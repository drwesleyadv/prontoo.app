<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Não encontrado - Prontoo</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#238763">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <meta name="application-name" content="Prontoo">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-25..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/assets/presentation.css">
</head>
<body class="public has-top-shell" style="--clinic-accent:#238763;--clinic-accent-dark:#105e44;--clinic-accent-soft:#dff3ea;--clinic-on-accent:#ffffff;">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="top">
    <a class="brand" href="/" aria-label="Prontoo">
      <span class="brand-mark app-brandmark-inline"><img class="brand-mark-img app-brandmark-img" src="/favicon.ico" alt="" aria-hidden="true"></span>
      <span class="brand-copy"><b>Prontoo</b></span>
    </a>
    <div class="top-actions"></div>
  </header>
  <main id="conteudo" tabindex="-1">
    <section class="auth login-card login-shell" style="width:min(520px,100%);grid-template-columns:minmax(0,1fr);gap:0;align-items:stretch;" aria-labelledby="not-found-title" aria-describedby="not-found-description">
      <div class="auth-titleline login-titleline">
        <div class="auth-brandmark"><img class="auth-brandmark-favicon" src="/favicon.ico" alt="" aria-hidden="true"></div>
        <div>
          <span class="eyebrow">Nada por aqui...</span>
          <h1 id="not-found-title">Esta página não existe</h1>
        </div>
      </div>
      <div class="login-boot">
        <span aria-hidden="true"><span class="material-symbols-rounded">travel_explore</span></span>
        <small>Confirme se o endereço existe ou foi digitado corretamente.</small>
      </div>
      <p id="not-found-description" class="field-help" style="margin:0 0 18px;">Você pode voltar ao Prontoo e continuar normalmente.</p>
      <a class="primary wide login-submit" href="/">
        <span class="material-symbols-rounded" aria-hidden="true">home</span>
        <span>Voltar ao Prontoo</span>
      </a>
    </section>
  </main>
</body>
</html>
