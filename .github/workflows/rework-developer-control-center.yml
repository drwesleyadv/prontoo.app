name: Rework developer control center

on:
  push:
    branches:
      - agent/developer-control-center

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-control-center
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp-developer-control-center-rewrite.py')
          text = path.read_text()
          old = 'new, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = 'new, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)'
          if text.count(old) != 1:
              raise SystemExit('rewrite helper signature drift')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 tools/tmp-developer-control-center-rewrite.py
      - name: Remove temporary execution files
        shell: bash
        run: |
          rm -f tools/tmp-developer-control-center-rewrite.py
          rm -f .github/workflows/rework-developer-control-center.yml
      - name: Validate syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l app/prontoo.php >/dev/null
          php -l app/Runtime/Routing/RouteRegistry.php >/dev/null
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations01.php >/dev/null
          php -l app/Runtime/UiComponents/UiComponentsRuntimeOperations03.php >/dev/null
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php >/dev/null
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations06.php >/dev/null
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations09.php >/dev/null
          php -l app/Application/Authorization/Definitions/AdminActionDefinitions.php >/dev/null
      - name: Reconcile release contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
      - name: Commit reconciled redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: redesign developer control center"
          git push origin HEAD:agent/developer-control-center
