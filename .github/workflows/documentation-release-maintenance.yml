name: Documentation Release Maintenance

on:
  push:
    branches:
      - docs/session-idle-rationale
    paths:
      - .github/workflows/documentation-release-maintenance.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile documentation release
        shell: bash
        run: |
          set -euo pipefail
          old='1.9.15.7'
          new='1.9.15.8'

          python3 <<'PY'
          import json
          from pathlib import Path
          path = Path('version.json')
          data = json.loads(path.read_text())
          if data.get('version') != '1.9.15.7':
              raise SystemExit('release canônica inesperada')
          data['version'] = '1.9.15.8'
          data['release'] = '1.9.15.8'
          data['generated_at_unix'] = 1789503359
          data['generated_at'] = '2026-09-15T16:15:59-04:00'
          data['updated_at'] = '2026-09-15T16:15:59-04:00'
          data['build'] = '1.9.15.8-session-idle-rationale'
          data['asset_version'] = '1.9.15.8'
          data['package_type'] = 'documentation'
          data['database_changes'] = False
          data['schema_changes'] = False
          data['logic_changes'] = False
          data['visual_changes'] = False
          data['notes'] = 'Documenta a justificativa operacional do limite de 4 horas de inatividade, alinhado a uma jornada diária de 8 horas organizada em dois períodos aproximados de 4 horas no Brasil, preservando o limite absoluto de 12 horas.'
          data['documentation_changes'] = True
          data['deployment_sync_id'] = 'github-prontoo-1.9.15.8-release'
          data['deployment_sync_requested_at'] = '2026-09-15T16:15:59-04:00'
          data['changelog'] = {
              'title': 'Sessão autenticada: justificativa operacional do limite de 4 horas',
              'items': [
                  'Documenta que o limite de 4 horas de inatividade considera como referência operacional uma jornada diária de 8 horas organizada em dois períodos aproximados de 4 horas no Brasil',
                  'Explicita que a finalidade é reduzir expirações durante um turno normal de trabalho',
                  'Preserva o limite absoluto de 12 horas como barreira máxima de segurança',
                  'Esclarece que a referência é uma motivação de produto e não uma presunção jurídica sobre toda relação de trabalho brasileira',
                  'Não altera comportamento, schema, banco, MFA, CSRF, logout ou revogação global de sessões'
              ]
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          for stem in app-icon favicon prontoo-mark; do
            for ext in png ico; do
              source="public/assets/${stem}-${old}.${ext}"
              if [[ -f "$source" ]]; then
                git mv "$source" "public/assets/${stem}-${new}.${ext}"
              fi
            done
          done
          git mv "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"

          while IFS= read -r -d '' file; do
            python3 - "$file" "$old" "$new" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          old, new = sys.argv[2], sys.argv[3]
          data = path.read_bytes()
          if b'\0' in data:
              raise SystemExit(0)
          try:
              text = data.decode('utf-8')
          except UnicodeDecodeError:
              raise SystemExit(0)
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          done < <(git grep -Ilz "$old" || true)

          php tools/presentation-css-build --write
          rm .github/workflows/documentation-release-maintenance.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/superseded-reference-contract-check
          php tools/version-asset-contract-check.php
          php tools/install-security-check.php
          php tools/security-regression-check.php
          php tools/quality-gate --fast
          php tools/documentation-check.php
          git diff --check
      - name: Commit reconciled documentation release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcilia release documental 1.9.15.8"
          git push origin HEAD:docs/session-idle-rationale
