name: SOLID Working Snapshot

on:
  push:
    branches:
      - agent/solid-runtime-runner

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: solid-working-tree
          path: |
            app
            tools
            docs
            .github
            version.json
            index.php
            install.php
            br
            cron
            public
            .htaccess
            .gitignore
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
