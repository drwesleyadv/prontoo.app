name: Temporary normalize recurrence test contract

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-1-9-15-1

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize contract and validate
        run: |
          set -euo pipefail
          git checkout origin/prontoo -- app/application.test-contract.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/application.test-contract.json')
          text = path.read_text()
          old_entries = '"entry_points": ["createBlock", "updateBlock", "updateAppointment", "createAppointment"],'
          new_entries = '"entry_points": ["createBlock", "updateBlock", "removeBlock", "updateAppointment", "createAppointment", "createAppointmentBatch"],'
          old_assertions = '"assertions": ["application.appointment_commands.ids", "application.appointment_commands.conflict", "application.appointment_commands.financial_sync"]'
          new_assertions = '"assertions": ["application.appointment_commands.ids", "application.appointment_commands.remove_block", "application.appointment_commands.batch_ids", "application.appointment_commands.batch_financial_sync", "application.appointment_commands.conflict", "application.appointment_commands.financial_sync"]'
          if old_entries not in text:
              raise SystemExit('Lista canônica de entry points não encontrada.')
          if old_assertions not in text:
              raise SystemExit('Lista canônica de asserções não encontrada.')
          text = text.replace(old_entries, new_entries, 1)
          text = text.replace(old_assertions, new_assertions, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/tmp-normalize-recurrence-contract.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/quality-gate --fast
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normaliza contrato de testes da recorrência'
          git push origin HEAD
