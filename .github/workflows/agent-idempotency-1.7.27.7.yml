name: Agent duplicate-write remediation

on:
  push:
    branches:
      - agent/prevent-duplicate-writes-1.7.27.7
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply idempotency remediation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          git fetch origin agent/prevent-duplicate-writes-1.7.27.6
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import re
          import subprocess
          import zlib

          old = subprocess.check_output([
              'git', 'show',
              'origin/agent/prevent-duplicate-writes-1.7.27.6:.github/workflows/agent-idempotency-1.7.27.6.yml',
          ], text=True)
          match = re.search(
              r'PATCH_B64: >-\n((?: {12}[A-Za-z0-9+/=]+\n)+)',
              old,
          )
          if not match:
              raise RuntimeError('Payload de correção anterior não localizado.')
          payload = ''.join(line.strip() for line in match.group(1).splitlines())
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          replacements = [
              ('VERSION = "1.7.27.6"', 'VERSION = "1.7.27.7"'),
              ('PREVIOUS = "1.7.27.5"', 'PREVIOUS = "1.7.27.6"'),
              (
                  "'const PRONTOO_VERSION_FALLBACK = \"1.7.27.5\";',\n    'const PRONTOO_VERSION_FALLBACK = \"1.7.27.6\";'",
                  "'const PRONTOO_VERSION_FALLBACK = \"1.7.27.6\";',\n    'const PRONTOO_VERSION_FALLBACK = \"1.7.27.7\";'",
              ),
              (
                  "'const PRONTOO_PREVIOUS_VERSION = \"1.7.27.4\";',\n    'const PRONTOO_PREVIOUS_VERSION = \"1.7.27.5\";'",
                  "'const PRONTOO_PREVIOUS_VERSION = \"1.7.27.5\";',\n    'const PRONTOO_PREVIOUS_VERSION = \"1.7.27.6\";'",
              ),
              ('1\\.7\\.27\\.5(["\\\'];)', '1\\.7\\.27\\.6(["\\\'];)'),
              (r'\g<1>1.7.27.6\g<2>', r'\g<1>1.7.27.7\g<2>'),
              (
                  'Prontoo 1.7.27.6 — gravações únicas e contatos consistentes',
                  'Prontoo 1.7.27.7 — gravações únicas e contatos consistentes',
              ),
              (
                  '.github/workflows/agent-idempotency-1.7.27.6.yml',
                  '.github/workflows/agent-idempotency-1.7.27.7.yml',
              ),
          ]
          for before, after in replacements:
              if before not in source:
                  raise RuntimeError('Trecho de versionamento não encontrado: ' + before[:80])
              source = source.replace(before, after, 1)

          exec(compile(source, 'agent-idempotency-patch', 'exec'))

          # A baseline 1.7.27.6 possuía metadados exclusivos de republicação.
          version_path = Path('version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          for key in ['baseline_source', 'full_baseline_rewrite', 'rewrite_scope']:
              version.pop(key, None)
          version_path.write_text(
              json.dumps(version, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          manifest_path = Path('app/update.manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for key in ['baseline_source', 'full_baseline_rewrite', 'rewrite_scope']:
              manifest.pop(key, None)
          files = manifest.get('files', {})
          for file in files:
              files[file] = hashlib.sha256(Path(file).read_bytes()).hexdigest()
          manifest['files'] = files
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = sum(
              Path(file).stat().st_size for file in files
          )
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          } 2>&1 | tee /tmp/patch.log

      - name: Upload patch failure log
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-write-patch-error
          path: /tmp/patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Validate changed runtime
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Support/SecurityPrivacy.php >/dev/null
          php -l app/Domain/Leads/Leads.php >/dev/null
          php -l app/prontoo.php >/dev/null
          php -l br/index.php >/dev/null
          node --check public/assets/app.js
          php tools/security-regression-check.php >/tmp/security-regression.json
          php tools/architecture-check.php >/tmp/architecture-report.json
          git diff --check

      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.7 — impedir gravações duplicadas"
          git push origin HEAD:agent/prevent-duplicate-writes-1.7.27.7
