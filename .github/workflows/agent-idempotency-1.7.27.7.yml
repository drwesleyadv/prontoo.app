name: Agent duplicate-write remediation

on:
  push:
    branches:
      - agent/prevent-duplicate-writes-1.7.27.7
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply idempotency remediation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cat tools/.agent-idempotency/part*.py > /tmp/agent-idempotency-patch.py
            python3 -m py_compile /tmp/agent-idempotency-patch.py
            python3 /tmp/agent-idempotency-patch.py
            rm -rf tools/.agent-idempotency
          } 2>&1 | tee /tmp/patch.log

      - name: Upload patch failure log
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-write-patch-error
          path: /tmp/patch.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after patch failure
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Validate changed runtime
        id: validate
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo "[php-lint] SecurityPrivacy"
            php -l app/Support/SecurityPrivacy.php
            echo "[php-lint] Leads"
            php -l app/Domain/Leads/Leads.php
            echo "[php-lint] runtime"
            php -l app/prontoo.php
            echo "[php-lint] landing"
            php -l br/index.php
            echo "[node-check] app.js"
            node --check public/assets/app.js
            echo "[security-regression]"
            php tools/security-regression-check.php
            echo "[architecture-check]"
            php tools/architecture-check.php
            echo "[diff-check]"
            git diff --check
          } 2>&1 | tee /tmp/validate.log

      - name: Upload validation failure log
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-write-validation-error
          path: /tmp/validate.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit remediation
        if: steps.apply.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.7 — impedir gravações duplicadas"
          git push origin HEAD:agent/prevent-duplicate-writes-1.7.27.7
