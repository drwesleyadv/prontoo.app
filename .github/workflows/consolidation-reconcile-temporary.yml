name: Consolidation Reconcile Temporary

on:
  pull_request:
    branches: [prontoo]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/consolidation-audit-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/consolidation-audit-20260809
          git checkout -B agent/consolidation-audit-20260809 origin/agent/consolidation-audit-20260809
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile and publish
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconciliar contrato após ajuste da fixture de schema'
          git push origin HEAD:agent/consolidation-audit-20260809
