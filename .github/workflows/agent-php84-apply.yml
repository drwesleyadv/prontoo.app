name: Agent PHP 8.4 Apply Validated Candidate

on:
  push:
    branches:
      - agent/php84-conformance-final-1-8-6-1

concurrency:
  group: php84-apply-validated-1-8-6-1
  cancel-in-progress: true

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[php84-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Generate validated candidate
        run: python3 .agent-php84-conformance-lint-fix.py
      - name: Validate final candidate
        shell: bash
        run: |
          set -euo pipefail
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 4 ? 0 : 1);'
          php tools/php84-runtime-contract-check
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            if grep -qi 'deprecated' <<<"$output"; then
              echo "Depreciação PHP 8.4 em $file" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
          php tools/version-asset-contract-check.php
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Remove generation helpers and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent-php84-conformance-final.py \
            .agent-php84-conformance-lint-fix.py \
            .agent-php84-conformance-trailing-comma-fix.py \
            .agent-php84-conformance-final.log \
            .agent-php84-conformance-final.status
          git checkout HEAD -- .github/workflows/architecture.yml
          git config user.name "prontoo-agent"
          git config user.email "prontoo-agent@users.noreply.github.com"
          git add -A
          python3 <<'PY'
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'app/update.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          files = {}
          total = 0
          for raw in tracked:
              if not raw:
                  continue
              relative = raw.decode('utf-8')
              if relative == 'app/update.manifest.json':
                  continue
              absolute = root / relative
              if not absolute.is_file():
                  continue
              data = absolute.read_bytes()
              files[relative] = hashlib.sha256(data).hexdigest()
              total += len(data)
          now = datetime.now(timezone.utc).isoformat()
          manifest['generated_at'] = now
          manifest['updated_at'] = now
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = total
          manifest['files'] = dict(sorted(files.items()))
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=4) + '\n',
              encoding='utf-8',
          )
          PY
          git add app/update.manifest.json
          git diff --cached --check
          git commit -m "Publicar 1.8.6.1 com conformidade integral PHP 8.4 [php84-applied]"
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
