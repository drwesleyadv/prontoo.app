name: Phase 11 Integration Fix

on:
  push:
    branches:
      - agent/architecture-phase-11-dependency-closure
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prontoo_schema
      DB_USERNAME: root
      DB_PASSWORD: root
      PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
      PRONTOO_SCHEMA_USER: root
      PRONTOO_SCHEMA_PASS: root
      GITHUB_ACTIONS: true
      CI: true
      PRONTOO_SCHEMA_TEST_MODE: 1
      PRONTOO_INSTALLER_CLI_MODE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-phase-11-dependency-closure
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql,mbstring
      - name: Repair integration semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          revenue = Path('app/Infrastructure/Financial/PdoPatientRevenueReceiptRepository.php')
          s = revenue.read_text()
          old = '''    private function one(string $sql, array $params = []): ?array
    {
        $statement = \\Prontoo\\Infrastructure\\DatabaseSchema\\DatabaseSchemaInfrastructureOperations01::pdo()->prepare($sql);
        $statement->execute($params);
        $row = $statement->fetch(\\PDO::FETCH_ASSOC);
        $statement->closeCursor();
        return is_array($row) ? $row : null;
    }

    private function val(string $sql, array $params = []): mixed
    {
        $statement = \\Prontoo\\Infrastructure\\DatabaseSchema\\DatabaseSchemaInfrastructureOperations01::pdo()->prepare($sql);
        $statement->execute($params);
        $value = $statement->fetchColumn();
        $statement->closeCursor();
        return $value === false ? null : $value;
    }

    private function q(string $sql, array $params = []): \\PDOStatement
    {
        $statement = \\Prontoo\\Infrastructure\\DatabaseSchema\\DatabaseSchemaInfrastructureOperations01::pdo()->prepare($sql);
        $statement->execute($params);
        return $statement;
    }
'''
          new = '''    private function one(string $sql, array $params = []): ?array
    {
        $statement = $this->statement($sql, $params);
        $row = $statement->fetch(\\PDO::FETCH_ASSOC);
        $statement->closeCursor();
        return is_array($row) ? $row : null;
    }

    private function val(string $sql, array $params = []): mixed
    {
        $statement = $this->statement($sql, $params);
        $value = $statement->fetchColumn();
        $statement->closeCursor();
        return $value === false ? null : $value;
    }

    private function q(string $sql, array $params = []): \\PDOStatement
    {
        return $this->statement($sql, $params);
    }

    private function statement(string $sql, array $params = []): \\PDOStatement
    {
        [$runtimeSql, $runtimeParams] = \\Prontoo\\Core\\Temporal\\PiTime::prepareRuntimeQuery($sql, $params);
        $statement = \\Prontoo\\Infrastructure\\DatabaseSchema\\DatabaseSchemaInfrastructureOperations01::pdo()->prepare($runtimeSql);
        $statement->execute($runtimeParams);
        return $statement;
    }
'''
          if s.count(old) != 1:
              raise SystemExit('PdoPatientRevenueReceiptRepository helper block not found')
          revenue.write_text(s.replace(old, new))

          integrity = Path('app/Infrastructure/Integrity/PiIntegrity.php')
          s = integrity.read_text()
          marker = '''    private static function secret(): string
    {
        try {
            if (\\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::has_cfg()) {
                $statement = self::pdo()->query("SELECT meta_value FROM pi_meta WHERE meta_key='app_secret' LIMIT 1");
                $value = $statement ? $statement->fetchColumn() : false;
                if (is_string($value) && trim($value) !== '') {
                    return $value;
                }
            }
        } catch (\\Throwable) {
        }
        try {
            return (string) (\\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::cfg()['secret'] ?? 'prontoo-integrity');
        } catch (\\Throwable) {
            return 'prontoo-integrity';
        }
    }
}'''
          replacement = marker[:-1] + '''

    private static function logOnce(string $stage, \\Throwable $error): void
    {
        static $logged = [];
        $key = $stage . '|' . $error->getMessage();
        if (isset($logged[$key])) {
            return;
        }
        $logged[$key] = true;
        error_log('[Prontoo integrity ' . $stage . '] ' . $error->getMessage());
    }

    private static function requestId(): string
    {
        if (self::$requestId !== null) {
            return self::$requestId;
        }
        try {
            return self::$requestId = bin2hex(random_bytes(16));
        } catch (\\Throwable) {
            return self::$requestId = md5(uniqid('prontoo', true));
        }
    }

    private static function cleanToken(string $value, string $fallback): string
    {
        return preg_replace('/[^a-z0-9_-]+/i', '_', trim($value)) ?: $fallback;
    }
}'''
          if s.count(marker) != 1:
              raise SystemExit('PiIntegrity tail marker not found')
          integrity.write_text(s.replace(marker, replacement))
          PY
          git rm -f .github/workflows/phase11-integration-fix.yml
          php tools/release-contract-reconcile --write
          git add -A
          php tools/quality-gate
          php tools/schema-check.php
          php tools/critical-runtime-smoke-check
      - name: Commit repaired phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Engenharia 11/15 — preservar semântica de runtime tipado'
          git push origin HEAD:agent/architecture-phase-11-dependency-closure
