name: Stage Runtime Maestro

on:
  push:
    branches:
      - agent/runtime-stability-maestro-1-8-7-3

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-stability-maestro-1-8-7-3
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Materialize stage
        shell: bash
        run: |
          set -euo pipefail
          php tools/.stage-runtime-maestro.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cron/maestro.php version.json
          git diff --cached --quiet && exit 0
          git commit -m "runtime: stabilize Maestro integrity flush"
          git push origin HEAD:agent/runtime-stability-maestro-1-8-7-3
