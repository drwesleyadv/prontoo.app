name: Consolidation Audit Materializer

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/consolidation-audit-20260809
          git checkout -B agent/consolidation-audit-20260809 FETCH_HEAD
      - name: Ensure PHP 8.4
        shell: bash
        run: |
          set -euo pipefail
          if ! php -r 'exit(PHP_MAJOR_VERSION===8 && PHP_MINOR_VERSION===4 && extension_loaded("mbstring") ? 0 : 1);'; then
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
            sudo apt-get install -y php8.4-cli php8.4-mbstring php8.4-mysql
            sudo update-alternatives --set php /usr/bin/php8.4
          fi
      - name: Apply consolidation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          version_path = root / 'version.json'
          version = json.loads(version_path.read_text())
          version.update({
              'version': '1.8.9.1',
              'release': '1.8.9.1',
              'generated_at_unix': 1786317300,
              'generated_at': '2026-08-09T23:15:00+00:00',
              'updated_at': '2026-08-09T23:15:00+00:00',
              'build': '1.8.9.1-consolidation-audit',
              'previous_version': '1.8.7.8',
              'release_date': '2026-08-09',
              'logic_changes': False,
              'documentation_changes': True,
              'database_changes': False,
              'schema_changes': False,
              'visual_changes': False,
              'functional_equivalence_policy': 'post_zero_legacy_consolidation_no_runtime_behavior_change',
              'notes': 'Auditoria de consolidação pós-zero-legacy: corrige metadata ativa, documentação e higiene operacional sem alterar runtime, schema, dados ou interface.',
              'deployment_sync_id': 'github-prontoo-1.8.9.1-consolidation-audit',
              'deployment_sync_requested_at': '2026-08-09T23:15:00+00:00',
              'rewrite_scope': 'post_zero_legacy_metadata_ci_and_repository_hygiene',
              'changelog': {
                  'title': 'Auditoria de consolidação pós-zero-legacy',
                  'items': [
                      'alinha componentes arquiteturais ativos aos paths nativos após a remoção das fachadas globais',
                      'transforma a ausência de fronteiras de compatibilidade e resíduos temporários em gate permanente de arquitetura',
                      'corrige a documentação de estado atual para distinguir rastreabilidade histórica de compatibilidade executável',
                      'encerra PRs técnicos de inventário e migração já superseded pela materialização zero-legacy',
                      'preserva referências históricas somente nos mapas explícitos de migração, auditorias e contratos de baseline',
                      'não altera banco, schema, comportamento funcional, layout ou assets públicos'
                  ]
              }
          })
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4, separators=(',', ': ')) + '\n')

          manifest_path = root / 'app/architecture.manifest.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['server_evolution_phase_two_components'] = [
              'app/Infrastructure/ServerJsonCache/ServerJsonCacheInfrastructureOperations01.php',
              'app/Runtime/ServerJsonCache/ServerJsonCacheRuntimeOperations01.php',
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations01.php',
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php',
              'app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php'
          ]
          manifest['server_evolution_phase_three_components'] = [
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations01.php',
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php',
              'app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php'
          ]
          manifest['developer_dashboard_observability_components'] = [
              'app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php',
              'app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php',
              'app/Presentation/AdminPages/AdminPagesPresentationOperations03.php',
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations01.php',
              'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php',
              'app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php',
              'public/assets/design-system.css'
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4, separators=(',', ': ')) + '\n')

          reconcile_path = root / 'tools/release-contract-reconcile'
          reconcile = reconcile_path.read_text()
          old = "$architecture['native_migration_policy'] = 'effective_native_unit_count_must_not_decrease_after_consolidation_1_8_7_1_and_compatibility_boundary_ceiling_51_must_not_increase';"
          new = "$architecture['native_migration_policy'] = 'effective_native_unit_count_must_not_decrease_and_current_non_native_ceiling_must_not_increase';"
          if old not in reconcile:
              raise SystemExit('native migration policy anchor not found')
          reconcile_path.write_text(reconcile.replace(old, new, 1))

          architecture_check_path = root / 'tools/architecture-check.php'
          architecture_check = architecture_check_path.read_text()
          anchor = "\n$result = [\n"
          if anchor not in architecture_check:
              raise SystemExit('architecture result anchor not found')
          consolidation_gate = r'''
$consolidationManifest = json_decode(
    (string) file_get_contents($root . '/app/architecture.manifest.json'),
    true,
    512,
    JSON_THROW_ON_ERROR,
);
$assert(($consolidationManifest['compatibility_boundaries'] ?? null) === [], 'consolidation_compatibility_boundaries_not_empty');
$removedLegacyFiles = array_fill_keys(
    array_map('strval', (array) ($consolidationManifest['removed_legacy_files'] ?? [])),
    true,
);
foreach ($consolidationManifest as $key => $paths) {
    if (!is_string($key) || !str_ends_with($key, '_components') || !is_array($paths)) {
        continue;
    }
    foreach ($paths as $path) {
        if (!is_string($path) || $path === '') {
            $failures[] = 'consolidation_component_invalid:' . $key;
            continue;
        }
        $assert(is_file($root . '/' . $path), 'consolidation_component_missing:' . $key . ':' . $path);
        $assert(!isset($removedLegacyFiles[$path]), 'consolidation_component_removed_legacy:' . $key . ':' . $path);
    }
}
$consolidationTemporaryArtifacts = [
    '.github/workflows/zero-legacy-migration.yml',
    '.github/workflows/zero-legacy-final-readonly.yml',
    '.github/workflows/zero-legacy-final-push.yml',
    '.github/workflows/zero-legacy-public-finalizer.yml',
    '.github/workflows/zero-legacy-materializer-scheduled.yml',
    '.zero-legacy-materialize-trigger',
    'tools/zero-legacy-final-generate.py',
    'tools/zero-legacy-root-entrypoints-fix.py',
    'tools/sitecustomize.py',
    'zero-legacy-final-failure.log',
];
foreach ($consolidationTemporaryArtifacts as $path) {
    $assert(!is_file($root . '/' . $path), 'consolidation_temporary_artifact:' . $path);
}
$appIterator = new RecursiveIteratorIterator(
    new RecursiveDirectoryIterator($root . '/app', FilesystemIterator::SKIP_DOTS),
);
foreach ($appIterator as $file) {
    if (!$file->isFile() || strtolower($file->getExtension()) !== 'php') {
        continue;
    }
    $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
    $assert(!str_contains($relative, '/Legacy/'), 'consolidation_legacy_path:' . $relative);
}
'''
          architecture_check_path.write_text(architecture_check.replace(anchor, '\n' + consolidation_gate + anchor, 1))

          docs_index_path = root / 'docs/index.md'
          docs_index = docs_index_path.read_text()
          docs_index = docs_index.replace(
              '- [View de contato do paciente](architecture/patient-contact-view.md)\n',
              '- [View de contato do paciente](architecture/patient-contact-view.md)\n- [Auditoria de consolidação pós-zero-legacy](architecture/CONSOLIDATION-AUDIT-1.8.9.1.md)\n',
              1,
          )
          docs_index = docs_index.replace('`app/version.json`', '`version.json`')
          docs_index_path.write_text(docs_index)

          overview_path = root / 'docs/architecture/overview.md'
          overview = overview_path.read_text()
          overview = overview.replace(
              '- preservar compatibilidade enquanto unidades históricas são classificadas e decompostas;',
              '- preservar rastreabilidade histórica sem reintroduzir compatibilidade executável;',
          )
          start = overview.index('## Compatibilidade `Legacy`')
          end = overview.index('## Pontos de entrada', start)
          replacement = '''## Histórico de migração\n\nA árvore atual não possui camada, namespace ou fachada executável `Legacy`. Os nomes de origem removidos sobrevivem apenas como **metadados históricos declarados** nos mapas de migração de `version.json`, em `removed_legacy_files`, nas auditorias de baseline e nos contratos que precisam resolver uma origem histórica para seu destino nativo.\n\nEssas referências não participam do dispatch, do bootstrap nem da composição do runtime. Componentes arquiteturais ativos devem apontar exclusivamente para arquivos existentes e não podem apontar para qualquer item de `removed_legacy_files`; essa condição é verificada por `tools/architecture-check.php`.\n\nA migração permanece monotônica: o número efetivo de unidades nativas não pode diminuir e o teto corrente de entrypoints e ferramentas procedurais não nativos não pode aumentar.\n\n'''
          overview = overview[:start] + replacement + overview[end:]
          overview = overview.replace('5. compatibilidade controlada;', '5. rastreabilidade histórica sem compatibilidade executável;')
          overview_path.write_text(overview)

          audit_path = root / 'docs/architecture/CONSOLIDATION-AUDIT-1.8.9.1.md'
          audit_path.write_text('''# Auditoria de consolidação — 1.8.9.1\n\n## Escopo\n\nEsta auditoria revisa a árvore canônica após a materialização zero-legacy e verifica se código executável, manifests, documentação, contratos e backlog técnico representam o mesmo estado arquitetural.\n\n## Resultado\n\nO zero-legacy executável permanece confirmado: `compatibility_boundaries` está vazio, as fachadas globais removidas não existem na árvore e não há paths PHP ativos sob `/Legacy/`. A auditoria não encontrou necessidade de reintroduzir adaptadores de compatibilidade.\n\n## Achados e correções\n\n### 1. Metadata arquitetural ativa apontava para fachadas removidas\n\n`server_evolution_phase_two_components`, `server_evolution_phase_three_components` e `developer_dashboard_observability_components` ainda citavam `app/Support/ServerJsonCache.php`, `app/Support/Telemetry.php` e `app/Admin/AdminPages.php`. Essas referências eram drift documental do manifesto, não dependências de runtime.\n\n**Correção:** os componentes ativos agora apontam para as unidades nativas atuais de Infrastructure, Presentation e Runtime.\n\n### 2. A política textual de migração mantinha o teto histórico 51\n\n`tools/release-contract-reconcile` ainda materializava a frase `compatibility_boundary_ceiling_51`, apesar de a baseline atual limitar arquivos não nativos a 21.\n\n**Correção:** a política passa a ser relativa ao teto corrente canônico, sem congelar o número histórico de uma fase anterior.\n\n### 3. Faltava um gate permanente de consolidação pós-zero-legacy\n\nA CI validava arquitetura e SOLID, mas não exigia explicitamente que listas de componentes ativos apontassem somente para arquivos existentes e não removidos.\n\n**Correção:** `tools/architecture-check.php` agora exige `compatibility_boundaries=[]`, valida todos os arrays top-level `*_components`, rejeita paths ativos listados em `removed_legacy_files`, rejeita artefatos temporários da migração e veta paths PHP atuais sob `/Legacy/`.\n\n### 4. Documentação atual misturava história e estado executável\n\nA visão arquitetural ainda descrevia uma “Compatibilidade Legacy” como conceito corrente e o índice apontava para `app/version.json`, embora a fonte canônica seja `version.json` na raiz.\n\n**Correção:** a documentação passa a distinguir metadados históricos de compatibilidade executável e corrige a fonte de versão.\n\n### 5. Backlog técnico da migração permanecia aberto\n\nOs PRs #196, #201, #202 e #203 eram inventários/geradores explicitamente temporários e já haviam sido superseded pela materialização final #229.\n\n**Correção:** os quatro PRs foram encerrados sem merge. O PR #182 foi deliberadamente preservado porque contém hardening funcional de login/logout não consolidado na árvore atual; ele não faz parte da limpeza zero-legacy e não deve ser reaplicado como diff antigo.\n\n## Referências históricas preservadas intencionalmente\n\nPermanecem válidas referências a paths removidos quando usadas exclusivamente em `php84_baseline_path_migrations`, `architecture_source_path_migrations`, `removed_legacy_files`, auditorias históricas e contratos que resolvem a origem histórica via `CompatibilitySourceResolver`. Elas são rastreabilidade, não runtime legacy.\n\n## Invariantes\n\n- zero fronteiras executáveis de compatibilidade;\n- 100% de classificação arquitetural;\n- mínimo de 278 unidades nativas;\n- máximo corrente de 21 entrypoints/ferramentas procedurais não nativos;\n- PHP 8.4;\n- SOLID estrito;\n- segurança, assets, release contract e lint obrigatórios;\n- nenhuma mudança de banco, schema, comportamento funcional ou interface nesta auditoria.\n''')
          PY
          php tools/release-contract-reconcile --write
      - name: Validate consolidated tree
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --check
          php tools/native-unit-check
          php tools/architecture-check.php
          php tools/solid-audit --strict
          php tools/security-regression-check.php
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Commit audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Auditoria de consolidação pós-zero-legacy'
          git push origin HEAD:agent/consolidation-audit-20260809
      - name: Remove temporary materializer from canonical branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin prontoo
          git checkout -B cleanup-consolidation-audit origin/prontoo
          git rm .github/workflows/consolidation-audit-materializer.yml
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remover materializador temporário da auditoria de consolidação'
          git push origin HEAD:prontoo
