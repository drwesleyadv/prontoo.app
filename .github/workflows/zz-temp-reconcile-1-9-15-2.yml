name: Temp Reconcile 1.9.15.2

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-ux-1-9-15-2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/quick-scheduling-recurrence-ux-1-9-15-2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Reconcile final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-temp-reconcile-1-9-15-2.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcilia manifest da árvore final"
          git push origin HEAD:feature/quick-scheduling-recurrence-ux-1-9-15-2
