name: Zero Legacy Migration Harness

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: read

jobs:
  final:
    if: github.head_ref == 'agent/zero-legacy-final'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: agent/zero-legacy-final
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Generate and validate zero legacy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zero-legacy-final-generate.py
          rm tools/zero-legacy-final-generate.py
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/native-unit-check
          php tools/architecture-check.php
          php tools/solid-audit --strict
          php tools/security-regression-check.php
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Materialize validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to materialize.'
            exit 0
          fi
          git commit -m 'Zero legacy: eliminar todas as fronteiras transitórias'
          git push origin HEAD:agent/zero-legacy-final
