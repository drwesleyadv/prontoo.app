name: Zero Legacy Migration Harness

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: read

jobs:
  phase2:
    if: github.head_ref == 'agent/zero-legacy-phase2-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/zero-legacy-phase2-v3
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Generate phase 2
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zero-legacy-phase2-generate.py
          rm tools/zero-legacy-phase2-generate.py
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/native-unit-check
          php tools/architecture-check.php
          php tools/solid-audit --strict
          php tools/security-regression-check.php
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null
          tar --exclude=.git --exclude=ssd --exclude=vendor --exclude=node_modules -czf /tmp/zero-legacy-phase2.tar.gz .
      - name: Upload generated tree
        uses: actions/upload-artifact@v4
        with:
          name: zero-legacy-phase2-generated
          path: /tmp/zero-legacy-phase2.tar.gz
          if-no-files-found: error
