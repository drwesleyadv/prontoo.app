name: Fix Audit Materializer

on:
  push:
    branches:
      - audit/consolidation-1-9-14-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/consolidation-1-9-14-1
          fetch-depth: 0
      - name: Fix exact MFA replacement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/audit-consolidation-materialize.yml')
          text = p.read_text()
          old = '''          replace_exact(
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations02.php',
              '\"mfa_recovery_code_hash\",',
              '[\\\\Prontoo\\\\Runtime\\\\SecurityAccess\\\\SecurityAccessRuntimeOperations01::class, \"mfa_recovery_code_hash\"],',
              1,
          )
          replace_exact(
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations02.php',
              'array_map(\"mfa_recovery_code_hash\", $codes)',
              'array_map([\\\\Prontoo\\\\Runtime\\\\SecurityAccess\\\\SecurityAccessRuntimeOperations01::class, \"mfa_recovery_code_hash\"], $codes)',
              1,
          )
'''
          new = '''          replace_exact(
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations02.php',
              '\"mfa_recovery_code_hash\"',
              '[\\\\Prontoo\\\\Runtime\\\\SecurityAccess\\\\SecurityAccessRuntimeOperations01::class, \"mfa_recovery_code_hash\"]',
              2,
          )
'''
          if text.count(old) != 1:
              raise SystemExit('materializer MFA block mismatch')
          p.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-audit-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige substituição MFA do materializador"
          git push origin HEAD:audit/consolidation-1-9-14-1
