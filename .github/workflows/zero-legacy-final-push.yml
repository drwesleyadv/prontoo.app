name: Zero Legacy Final Push

on:
  push:
    branches:
      - agent/zero-legacy-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without actions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/zero-legacy-final
          git checkout -B agent/zero-legacy-final FETCH_HEAD
      - name: Ensure PHP 8.4
        shell: bash
        run: |
          set -euo pipefail
          php -v || true
          if ! php -r 'exit(PHP_MAJOR_VERSION===8 && PHP_MINOR_VERSION===4 ? 0 : 1);'; then
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update
            sudo apt-get install -y php8.4-cli php8.4-mbstring php8.4-mysql
            sudo update-alternatives --set php /usr/bin/php8.4
          fi
          php -r 'if (PHP_MAJOR_VERSION!==8 || PHP_MINOR_VERSION!==4) {fwrite(STDERR, PHP_VERSION.PHP_EOL); exit(1);}'
      - name: Generate and validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          LOG=/tmp/zero-legacy-final.log
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          fail() {
            rc=$?
            echo "FAILED_STEP=$1" >> "$LOG"
            cp "$LOG" zero-legacy-final-failure.log
            git config user.name 'Prontoo Architecture Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add zero-legacy-final-failure.log
            git commit -m 'Diagnóstico zero legacy: falha em validação [skip ci]' || true
            git push origin HEAD:agent/zero-legacy-final || true
            exit "$rc"
          }
          python3 tools/zero-legacy-final-generate.py || fail generate
          rm tools/zero-legacy-final-generate.py
          rm -f .github/workflows/zero-legacy-migration.yml
          rm -f .github/workflows/zero-legacy-final-readonly.yml
          rm -f .github/workflows/zero-legacy-final-push.yml
          rm -f zero-legacy-final-failure.log
          php tools/release-contract-reconcile --write || fail release-write
          php tools/release-contract-reconcile --check || fail release-check
          php tools/native-unit-check || fail native-unit
          php tools/architecture-check.php || fail architecture
          php tools/solid-audit --strict || fail solid
          php tools/security-regression-check.php || fail security
          php tools/version-asset-contract-check.php || fail assets
          php tools/php84-runtime-contract-check || fail php84
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null || fail lint
      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Zero legacy: remover 22 fachadas globais'
          git push origin HEAD:agent/zero-legacy-final
