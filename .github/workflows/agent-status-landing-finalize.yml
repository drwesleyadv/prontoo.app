name: Finalize status landing card
on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-landing-load-card' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Finalize
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/Admin/AdminPages.php')
          s=p.read_text()
          a=s.index('function admin_performance_card_content_html(bool $public = false): string')
          b=s.index('function admin_performance_card_html(bool $public = false): string',a)
          shared='''function admin_performance_card_content_html(bool $public = false): string
          {
              return '<div class="section-head admin-performance-head"><h2>Desempenho geral</h2>' .
                  admin_maestro_health_pill_html(!$public) .
                  "</div>" .
                  admin_global_perf_charts_html();
          }
          '''
          s=s[:a]+shared+s[b:]
          a=s.index('function page_status(): void')
          b=s.index('function page_admin_operations(): void',a)
          sec=s[a:b]
          card='''    $summary = function_exists("telemetry_route_performance_summary")
              ? telemetry_route_performance_summary(24)
              : ["routes" => []];
              $landingRequests24h = 0;
              foreach ((array) ($summary["routes"] ?? []) as $routePerformance) {
                  if ((string) ($routePerformance["route"] ?? "") !== "landing") {
                      continue;
                  }
                  $landingRequests24h = max(0, (int) ($routePerformance["count"] ?? 0));
                  break;
              }
              $landingCard = card(
                  stat_card(
                      "Carregamentos da landing page",
                      $landingRequests24h,
                      "web",
                      "carregamentos nas últimas 24 horas",
                  ),
                  "status-landing-load-card",
              );
              $card = $landingCard . admin_performance_card_html(true);
          '''
          start=sec.find('    $summary = function_exists("telemetry_route_performance_summary")')
          if start>=0:
              end=sec.index('    echo ',start)
              sec=sec[:start]+card+sec[end:]
          else:
              anchor='    $card = admin_performance_card_html(true);\n'
              if anchor not in sec: raise SystemExit('anchor missing')
              sec=sec.replace(anchor,card,1)
          s=s[:a]+sec+s[b:]
          p.write_text(s)
          for f in Path('ssd').glob('.status-landing*'):
              f.unlink()
          PY
          php -l app/Admin/AdminPages.php
          grep -q '"Carregamentos da landing page"' app/Admin/AdminPages.php
          test "$(grep -c 'function admin_performance_card_content_html' app/Admin/AdminPages.php)" -eq 1
          php <<'PHP'
          <?php
          $root=getcwd();$path="$root/app/update.manifest.json";$m=json_decode(file_get_contents($path),true,512,JSON_THROW_ON_ERROR);$files=[];$total=0;$it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS));foreach($it as $f){if(!$f->isFile()||$f->isLink())continue;$r=str_replace('\\','/',substr($f->getPathname(),strlen($root)+1));if($r==='app/update.manifest.json'||str_starts_with($r,'.git/')||str_starts_with($r,'ssd/')||str_starts_with($r,'vendor/')||str_starts_with($r,'node_modules/'))continue;$files[$r]=hash_file('sha256',$f->getPathname());$total+=$f->getSize();}ksort($files);$m['files']=$files;$m['file_count']=count($files);$m['total_uncompressed_bytes']=$total;$m['updated_at']=gmdate('c');file_put_contents($path,json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL);
          PHP
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalizar card de carregamentos na tela status'
          git push origin HEAD:"$HEAD_BRANCH"
