name: Temporary agenda hover block patch
on:
  push:
    branches:
      - feature/agenda-hover-block-1-9-14-2
    paths:
      - .tmp-agenda-hover-trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: bash .github/scripts/tmp-agenda-hover-block.sh
