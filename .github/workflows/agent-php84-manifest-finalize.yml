name: Agent PHP 8.4 Manifest Finalize

on:
  push:
    branches:
      - agent/php84-exclusive-runtime-1-8-5-2

concurrency:
  group: php84-manifest-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate manifest
        run: python3 .agent-php84-manifest-finalize.py
      - name: Commit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-agent"
          git config user.email "prontoo-agent@users.noreply.github.com"
          git add -A
          git reset .github/workflows/agent-php84-manifest-finalize.yml
          git diff --cached --check
          git commit -m "Reconciliar manifesto da versão 1.8.5.2 [manifest-finalized]"
          git fetch origin ${GITHUB_REF_NAME}
          git rebase origin/${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
