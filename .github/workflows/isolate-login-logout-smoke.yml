name: Isolate Login Logout Smoke

on:
  push:
    branches:
      - agent/maintenance-security-refactor-touch

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Make smoke fixtures hermetic
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('tools/login-logout-http-smoke')
          text = p.read_text()
          old = 'CONFIG="$TMP/config.php"\nSERVER_LOG="$TMP/server.log"\nSERVER_PID=""\nSTEP="bootstrap"\n'
          new = 'CONFIG="$TMP/config.php"\nSERVER_LOG="$TMP/server.log"\nAUDIT_SPOOL="$ROOT/ssd/cache/maestro-audit"\nAUDIT_BEFORE="$TMP/audit-before.txt"\nSERVER_PID=""\nSTEP="bootstrap"\n\nif [[ -d "$AUDIT_SPOOL" ]]; then\n  find "$AUDIT_SPOOL" -maxdepth 1 -type f -name \'audit-*.json\' -printf \'%f\\n\' | sort >"$AUDIT_BEFORE"\nelse\n  : >"$AUDIT_BEFORE"\nfi\n'
          if text.count(old) != 1:
              raise SystemExit(f'header anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_cleanup = '''cleanup() {
  if [[ -n "$SERVER_PID" ]]; then
    kill "$SERVER_PID" >/dev/null 2>&1 || true
    wait "$SERVER_PID" >/dev/null 2>&1 || true
  fi
  rm -rf "$TMP"
}
'''
          new_cleanup = '''cleanup() {
  if [[ -n "$SERVER_PID" ]]; then
    kill "$SERVER_PID" >/dev/null 2>&1 || true
    wait "$SERVER_PID" >/dev/null 2>&1 || true
  fi
  if [[ -d "$AUDIT_SPOOL" ]]; then
    while IFS= read -r file; do
      base="$(basename "$file")"
      if ! grep -Fxq "$base" "$AUDIT_BEFORE"; then
        rm -f -- "$file"
      fi
    done < <(find "$AUDIT_SPOOL" -maxdepth 1 -type f -name 'audit-*.json' -print)
  fi
  if [[ -f "$CONFIG" ]]; then
    PRONTOO_CONFIG_PATH="$CONFIG" php <<'PHP' >/dev/null 2>&1 || true
<?php
declare(strict_types=1);
$config = require getenv('PRONTOO_CONFIG_PATH');
$dsn = sprintf('mysql:host=%s;dbname=%s;charset=utf8mb4', $config['db_host'], $config['db_name']);
$pdo = PDO::connect($dsn, $config['db_user'], $config['db_pass'], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
$pdo->exec('DROP TRIGGER IF EXISTS ci_block_pi_meta_insert');
PHP
  fi
  rm -rf "$TMP"
}
'''
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'cleanup anchor count={text.count(old_cleanup)}')
          p.write_text(text.replace(old_cleanup, new_cleanup, 1))
          PY
          rm -f .github/workflows/isolate-login-logout-smoke.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          bash -n tools/login-logout-http-smoke
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              .github/workflows/*) continue ;;
            esac
            git add -- "$path"
          done < <(git diff --name-only)
          git commit -m 'test(security): isolate logout smoke fixtures'
          git push origin HEAD:agent/maintenance-security-refactor-touch
