name: Temporary Telemetry Asset Reconcile

on:
  push:
    branches:
      - agent/telemetry-overlap-all-surfaces

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telemetry-overlap-all-surfaces
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile legacy opacity contract and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/version-asset-contract-check.php')
          source = path.read_text()
          old = 'body.has-telemetry-mountains .login-telemetry-wave-path{stroke:none;opacity:.3}'
          new = 'body.has-telemetry-mountains .login-telemetry-wave-path{stroke:none;opacity:.5}'
          if source.count(old) != 1:
              raise SystemExit('legacy telemetry opacity asset contract target count != 1')
          path.write_text(source.replace(old, new, 1))
          PY
          php -l tools/version-asset-contract-check.php
          rm .github/workflows/reconcile-telemetry-asset-contract.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/telemetry-json-source-contract-check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(telemetry): require 50% footer opacity'
          git push origin HEAD:agent/telemetry-overlap-all-surfaces
