name: PR 371 Architecture Diagnostic

on:
  push:
    branches:
      - fix/vps-homologation-mfa

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Diagnose transitional PHP paths
        shell: bash
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'app/Core/Architecture/LayerMap.php';
          use Prontoo\Core\Architecture\LayerMap;
          $root = getcwd();
          $groups = [];
          $paths = [];
          foreach (LayerMap::phpFiles($root) as $file) {
              $relative = ltrim(str_replace(str_replace('\\', '/', $root) . '/', '', str_replace('\\', '/', $file)), '/');
              if (LayerMap::isNativePath($relative)) {
                  continue;
              }
              $role = LayerMap::compositionRoleFor($relative) ?? 'non_composition';
              $layer = LayerMap::layerFor($relative) ?? 'unclassified';
              $key = $layer . ':' . $role;
              $groups[$key] = ($groups[$key] ?? 0) + 1;
              $paths[] = [$key, $relative];
          }
          ksort($groups);
          echo "GROUPS\n";
          foreach ($groups as $key => $count) echo "$key=$count\n";
          echo "PATHS\n";
          foreach ($paths as [$key, $path]) echo "$key\t$path\n";
          echo 'TOTAL=' . count($paths) . "\n";
          PHP
