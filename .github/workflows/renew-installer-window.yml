name: Renew Installer Window 1.7.21.8

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  renew:
    if: github.head_ref == 'agent/renew-installer-window-1.7.21.8-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout renewal branch
        uses: actions/checkout@v4
        with:
          ref: agent/renew-installer-window-1.7.21.8-20260722
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply four-hour renewal
        shell: bash
        run: |
          set -euo pipefail
          python3 .automation/renew-installer-window.py | tee /tmp/renew-installer-window.json

      - name: PHP syntax and documentation policy
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './storage' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          test -z "$(find . -type f -name '*.md' -print -quit)"

      - name: Validate metadata and sealed manifest
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $version = json_decode((string) file_get_contents("version.json"), true, 512, JSON_THROW_ON_ERROR);
            $window = $version["temporary_public_installer"] ?? [];
            if (($window["start_unix"] ?? 0) !== 1784722014 || ($window["end_unix"] ?? 0) !== 1784736414) throw new RuntimeException("Janela divergente");
            if ((int) $window["end_unix"] - (int) $window["start_unix"] !== 14400) throw new RuntimeException("Duração divergente");
            $manifest = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $bytes = 0;
            foreach ((array) $manifest["files"] as $file => $hash) {
              if (!is_file($file) || !hash_equals((string) $hash, hash_file("sha256", $file))) throw new RuntimeException("Hash divergente: " . $file);
              $bytes += filesize($file);
            }
            if ($bytes !== (int) $manifest["total_uncompressed_bytes"]) throw new RuntimeException("Bytes divergentes");
          '

      - name: Installer, schema and architecture contracts
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          php tools/install-security-check.php | tee /tmp/install-security-report.json
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php | tee /tmp/schema-report.json
          php tools/architecture-check.php | tee /tmp/architecture-report.json
          test "$(sha256sum app/Database/schema.sql | cut -d' ' -f1)" = "28515f46af3081e5ac0dded5723e6d2d7ceddec11e9c6f782975f31931a69d33"

      - name: Commit certified product files
        shell: bash
        run: |
          set -euo pipefail
          git add .htaccess ChangeLog.txt \
            app/Core/Install/InstallAccess.php \
            app/architecture.manifest.json \
            app/update.manifest.json \
            tools/install-security-check.php \
            version.json
          if git diff --cached --quiet; then
            echo "Renewal already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "renova a janela pública do instalador por quatro horas"
          git push origin HEAD:agent/renew-installer-window-1.7.21.8-20260722

      - name: Upload renewal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-installer-window-1.7.21.8-20260722
          path: |
            /tmp/renew-installer-window.json
            /tmp/install-security-report.json
            /tmp/schema-report.json
            /tmp/architecture-report.json
          if-no-files-found: warn
          retention-days: 7
