name: Presentation CSS Safe Debt Reduction
on:
  push:
    branches: [agent/presentation-css-debt-reduction-1]
    paths:
      - tools/presentation-css-safe-reduce
      - .github/workflows/presentation-css-safe-reduce.yml
permissions:
  contents: write
jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-debt-reduction-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reduce debt and prove UX equivalence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m pip install --quiet tinycss2
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/presentation-css-safe-reduce')
          s=p.read_text()
          start=s.index('def dedupe_declarations(tokens, stats: dict[str, int]):')
          end=s.index('\ndef route_name(text: str)', start)
          replacement=r'''def dedupe_declarations(tokens, stats: dict[str, int]):
              items = tinycss2.parse_declaration_list(tokens, skip_whitespace=False, skip_comments=False)
              output = []
              previous_key = None
              custom_last = {}
              for item in items:
                  if item.type in {'whitespace', 'comment'}:
                      output.append(item)
                      continue
                  if item.type == 'declaration':
                      key = declaration_key(item)
                      duplicate = previous_key == key
                      if str(item.lower_name).startswith('--'):
                          if custom_last.get(str(item.lower_name)) == key:
                              duplicate = True
                          custom_last[str(item.lower_name)] = key
                      if duplicate:
                          stats['duplicate_declarations_removed'] += 1
                          if item.important:
                              stats['duplicate_important_removed'] += 1
                          continue
                      previous_key = key
                      output.append(item)
                      continue
                  previous_key = None
                  output.append(item)
              return tinycss2.parse_component_value_list(tinycss2.serialize(output))


          def dedupe_selector_prelude(tokens, stats: dict[str, int]):
              parts = []
              current = []
              for token in tokens:
                  if token.type == 'literal' and getattr(token, 'value', None) == ',':
                      parts.append(current)
                      current = []
                  else:
                      current.append(token)
              parts.append(current)
              if len(parts) < 2:
                  return tokens
              unique = []
              seen = set()
              removed = 0
              for part in parts:
                  text = tinycss2.serialize(part).strip()
                  if text and text in seen:
                      removed += 1
                      continue
                  if text:
                      seen.add(text)
                  unique.append(text)
              if removed == 0:
                  return tokens
              stats['duplicate_selectors_removed'] += removed
              return tinycss2.parse_component_value_list(','.join(unique))


          def transform_rules(rules, stats: dict[str, int]):
              output = []
              previous_qualified_key = None
              for rule in rules:
                  if rule.type in {'whitespace', 'comment'}:
                      output.append(rule)
                      continue
                  if rule.type == 'qualified-rule':
                      rule.prelude = dedupe_selector_prelude(rule.prelude, stats)
                      rule.content = dedupe_declarations(rule.content, stats)
                      key = tinycss2.serialize(rule.prelude).strip() + '{' + tinycss2.serialize(rule.content) + '}'
                      if previous_qualified_key == key:
                          stats['adjacent_duplicate_rules_removed'] += 1
                          stats['duplicate_rule_important_removed'] += tinycss2.serialize(rule.content).count('!important')
                          stats['duplicate_rule_route_scopes_removed'] += tinycss2.serialize(rule.prelude).count('body[data-route=')
                          continue
                      previous_qualified_key = key
                      output.append(rule)
                      continue
                  if rule.type == 'at-rule' and rule.content is not None:
                      name = str(rule.lower_at_keyword)
                      if name in RULE_LIST_AT:
                          inner = tinycss2.parse_rule_list(rule.content, skip_whitespace=False, skip_comments=False)
                          inner = transform_rules(inner, stats)
                          rule.content = tinycss2.parse_component_value_list(tinycss2.serialize(inner))
                      elif name in DECLARATION_AT:
                          rule.content = dedupe_declarations(rule.content, stats)
                  previous_qualified_key = None
                  output.append(rule)
              return output

'''
          replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())+'\n'
          s=s[:start]+replacement+s[end+1:]
          old="stats = {'duplicate_declarations_removed': 0, 'duplicate_important_removed': 0}"
          new="stats = {'duplicate_declarations_removed': 0, 'duplicate_important_removed': 0, 'duplicate_selectors_removed': 0, 'adjacent_duplicate_rules_removed': 0, 'duplicate_rule_important_removed': 0, 'duplicate_rule_route_scopes_removed': 0}"
          if s.count(old)!=1:
              raise SystemExit('stats anchor missing')
          s=s.replace(old,new,1)
          old2="if stats['duplicate_declarations_removed'] < 1:\n        fail('no semantics-preserving duplicate declarations found')"
          new2="if stats['duplicate_declarations_removed'] + stats['duplicate_selectors_removed'] + stats['adjacent_duplicate_rules_removed'] < 1:\n        fail('no provably equivalent CSS redundancies found')"
          if s.count(old2)!=1:
              raise SystemExit('reduction guard anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python3 tools/presentation-css-safe-reduce
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium
          node tools/presentation-ux-contract.mjs --check
          python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p='version.json'
          data=json.load(open(p))
          now=datetime.now(ZoneInfo('America/Cuiaba')).replace(microsecond=0)
          data['generated_at_unix']=int(now.timestamp())
          data['generated_at']=now.isoformat()
          data['updated_at']=now.isoformat()
          data['notes']='Redução inicial da dívida CSS remove redundâncias formalmente equivalentes em declarations, selector lists e regras adjacentes; UX é provada pelo baseline Chromium.'
          data['deployment_sync_id']='github-prontoo-1.8.12.9-presentation-css-safe-debt-reduction'
          data['deployment_sync_requested_at']=now.isoformat()
          with open(p,'w') as f: json.dump(data,f,indent=4,ensure_ascii=False); f.write('\n')
          PY
          rm -rf node_modules
          git rm -f tools/presentation-css-safe-reduce .github/workflows/presentation-css-safe-reduce.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check -- ':!app/Presentation/Styles/**/*.css' ':!public/assets/presentation.css'
          git commit -m "refactor(presentation): reduce semantics-neutral CSS debt"
          git push origin HEAD:agent/presentation-css-debt-reduction-1
