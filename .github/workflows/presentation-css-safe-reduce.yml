name: Presentation CSS Surgical Debt Reduction
on:
  push:
    branches: [agent/presentation-css-debt-reduction-1]
    paths:
      - tools/presentation-css-surgical-reduce
      - .github/workflows/presentation-css-safe-reduce.yml
permissions:
  contents: write
jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-debt-reduction-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply one exact CSS edit and prove UX equivalence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/presentation-css-surgical-reduce
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium
          node tools/presentation-ux-contract.mjs --check
          python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p='version.json'
          data=json.load(open(p))
          now=datetime.now(ZoneInfo('America/Cuiaba')).replace(microsecond=0)
          data['generated_at_unix']=int(now.timestamp())
          data['generated_at']=now.isoformat()
          data['updated_at']=now.isoformat()
          data['deployment_sync_id']='github-prontoo-1.8.12.9-presentation-css-surgical-debt-reduction'
          data['deployment_sync_requested_at']=now.isoformat()
          with open(p,'w') as f: json.dump(data,f,indent=4,ensure_ascii=False); f.write('\n')
          PY
          rm -rf node_modules
          git rm -f tools/presentation-css-safe-reduce tools/presentation-css-safe-reduce-patch tools/presentation-css-selector-audit tools/presentation-css-surgical-reduce .github/workflows/presentation-css-selector-audit.yml .github/workflows/presentation-css-safe-reduce.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check -- ':!app/Presentation/Styles/**/*.css' ':!public/assets/presentation.css'
          git commit -m "refactor(presentation): eliminate duplicate selector-list debt"
          git push origin HEAD:agent/presentation-css-debt-reduction-1
