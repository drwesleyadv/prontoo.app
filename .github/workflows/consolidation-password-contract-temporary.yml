name: Consolidation Password Contract Temporary

on:
  pull_request:
    branches: [prontoo]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/consolidation-audit-20260809'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-audit-20260809
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Reconcile native password contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/install-security-check.php')
          text = path.read_text()
          old = '''if (!preg_match('/function\\\\s+password_ok\\\\(string\\\\s+\\\\$s\\\\):\\\\s*bool\\\\s*\\\\{.*?return\\\\s+\\\\$length\\\\s*>=\\\\s*8\\\\s*&&\\\\s*\\\\$length\\\\s*<=\\\\s*128\\\\s*&&\\\\s*!password_common_rejected\\\\(\\\\$s\\\\);/s', $securityAccessSource) ||
              substr_count($authSecuritySource, 'minlength="8" maxlength="128"') < 5 ||
              str_contains($authSecuritySource, 'minlength="15"') ||
              str_contains($securityAccessSource, '$length >= 15')) {
              $errors[] = 'password_minimum_8_policy';
          }'''
          new = '''$nativeSecurityAccessSource = (string) file_get_contents(
              $root . '/app/Infrastructure/SecurityAccess/SecurityAccessInfrastructureOperations01.php',
          );
          if (!str_contains($nativeSecurityAccessSource, 'public static function password_ok(string $s): bool') ||
              !str_contains($nativeSecurityAccessSource, '$length >= 8 &&') ||
              !str_contains($nativeSecurityAccessSource, '$length <= 128 &&') ||
              !str_contains($nativeSecurityAccessSource, '::password_common_rejected($s);') ||
              substr_count($authSecuritySource, 'minlength="8" maxlength="128"') < 5 ||
              str_contains($authSecuritySource, 'minlength="15"') ||
              str_contains($nativeSecurityAccessSource, '$length >= 15')) {
              $errors[] = 'password_minimum_8_policy';
          }'''
          if old not in text:
              raise SystemExit('password contract block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          php tools/release-contract-reconcile --write
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/install-security-check.php app/update.manifest.json app/architecture.manifest.json version.json app/prontoo.php br/index.php CHANGELOG.md .github/workflows/architecture.yml .github/workflows/documentation.yml
          git commit -m 'test: validate native password policy contract'
          git push origin HEAD:agent/consolidation-audit-20260809
