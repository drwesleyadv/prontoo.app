name: Temporary Audited Baseline Publisher

on:
  push:
    branches:
      - audit/baseline-1.8.13.2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/baseline-1.8.13.2
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring

      - name: Apply audited baseline and reconcile release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-baseline-publisher.yml
          php -r '
          $p="app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php";
          $s=file_get_contents($p);
          $old="stats-grid admin-overview-kpis two wide";
          $new="two wide global-telemetry-grid";
          if (substr_count($s,$old)!==1) { fwrite(STDERR,"telemetry wrapper contract drift\n"); exit(1); }
          file_put_contents($p,str_replace($old,$new,$s,$count),LOCK_EX);
          if ($count!==1) { exit(1); }
          '
          php -r '
          $p="README.md";
          $s=file_get_contents($p);
          if (substr_count($s,"1.8.11.2")!==1) { fwrite(STDERR,"README version drift\n"); exit(1); }
          $s=str_replace("1.8.11.2","1.8.13.2",$s);
          $needle="- `docs/index.md`: mapa de toda a documentação.";
          if (substr_count($s,$needle)!==1) { fwrite(STDERR,"README map drift\n"); exit(1); }
          $s=str_replace($needle,"- `AGENTS.md`: guardrails operacionais para IA agêntica e automações;\n".$needle,$s);
          file_put_contents($p,$s,LOCK_EX);
          '
          php -r '
          $p="CONTRIBUTING.md";
          $s=file_get_contents($p);
          $needle="## Ambiente";
          if (substr_count($s,$needle)!==1) { fwrite(STDERR,"CONTRIBUTING structure drift\n"); exit(1); }
          $block="## Antes de alterar\n\nHumanos e agentes devem ler `AGENTS.md`. Ele reúne a ordem de autoridade, invariantes arquiteturais, regras de tenant, segurança, banco, Presentation, release e Definition of Done.\n\n";
          $s=str_replace($needle,$block.$needle,$s);
          file_put_contents($p,$s,LOCK_EX);
          '
          php -r '
          $p="docs/index.md";
          $s=file_get_contents($p);
          $needle="## Leitura recomendada";
          if (substr_count($s,$needle)!==1) { fwrite(STDERR,"docs index structure drift\n"); exit(1); }
          $block="## Entrada para agentes\n\nQualquer IA agêntica ou automação que pretenda editar o repositório deve começar por `../AGENTS.md`. Esse documento reúne guardrails operacionais, ordem de autoridade, regras de tenant, segurança, banco, Presentation, release e Definition of Done. A baseline vigente está registrada em `audits/BASELINE-1.8.13.2.md`.\n\n";
          $s=str_replace($needle,$block.$needle,$s);
          file_put_contents($p,$s,LOCK_EX);
          '
          php tools/release-version --write --date=2026-08-13 --timestamp=2026-08-13T09:30:00-04:00 --expected-current=1.8.13.1
          php -r '
          $p="version.json";
          $v=json_decode(file_get_contents($p),true,512,JSON_THROW_ON_ERROR);
          $v["build"]="1.8.13.2-audited-baseline-agentic-guardrails";
          $v["database_changes"]=false;
          $v["schema_changes"]=false;
          $v["logic_changes"]=true;
          $v["visual_changes"]=true;
          $v["documentation_changes"]=true;
          $v["functional_equivalence_policy"]="intentional_visual_fix_telemetry_two_by_two_without_business_logic_change";
          $v["notes"]="Baseline auditada: corrige a grade 2×2 dos quatro KPIs globais sem alterar CSS, cálculos ou fontes e consolida guardrails operacionais para IA agêntica.";
          $v["changelog"]=["title"=>"Baseline auditada e guardrails para agentes","items"=>["corrige a composição dos quatro KPIs de telemetria para 2 colunas × 2 linhas em viewport ampla, preservando a queda responsiva para uma coluna","remove do wrapper interno a combinação de classes cujo auto-fit anulava a intenção da grade two, sem alterar CSS, cálculos ou fontes de telemetria","atualiza README, índice documental e guia de contribuição para a baseline vigente","adiciona AGENTS.md com ordem de autoridade, invariantes de arquitetura, tenant, segurança, banco, Presentation, release e checklist de merge para IA agêntica","mantém banco e schema inalterados"]];
          $v["deployment_sync_id"]="github-prontoo-1.8.13.2-audited-baseline-agentic-guardrails";
          $v["deployment_sync_requested_at"]="2026-08-13T09:30:00-04:00";
          $v["rewrite_scope"]="admin_status_telemetry_layout_and_agentic_documentation_only";
          file_put_contents($p,json_encode($v,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR).PHP_EOL,LOCK_EX);
          '
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/presentation-css-build --check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/quality-gate

      - name: Commit audited baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -Fq '.github/workflows/audit-baseline-publisher.yml'; then
            echo 'Temporary workflow leaked into final diff.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'chore(release): publish audited baseline 1.8.13.2'
          git push origin HEAD:audit/baseline-1.8.13.2
