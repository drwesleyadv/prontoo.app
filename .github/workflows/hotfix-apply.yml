name: Hotfix Apply 1.7.21.1

on:
  push:
    branches:
      - agent/hotfix-1.7.21.1-zero-table-installer

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-1.7.21.1-zero-table-installer
          fetch-depth: 0

      - name: Apply verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .hotfix/part.00 ]; then
            echo "Hotfix already applied."
            exit 0
          fi
          find .hotfix -maxdepth 1 -type f -name 'part.*' -print0 | sort -z | xargs -0 cat > /tmp/hotfix.patch
          echo '8d56e4488bc8bd8fe3502ed2e7648c8d17b9e88de4f44ea079a19f0fbd0980b5  /tmp/hotfix.patch' | sha256sum -c -
          python3 - <<'PY'
          import re
          from pathlib import Path
          patch = Path('/tmp/hotfix.patch').read_text()
          sections = re.split(r'(?=^diff -ruN )', patch, flags=re.M)
          kept = [
              section
              for section in sections
              if section and 'prontoo_main/.github/workflows/architecture.yml' not in section.splitlines()[0]
          ]
          Path('/tmp/hotfix-no-workflow.patch').write_text(''.join(kept))
          PY
          patch --dry-run --batch --forward -p1 < /tmp/hotfix-no-workflow.patch
          patch --batch --forward -p1 < /tmp/hotfix-no-workflow.patch
          rm -rf .hotfix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige instalador em banco com zero tabelas'
          git push origin HEAD:agent/hotfix-1.7.21.1-zero-table-installer
