name: Hotfix Apply 1.7.21.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/hotfix-1.7.21.1-zero-table-installer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-1.7.21.1-zero-table-installer
          fetch-depth: 0

      - name: Assemble and test hotfix
        shell: bash
        run: |
          set -u
          head -n -3 .hotfix/part.00 > hotfix.patch
          cat .hotfix/part.01 .hotfix/part.02 .hotfix/part.03 >> hotfix.patch
          sha256sum hotfix.patch | tee hotfix-hash.txt
          find .hotfix -maxdepth 1 -type f -printf '%f %s\n' | sort > hotfix-files.txt
          find .hotfix -maxdepth 1 -type f -name 'part.*' -print0 | sort -z | xargs -0 sha256sum > hotfix-parts.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          patch = Path('hotfix.patch').read_text()
          sections = re.split(r'(?=^diff -ruN )', patch, flags=re.M)
          kept = [
              section
              for section in sections
              if section and 'prontoo_main/.github/workflows/architecture.yml' not in section.splitlines()[0]
          ]
          Path('hotfix-no-workflow.patch').write_text(''.join(kept))
          PY
          patch --dry-run --batch --forward -p1 < hotfix-no-workflow.patch > hotfix-dry-run.txt 2>&1 || true

      - name: Upload hotfix diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-diagnostic
          path: |
            hotfix.patch
            hotfix-no-workflow.patch
            hotfix-hash.txt
            hotfix-files.txt
            hotfix-parts.txt
            hotfix-dry-run.txt
          if-no-files-found: error
          retention-days: 1
