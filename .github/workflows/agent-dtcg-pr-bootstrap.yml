          let php=runtime;const needle='        return [\n            "brand" => $base,';if(!php.includes(needle))throw new Error('runtime theme anchor missing');php=php.replace(needle,`        $css .=\n            "--pt-theme-identity-accent:" . $base .\n            ";--pt-theme-identity-hover:" . $hover .\n            ";--pt-theme-identity-on-accent:" . $on .\n            ";--pt-theme-accent:" . $base .\n            ";--pt-theme-accent-strong:" . $strong .\n            ";--pt-theme-accent-hover:" . $hover .\n            ";--pt-theme-accent-soft:" . $soft .\n            ";--pt-theme-accent-subtle:" . $subtle .\n            ";--pt-theme-accent-muted:" . $muted .\n            ";--pt-theme-on-accent:" . $on .\n            ";";\n`+needle);fs.writeFileSync('app/Domain/ClinicConfig/ClinicConfigDomainOperations02.php',php);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.scripts={...(pkg.scripts||{}),'tokens:build':'node tools/design-tokens-build.mjs --write','tokens:check':'node tools/design-tokens-build.mjs --check','tokens:contract':'node tools/design-tokens-contract.mjs'};fs.writeFileSync('package.json',JSON.stringify(pkg,null,4)+'\n');
