      - name: Reconcile presentation source manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const p='app/Presentation/Styles/styles.manifest.json',root='app/Presentation/Styles/',m=JSON.parse(fs.readFileSync(p,'utf8'));const tokenSet=new Set(['tokens/clinic.css','tokens/material.css','tokens/semantic.css']);m.token_source_model='dtcg-2025.10-style-dictionary-v5';m.token_source_root='design/tokens';m.token_compiler='tools/design-tokens-build.mjs';m.token_generated_sources=[...tokenSet];for(const s of m.sources){const css=fs.readFileSync(root+s.path,'utf8');s.sha256=crypto.createHash('sha256').update(css).digest('hex');s.bytes=Buffer.byteLength(css);s.important_count=(css.match(/!important/g)||[]).length;s.route_scope_count=(css.match(/body\[data-route=/g)||[]).length}const idx=[];m.sequence.forEach((s,i)=>{if(tokenSet.has(s.source))idx.push(i)});const min=Math.min(...idx),max=Math.max(...idx);for(let i=min;i<=max;i++)if(!tokenSet.has(m.sequence[i].source))throw new Error(`token sequence interleaved:${i}`);const tokenSegments=[...tokenSet].map(source=>{const css=fs.readFileSync(root+source,'utf8');return{source,offset:0,bytes:Buffer.byteLength(css),sha256:crypto.createHash('sha256').update(css).digest('hex'),important_count:(css.match(/!important/g)||[]).length,route_scope_count:(css.match(/body\[data-route=/g)||[]).length}});m.sequence=[...m.sequence.slice(0,min),...tokenSegments,...m.sequence.slice(max+1)];m.sequence.forEach((s,i)=>s.order=i+1);m.sequence_segment_count=m.sequence.length;let built='';for(const s of m.sequence){const css=fs.readFileSync(root+s.source,'utf8'),slice=Buffer.from(css).subarray(s.offset,s.offset+s.bytes).toString();if(Buffer.byteLength(slice)!==s.bytes)throw new Error(`bad slice ${s.source}`);if(!tokenSet.has(s.source)){s.sha256=crypto.createHash('sha256').update(slice).digest('hex');s.important_count=(slice.match(/!important/g)||[]).length;s.route_scope_count=(slice.match(/body\[data-route=/g)||[]).length}built+=slice}m.artifact_contract={...(m.artifact_contract||{}),sha256:crypto.createHash('sha256').update(built).digest('hex'),bytes:Buffer.byteLength(built),deterministic_source_required:true};fs.writeFileSync(p,JSON.stringify(m,null,4)+'\n');fs.writeFileSync('public/assets/presentation.css',built);
          NODE
