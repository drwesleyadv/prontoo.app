name: Agent DTCG PR Bootstrap

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build DTCG source from canonical CSS inventory
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact style-dictionary@5.5.0
          node <<'NODE'
          const fs=require('fs');
          const roots={clinic:'app/Presentation/Styles/tokens/clinic.css',material:'app/Presentation/Styles/tokens/material.css',semantic:'app/Presentation/Styles/tokens/semantic.css'};
          const bridge={schema:'prontoo-design-token-css-bridge-v1',entries:[],rules:[]};
          const canonical={
            '--md-ref-palette-primary40':'var(--pt-sys-color-accent)','--md-ref-palette-primary30':'var(--pt-sys-color-accent-strong)',
            '--md-sys-color-primary':'var(--pt-sys-color-accent)','--md-sys-color-on-primary':'var(--pt-sys-color-on-accent)','--md-sys-color-primary-container':'var(--pt-sys-color-accent-container)','--md-sys-color-on-primary-container':'var(--pt-sys-color-on-accent-container)',
