              while((prop=propRe.exec(body))){let value=prop[2].trim();const important=/!important\s*$/i.test(value);value=value.replace(/!important\s*$/i,'').trim();declarations.push({target,selector,name:prop[1],value,important,order:order++});ranges.push([prop.index,prop.index+prop[0].length]);}
              let remainder='',cursor=0;for(const [a,b] of ranges){remainder+=body.slice(cursor,a);cursor=b}remainder+=body.slice(cursor);const cleaned=remainder.replace(/\s+/g,' ').trim().replace(/^;+|;+$/g,'').trim();if(cleaned)bridge.rules.push({target,selector,declarations:cleaned,order:order++});
            }
          }
          let changed=true;while(changed){changed=false;for(const item of declarations.filter(x=>x.selector===':root')){if(dynamic.has(item.name))continue;const deps=[...item.value.matchAll(/var\((--[a-z0-9-]+)/gi)].map(m=>m[1]);if(deps.some(dep=>dep.startsWith('--clinic-')||dynamic.has(dep))){dynamic.add(item.name);changed=true}}}
          for(const item of declarations)bridge.entries.push({...item,selector:item.selector===':root'&&dynamic.has(item.name)?'body':item.selector,value:canonical[item.name]||item.value});
          bridge.policy={authored_css_is_not_source_of_truth:true,runtime_sensitive_aliases_resolve_on_body:true};fs.mkdirSync('design/tokens',{recursive:true});fs.writeFileSync('design/tokens/css-bridge.json',JSON.stringify(bridge,null,2)+'\n');
          const color=hex=>{const h=hex.replace('#','').toLowerCase(),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return{colorSpace:'srgb',components:[r/255,g/255,b/255],hex:'#'+h}};
          const ext=(cssName,target='clinic',selector=':root',order=-10000,cssValue=null,important=false)=>({'com.prontoo':{cssName,target,selector,order,...(cssValue?{cssValue}:{}),...(important?{important:true}:{})}});const t=(v,n,target='clinic',selector=':root',o=-10000,x=null,important=false)=>({$type:'color',$value:v,$extensions:ext(n,target,selector,o,x,important)});
          const ref={ref:{color:{brand:{default:t(color('#2f6652'),'--pt-ref-color-brand-default'),strong:t(color('#1d583f'),'--pt-ref-color-brand-strong'),soft:t(color('#d9f0df'),'--pt-ref-color-brand-soft'),subtle:t(color('#f6fbf7'),'--pt-ref-color-brand-subtle'),global:t(color('#238763'),'--pt-ref-color-brand-global'),globalStrong:t(color('#105e44'),'--pt-ref-color-brand-global-strong'),public:t(color('#2d6f55'),'--pt-ref-color-brand-public')},neutral:{white:t(color('#ffffff'),'--pt-ref-color-neutral-white')},semantic:{success:t(color('#146c43'),'--pt-ref-color-success'),successContainer:t(color('#d8f5e5'),'--pt-ref-color-success-container'),successInk:t(color('#05391f'),'--pt-ref-color-success-ink'),warning:t(color('#865900'),'--pt-ref-color-warning'),warningContainer:t(color('#ffefc2'),'--pt-ref-color-warning-container'),warningInk:t(color('#3d2b00'),'--pt-ref-color-warning-ink'),info:t(color('#286b73'),'--pt-ref-color-info'),infoContainer:t(color('#d6f4f7'),'--pt-ref-color-info-container'),infoInk:t(color('#063b42'),'--pt-ref-color-info-ink'),error:t(color('#ba1a1a'),'--pt-ref-color-error'),errorContainer:t(color('#ffdad6'),'--pt-ref-color-error-container'),errorInk:t(color('#410002'),'--pt-ref-color-error-ink')}}}};
          const sys={sys:{color:{accent:t('{ref.color.brand.default}','--pt-sys-color-accent','clinic','body',-9000,'var(--pt-theme-accent,var(--pt-ref-color-brand-default))'),accentStrong:t('{ref.color.brand.strong}','--pt-sys-color-accent-strong','clinic','body',-8999,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),onAccent:t('{ref.color.neutral.white}','--pt-sys-color-on-accent','clinic','body',-8998,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),accentContainer:t('{ref.color.brand.soft}','--pt-sys-color-accent-container','clinic','body',-8997,'var(--pt-theme-accent-soft,var(--pt-ref-color-brand-soft))'),onAccentContainer:t('{ref.color.brand.strong}','--pt-sys-color-on-accent-container','clinic','body',-8996,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),accentSubtle:t('{ref.color.brand.subtle}','--pt-sys-color-accent-subtle','clinic','body',-8995,'var(--pt-theme-accent-subtle,var(--pt-ref-color-brand-subtle))'),secondary:t('{ref.color.brand.strong}','--pt-sys-color-secondary','clinic','body',-8994,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),onSecondary:t('{ref.color.neutral.white}','--pt-sys-color-on-secondary','clinic','body',-8993,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),secondaryContainer:t('{ref.color.brand.subtle}','--pt-sys-color-secondary-container','clinic','body',-8992,'var(--pt-theme-accent-subtle,var(--pt-ref-color-brand-subtle))'),onSecondaryContainer:t('{ref.color.brand.strong}','--pt-sys-color-on-secondary-container','clinic','body',-8991,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),tertiary:t('{ref.color.brand.default}','--pt-sys-color-tertiary','clinic','body',-8990,'var(--pt-theme-accent-hover,var(--pt-theme-accent,var(--pt-ref-color-brand-default)))'),onTertiary:t('{ref.color.neutral.white}','--pt-sys-color-on-tertiary','clinic','body',-8989,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),tertiaryContainer:t('{ref.color.brand.soft}','--pt-sys-color-tertiary-container','clinic','body',-8988,'var(--pt-theme-accent-muted,var(--pt-ref-color-brand-soft))'),onTertiaryContainer:t('{ref.color.brand.strong}','--pt-sys-color-on-tertiary-container','clinic','body',-8987,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),success:t('{ref.color.semantic.success}','--pt-sys-color-success'),onSuccess:t('{ref.color.neutral.white}','--pt-sys-color-on-success'),successContainer:t('{ref.color.semantic.successContainer}','--pt-sys-color-success-container'),onSuccessContainer:t('{ref.color.semantic.successInk}','--pt-sys-color-on-success-container'),warning:t('{ref.color.semantic.warning}','--pt-sys-color-warning'),onWarning:t('{ref.color.neutral.white}','--pt-sys-color-on-warning'),warningContainer:t('{ref.color.semantic.warningContainer}','--pt-sys-color-warning-container'),onWarningContainer:t('{ref.color.semantic.warningInk}','--pt-sys-color-on-warning-container'),info:t('{ref.color.semantic.info}','--pt-sys-color-info'),infoContainer:t('{ref.color.semantic.infoContainer}','--pt-sys-color-info-container'),onInfoContainer:t('{ref.color.semantic.infoInk}','--pt-sys-color-on-info-container'),error:t('{ref.color.semantic.error}','--pt-sys-color-error'),onError:t('{ref.color.neutral.white}','--pt-sys-color-on-error'),errorContainer:t('{ref.color.semantic.errorContainer}','--pt-sys-color-error-container'),onErrorContainer:t('{ref.color.semantic.errorInk}','--pt-sys-color-on-error-container')}}};
          const cmp={cmp:{pagehead:{accent:t('{sys.color.accent}','--pt-cmp-pagehead-accent','clinic','body',-8000,'var(--pt-theme-identity-accent,var(--pt-sys-color-accent))'),onAccent:t('{sys.color.onAccent}','--pt-cmp-pagehead-on-accent','clinic','body',-7999,'var(--pt-theme-identity-on-accent,var(--pt-sys-color-on-accent))'),hover:t('{sys.color.accentStrong}','--pt-cmp-pagehead-hover','clinic','body',-7998,'var(--pt-theme-identity-hover,var(--pt-sys-color-accent-strong))'),container:t('{sys.color.accentContainer}','--pt-cmp-pagehead-container','clinic','body',-7997,'color-mix(in srgb,var(--pt-cmp-pagehead-accent) 15%,var(--md-sys-color-surface-container-lowest))'),onContainer:t('{sys.color.accentStrong}','--pt-cmp-pagehead-on-container','clinic','body',-7996,'color-mix(in srgb,var(--pt-cmp-pagehead-accent) 74%,#102018)')}}};
          const theme=(name,hex,selector,o)=>t(color(hex),name,'material',selector,o,null,true);const themes={theme:{global:{accent:theme('--pt-theme-accent','#238763','body.scope-global',-7000),strong:theme('--pt-theme-accent-strong','#105e44','body.scope-global',-6999),hover:theme('--pt-theme-accent-hover','#105e44','body.scope-global',-6998),soft:theme('--pt-theme-accent-soft','#dff3ea','body.scope-global',-6997),subtle:theme('--pt-theme-accent-subtle','#f1fbf6','body.scope-global',-6996),muted:theme('--pt-theme-accent-muted','#dff3ea','body.scope-global',-6995),on:theme('--pt-theme-on-accent','#ffffff','body.scope-global',-6994),identity:theme('--pt-theme-identity-accent','#238763','body.scope-global',-6993),identityHover:theme('--pt-theme-identity-hover','#105e44','body.scope-global',-6992),identityOn:theme('--pt-theme-identity-on-accent','#ffffff','body.scope-global',-6991)},public:{accent:theme('--pt-theme-accent','#2d6f55','body.public',-6980),strong:theme('--pt-theme-accent-strong','#1d583f','body.public',-6979),hover:theme('--pt-theme-accent-hover','#1d583f','body.public',-6978),soft:theme('--pt-theme-accent-soft','#d9f0df','body.public',-6977),subtle:theme('--pt-theme-accent-subtle','#f6fbf7','body.public',-6976),muted:theme('--pt-theme-accent-muted','#d9f0df','body.public',-6975),on:theme('--pt-theme-on-accent','#ffffff','body.public',-6974),identity:theme('--pt-theme-identity-accent','#2d6f55','body.public',-6973),identityHover:theme('--pt-theme-identity-hover','#1d583f','body.public',-6972),identityOn:theme('--pt-theme-identity-on-accent','#ffffff','body.public',-6971)}}};
