name: Phase 1 Visual Geometry

on:
  push:
    branches:
      - 'agent/presentation-visual-contract'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/presentation-visual-contract
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply canonical geometry
        run: python3 .github/phase1-visual-geometry.py
      - name: Remove temporary phase files
        run: |
          rm .github/phase1-visual-geometry.py
          rm .github/workflows/phase1-visual-geometry.yml
      - name: Reconcile release manifest
        run: php tools/release-contract-reconcile --write
      - name: Validate
        run: |
          php tools/quality-gate
          php tools/release-contract-reconcile --check
          git diff --check
      - name: Commit
        run: |
          git config user.name 'prontoo-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(presentation): canonicalize pagehead geometry'
          git push origin HEAD:agent/presentation-visual-contract
