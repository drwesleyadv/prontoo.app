name: Temporary recurrence add hotfix

on:
  push:
    branches:
      - fix/quick-scheduling-recurrence-add-1-9-15-3

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quick-scheduling-recurrence-add-1-9-15-3
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Materialize hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp-fix-recurrence-add-1-9-15-3.py
          shopt -s nullglob
          for source in public/assets/*1.9.15.2*; do
            target="${source/1.9.15.2/1.9.15.3}"
            git mv "$source" "$target"
          done
          git rm tools/tmp-fix-recurrence-add-1-9-15-3.py .github/workflows/tmp-fix-recurrence-add-1-9-15-3.yml
          php tools/release-contract-reconcile --write
      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          node --check public/assets/app.js
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          php tools/quality-gate --fast
          git diff --check
      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige adição de recorrência no Agendamento Rápido"
          git push origin HEAD:fix/quick-scheduling-recurrence-add-1-9-15-3
