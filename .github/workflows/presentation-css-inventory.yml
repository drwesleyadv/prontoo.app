name: Presentation CSS Source Consolidation

on:
  push:
    branches:
      - agent/presentation-css-source-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-source-consolidation
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Consolidate source and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/presentation-css-source-consolidate')
          source = path.read_text(encoding='utf-8')
          start = source.index('def split_units(source: str) -> list[str]:')
          end = source.index('\ndef concerns(chunk: str)', start)
          replacement = '''def split_units(source: str) -> list[str]:\n    units = source.splitlines(keepends=True)\n    if not units or \"\".join(units) != source:\n        fail(\"line-fragment split changed source\")\n    return units\n\n'''
          path.write_text(source[:start] + replacement + source[end + 1:], encoding='utf-8')
          quality = Path('tools/quality-gate')
          q = quality.read_text(encoding='utf-8')
          old = "$run('presentation-native-css-contract', 'tools/presentation-css-build', ['--lint']);"
          new = "$run('presentation-native-css-contract', 'tools/presentation-css-build');"
          if q.count(old) != 1:
              raise SystemExit('quality gate pre-normalization point missing')
          quality.write_text(q.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/presentation-css-source-consolidate
          test ! -e public/assets/design-system.css
          test -f public/assets/presentation.css
          test "$(sha256sum public/assets/presentation.css | awk '{print $1}')" = "662840adb1acfb8a2f2efcd54102d3ee1e8fcfedd54c0773fb1676a95107a561"
          git rm -f .github/workflows/presentation-css-inventory.yml tools/presentation-css-source-consolidate
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check
          git commit -m "refactor(presentation): consolidate CSS source with byte-equivalent delivery"
          git push origin HEAD:agent/presentation-css-source-consolidation
