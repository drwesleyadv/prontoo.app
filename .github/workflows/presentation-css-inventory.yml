name: Presentation CSS Source Consolidation

on:
  push:
    branches:
      - agent/presentation-css-source-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-source-consolidation
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Consolidate source and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/presentation-css-source-consolidate
          test ! -e public/assets/design-system.css
          test -f public/assets/presentation.css
          test "$(sha256sum public/assets/presentation.css | awk '{print $1}')" = "662840adb1acfb8a2f2efcd54102d3ee1e8fcfedd54c0773fb1676a95107a561"
          git rm .github/workflows/presentation-css-inventory.yml tools/presentation-css-source-consolidate
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check
          git commit -m "refactor(presentation): consolidate CSS source with byte-equivalent delivery"
          git push origin HEAD:agent/presentation-css-source-consolidation
