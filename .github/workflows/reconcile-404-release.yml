name: Reconcile 404 Release Contract

on:
  push:
    branches:
      - agent/public-404-visual-identity-1-8-14-2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reconcile canonical release
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-404-release.yml
          php -l app/Runtime/PublicWeb/PublicWebRuntimeOperations01.php >/dev/null
          bash -n tools/http-runtime-smoke-check
          php tools/release-version
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: reconcile 1.8.14.2 release contract'
          git push origin HEAD:agent/public-404-visual-identity-1-8-14-2
