              removed_legacy.append(reset_path)
          architecture['removed_legacy_files'] = removed_legacy
          write_json('app/architecture.manifest.json', architecture)

          operational = load_json('app/Database/operational-schema.contract.json')
          operational['version'] = VERSION
          write_json('app/Database/operational-schema.contract.json', operational)

          changelog_entry = '''Prontoo 1.7.21.3 — instalador local e congelamento estrutural

- Restringe `install.php` ao loopback e a host local explícito, com bloqueio no servidor web e antes do bootstrap PHP.
- Rejeita cabeçalhos de proxy como prova de origem local.
- Remove o redirecionamento público para o instalador quando a configuração estiver ausente.
- Substitui a flag global de instalação por uma janela privada de mutação estrutural.
- Remove a rotina histórica `CleanInstallReset`, capaz de apagar tabelas.
- Mantém `schema.sql`, revisão r7, 62 tabelas, dados, interface e ativos sem alteração.

'''
          changelog = read('ChangeLog.txt')
          if not changelog.startswith('Prontoo 1.7.21.3'):
              write('ChangeLog.txt', changelog_entry + changelog)

          hardening = '''# Hardening Prontoo 1.7.21.3

## Estado

A instalação 1.7.21.2 foi concluída com sucesso. A partir desta versão, a estrutura do banco é considerada congelada.

## Defesas

- `install.php` recebe `Require local` no servidor web;
- o ponto de entrada valida loopback e host local antes de carregar o bootstrap;
- solicitações com cabeçalhos de proxy são recusadas;
- o runtime público não redireciona para o instalador;
- DDL exige uma janela privada autenticada por nonce em memória;
- a janela só abre para HTTP local real ou CI/CLI explicitamente autorizado;
- a rotina histórica de limpeza integral do banco foi removida;
- testes verificam exposição, congelamento e ausência de referências destrutivas.

## Invariantes preservadas

Não há alteração no `schema.sql`, na revisão `prontoo_1_7_20_6_clean_schema_r7_layer2_ledger`, nas 62 tabelas, nos dados operacionais, na interface ou nos ativos.
'''
          write('HARDENING-1.7.21.3.md', hardening)

          release_files = [
              '.github/workflows/architecture.yml',
              '.htaccess',
              'ChangeLog.txt',
              'HARDENING-1.7.21.3.md',
              'install.php',
              'app/Core/Install/InstallAccess.php',
              'app/Core/Database/SchemaMutationLock.php',
              'app/Database/DatabaseSchema.php',
              'app/Install/Installer.php',
              'app/Runtime/Runner.php',
              'app/bootstrap_architecture.php',
              'app/Database/operational-schema.contract.json',
              'app/architecture.manifest.json',
              'app/prontoo.php',
              'br/index.php',
              'tools/schema-check.php',
              'tools/install-security-check.php',
              'version.json',
          ]
          files = {}
          total = 0
          for path in release_files:
              data = (ROOT / path).read_bytes()
              files[path] = hashlib.sha256(data).hexdigest()
              total += len(data)

          manifest = load_json('app/update.manifest.json')
          manifest.update({
              'version': VERSION,
              'release': VERSION,
              'build': '1.7.21.3-localhost-installer-schema-freeze',
              'package_type': 'post_install_security_hardening_incremental',
              'generated_at': current['generated_at'],
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'clean_install_schema': True,
              'requires_empty_database': True,
              'installer_policy': 'localhost_loopback_host_no_forwarded_headers_only',
              'schema_mutation_policy': 'frozen_except_private_local_installer_or_ci_window',
              'file_count': len(files),
              'total_uncompressed_bytes': total,
              'files': files,
          })
          removed = list(manifest.get('removed_files', []))
          reset_path = 'app/Infrastructure/Database/CleanInstallReset.php'
          if reset_path not in removed:
              removed.append(reset_path)
          manifest['removed_files'] = removed
          write_json('app/update.manifest.json', manifest)
          PY

      - name: Validate hardening
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -path './.git' -prune -o -path './storage' -prune -o -name '*.php' -print0)
          php tools/install-security-check.php
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php
          php tools/architecture-check.php
          php -r '
            $m=json_decode(file_get_contents("app/update.manifest.json"),true,512,JSON_THROW_ON_ERROR);
            $bytes=0;
            foreach($m["files"] as $f=>$h){if(!is_file($f)||!hash_equals($h,hash_file("sha256",$f))){throw new RuntimeException("manifest:".$f);} $bytes+=filesize($f);}
            if($bytes!==(int)$m["total_uncompressed_bytes"]){throw new RuntimeException("manifest:bytes");}
            foreach($m["removed_files"] as $f){if(file_exists($f)){throw new RuntimeException("removed:".$f);}}
          '

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hardening already applied."
          else
            git commit -m "Formaliza Prontoo 1.7.21.3 — instalador local e schema congelado"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
