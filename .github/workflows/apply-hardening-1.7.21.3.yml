name: Apply Hardening 1.7.21.3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-hardening:
    if: github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply frozen-schema hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          VERSION = '1.7.21.3'
          PREVIOUS = '1.7.21.2'

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def load_json(path: str) -> dict:
              return json.loads(read(path))

          def write_json(path: str, payload: dict) -> None:
              write(path, json.dumps(payload, ensure_ascii=False, indent=2) + '\n')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if new in text and old not in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Marcador ausente em {path}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          install_access = r'''<?php
declare(strict_types=1);

namespace Prontoo\Core\Install;

final class InstallAccess
{
    private const LOCAL_HOSTS = ['localhost', '127.0.0.1', '::1'];
    private const FORWARDED_HEADERS = [
        'HTTP_FORWARDED',
        'HTTP_X_FORWARDED_FOR',
        'HTTP_X_REAL_IP',
        'HTTP_CF_CONNECTING_IP',
        'HTTP_TRUE_CLIENT_IP',
    ];

    private function __construct() {}

    public static function isLoopbackAddress(string $address): bool
    {
        $address = trim($address);
        if ($address === '::1') {
            return true;
        }
        if (filter_var($address, FILTER_VALIDATE_IP, FILTER_FLAG_IPV4) === false) {
            return false;
        }
        return str_starts_with($address, '127.');
    }

    public static function requestHost(): string
    {
        $host = strtolower(trim((string) ($_SERVER['HTTP_HOST'] ?? $_SERVER['SERVER_NAME'] ?? '')));
        if ($host === '') {
            return '';
        }
        if (str_starts_with($host, '[')) {
            $end = strpos($host, ']');
            return $end === false ? '' : substr($host, 1, $end - 1);
        }
        return preg_replace('/:\d+$/', '', $host) ?? '';
    }

    public static function isLocalHttpRequest(): bool
    {
        if (PHP_SAPI === 'cli') {
            return false;
        }
        if (!self::isLoopbackAddress((string) ($_SERVER['REMOTE_ADDR'] ?? ''))) {
            return false;
        }
        foreach (self::FORWARDED_HEADERS as $header) {
            if (trim((string) ($_SERVER[$header] ?? '')) !== '') {
                return false;
            }
        }
        return in_array(self::requestHost(), self::LOCAL_HOSTS, true);
    }

    public static function isLocalExecution(): bool
    {
        return PHP_SAPI === 'cli' || self::isLocalHttpRequest();
    }

    public static function assertLocalEntry(): void
    {
        if (!self::isLocalExecution()) {
            self::denyPublicAccess();
        }
    }

    public static function denyPublicAccess(): never
    {
        if (!headers_sent()) {
            http_response_code(404);
            header('Content-Type: text/plain; charset=utf-8');
            header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
            header('X-Robots-Tag: noindex, nofollow, noarchive');
        }
        echo "Not Found\n";
        exit;
    }
}
