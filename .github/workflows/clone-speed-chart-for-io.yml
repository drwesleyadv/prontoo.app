name: Apply Velocity Clone IO Chart

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: clone-speed-chart-for-io
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-velocity-clone:
    if: github.head_ref == 'agent/clone-speed-chart-for-io' || github.ref_name == 'agent/clone-speed-chart-for-io'
    runs-on: ubuntu-latest
    services:
      mysql80:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prontoo_schema
      DB_USERNAME: root
      DB_PASSWORD: root
      GITHUB_ACTIONS: true
      CI: true
      PRONTOO_SCHEMA_TEST_MODE: 1
      PRONTOO_INSTALLER_CLI_MODE: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clone-speed-chart-for-io
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, json, openssl
      - name: Apply validate and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/clone_speed_chart_for_io.py
          rm -f tools/clone_speed_chart_for_io.py .github/workflows/clone-speed-chart-for-io.yml
          find tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
          test ! -e tools/clone_speed_chart_for_io.py
          test ! -e .github/workflows/clone-speed-chart-for-io.yml
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          test "$(grep -Fc 'admin_metric_dual_area_chart(' app/Admin/AdminPages.php)" -eq 3
          grep -F 'admin_metric_dual_area_chart("Velocidade", $load, $response, "speed")' app/Admin/AdminPages.php
          grep -A5 -F '"Leitura e gravação",' app/Admin/AdminPages.php | grep -F '"speed",'
          grep -F '$fillAreas = $loadArea . $responseArea;' app/Admin/AdminPages.php
          grep -F 'class="metric-chart-fill-load"' app/Admin/AdminPages.php
          grep -F 'class="metric-chart-fill-response"' app/Admin/AdminPages.php
          grep -F '.metric-dual-time-chart .metric-chart-fill-load{' public/assets/design-system.css
          grep -F '.metric-dual-time-chart .metric-chart-fill-response{' public/assets/design-system.css
          ! grep -Fq '$segmentedCountAreas' app/Admin/AdminPages.php
          ! grep -Fq 'metric-chart-fill-load-exclusive' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -Fq 'metric-chart-fill-response-exclusive' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -Fq 'metric-chart-fill-intersection' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -Fq 'data-metric-value-type=' app/Admin/AdminPages.php public/assets/design-system.css
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clonar visual de Velocidade em Leitura e gravação"
          git push origin HEAD:agent/clone-speed-chart-for-io
