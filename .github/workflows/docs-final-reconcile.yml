name: Documentation Final Reconcile

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-rewrite-final-architecture
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reconcile final documentation hashes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/docs-final-reconcile.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/update.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(docs): reconcile final documentation hashes'
            git push origin HEAD:agent/documentation-rewrite-final-architecture
          fi
