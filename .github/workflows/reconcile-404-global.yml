name: Reconcile global branded 404

on:
  push:
    branches:
      - agent/404-ux-friendly-alignment

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Close runtime 404 surfaces and expand smoke contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runner = Path('app/Runtime/Runner.php')
          text = runner.read_text()
          anchor = """            \\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::headers_secure(false);\n            if (!\\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::has_cfg() && !$installMode && !$publicHome && !$publicCompatibility) {"""
          replacement = """            \\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::headers_secure(false);\n            if (!in_array($route, RouteCatalog::all(), true)) {\n                \\Prontoo\\Runtime\\PublicWeb\\PublicWebRuntimeOperations01::page_public_status();\n                return;\n            }\n            if (!\\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::has_cfg() && !$installMode && !$publicHome && !$publicCompatibility) {"""
          if text.count(anchor) != 1:
              raise SystemExit('Runner unknown-route anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          anchor = """            \\Prontoo\\Runtime\\SupportFoundation\\SupportFoundationRuntimeOperations01::app_fail($error);"""
          replacement = """            if ($status === 404) {\n                \\Prontoo\\Runtime\\PublicWeb\\PublicWebRuntimeOperations01::page_public_status();\n                return;\n            }\n            \\Prontoo\\Runtime\\SupportFoundation\\SupportFoundationRuntimeOperations01::app_fail($error);"""
          if text.count(anchor) != 1:
              raise SystemExit('Runner 404 catch anchor mismatch')
          runner.write_text(text.replace(anchor, replacement, 1))

          smoke = Path('tools/http-runtime-smoke-check')
          text = smoke.read_text()
          anchor = """STEP=\"status\"\ncurl -sS -D \"$TMP/status.headers\" \"${COMMON_HEADERS[@]}\" \"$BASE_URL?r=status\" -o \"$TMP/status.body\"\nassert_status \"$TMP/status.headers\" 404 \"status\"\ngrep -Eqi '^Content-Type: text/html; charset=utf-8' \"$TMP/status.headers\"\ngrep -Fq 'class=\"public has-top-shell\"' \"$TMP/status.body\"\ngrep -Fq 'class=\"auth login-card login-shell\"' \"$TMP/status.body\"\ngrep -Fq 'Página não encontrada' \"$TMP/status.body\"\ngrep -Fq '/public/assets/presentation.css' \"$TMP/status.body\"\ngrep -Fq 'Voltar ao Prontoo' \"$TMP/status.body\"\nif grep -Eqi 'prontoo-version|data-app-version|Versão:|telemetry|health|runtime' \"$TMP/status.body\"; then\n  printf 'http runtime smoke: public 404 leaked operational or version signal\\n' >&2\n  exit 1\nfi"""
          replacement = """STEP=\"status\"\ngrep -Fq 'ErrorDocument 404 /public/errors/404.html' \"$ROOT/.htaccess\"\ngrep -Fq 'width:min(520px,100%);grid-template-columns:minmax(0,1fr);gap:0;align-items:stretch;' \"$ROOT/public/errors/404.html\"\ngrep -Fq 'Esta página não está por aqui' \"$ROOT/public/errors/404.html\"\ngrep -Fq 'O link pode ter mudado ou o endereço pode estar incompleto.' \"$ROOT/public/errors/404.html\"\ngrep -Fq 'Você pode voltar ao Prontoo e continuar normalmente.' \"$ROOT/public/errors/404.html\"\ncurl -sS -D \"$TMP/status.headers\" \"${COMMON_HEADERS[@]}\" \"$BASE_URL?r=status\" -o \"$TMP/status.body\"\nassert_status \"$TMP/status.headers\" 404 \"status\"\ngrep -Eqi '^Content-Type: text/html; charset=utf-8' \"$TMP/status.headers\"\ngrep -Fq 'class=\"public has-top-shell\"' \"$TMP/status.body\"\ngrep -Fq 'class=\"auth login-card login-shell\"' \"$TMP/status.body\"\ngrep -Fq 'Esta página não está por aqui' \"$TMP/status.body\"\ngrep -Fq '/public/assets/presentation.css' \"$TMP/status.body\"\ngrep -Fq 'Voltar ao Prontoo' \"$TMP/status.body\"\nif grep -Fq 'O endereço informado não está disponível.' \"$TMP/status.body\"; then\n  printf 'http runtime smoke: public 404 retained unfriendly legacy copy\\n' >&2\n  exit 1\nfi\nif grep -Eqi 'prontoo-version|data-app-version|Versão:|telemetry|health|runtime' \"$TMP/status.body\"; then\n  printf 'http runtime smoke: public 404 leaked operational or version signal\\n' >&2\n  exit 1\nfi\n\nSTEP=\"unknown-route\"\ncurl -sS -D \"$TMP/unknown-route.headers\" \"${COMMON_HEADERS[@]}\" \"$BASE_URL?r=definitely_not_a_prontoo_route\" -o \"$TMP/unknown-route.body\"\nassert_status \"$TMP/unknown-route.headers\" 404 \"unknown-route\"\ngrep -Fq 'Esta página não está por aqui' \"$TMP/unknown-route.body\"\n\nSTEP=\"installer-closed-404\"\ncurl -sS -D \"$TMP/install-404.headers\" \"${COMMON_HEADERS[@]}\" \"${BASE_URL}install.php\" -o \"$TMP/install-404.body\"\nassert_status \"$TMP/install-404.headers\" 404 \"installer-closed-404\"\ngrep -Fq 'Esta página não está por aqui' \"$TMP/install-404.body\"\n\nSTEP=\"landing-asset-404\"\ncurl -sS -D \"$TMP/landing-404.headers\" \"${COMMON_HEADERS[@]}\" \"${BASE_URL}br/index.php?asset=does-not-exist\" -o \"$TMP/landing-404.body\"\nassert_status \"$TMP/landing-404.headers\" 404 \"landing-asset-404\"\ngrep -Fq 'Esta página não está por aqui' \"$TMP/landing-404.body\""""
          if text.count(anchor) != 1:
              raise SystemExit('HTTP smoke 404 block anchor mismatch')
          smoke.write_text(text.replace(anchor, replacement, 1))
          PY
          php -l app/Runtime/Runner.php
          php -l app/Runtime/PublicWeb/PublicWebRuntimeOperations01.php
          php -l app/Core/Install/InstallAccess.php
          php -l br/runtime-core.php
          bash -n tools/http-runtime-smoke-check
      - name: Remove temporary workflow before release hashing
        shell: bash
        run: rm -f .github/workflows/reconcile-404-global.yml
      - name: Reconcile release contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
      - name: Commit reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify friendly branded 404 responses'
          git push origin HEAD:agent/404-ux-friendly-alignment
