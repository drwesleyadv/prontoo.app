name: Apply telemetry 14d comparison

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/telemetry-14d-comparison' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply telemetry retention and comparison
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          telemetry = Path('app/Support/Telemetry.php')
          text = telemetry.read_text(encoding='utf-8')
          text = text.replace('$cut = $nowTs - 25 * 3600;', '$cut = $nowTs - 14 * 86400;', 1)
          text = text.replace('"retention_hours" => 25,', '"retention_hours" => 336,', 1)

          marker = 'function telemetry_route_count_last_days(string $route, int $days = 7): int\n'
          if marker not in text:
              raise SystemExit('Ponto de inserção da comparação de telemetria não localizado.')
          helper = r'''function telemetry_period_variation(float $current, float $previous): ?float
{
    if ($previous <= 0.0) {
        return $current <= 0.0 ? 0.0 : null;
    }
    return round((($current - $previous) / $previous) * 100, 1);
}

function telemetry_seven_day_comparison(): array
{
    $nowTs = time();
    $currentCut = $nowTs - 7 * 86400;
    $previousCut = $nowTs - 14 * 86400;
    $periods = [
        "current" => ["total" => 0, "total_ms" => 0.0, "landing" => 0],
        "previous" => ["total" => 0, "total_ms" => 0.0, "landing" => 0],
    ];
    $json = telemetry_route_perf_snapshot();
    $buckets = isset($json["buckets"]) && is_array($json["buckets"])
        ? $json["buckets"]
        : [];
    foreach ($buckets as $bucketTs => $routes) {
        $ts = (int) $bucketTs;
        if ($ts < $previousCut || $ts > $nowTs || !is_array($routes)) {
            continue;
        }
        $period = $ts >= $currentCut ? "current" : "previous";
        foreach ($routes as $route => $row) {
            if (!is_array($row)) {
                continue;
            }
            $count = max(0, (int) ($row["count"] ?? 0));
            $periods[$period]["total"] += $count;
            $periods[$period]["total_ms"] += max(0.0, (float) ($row["total_ms"] ?? 0));
            if (telemetry_route_perf_safe_route((string) $route) === "landing") {
                $periods[$period]["landing"] += $count;
            }
        }
    }
    foreach (["current", "previous"] as $period) {
        $count = max(0, (int) $periods[$period]["total"]);
        $periods[$period]["avg_ms"] = $count > 0
            ? round((float) $periods[$period]["total_ms"] / $count, 1)
            : 0.0;
    }
    return [
        "days" => 7,
        "retention_days" => 14,
        "current" => $periods["current"],
        "previous" => $periods["previous"],
        "variation" => [
            "total" => telemetry_period_variation(
                (float) $periods["current"]["total"],
                (float) $periods["previous"]["total"],
            ),
            "avg_ms" => telemetry_period_variation(
                (float) $periods["current"]["avg_ms"],
                (float) $periods["previous"]["avg_ms"],
            ),
            "landing" => telemetry_period_variation(
                (float) $periods["current"]["landing"],
                (float) $periods["previous"]["landing"],
            ),
        ],
        "updated_at" => (string) ($json["updated_at"] ?? ""),
    ];
}

'''
          if 'function telemetry_seven_day_comparison()' not in text:
              text = text.replace(marker, helper + marker, 1)
          telemetry.write_text(text, encoding='utf-8')

          admin = Path('app/Admin/AdminPages.php')
          text = admin.read_text(encoding='utf-8')
          insert_marker = 'function page_status(): void\n'
          ui_helper = r'''function admin_telemetry_variation_text(?float $variation): string
{
    if ($variation === null) {
        return "sem base comparável nos 7 dias anteriores";
    }
    $signal = $variation > 0 ? "+" : "";
    return $signal . number_format($variation, 1, ",", ".") . "% vs. 7 dias anteriores";
}
function admin_telemetry_seven_day_cards_html(array $comparison): string
{
    $current = isset($comparison["current"]) && is_array($comparison["current"])
        ? $comparison["current"]
        : [];
    $variation = isset($comparison["variation"]) && is_array($comparison["variation"])
        ? $comparison["variation"]
        : [];
    return
        stat_card(
            "Requisições",
            max(0, (int) ($current["total"] ?? 0)),
            "sync_alt",
            admin_telemetry_variation_text(isset($variation["total"]) ? (float) $variation["total"] : null),
        ) .
        stat_card(
            "Tempo Médio",
            number_format(max(0.0, (float) ($current["avg_ms"] ?? 0.0)), 1, ",", ".") . " ms",
            "speed",
            admin_telemetry_variation_text(isset($variation["avg_ms"]) ? (float) $variation["avg_ms"] : null),
        ) .
        stat_card(
            "Carregamentos da landing page",
            max(0, (int) ($current["landing"] ?? 0)),
            "web",
            admin_telemetry_variation_text(isset($variation["landing"]) ? (float) $variation["landing"] : null),
        );
}
'''
          if 'function admin_telemetry_seven_day_cards_html' not in text:
              text = text.replace(insert_marker, ui_helper + insert_marker, 1)

          status_start = text.index('function page_status(): void')
          status_end = text.index('function page_admin_operations(): void', status_start)
          status = text[status_start:status_end]
          old_start = status.index('    $summary = function_exists("telemetry_route_performance_summary")')
          old_end = status.index('$statusHeader =', old_start)
          new_block = '''    $comparison = function_exists("telemetry_seven_day_comparison")
        ? telemetry_seven_day_comparison()
        : ["current" => [], "variation" => []];
    $overviewCards = admin_telemetry_seven_day_cards_html($comparison);
'''
          status = status[:old_start] + new_block + status[old_end:]
          text = text[:status_start] + status + text[status_end:]

          old_perf = '''    $performance24h = function_exists("telemetry_route_performance_summary")
        ? telemetry_route_performance_summary(24)
        : ["routes" => [], "total" => 0];
    $requests24h = max(0, (int) ($performance24h["total"] ?? 0));
    $averageResponseMs = max(0.0, (float) ($performance24h["avg_ms"] ?? 0));
    $landingRequests24h = 0;
    foreach ((array) ($performance24h["routes"] ?? []) as $routePerformance) {
        if ((string) ($routePerformance["route"] ?? "") !== "landing") {
            continue;
        }
        $landingRequests24h = max(
            0,
            (int) ($routePerformance["count"] ?? 0),
        );
        break;
    }
'''
          new_perf = '''    $telemetryComparison = function_exists("telemetry_seven_day_comparison")
        ? telemetry_seven_day_comparison()
        : ["current" => [], "variation" => []];
'''
          if old_perf not in text:
              raise SystemExit('Bloco de telemetria do painel do desenvolvedor não localizado.')
          text = text.replace(old_perf, new_perf, 1)

          telemetry_start = text.index('    $telemetry =\n        \'<div class="stats-grid admin-overview-kpis global-telemetry-grid">\' .')
          telemetry_end = text.index('    $actionsCard =', telemetry_start)
          new_telemetry = '''    $telemetry =
        '<div class="stats-grid admin-overview-kpis global-telemetry-grid telemetry-comparison-cards">' .
        admin_telemetry_seven_day_cards_html($telemetryComparison) .
        stat_card(
            "Usuários Ativos",
            $activeUsers24h,
            "person_check",
            "últimas 24 horas",
        ) .
        "</div>";
'''
          text = text[:telemetry_start] + new_telemetry + text[telemetry_end:]
          admin.write_text(text, encoding='utf-8')

          css = Path('public/assets/design-system.css')
          css_text = css.read_text(encoding='utf-8')
          css_text = css_text.replace('body.status-public #conteudo>.stat-card .stat-subtitle,body.status-public #conteudo>.stat-card small{display:none!important;}', 'body.status-public #conteudo>.stat-card .stat-subtitle,body.status-public #conteudo>.stat-card small{display:block!important;grid-column:2/4!important;margin:4px 0 0!important;color:var(--md-sys-color-on-surface-variant)!important;font:var(--md-sys-typescale-label-medium)!important;}')
          extra = '''
body.status-public #conteudo>.stat-card{grid-template-rows:auto auto!important;}
body.status-public #conteudo>.stat-card .stat-icon{grid-row:1/3!important;}
body.status-public #conteudo>.stat-card .stat-title{grid-row:1!important;}
body.status-public #conteudo>.stat-card .stat-value{grid-row:1!important;}
body.status-public #conteudo>.stat-card .stat-subtitle{grid-row:2!important;}
.telemetry-comparison-cards>.stat-card .stat-subtitle{font-variant-numeric:tabular-nums;}
'''
          if 'telemetry-comparison-cards>.stat-card .stat-subtitle' not in css_text:
              css_text += extra
          css.write_text(css_text, encoding='utf-8')

          for path in [Path('ssd/.telemetry-14d-comparison'), Path('.github/workflows/agent-telemetry-14d-comparison.yml')]:
              if path.exists():
                  path.unlink()
          PY
          php -l app/Support/Telemetry.php >/dev/null
          php -l app/Admin/AdminPages.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reter 14 dias e comparar telemetria semanal"
          git push origin HEAD:"$HEAD_BRANCH"
