name: Telemetry Contract Fix Encoded

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-contract-fix-encoded.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Align civil contracts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc > /tmp/civil-contract-fix.py
          python3 /tmp/civil-contract-fix.py
          for file in app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php tools/security-regression-check.php; do php -l "$file" >/dev/null; done
          php tools/database-record-telemetry-contract-check
          php tools/page-load-telemetry-contract-check
          php tools/security-regression-check.php
          git diff --check
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add app tools
          git commit -m 'fix(telemetry): align civil-window regression contracts'
          echo READY_FOR_CLEANUP
          sleep 60
          git fetch origin +refs/heads/agent/telemetry-audit-live:refs/remotes/origin/agent/telemetry-audit-live
          git rebase origin/agent/telemetry-audit-live
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          git diff --check
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/telemetry-audit-live
