name: tmp agenda day blocked ux 1.9.15.6 final
on:
  push:
    branches:
      - feature/agenda-day-blocked-ux-1-9-15-6
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@ec406be512d7077f68eed36e63f4d91bc006edc4
        with:
          php-version: '8.4'
      - name: Materialize final product tree
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|php tools/release-contract-check|php tools/release-contract-reconcile --check|g' tools/_tmp-agenda-day-blocked-ux-materialize
          sed -i 's|php tools/release-asset-contract|php tools/version-asset-contract-check.php|g' tools/_tmp-agenda-day-blocked-ux-materialize
          sed -i 's|php tools/release-superseded-reference-check|php tools/superseded-reference-contract-check|g' tools/_tmp-agenda-day-blocked-ux-materialize
          sed -i 's|2026-09-15T11:46:01-04:00|2026-09-15T14:03:00-04:00|g' tools/_tmp-agenda-day-blocked-ux-materialize
          sed -i 's|git rm .github/workflows/_tmp-agenda-day-blocked-ux-1-9-15-6.yml .github/workflows/_tmp-agenda-day-blocked-ux-1-9-15-6-v2.yml .github/workflows/_tmp-agenda-day-blocked-ux-1-9-15-6-v3.yml tools/_tmp-agenda-day-blocked-ux-materialize|git rm .github/workflows/_tmp-agenda-day-blocked-ux-1-9-15-6-v6.yml tools/_tmp-agenda-day-blocked-ux-materialize|' tools/_tmp-agenda-day-blocked-ux-materialize

          set +e
          bash tools/_tmp-agenda-day-blocked-ux-materialize
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('version.json').read_text())
          if data.get('version') != '1.9.15.6':
              raise SystemExit('materializer failed before release 1.9.15.6 was generated')
          PY
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('version.json')
          data = json.loads(p.read_text())
          data['asset_version'] = '1.9.15.6'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          php tools/quality-gate --fast
          git diff --check

          git rm -f --ignore-unmatch .github/workflows/_tmp-agenda-day-blocked-ux-1-9-15-6-v6.yml tools/_tmp-agenda-day-blocked-ux-materialize
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          php tools/quality-gate --fast
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refina estado de bloqueio integral da Agenda'
          git push origin HEAD:feature/agenda-day-blocked-ux-1-9-15-6
