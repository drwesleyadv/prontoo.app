name: PR 371 Release Repair

on:
  push:
    branches:
      - fix/vps-homologation-mfa

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/vps-homologation-mfa
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Repair canonical release artifacts
        shell: bash
        run: |
          set -euo pipefail
          old='1.8.21.1'
          new='1.8.26.1'

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          old = '1.8.21.1'
          new = '1.8.26.1'

          version_path = Path('version.json')
          version = json.loads(version_path.read_text())
          version['asset_version'] = new
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n')

          prontoo_path = Path('app/prontoo.php')
          prontoo = prontoo_path.read_text()
          prontoo, count = re.subn(
              r'const PRONTOO_ASSET_REV_FALLBACK = ["\x27][^"\x27]+["\x27];',
              f'const PRONTOO_ASSET_REV_FALLBACK = "{new}";',
              prontoo,
              count=1,
          )
          if count != 1:
              raise SystemExit('PRONTOO_ASSET_REV_FALLBACK não localizado')
          prontoo_path.write_text(prontoo)

          design_path = Path('design/styles/application.css')
          design = design_path.read_text()
          if old not in design:
              raise SystemExit('referência PIX antiga não localizada na fonte CSS')
          design_path.write_text(design.replace(old, new))

          visual_path = Path('app/presentation.visual-contract.json')
          visual = json.loads(visual_path.read_text())
          visual['version'] = new
          visual_path.write_text(json.dumps(visual, ensure_ascii=False, indent=4) + '\n')

          docs_path = Path('docs/index.md')
          docs = docs_path.read_text()
          if old not in docs:
              raise SystemExit('baseline antiga não localizada em docs/index.md')
          docs_path.write_text(docs.replace(old, new))
          PY

          for stem_ext in \
            'app-icon png' \
            'prontoo-mark png' \
            'favicon png' \
            'favicon ico' \
            'pix svg'
          do
            set -- $stem_ext
            stem="$1"
            ext="$2"
            src="public/assets/${stem}-${old}.${ext}"
            dst="public/assets/${stem}-${new}.${ext}"
            test -f "$src"
            test ! -e "$dst"
            git mv "$src" "$dst"
          done

          rm -f .github/workflows/pr371-release-repair.yml

          php tools/presentation-css-build --write
          php tools/presentation-css-build --check

          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check

          php tools/superseded-reference-contract-check
          php tools/version-asset-contract-check.php
          php tools/quality-gate --fast
          git diff --check

          git config user.name 'Wesley Ferreira'
          git config user.email 'drwesleyadv@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcilia artefatos da release 1.8.26.1'
          git push origin HEAD:fix/vps-homologation-mfa
