name: Agent Release Finalize 351

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/developer-clinics-filters-login-order
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile release contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          rm -f .github/workflows/agent-release-finalize-351.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git add -A
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/php84-runtime-contract-check
          php -l app/Infrastructure/Operational/AdminPagesSqlCatalog08.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcilia release 1.8.18.2"
          git push origin HEAD:agent/developer-clinics-filters-login-order
