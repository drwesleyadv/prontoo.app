name: Fix Security Syntax and Reconcile

on:
  push:
    branches:
      - agent/reconcile-security-release-1-8-14-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Fix syntax, reconcile and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php')
          source = path.read_text()
          needle = '        $secret = $candidate;\n        return $secret;\n    \n\n    public static function billing_state(array $clinic): array'
          replacement = '        $secret = $candidate;\n        return $secret;\n    \n    }\n\n    public static function billing_state(array $clinic): array'
          if source.count(needle) != 1:
              raise SystemExit('ponto de correção de secret_key não é único')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          git rm .github/workflows/fix-security-syntax-reconcile.yml
          php -l app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close security secret_key function"
          git push origin HEAD:agent/reconcile-security-release-1-8-14-1
