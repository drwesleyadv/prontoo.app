name: Logout Cascade Launcher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/logout-cascade-20260724' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, openssl

      - name: Apply implementation
        shell: bash
        run: |
          set +e
          python3 tools/apply-logout-cascade.py > /tmp/logout-cascade-apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/logout-cascade-apply.log
            cp /tmp/logout-cascade-apply.log tools/logout-cascade-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/logout-cascade-error.txt
            git commit -m "Registrar falha da aplicação do logout em cascata"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi

      - name: Validate implementation
        shell: bash
        run: |
          set +e
          {
            php -l app/Support/SecurityAccess.php
            php -l app/Support/ServerJsonCache.php
            php -l app/Runtime/Runner.php
            php -l app/Support/ModuleLoader.php
            php -l app/Domain/Audit/AuditActivity.php
            php -l app/Auth/AuthOnboarding.php
            php -l tools/architecture-check.php
            php tools/architecture-check.php
            git diff --check
          } > /tmp/logout-cascade-validation.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/logout-cascade-validation.log
            cp /tmp/logout-cascade-validation.log tools/logout-cascade-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/logout-cascade-error.txt
            git commit -m "Registrar falha de validação do logout em cascata"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt app/Auth/AuthOnboarding.php app/Domain/Audit/AuditActivity.php app/Runtime/Runner.php app/Support/ModuleLoader.php app/Support/SecurityAccess.php app/Support/ServerJsonCache.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php tools/architecture-check.php version.json
          git commit -m "Implementar logout em cascata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
