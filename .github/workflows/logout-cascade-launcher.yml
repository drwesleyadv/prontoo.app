name: Logout Cascade Launcher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/logout-cascade-20260724' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, openssl

      - name: Extract and apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/logout-cascade-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-logout-cascade.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-logout-cascade.py

      - name: Validate implementation
        shell: bash
        run: |
          php -l app/Support/SecurityAccess.php
          php -l app/Support/ServerJsonCache.php
          php -l app/Runtime/Runner.php
          php -l app/Support/ModuleLoader.php
          php -l app/Domain/Audit/AuditActivity.php
          php -l app/Auth/AuthOnboarding.php
          php -l tools/architecture-check.php
          php tools/architecture-check.php
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt app/Auth/AuthOnboarding.php app/Domain/Audit/AuditActivity.php app/Runtime/Runner.php app/Support/ModuleLoader.php app/Support/SecurityAccess.php app/Support/ServerJsonCache.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php tools/architecture-check.php version.json
          git commit -m "Implementar logout em cascata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
