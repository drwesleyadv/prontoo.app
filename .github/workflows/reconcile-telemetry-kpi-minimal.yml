name: Temporary Telemetry KPI Minimal Reconcile

on:
  push:
    branches:
      - agent/telemetry-kpi-minimal-trends

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telemetry-kpi-minimal-trends
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Materialize minimal KPI trends and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runtime_path = Path('app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php')
          runtime = runtime_path.read_text()
          old_card = "\n".join([
              '        $card = static function (',
              '            string $label,',
              '            mixed $value,',
              '            string $iconName,',
              '            string $note,',
              '        ) use ($linked): string {',
              '            return $linked',
              '                ? \\Prontoo\\Runtime\\AdminPages\\AdminPagesRuntimeOperations01::stat_link_card(',
              '                    $label,',
              '                    $value,',
              '                    $iconName,',
              '                    $note,',
              '                    "admin_performance",',
              '                )',
              '                : \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::stat_card($label, $value, $iconName, $note);',
              '        };',
          ])
          new_card = "\n".join([
              '        $card = static function (',
              '            string $label,',
              '            mixed $value,',
              '            string $iconName,',
              '            ?float $variation,',
              '        ) use ($linked): string {',
              '            $trend = \\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_badge($variation);',
              '            $inner =',
              '                \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon($iconName) .',
              '                \'<div><div class="telemetry-kpi-value">\' .',
              '                $trend .',
              '                "<b>" .',
              '                \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::n($value) .',
              '                "</b></div><span>" .',
              '                \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($label) .',
              '                "</span></div>";',
              '            return $linked',
              '                ? \'<a class="stat-card stat-link telemetry-kpi-card" href="\' .',
              '                    \\Prontoo\\Runtime\\SupportFoundation\\SupportFoundationRuntimeOperations01::href("admin_performance") .',
              '                    \'">\' .',
              '                    $inner .',
              '                    "</a>"',
              '                : \'<article class="stat-card telemetry-kpi-card">\' . $inner . "</article>";',
              '        };',
          ])
          if runtime.count(old_card) != 1:
              raise SystemExit('telemetry KPI card closure target count != 1')
          runtime = runtime.replace(old_card, new_card, 1)

          replacements = [
              (
                  "\\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_note(\n                isset($variations[\"requests_pct\"])\n                    ? (float) $variations[\"requests_pct\"]\n                    : null,\n            )",
                  "isset($variations[\"requests_pct\"])\n                ? (float) $variations[\"requests_pct\"]\n                : null",
              ),
              (
                  "\\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_note(\n                    isset($variations[\"average_ms_pct\"])\n                        ? (float) $variations[\"average_ms_pct\"]\n                        : null,\n                )",
                  "isset($variations[\"average_ms_pct\"])\n                    ? (float) $variations[\"average_ms_pct\"]\n                    : null",
              ),
              (
                  "\\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_note(\n                    $recordVariation,\n                )",
                  "$recordVariation",
              ),
              (
                  "\\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_note(\n                    isset($variations[\"landing_requests_pct\"])\n                        ? (float) $variations[\"landing_requests_pct\"]\n                        : null,\n                )",
                  "isset($variations[\"landing_requests_pct\"])\n                    ? (float) $variations[\"landing_requests_pct\"]\n                    : null",
              ),
          ]
          for old, new in replacements:
              if runtime.count(old) != 1:
                  raise SystemExit(f'telemetry KPI variation call target count != 1: {old[:60]!r}')
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          presentation_path = Path('app/Presentation/AdminPages/AdminPagesPresentationOperations03.php')
          presentation = presentation_path.read_text()
          old_helper = "\n".join([
              '    public static function admin_telemetry_variation_note(?float $variation): string',
              '    {',
              '        if ($variation === null) {',
              '            return "15 dias móveis · sem base comparável nos 15 dias anteriores";',
              '        }',
              '        if (abs($variation) < 0.0000005) {',
              '            $variation = 0.0;',
              '        }',
              '        $prefix = $variation > 0 ? "+" : "";',
              '        return "15 dias móveis · " .',
              '            $prefix .',
              '            number_format($variation, 2, ",", ".") .',
              '            "% vs. 15 dias anteriores";',
              '    }',
          ])
          new_helper = "\n".join([
              '    public static function admin_telemetry_variation_badge(?float $variation): string',
              '    {',
              '        if ($variation === null) {',
              '            return "";',
              '        }',
              '        if (abs($variation) < 0.05) {',
              '            return \'<span class="telemetry-kpi-trend is-neutral" title="Sem variação em relação aos 15 dias anteriores" aria-label="Sem variação em relação aos 15 dias anteriores">0%</span>\';',
              '        }',
              '        $positive = $variation > 0;',
              '        $compact = number_format(abs($variation), 1, ",", ".");',
              '        $compact = preg_replace(\'/,0$/\', "", $compact) ?: "0";',
              '        $direction = $positive ? "▲" : "▼";',
              '        $description =',
              '            ($positive ? "Alta de " : "Queda de ") .',
              '            $compact .',
              '            "% em relação aos 15 dias anteriores";',
              '        return \'<span class="telemetry-kpi-trend \' .',
              '            ($positive ? "is-positive" : "is-negative") .',
              '            \'" title="\' .',
              '            \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($description) .',
              '            \'" aria-label="\' .',
              '            \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($description) .',
              '            \'"><span class="telemetry-kpi-trend-icon" aria-hidden="true">\' .',
              '            $direction .',
              '            \'</span><span class="telemetry-kpi-trend-rate">\' .',
              '            \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($compact . "%") .',
              '            "</span></span>";',
              '    }',
          ])
          if presentation.count(old_helper) != 1:
              raise SystemExit('telemetry variation helper target count != 1')
          presentation_path.write_text(presentation.replace(old_helper, new_helper, 1))

          css_path = Path('public/assets/design-system.css')
          css = css_path.read_text()
          css_block = "\n".join([
              '',
              '',
              '/* Minimal telemetry KPI trend: compact 15d-over-15d variation beside the primary value. */',
              '.stat-card.telemetry-kpi-card{display:flex;align-items:center;gap:12px}',
              '.stat-card.telemetry-kpi-card>div{min-width:0}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-value{display:flex;align-items:baseline;gap:7px;white-space:nowrap}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-value>b{display:inline-block}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend{display:inline-flex!important;align-items:center;gap:2px;position:relative;top:-.28em;font-size:.72rem!important;line-height:1!important;font-weight:800!important;letter-spacing:-.01em;white-space:nowrap}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend>span{display:inline!important;color:inherit!important;font:inherit!important}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend.is-positive{color:#2563eb!important}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend.is-negative{color:var(--md-sys-color-error,#ba1a1a)!important}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend.is-neutral{color:var(--md-sys-color-on-surface-variant)!important}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend-icon{font-size:.68em!important}',
              '',
          ])
          if 'telemetry-kpi-trend.is-positive' in css:
              raise SystemExit('telemetry KPI trend CSS already present')
          css_path.write_text(css.rstrip() + css_block)

          contract_path = Path('tools/telemetry-json-source-contract-check')
          contract = contract_path.read_text()
          anchor_lines = [
              '$assert(',
              '    str_contains($admin3, \'$current["landing_requests"]\') &&',
              '    str_contains($admin3, \'$variations["landing_requests_pct"]\'),',
              "    'card Landing Page deixou de consumir total e comparação canônicos',",
              ');',
          ]
          anchor = "\n".join(anchor_lines) + "\n"
          extra_lines = [
              '$assert(',
              "    str_contains($admin3, 'telemetry-kpi-card') &&",
              "    str_contains($admin3, 'telemetry-kpi-value') &&",
              "    !str_contains($admin3, 'admin_telemetry_variation_note') &&",
              "    !str_contains($admin3, '15 dias móveis') &&",
              "    !str_contains($admin3, 'vs. 15 dias anteriores'),",
              "    'cards de telemetria perderam a apresentação minimalista da variação',",
              ');',
              '$assert(',
              "    str_contains($admin6, 'admin_telemetry_kpi_cards_html(true)') &&",
              "    str_contains($admin3, 'admin_telemetry_kpi_cards_html()'),",
              "    'Painel do Desenvolvedor e Status devem compartilhar o renderer minimalista dos KPIs',",
              ');',
              '$positiveTrend = \\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_badge(12.34);',
              '$negativeTrend = \\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_badge(-8.0);',
              '$neutralTrend = \\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_badge(0.0);',
              '$missingTrend = \\Prontoo\\Presentation\\AdminPages\\AdminPagesPresentationOperations03::admin_telemetry_variation_badge(null);',
              '$assert(',
              "    str_contains($positiveTrend, 'is-positive') &&",
              "    str_contains($positiveTrend, '▲') &&",
              "    str_contains($positiveTrend, '12,3%') &&",
              "    !str_contains($positiveTrend, '+12'),",
              "    'variação positiva deve ser compacta, azul e precedida por triângulo para cima',",
              ');',
              '$assert(',
              "    str_contains($negativeTrend, 'is-negative') &&",
              "    str_contains($negativeTrend, '▼') &&",
              "    str_contains($negativeTrend, '8%') &&",
              "    !str_contains($negativeTrend, '-8'),",
              "    'variação negativa deve ser compacta, vermelha e precedida por triângulo para baixo',",
              ');',
              '$assert(',
              "    str_contains($neutralTrend, 'is-neutral') &&",
              "    str_contains($neutralTrend, '0%') &&",
              "    !str_contains($neutralTrend, '▲') &&",
              "    !str_contains($neutralTrend, '▼') &&",
              "    $missingTrend === '',",
              "    'variação neutra/não comparável deve permanecer minimalista',",
              ');',
              'foreach ([',
              "    '.stat-card.telemetry-kpi-card .telemetry-kpi-trend.is-positive{color:#2563eb!important}',",
              "    '.stat-card.telemetry-kpi-card .telemetry-kpi-trend.is-negative{color:var(--md-sys-color-error,#ba1a1a)!important}',",
              "    'top:-.28em',",
              '] as $trendCssToken) {',
              "    $assert(str_contains($css, $trendCssToken), 'CSS minimalista dos KPIs divergente: ' . $trendCssToken);",
              '}',
          ]
          addition = anchor + "\n".join(extra_lines) + "\n"
          if contract.count(anchor) != 1:
              raise SystemExit('telemetry KPI contract insertion point count != 1')
          contract = contract.replace(anchor, addition, 1)
          old_unset = 'unset($root, $assert, $admin2, $admin3, $admin6, $admin9, $login, $presentation3, $speedGeometry, $css, $loadAreaPos, $responseAreaPos, $fillOrderPos, $requestWavePos, $recordWavePos, $visualToken, $opacityToken, $token, $source);'
          new_unset = 'unset($root, $assert, $admin2, $admin3, $admin6, $admin9, $login, $presentation3, $speedGeometry, $css, $loadAreaPos, $responseAreaPos, $fillOrderPos, $requestWavePos, $recordWavePos, $positiveTrend, $negativeTrend, $neutralTrend, $missingTrend, $trendCssToken, $visualToken, $opacityToken, $token, $source);'
          if contract.count(old_unset) != 1:
              raise SystemExit('telemetry contract unset target count != 1')
          contract_path.write_text(contract.replace(old_unset, new_unset, 1))
          PY

          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l tools/telemetry-json-source-contract-check
          php tools/telemetry-json-source-contract-check
          php tools/database-record-telemetry-contract-check
          rm .github/workflows/reconcile-telemetry-kpi-minimal.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/telemetry-json-source-contract-check
          php tools/database-record-telemetry-contract-check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(telemetry): simplify KPI trend indicators'
          git push origin HEAD:agent/telemetry-kpi-minimal-trends
