name: Landing Route Executions KPI

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  apply_change:
    if: github.head_ref == 'agent/landing-route-executions-kpi-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply KPI change and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          version = '1.8.3.4'
          previous = '1.8.3.3'
          build = '1.8.3.4-landing-route-executions-kpi'
          sync_id = 'github-landing-route-executions-kpi-1-8-3-4'
          now = datetime.now(timezone.utc)
          now_iso = now.isoformat(timespec='microseconds')
          now_unix = int(now.timestamp())

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: substituição esperava 1 ocorrência e encontrou {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/Support/Telemetry.php',
              '''            "average_ms_pct" => telemetry_nullable_percentage_variation(\n                isset($current["average_ms"])\n                    ? (float) $current["average_ms"]\n                    : null,\n                isset($previous["average_ms"])\n                    ? (float) $previous["average_ms"]\n                    : null,\n            ),\n            "landing_average_ms_pct" => telemetry_nullable_percentage_variation(''',
              '''            "average_ms_pct" => telemetry_nullable_percentage_variation(\n                isset($current["average_ms"])\n                    ? (float) $current["average_ms"]\n                    : null,\n                isset($previous["average_ms"])\n                    ? (float) $previous["average_ms"]\n                    : null,\n            ),\n            "landing_requests_pct" => telemetry_percentage_variation(\n                $current["landing_requests"],\n                $previous["landing_requests"],\n            ),\n            "landing_average_ms_pct" => telemetry_nullable_percentage_variation(''',
          )

          replace_once(
              'app/Admin/AdminPages.php',
              '''    $landingAverageMs = isset($current["landing_average_ms"])\n        ? admin_performance_format_ms((float) $current["landing_average_ms"])\n        : "—";''',
              '''    $landingRequests = max(\n        0,\n        (int) ($current["landing_requests"] ?? 0),\n    );''',
          )
          replace_once(
              'app/Admin/AdminPages.php',
              '''        $card(\n            "Tempo médio da Landing Page",\n            $landingAverageMs,\n            "web",\n            admin_telemetry_variation_note(\n                isset($variations["landing_average_ms_pct"])\n                    ? (float) $variations["landing_average_ms_pct"]\n                    : null,\n            ),\n        );''',
              '''        $card(\n            "Execuções da Landing Page",\n            $landingRequests,\n            "web",\n            admin_telemetry_variation_note(\n                isset($variations["landing_requests_pct"])\n                    ? (float) $variations["landing_requests_pct"]\n                    : null,\n            ),\n        );''',
          )

          changelog = root / 'CHANGELOG.md'
          changelog_text = changelog.read_text(encoding='utf-8')
          header = '# Histórico de versões\n\n'
          if not changelog_text.startswith(header):
              raise RuntimeError('Cabeçalho inesperado em CHANGELOG.md')
          entry = '''## 1.8.3.4 — Execuções da Landing Page no comparativo\n\n- substitui o KPI de tempo médio da Landing Page pela quantidade de execuções da rota `landing`;\n- mostra o total registrado nos últimos 10 dias e a variação percentual contra os 10 dias anteriores;\n- mantém o tempo da Landing Page disponível no gráfico de velocidade, sem alterar sua série histórica;\n- não altera banco de dados nem schema.\n\n'''
          changelog.write_text(header + entry + changelog_text[len(header):], encoding='utf-8')

          changelog_txt = root / 'ChangeLog.txt'
          old_txt = changelog_txt.read_text(encoding='utf-8')
          entry_txt = '''Prontoo 1.8.3.4 — Execuções da Landing Page no comparativo\n\n- O card da Landing Page passa a mostrar a quantidade de execuções da rota nos últimos 10 dias.\n- A nota compara o resultado com os 10 dias imediatamente anteriores.\n- O gráfico de velocidade preserva a duração da Landing Page.\n- Banco de dados e schema permanecem inalterados.\n\n'''
          changelog_txt.write_text(entry_txt + old_txt, encoding='utf-8')

          replace_once(
              'app/prontoo.php',
              'const PRONTOO_VERSION_FALLBACK = "1.8.3.3";',
              'const PRONTOO_VERSION_FALLBACK = "1.8.3.4";',
          )
          replace_once(
              'app/prontoo.php',
              'const PRONTOO_PREVIOUS_VERSION = "1.8.3.2";',
              'const PRONTOO_PREVIOUS_VERSION = "1.8.3.3";',
          )
          replace_once(
              'br/index.php',
              'const BR_LANDING_VERSION_FALLBACK = "1.8.3.3";',
              'const BR_LANDING_VERSION_FALLBACK = "1.8.3.4";',
          )

          version_path = root / 'version.json'
          version_data = json.loads(version_path.read_text(encoding='utf-8'))
          version_data.update({
              'version': version,
              'release': version,
              'generated_at_unix': now_unix,
              'generated_at': now_iso,
              'updated_at': now_iso,
              'build': build,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'functional_equivalence_policy': 'preserves_runtime_and_schema_while_replacing_the_landing_duration_kpi_with_route_execution_volume_comparison',
              'notes': 'O card da Landing Page mostra execuções da rota nos últimos 10 dias e compara com os 10 dias anteriores.',
              'previous_version': previous,
              'documentation_changes': True,
              'deployment_sync_id': sync_id,
              'deployment_sync_requested_at': now_iso,
              'rewrite_scope': 'landing_route_execution_comparison_card',
          })
          version_path.write_text(json.dumps(version_data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          architecture_path = root / 'app/architecture.manifest.json'
          architecture = json.loads(architecture_path.read_text(encoding='utf-8'))
          architecture.update({
              'version': version,
              'release': version,
              'build': build,
              'generated_at': now_iso,
              'updated_at': now_iso,
              'previous_version': previous,
              'deployment_sync_id': sync_id,
              'notes': 'O KPI da Landing Page usa volume de execuções em janelas móveis de 10 dias.',
          })
          architecture_path.write_text(json.dumps(architecture, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          workflow_path = root / '.github/workflows/landing-route-executions-kpi.yml'
          if workflow_path.exists():
              workflow_path.unlink()

          manifest_path = root / 'app/update.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.update({
              'version': version,
              'release': version,
              'build': build,
              'generated_at': now_iso,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': True,
              'previous_version': previous,
              'updated_at': now_iso,
              'notes': 'O card da Landing Page mostra execuções da rota e comparação entre dois períodos de 10 dias.',
              'deployment_sync_id': sync_id,
              'deployment_sync_requested_at': now_iso,
              'rewrite_scope': 'landing_route_execution_comparison_card',
              'functional_equivalence_policy': 'preserves_runtime_and_schema_while_replacing_the_landing_duration_kpi_with_route_execution_volume_comparison',
          })
          files = dict(manifest.get('files') or {})
          files.pop('.github/workflows/landing-route-executions-kpi.yml', None)
          missing = [relative for relative in files if not (root / relative).is_file()]
          if missing:
              raise RuntimeError('Arquivos ausentes no manifesto: ' + ', '.join(missing))
          refreshed = {}
          total_bytes = 0
          for relative in sorted(files):
              data = (root / relative).read_bytes()
              refreshed[relative] = hashlib.sha256(data).hexdigest()
              total_bytes += len(data)
          manifest['files'] = refreshed
          manifest['file_count'] = len(refreshed)
          manifest['total_uncompressed_bytes'] = total_bytes
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

          php -l app/Support/Telemetry.php >/dev/null
          php -l app/Admin/AdminPages.php >/dev/null
          php -l app/prontoo.php >/dev/null
          php -l br/index.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $telemetry = (string) file_get_contents('app/Support/Telemetry.php');
          $admin = (string) file_get_contents('app/Admin/AdminPages.php');
          foreach ([
              '"landing_requests_pct" => telemetry_percentage_variation(',
              '$current["landing_requests"]',
              '$previous["landing_requests"]',
          ] as $token) {
              if (!str_contains($telemetry, $token)) {
                  throw new RuntimeException('Contrato ausente na telemetria: ' . $token);
              }
          }
          foreach ([
              '"Execuções da Landing Page"',
              '$current["landing_requests"] ?? 0',
              '$variations["landing_requests_pct"]',
          ] as $token) {
              if (!str_contains($admin, $token)) {
                  throw new RuntimeException('Contrato ausente no card: ' . $token);
              }
          }
          if (str_contains($admin, '"Tempo médio da Landing Page"')) {
              throw new RuntimeException('O KPI antigo de tempo médio da Landing Page permanece no card.');
          }
          PHP
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Exibir execuções da Landing Page no comparativo'
          git push origin HEAD:${{ github.head_ref }}
