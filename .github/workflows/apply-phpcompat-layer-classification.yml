name: Apply PhpCompat Layer Classification

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-repository-audit-2026-08-02' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Classify global polyfill as environment bootstrap
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Core/Architecture/LayerMap.php')
          text = path.read_text(encoding='utf-8')
          native = "        'app/Support/PhpCompat.php',\n"
          environment = "        'app/config.php',\n        'app/Support/PhpCompat.php',\n"
          if environment in text and native not in text.split('private const ENVIRONMENT_PHP_PATHS', 1)[0]:
              raise SystemExit(0)
          if text.count(native) != 1:
              raise SystemExit(f'Entrada nativa esperada uma vez; encontrada {text.count(native)}.')
          text = text.replace(native, '', 1)
          anchor = "        'app/config.php',\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Âncora de ambiente esperada uma vez; encontrada {text.count(anchor)}.')
          text = text.replace(anchor, environment, 1)
          path.write_text(text, encoding='utf-8')
          PY
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $path = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          php -l app/Core/Architecture/LayerMap.php
          php tools/architecture-check.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Core/Architecture/LayerMap.php app/update.manifest.json
          git commit -m "Classificar polyfill como bootstrap de ambiente"
          git push origin HEAD:"$HEAD_BRANCH"
