name: Patch Audit V2 Line

on:
  push:
    branches:
      - audit/consolidation-1-9-14-1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/consolidation-1-9-14-1
          fetch-depth: 0
      - name: Patch validated line and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n '85p' .github/workflows/audit-consolidation-v2.yml)" = "          \$tracked = shell_exec('git -C ' . escapeshellarg(\$root) . ' ls-files -z --cached');"
          sed -i "85i\\          \$rootPrefix = rtrim(str_replace('\\\\\\\\', '/', \$root), '/') . '/';" .github/workflows/audit-consolidation-v2.yml
          git rm .github/workflows/patch-audit-v2.yml .github/workflows/patch-audit-v2-line.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige prefixo do reconciliador materializado"
          git push origin HEAD:audit/consolidation-1-9-14-1
