name: Reconcile Visual Contract PR

on:
  push:
    branches:
      - 'agent/presentation-visual-contract-v1'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/presentation-visual-contract-v1
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Remove Runtime trace marker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Runtime/UiComponents/UiComponentsRuntimeOperations03.php')
          source = path.read_text()
          old = '<div class="pagehead-actions" data-ui-contract="pagehead-actions-v1" aria-label="Operações rápidas">'
          new = '<div class="pagehead-actions" aria-label="Operações rápidas">'
          if source.count(old) != 1:
              raise SystemExit('runtime marker not found uniquely')
          path.write_text(source.replace(old, new))

          checker_path = Path('tools/presentation-visual-contract-check')
          checker = checker_path.read_text()
          checker = checker.replace("$ui = (string) file_get_contents($root . '/app/Runtime/UiComponents/UiComponentsRuntimeOperations03.php');\n", '')
          block = "if (!str_contains($ui, 'pagehead-actions-v1')) {\n    $failures[] = 'missing:pagehead-dom-contract';\n}\n"
          if checker.count(block) != 1:
              raise SystemExit('checker runtime marker assertion not found uniquely')
          checker_path.write_text(checker.replace(block, ''))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/reconcile-visual-contract-pr.yml
      - name: Stabilize deterministic release
        run: |
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
      - name: Validate
        run: |
          php tools/presentation-visual-contract-check
          php tools/quality-gate
          php tools/release-contract-reconcile --check
          git diff --check
      - name: Commit
        run: |
          git config user.name 'prontoo-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(presentation): keep visual contract out of runtime'
          git push origin HEAD:agent/presentation-visual-contract-v1
