name: Validate read write chart release

on:
  push:
    branches:
      - agent/chart-read-write-fill-20260804
    paths:
      - tools/chart-read-write-validate-trigger.txt

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chart-read-write-fill-20260804
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
      - name: Targeted visual contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('public/assets/design-system.css').read_text(encoding='utf-8')
          required = [
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load,',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-response{opacity:.5}',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-line-load,',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-line-response{stroke:none}',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-dot-load,',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-dot-response{display:none}',
          ]
          for token in required:
              if token not in css:
                  raise SystemExit('Missing count-chart visual contract: ' + token)
          preserved = [
              '.metric-dual-time-chart .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:1}',
              '.metric-dual-time-chart .metric-chart-line-load{fill:none;stroke:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);stroke-width:2.7;',
          ]
          for token in preserved:
              if token not in css:
                  raise SystemExit('Shared velocity style was not preserved: ' + token)
          admin = Path('app/Admin/AdminPages.php').read_text(encoding='utf-8')
          for token in (
              'data-metric-value-type="',
              '"value_type" => "count"',
              '"Leitura e gravação"',
              'function page_status(): void',
              'admin_performance_card_html(true)',
          ):
              if token not in admin:
                  raise SystemExit('Shared renderer/status contract missing: ' + token)
          PY
      - name: Canonical version contract
        shell: bash
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $contracts = [];
          foreach (['version.json', 'app/update.manifest.json', 'app/architecture.manifest.json'] as $file) {
              $contracts[$file] = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
          }
          $version = trim((string) ($contracts['version.json']['version'] ?? ''));
          if ($version !== '1.8.4.2' ||
              trim((string) ($contracts['version.json']['release'] ?? '')) !== $version ||
              trim((string) ($contracts['app/update.manifest.json']['version'] ?? '')) !== $version ||
              trim((string) ($contracts['app/update.manifest.json']['release'] ?? '')) !== $version ||
              trim((string) ($contracts['app/architecture.manifest.json']['version'] ?? '')) !== $version) {
              throw new RuntimeException('Contrato canônico de versão divergente');
          }
          PHP
      - name: Project contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Record successful validation
        shell: bash
        run: |
          printf 'validated_sha=%s\nvalidated_at=%s\n' "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > tools/chart-read-write-validation-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/chart-read-write-validation-ok.txt
          git commit -m "Validar áreas de leitura e gravação"
          git push origin HEAD:agent/chart-read-write-fill-20260804
