name: Apply Agenda Blocked Slots

on:
  push:
    branches:
      - feat/agenda-blocked-slots

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feat/agenda-blocked-slots
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Apply, release and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('public/assets/app.js')
          js = js_path.read_text()
          function_anchor = '  function initWeekScroll(root) {'
          if 'function syncAgendaBlockedDayMarkers(' not in js:
              blocked_function = '''  function syncAgendaBlockedDayMarkers(root = d) {
            $$(".agenda-day-shell[data-agenda-day]", root).forEach((shell) => {
              const canvas = $("[data-agenda-canvas]", shell);
              if (!canvas) return;
              const slots = Math.max(
                0,
                Number.parseInt(shell.style.getPropertyValue("--agenda-slots") || "0", 10) || 0,
              );
              const slotMinutes = Math.max(
                1,
                Number.parseInt(shell.dataset.slotMinutes || canvas.dataset.slotMinutes || "15", 10) || 15,
              );
              let blocked =
                canvas.dataset.dayBlocked === "1" || shell.classList.contains("is-day-blocked");
              let fullDayBlock = null;
              if (!blocked && shell.classList.contains("agenda-week-day-shell") && slots > 0) {
                fullDayBlock = $$(".agenda-day-event-block", canvas).find((event) => {
                  const top = Number.parseFloat(event.style.getPropertyValue("--event-top")) || 0;
                  const height =
                    Number.parseFloat(event.style.getPropertyValue("--event-height")) || 0;
                  return top <= 0.001 && height >= slots - 0.001;
                });
                blocked = !!fullDayBlock;
              }
              if (!blocked || slots <= 0) return;
              shell.classList.add("is-day-blocked");
              canvas.classList.add("is-day-blocked");
              canvas.dataset.dayBlocked = "1";
              if (fullDayBlock) {
                fullDayBlock.classList.add("is-full-day-block");
                fullDayBlock.hidden = true;
              }
              $$(".agenda-day-empty", canvas).forEach((empty) => {
                empty.hidden = true;
              });
              $$(".agenda-day-blocked-watermark", canvas).forEach((marker) => marker.remove());
              $$(".agenda-day-slot[href]", shell).forEach((slot) => {
                slot.removeAttribute("href");
                slot.setAttribute("aria-disabled", "true");
                slot.tabIndex = -1;
              });
              if (!$("[data-day-blocked-status]", canvas)) {
                const status = d.createElement("span");
                status.className = "sr-only";
                status.dataset.dayBlockedStatus = "1";
                status.setAttribute("role", "status");
                status.textContent = "Dia bloqueado";
                canvas.prepend(status);
              }
              for (let index = 0; index < slots; index += 1) {
                if ((index * slotMinutes) % 30 !== 0) continue;
                const marker = d.createElement("div");
                marker.className = "agenda-day-blocked-watermark";
                marker.style.setProperty("--blocked-slot-index", String(index));
                marker.setAttribute("aria-hidden", "true");
                const icon = d.createElement("span");
                icon.className = "material-symbols-rounded";
                icon.textContent = "lock";
                const label = d.createElement("span");
                label.textContent = "Dia bloqueado";
                marker.append(icon, label);
                canvas.append(marker);
              }
            });
          }
'''
              if function_anchor not in js:
                  raise SystemExit('âncora initWeekScroll não localizada')
              js = js.replace(function_anchor, blocked_function + function_anchor, 1)
          boot_anchor = '  function boot() {\n    initWeekScroll(document);'
          if 'syncAgendaBlockedDayMarkers(document);' not in js:
              if boot_anchor not in js:
                  raise SystemExit('âncora boot não localizada')
              js = js.replace(
                  boot_anchor,
                  '  function boot() {\n    syncAgendaBlockedDayMarkers(document);\n    initWeekScroll(document);',
                  1,
              )
          js_path.write_text(js)

          css_path = Path('design/styles/application.css')
          css = css_path.read_text()
          old_rule = '.agenda-day-blocked-watermark{position:absolute;top:12px;right:12px;z-index:7;display:inline-flex;align-items:center;gap:6px;pointer-events:none;color:var(--md-sys-color-on-surface-variant);opacity:.48;font:var(--md-sys-typescale-label-small);font-weight:800;letter-spacing:.01em}'
          new_rule = '.agenda-day-blocked-watermark{position:absolute;top:calc(var(--blocked-slot-index,0) * var(--pt-agenda-slot-h) + 6px);left:12px;right:auto;z-index:7;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 24px);pointer-events:none;color:var(--md-sys-color-on-surface-variant);opacity:.48;font:var(--md-sys-typescale-label-small);font-weight:800;letter-spacing:.01em;white-space:nowrap}'
          if old_rule in css:
              css = css.replace(old_rule, new_rule, 1)
          elif new_rule not in css:
              raise SystemExit('regra agenda-day-blocked-watermark não localizada')
          old_mobile = '.agenda-day-canvas.is-day-blocked .agenda-day-blocked-watermark{top:8px;right:8px}'
          new_mobile = '.agenda-day-canvas.is-day-blocked .agenda-day-blocked-watermark{top:calc(var(--blocked-slot-index,0) * var(--pt-agenda-slot-h) + 5px);left:8px;right:auto}'
          if old_mobile in css:
              css = css.replace(old_mobile, new_mobile, 1)
          elif new_mobile not in css:
              raise SystemExit('regra mobile do bloqueio não localizada')
          css_path.write_text(css)

          footer_path = Path('app/Presentation/AuthOnboarding/AuthOnboardingPresentationOperations01.php')
          footer = footer_path.read_text()
          old_y = '            $y = $top + $plotHeight - (max(0.0, (float) $value) / $maximum) * $plotHeight;'
          new_y = '''            $ratio = min(1.0, max(0.0, (float) $value) / $maximum);
                      $y = $top + $plotHeight - $ratio * ($plotHeight * 0.75);'''
          if old_y in footer:
              footer = footer.replace(old_y, new_y, 1)
          elif '$plotHeight * 0.75' not in footer:
              raise SystemExit('cálculo da linha de telemetria não localizado')
          footer_path.write_text(footer)

          telemetry_path = Path('tools/telemetry-json-source-contract-check')
          telemetry = telemetry_path.read_text()
          wave_anchor = '$historicalWave = \\Prontoo\\Presentation\\AuthOnboarding\\AuthOnboardingPresentationOperations01::footer_telemetry_wave_path([0, 3, 1, 4, 2], 4.0);'
          if 'pico do rodapé deve ficar 25% mais baixo' not in telemetry:
              if wave_anchor not in telemetry:
                  raise SystemExit('âncora do teste de onda histórica não localizada')
              peak_test = '''$loweredPeakWave = \\Prontoo\\Presentation\\AuthOnboarding\\AuthOnboardingPresentationOperations01::footer_telemetry_wave_path([4], 4.0);
          $assert(
              str_contains($loweredPeakWave, 'M 0 66.5 L 1000 66.5'),
              'pico do rodapé deve ficar 25% mais baixo preservando a base da área decorativa',
          );
          '''
              telemetry = telemetry.replace(wave_anchor, peak_test + wave_anchor, 1)
          telemetry_path.write_text(telemetry)

          test_path = Path('tools/test-fast')
          test = test_path.read_text()
          assertion_anchor = "$assert(\n    str_contains($agendaRuntimeSource, '$dayBlockDisabled = $rows !== [];') &&"
          if 'presentation.agenda.blocked_day_half_hour_markers' not in test:
              if assertion_anchor not in test:
                  raise SystemExit('asserção UX da Agenda não localizada')
              new_contract = '''$agendaBlockedPresentationJs = (string) file_get_contents($root . '/public/assets/app.js');
          $agendaBlockedPresentationCss = (string) file_get_contents($root . '/design/styles/application.css');
          $assert(
              str_contains($agendaBlockedPresentationJs, 'function syncAgendaBlockedDayMarkers(') &&
                  str_contains($agendaBlockedPresentationJs, '(index * slotMinutes) % 30 !== 0') &&
                  str_contains($agendaBlockedPresentationJs, 'agenda-week-day-shell') &&
                  str_contains($agendaBlockedPresentationJs, 'fullDayBlock.hidden = true') &&
                  str_contains($agendaBlockedPresentationJs, 'slot.removeAttribute("href")') &&
                  str_contains($agendaBlockedPresentationCss, '--blocked-slot-index,0') &&
                  str_contains($agendaBlockedPresentationCss, 'left:12px;right:auto'),
              'presentation.agenda.blocked_day_half_hour_markers',
          );
          '''
              test = test.replace(assertion_anchor, new_contract + assertion_anchor, 1)
          test_path.write_text(test)
          PY

          php tools/telemetry-json-source-contract-check
          php tools/test-fast

          cat > /tmp/release.json <<'JSON'
          {
            "build": "1.9.16.1-agenda-blocked-markers-footer-lines",
            "package_type": "presentation",
            "notes": "Simplifica a sinalização de dias integralmente bloqueados na Agenda diária e semanal com marcadores a cada 30 minutos e reposiciona 25% abaixo o pico máximo das linhas decorativas do rodapé.",
            "changelog": {
              "title": "Agenda bloqueada e rodapé mais discretos",
              "items": [
                "Repete cadeado e Dia bloqueado a cada 30 minutos nas visões diária e semanal",
                "Alinha o marcador de dia bloqueado à esquerda da linha horária",
                "Oculta na visão semanal o cartão integral redundante de bloqueio mantendo o bloqueio funcional",
                "Mantém atalhos de criação indisponíveis quando o dia inteiro está bloqueado",
                "Reduz em 25% a altura máxima das linhas decorativas de telemetria do rodapé"
              ]
            },
            "logic_changes": true,
            "visual_changes": true,
            "documentation_changes": true,
            "deployment_sync_id": "github-prontoo-1.9.16.1-agenda-blocked-markers-footer-lines"
          }
          JSON

          php tools/release-version --write \
            --date=2026-09-16 \
            --timestamp=2026-09-16T09:28:00-04:00 \
            --expected-current=1.9.15.10 \
            --metadata-file=/tmp/release.json

          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('.')
          version_path = root / 'version.json'
          data = json.loads(version_path.read_text())
          release = data['version']
          if release != '1.9.16.1':
              raise SystemExit(f'release inesperada: {release}')
          data['asset_version'] = release
          data['database_changes'] = False
          data['schema_changes'] = False
          data['logic_changes'] = True
          data['visual_changes'] = True
          data['documentation_changes'] = True
          version_path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')

          old = '1.9.15.10'
          for raw in subprocess.check_output(['git', 'ls-files', '*.md', '*.json'], text=True).splitlines():
              path = pathlib.Path(raw)
              if not path.is_file():
                  continue
              text = path.read_text()
              changed = text.replace(old, release)
              if changed != text:
                  path.write_text(changed)

          css_path = pathlib.Path('design/styles/application.css')
          css = css_path.read_text()
          css_path.write_text(css.replace(f'pix-{old}.svg', f'pix-{release}.svg'))
          PY

          release="$(php -r '$v=json_decode(file_get_contents("version.json"),true); echo $v["version"];')"
          old='1.9.15.10'
          for stem in app-icon prontoo-mark favicon; do
            if [[ -f "public/assets/${stem}-${old}.png" ]]; then
              git mv "public/assets/${stem}-${old}.png" "public/assets/${stem}-${release}.png"
            fi
          done
          if [[ -f "public/assets/favicon-${old}.ico" ]]; then
            git mv "public/assets/favicon-${old}.ico" "public/assets/favicon-${release}.ico"
          fi
          if [[ -f "public/assets/pix-${old}.svg" ]]; then
            git mv "public/assets/pix-${old}.svg" "public/assets/pix-${release}.svg"
          fi

          rm -f .github/workflows/inspect-agenda-blocked-slots.yml
          rm -f .github/workflows/apply-agenda-blocked-slots.yml

          php tools/presentation-css-build --write

          python3 - <<'PY'
          import hashlib, json, pathlib
          release = json.loads(pathlib.Path('version.json').read_text())['version']
          artifact = pathlib.Path('public/assets/presentation.css').read_bytes()
          path = pathlib.Path('app/presentation.visual-contract.json')
          data = json.loads(path.read_text())
          data['version'] = release
          data.setdefault('delivery', {})['current_sha256'] = hashlib.sha256(artifact).hexdigest()
          data['delivery']['current_bytes'] = len(artifact)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          php tools/release-contract-reconcile --write

          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('version.json').read_text())['asset_version']
          path = pathlib.Path('app/prontoo.php')
          text = path.read_text()
          text, count = re.subn(
              r'const PRONTOO_ASSET_REV_FALLBACK = "[^"]+";',
              f'const PRONTOO_ASSET_REV_FALLBACK = "{version}";',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('fallback de assets não localizado')
          path.write_text(text)
          PY

          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/superseded-reference-contract-check
          php tools/version-asset-contract-check.php
          php tools/telemetry-json-source-contract-check
          php tools/test-fast
          php tools/presentation-visual-contract-check
          php tools/quality-gate --fast
          php tools/documentation-check.php
          git diff --check

          git add -A
          git commit -m 'Simplifica dias bloqueados da Agenda e linhas do rodapé'
          git push origin HEAD:feat/agenda-blocked-slots
