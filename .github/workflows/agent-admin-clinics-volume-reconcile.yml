name: Agent Admin Clinics Volume Reconcile

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/admin-clinics-default-active
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply product changes and reconcile release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin prontoo
          python3 tools/agent-admin-clinics-volume-reconcile.py
          rm -f tools/agent-admin-clinics-volume-reconcile.py
          rm -f .github/workflows/agent-admin-clinics-volume-reconcile.yml
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git add -A
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/php84-runtime-contract-check
          php tools/telemetry-json-source-contract-check
          php tools/presentation-visual-contract-check
          php tools/documentation-check.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations08.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php
          git show origin/prontoo:public/assets/app-icon-1.8.18.2.png | cmp - public/assets/app-icon-1.8.18.3.png
          git show origin/prontoo:public/assets/favicon-1.8.18.2.ico | cmp - public/assets/favicon-1.8.18.3.ico
          git show origin/prontoo:public/assets/favicon-1.8.18.2.png | cmp - public/assets/favicon-1.8.18.3.png
          git show origin/prontoo:public/assets/pix-1.8.18.2.svg | cmp - public/assets/pix-1.8.18.3.svg
          git show origin/prontoo:public/assets/prontoo-mark-1.8.18.2.png | cmp - public/assets/prontoo-mark-1.8.18.3.png
      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Define Ativos inicial e alinha Volume a Registros"
          git push origin HEAD:agent/admin-clinics-default-active
