name: Apply Runtime Contract Manifest Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: runtime-contract-manifest-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-runtime-contract-fix:
    if: github.head_ref == 'agent/fix-runtime-version-contract-manifest'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.30
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-runtime-version-contract-manifest
          fetch-depth: 0
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
      - name: Apply validate and publish clean tree
        shell: bash
        env:
          PRONTOO_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_test;charset=utf8mb4
          PRONTOO_TEST_DB_USER: root
          PRONTOO_TEST_DB_PASS: root
        run: |
          set -euo pipefail
          python3 tools/tmp_fix_runtime_contract_manifest.py
          git rm tools/tmp_fix_runtime_contract_manifest.py .github/workflows/tmp-fix-runtime-contract-manifest.yml
          find app br cron public tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          version = json.loads((root / 'version.json').read_text())
          manifest = json.loads((root / 'app/update.manifest.json').read_text())
          keys = (
              'version', 'release', 'build', 'package_type', 'schema_revision',
              'minimum_php', 'minimum_mysql', 'database_changes', 'schema_changes',
              'logic_changes', 'visual_changes', 'documentation_changes',
              'previous_version', 'deployment_sync_id',
          )
          failures = [key for key in keys if version.get(key) != manifest.get(key)]
          if failures:
              raise SystemExit('release contract mismatch: ' + ', '.join(failures))
          app = (root / 'app/prontoo.php').read_text()
          landing = (root / 'br/index.php').read_text()
          expected = version['version']
          if f'PRONTOO_VERSION_FALLBACK = "{expected}"' not in app:
              raise SystemExit('app fallback mismatch')
          match = re.search(r'BR_LANDING_VERSION_FALLBACK\s*=\s*["\']([^"\']+)["\']', landing)
          if not match or match.group(1) != expected:
              raise SystemExit('landing fallback mismatch')
          print(json.dumps({'version': expected, 'build': version['build'], 'contract': 'ok'}))
          PY
          git diff --check
          git status --short
          git config user.name 'prontoo-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md ChangeLog.txt app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php tools/architecture-check.php version.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração funcional foi gerada.' >&2
            exit 1
          fi
          git commit -m 'Corrigir contrato de versão do runtime'
          git push origin HEAD:agent/fix-runtime-version-contract-manifest
