name: Financial Preparation

on:
  push:
    branches:
      - 'codex/finance-*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prontoo_schema
      DB_USERNAME: root
      DB_PASSWORD: root
      PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
      PRONTOO_SCHEMA_USER: root
      PRONTOO_SCHEMA_PASS: root
      CI: 'true'
      PRONTOO_SCHEMA_TEST_MODE: '1'
      PRONTOO_INSTALLER_CLI_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Prepare derived release files without publishing
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git diff --binary | gzip -n | base64 -w 0
          echo
      - name: Validate prepared candidate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate --fast
          php tools/quality-gate
          php tools/documentation-check.php
          php tools/schema-check.php
          php tools/mysql-query-budget-check
          php tools/critical-runtime-smoke-check
