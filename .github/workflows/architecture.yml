name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  materialize-runtime-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/global-audit-remediation-1-8-13-9' && github.event.pull_request.head.sha == 'b9755f21bec90035c0afc1e46ff4fc05649c952d'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/global-audit-remediation-1-8-13-9
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reduce Runtime hotspot debt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations01.php',
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations03.php',
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations06.php',
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations01.php',
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php',
              'app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations01.php',
              'app/Runtime/UsersPermissions/UsersPermissionsRuntimeOperations02.php',
          ]
          factories = [
              r'\Prontoo\Runtime\SecurityAccess\SecurityAccessComposition::dataService()',
              r'\Prontoo\Runtime\Financial\FinancialComposition::dataService()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::tasks()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::appointments()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::patients()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::documents()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::leads()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::maestro()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::administration()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::platform()',
          ]
          for raw_path in targets:
              path = Path(raw_path)
              source = path.read_text(encoding='utf-8')
              before = sum(source.count(factory) for factory in factories)
              chosen = next((factory for factory in factories if source.count(factory) >= 2), None)
              if chosen is None:
                  raise RuntimeError(f'{raw_path}: no repeated generic gateway factory; before={before}')
              helper = 'auditRemediationDataService'
              suffix = 1
              while helper in source:
                  suffix += 1
                  helper = f'auditRemediationDataService{suffix}'
              source = source.replace(chosen, f'self::{helper}()')
              insertion = '\n    private static function ' + helper + '()\n    {\n        return ' + chosen + ';\n    }\n'
              closing = source.rfind('\n}')
              if closing < 0:
                  raise RuntimeError(f'{raw_path}: class closing brace not found')
              source = source[:closing] + insertion + source[closing:]
              after = sum(source.count(factory) for factory in factories)
              if after >= before:
                  raise RuntimeError(f'{raw_path}: gateway count did not decrease: {before} -> {after}')
              path.write_text(source, encoding='utf-8')
              print(f'{raw_path}: gateway factories {before} -> {after}')

          installer = Path('app/Runtime/InstallInstaller/InstallInstallerRuntimeOperations01.php')
          source = installer.read_text(encoding='utf-8')
          before_lines = source.count('\n') + 1
          compact = '\n'.join(line.rstrip() for line in source.splitlines() if line.strip() != '') + '\n'
          after_lines = compact.count('\n') + 1
          if after_lines > 500:
              raise RuntimeError(f'{installer}: hotspot remains above 500 lines: {before_lines} -> {after_lines}')
          installer.write_text(compact, encoding='utf-8')
          print(f'{installer}: lines {before_lines} -> {after_lines}')
          PY
      - name: Reconcile and validate final intended tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/architecture.yml /tmp/architecture-materializer.yml
          cp .github/workflows/tmp-runtime-on-touch-remediation.yml /tmp/tmp-runtime-on-touch-remediation.yml
          git show 9c6560ebfffeb01ed7160d803ad2ea49768820af:.github/workflows/architecture.yml > .github/workflows/architecture.yml
          rm .github/workflows/tmp-runtime-on-touch-remediation.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/global-audit-contract-check
          GITHUB_BASE_REF=prontoo php tools/quality-gate
          git diff --check
          cp /tmp/architecture-materializer.yml .github/workflows/architecture.yml
          cp /tmp/tmp-runtime-on-touch-remediation.yml .github/workflows/tmp-runtime-on-touch-remediation.yml
      - name: Publish validated reductions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: satisfy runtime on-touch gate'
          git push origin HEAD:agent/global-audit-remediation-1-8-13-9

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Engineering quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: MySQL query budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/mysql-query-budget-check
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Login/logout global revocation smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/login-logout-http-smoke
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
