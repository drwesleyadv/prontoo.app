name: Apply Certified Maturity 1.7.21.5

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/maturity-audit-1.7.21.5
          fetch-depth: 0
      - name: Restore certified product files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/drwesleyadv/prontoo.app/actions/artifacts/8507918108/zip" \
            -o /tmp/certified.zip
          rm -rf /tmp/certified && mkdir -p /tmp/certified
          unzip -q /tmp/certified.zip -d /tmp/certified
          for path in \
            ChangeLog.txt \
            MATURITY-AUDIT-1.7.21.5.md \
            app/Database/operational-schema.contract.json \
            app/Domain/Audit/AuditActivity.php \
            app/Support/ModuleLoader.php \
            app/Support/ServerJsonCache.php \
            app/architecture.manifest.json \
            app/prontoo.php \
            app/update.manifest.json \
            br/index.php \
            install.php \
            version.json; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/certified/$path" "$path"
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=Path('version.json')
          data=json.loads(v.read_text())
          data['previous_version']='1.7.21.4'
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('app/update.manifest.json')
          m=json.loads(p.read_text())
          m['previous_version']='1.7.21.4'
          m['files']['version.json']=hashlib.sha256(v.read_bytes()).hexdigest()
          m['file_count']=len(m['files'])
          m['total_uncompressed_bytes']=sum(Path(f).stat().st_size for f in m['files'])
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f AUDIT_PLACEHOLDER.tmp tools/apply-maturity-1.7.21.5.py
      - name: Commit product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt MATURITY-AUDIT-1.7.21.5.md app/Database/operational-schema.contract.json app/Domain/Audit/AuditActivity.php app/Support/ModuleLoader.php app/Support/ServerJsonCache.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php install.php version.json
          git add -u AUDIT_PLACEHOLDER.tmp tools/apply-maturity-1.7.21.5.py || true
          git commit -m "amadurece runtime e cache JSON na 1.7.21.5"
          git push origin HEAD:agent/maturity-audit-1.7.21.5
