name: Apply Admin Panel 1.7.24.1

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-admin-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-panel-1.7.24.1
          fetch-depth: 0

      - name: Apply administrator panel correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .automation/apply_admin_panel_1_7_24_1.py | tee /tmp/admin-panel-report.json

      - name: Validate changed PHP and contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Support/SecurityAccess.php >/dev/null
          php -l app/Pages/Dashboards.php >/dev/null
          php -l app/prontoo.php >/dev/null
          php -l br/index.php >/dev/null
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) { throw new RuntimeException("JSON inválido: " . $file); }
            }
          '
          grep -F '"gerente" => [' app/Support/SecurityAccess.php >/dev/null
          grep -F 'class="manager-dashboard"' app/Pages/Dashboards.php >/dev/null
          grep -F 'body[data-route="painel"] .manager-dashboard{' public/assets/design-system.css >/dev/null

      - name: Publish transformed application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/Support/SecurityAccess.php \
            app/Pages/Dashboards.php \
            public/assets/design-system.css \
            ChangeLog.txt \
            version.json \
            app/prontoo.php \
            br/index.php \
            app/architecture.manifest.json \
            app/update.manifest.json \
            .automation/final-architecture.yml
          git commit -m 'Prontoo 1.7.24.1 — corrige Painel do Administrador'
          git push origin HEAD:agent/admin-panel-1.7.24.1
