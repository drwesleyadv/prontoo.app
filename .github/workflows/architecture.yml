name: Apply Hardening 1.7.21.3

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  apply-hardening:
    if: github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Extract and apply hardening
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 <<'"'"'PY'"'"'/{capture=1;next} capture && /^          PY$/{exit} capture{sub(/^          /,"");print}' .github/workflows/apply-hardening-1.7.21.3.yml > /tmp/apply-hardening.py
          git show origin/main:.github/workflows/architecture.yml > .github/workflows/architecture.yml
          python3 /tmp/apply-hardening.py > /tmp/apply-hardening.log 2>&1 || { cat /tmp/apply-hardening.log; exit 1; }
          rm -f .github/workflows/apply-hardening-1.7.21.3.yml HARDENING-ERROR.log

      - name: Publish apply diagnostic
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          log = Path('/tmp/apply-hardening.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/apply-hardening.log').exists() else 'Aplicador falhou antes de produzir log.'
          body = '### Diagnóstico automático do hardening 1.7.21.3\n\n```text\n' + log[-12000:] + '\n```'
          Path('/tmp/comment.json').write_text(json.dumps({'body': body}, ensure_ascii=False), encoding='utf-8')
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/15/comments" \
            --data-binary @/tmp/comment.json

      - name: Validate hardening
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -path './.git' -prune -o -path './storage' -prune -o -name '*.php' -print0)
          php tools/install-security-check.php
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php
          php tools/architecture-check.php
          php -r '
            $m=json_decode(file_get_contents("app/update.manifest.json"),true,512,JSON_THROW_ON_ERROR);
            $bytes=0;
            foreach($m["files"] as $f=>$h){if(!is_file($f)||!hash_equals($h,hash_file("sha256",$f))){throw new RuntimeException("manifest:".$f);} $bytes+=filesize($f);}
            if($bytes!==(int)$m["total_uncompressed_bytes"]){throw new RuntimeException("manifest:bytes");}
            foreach($m["removed_files"] as $f){if(file_exists($f)){throw new RuntimeException("removed:".$f);}}
          '

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Formaliza Prontoo 1.7.21.3 — instalador local e schema congelado"
          git push origin "HEAD:${{ github.head_ref }}"
