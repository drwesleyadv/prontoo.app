name: Architecture Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # BEGIN FINALIZE_1_7_21_2
      - name: Finalize release metadata 1.7.21.2
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 14
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          from pathlib import Path

          VERSION = "1.7.21.2"
          PREVIOUS = "1.7.21.1"
          ROOT = Path(".")

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              with (ROOT / path).open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write(content)

          def load_json(path: str) -> dict:
              return json.loads(read(path))

          def write_json(path: str, payload: dict) -> None:
              write(path, json.dumps(payload, ensure_ascii=False, indent=2) + "\n")

          current = load_json("version.json")
          if current.get("version") == VERSION:
              print("Release metadata already formalized.")
              raise SystemExit(0)

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          generated_at = now.isoformat().replace("+00:00", "Z")
          generated_at_unix = int(now.timestamp())

          current.update({
              "version": VERSION,
              "release": VERSION,
              "generated_at_unix": generated_at_unix,
              "generated_at": generated_at,
              "updated_at": generated_at,
              "build": "1.7.21.2-installer-integrity-guardian-hotfix",
              "package_type": "clean_install_installer_integrity_hotfix",
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": True,
              "visual_changes": False,
              "notes": "Corrige a integração entre o instalador limpo e o Guardião de integridade, preserva o schema r7 e certifica o fluxo real em MySQL 8 com zero tabelas iniciais.",
          })
          write_json("version.json", current)

          architecture = load_json("app/architecture.manifest.json")
          architecture.update({
              "version": VERSION,
              "database_changes": False,
              "schema_changes": False,
              "visual_changes": False,
          })
          write_json("app/architecture.manifest.json", architecture)

          operational = load_json("app/Database/operational-schema.contract.json")
          operational["version"] = VERSION
          write_json("app/Database/operational-schema.contract.json", operational)

          runtime = read("app/prontoo.php")
          replacements = {
              'const PRONTOO_VERSION_FALLBACK = "1.7.21.1";': 'const PRONTOO_VERSION_FALLBACK = "1.7.21.2";',
              'const PRONTOO_PREVIOUS_VERSION = "1.7.20.6";': 'const PRONTOO_PREVIOUS_VERSION = "1.7.21.1";',
          }
          for old, new in replacements.items():
              if old not in runtime:
                  raise RuntimeError(f"Runtime metadata marker missing: {old}")
              runtime = runtime.replace(old, new, 1)
          write("app/prontoo.php", runtime)

          landing = read("br/index.php")
          old_landing = 'const BR_LANDING_VERSION_FALLBACK = "1.7.21.1";'
          new_landing = 'const BR_LANDING_VERSION_FALLBACK = "1.7.21.2";'
          if old_landing not in landing:
              raise RuntimeError("Landing version marker missing")
          write("br/index.php", landing.replace(old_landing, new_landing, 1))

          changelog_entry = """Prontoo 1.7.21.2 — integração do instalador com o Guardião\n\n- Corrige a incompatibilidade de assinatura entre `run_schema_sql()` e `PiIntegrity::proveSchemaOperation()`.\n- Normaliza exclusivamente a chamada estrutural legada e extrai a tabela de `CREATE TABLE` canônico.\n- Faz o CI carregar o Guardião no mesmo caminho executado pela instalação real.\n- Certifica a criação integral das 62 tabelas em MySQL 8 partindo de banco vazio.\n- Não altera o schema SQL, a revisão r7, dados, interface ou ativos.\n\n"""
          changelog = read("ChangeLog.txt")
          if not changelog.startswith("Prontoo 1.7.21.2"):
              write("ChangeLog.txt", changelog_entry + changelog)

          hotfix = """# Hotfix Prontoo 1.7.21.2\n\n## Incidente\n\nA instalação limpa da versão 1.7.21.1 executava o primeiro `CREATE TABLE`, mas era interrompida logo depois porque `run_schema_sql()` ainda chamava `PiIntegrity::proveSchemaOperation()` com a assinatura anterior. No PHP 8.4, o booleano de sucesso era recebido no argumento tipado como nome da tabela, produzindo `TypeError`.\n\n## Correção\n\n- compatibiliza exclusivamente a chamada estrutural legada do instalador;\n- extrai o nome da tabela somente de SQL `CREATE TABLE` canônico;\n- mantém a assinatura moderna estrita para novas chamadas;\n- carrega `PiIntegrity` nos testes estático e de instalação;\n- executa `install_fresh_schema()` em MySQL 8 com zero tabelas iniciais.\n\n## Escopo\n\nNão há alteração no `schema.sql`, na revisão `prontoo_1_7_20_6_clean_schema_r7_layer2_ledger`, nas 62 tabelas, nos dados operacionais, na interface ou nos ativos.\n"""
          write("HOTFIX-1.7.21.2.md", hotfix)

          workflow_path = ".github/workflows/architecture.yml"
          workflow = read(workflow_path)
          start_marker = "      # BEGIN FINALIZE_1_7_21_2\n"
          end_marker = "      # END FINALIZE_1_7_21_2\n"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker)
          if start < 0 or end < 0 or end < start:
              raise RuntimeError("Workflow finalizer markers missing")
          end += len(end_marker)
          workflow = workflow[:start] + workflow[end:]
          workflow = workflow.replace("permissions:\n  contents: write", "permissions:\n  contents: read", 1)
          workflow = re.sub(
              r"(      - name: Checkout\n        uses: actions/checkout@v4)\n        with:\n          ref: .*\n          fetch-depth: 0\n",
              r"\1\n",
              workflow,
              count=1,
          )
          workflow = workflow.replace(
              "      - name: Release manifest\n        if: github.event_name == 'push'\n",
              "      - name: Release manifest\n",
              1,
          )
          write(workflow_path, workflow)

          release_files = [
              ".github/workflows/architecture.yml",
              "ChangeLog.txt",
              "HOTFIX-1.7.21.2.md",
              "app/Core/Integrity/PiIntegrity.php",
              "app/Database/operational-schema.contract.json",
              "app/architecture.manifest.json",
              "app/prontoo.php",
              "br/index.php",
              "version.json",
          ]
          hashes: dict[str, str] = {}
          total_bytes = 0
          for path in release_files:
              data = (ROOT / path).read_bytes()
              hashes[path] = hashlib.sha256(data).hexdigest()
              total_bytes += len(data)

          previous_manifest = load_json("app/update.manifest.json")
          manifest = {
              "version": VERSION,
              "release": VERSION,
              "schema_revision": "prontoo_1_7_20_6_clean_schema_r7_layer2_ledger",
              "build": "1.7.21.2-installer-integrity-guardian-hotfix",
              "package_type": "clean_install_installer_integrity_hotfix_incremental",
              "generated_at": generated_at,
              "version_format": "1.month.day.sequence",
              "minimum_php": "8.4.0",
              "minimum_mysql": "8.0.30",
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": True,
              "visual_changes": False,
              "clean_install_schema": True,
              "requires_empty_database": True,
              "hash_algorithm": "sha256",
              "signature_policy": "hostoo_github_repository_sync",
              "architecture_policy": "php-layered-invariants-v2",
              "database_policy": "clean-schema-layer2-ledger-v1",
              "installer_policy": "runtime_parser_integrity_guardian_and_install_fresh_schema_must_pass_on_mysql_with_zero_initial_tables",
              "schema_table_count": 62,
              "operational_tables_verified": 60,
              "file_count": len(release_files),
              "total_uncompressed_bytes": total_bytes,
              "files": hashes,
              "removed_files": list(previous_manifest.get("removed_files", [])),
          }
          write_json("app/update.manifest.json", manifest)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/architecture.yml ChangeLog.txt HOTFIX-1.7.21.2.md \
            app/Core/Integrity/PiIntegrity.php app/Database/operational-schema.contract.json \
            app/architecture.manifest.json app/prontoo.php app/update.manifest.json \
            br/index.php version.json
          if git diff --cached --quiet; then
            echo "No release metadata changes required."
          else
            git commit -m "Formaliza Prontoo 1.7.21.2"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      # END FINALIZE_1_7_21_2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './storage' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)

      - name: JSON contracts
        shell: bash
        run: |
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) { throw new RuntimeException("JSON inválido: " . $file); }
            }
          '

      - name: Release manifest
        shell: bash
        run: |
          php -r '
            $manifest = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $files = (array) ($manifest["files"] ?? []);
            if (count($files) !== (int) ($manifest["file_count"] ?? -1)) {
              throw new RuntimeException("file_count divergente");
            }
            $bytes = 0;
            foreach ($files as $file => $expected) {
              if (!is_file($file)) { throw new RuntimeException("Arquivo ausente: " . $file); }
              $actual = hash_file("sha256", $file);
              if (!hash_equals((string) $expected, (string) $actual)) {
                throw new RuntimeException("Hash divergente: " . $file);
              }
              $bytes += (int) filesize($file);
            }
            if ($bytes !== (int) ($manifest["total_uncompressed_bytes"] ?? -1)) {
              throw new RuntimeException("total_uncompressed_bytes divergente");
            }
            foreach ((array) ($manifest["removed_files"] ?? []) as $file) {
              if (file_exists((string) $file)) {
                throw new RuntimeException("Arquivo legado ainda presente: " . $file);
              }
            }
          '

      - name: Static schema contract with Guardian loaded
        shell: bash
        run: |
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php

      - name: Full zero-table installer with Guardian loaded on MySQL 8
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php | tee schema-report.json

      - name: Layered architecture
        shell: bash
        run: |
          set -o pipefail
          php tools/architecture-check.php | tee architecture-report.json

      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: |
            architecture-report.json
            schema-report.json
          if-no-files-found: error
          retention-days: 7
