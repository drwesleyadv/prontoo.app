name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/avisos-design-system-consolidation
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Finalize Design System consolidation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp-finalize-design-system.py
          sed -i 's/[[:blank:]]*$//' design/styles/application.css
          sed -i '/Avisos — Design System canônico/d' design/styles/application.css
          rm tools/temp-finalize-design-system.py
          git checkout origin/prontoo -- .github/workflows/architecture.yml
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          if grep -R -n -E 'ds-collaborator-row-v31|procedure-kpis-refined|notice-gmail-|notice-minimal-|notice-form-refined|notice-filter-chips|agenda-route-(dialog|overlay|backdrop)-retired' app public design/styles/application.css; then
            echo 'Legacy Design System token remains.' >&2
            exit 1
          fi
          git diff --check
          php tools/quality-gate
          php tools/schema-check.php
          php tools/mysql-query-budget-check
          php tools/install-security-check.php
          php tools/install-window-contract-check
          php tools/login-post-password-runtime-check
          bash tools/login-logout-http-smoke
          php tools/maestro-runtime-regression-check
          php tools/critical-runtime-smoke-check
          bash tools/http-runtime-smoke-check
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/architecture.yml|.github/workflows/documentation.yml|app/Infrastructure/Operational/TasksNoticesSqlCatalog06.php|app/Runtime/AdminPages/AdminPagesRuntimeOperations09.php|app/Runtime/AuditActivity/AuditActivityRuntimeOperations05.php|app/Runtime/Documents/DocumentsRuntimeOperations06.php|app/Runtime/TasksNotices/TasksNoticesRuntimeOperations05.php|app/Runtime/TasksNotices/TasksNoticesRuntimeOperations06.php|app/Runtime/UsersPermissions/UsersPermissionsRuntimeOperations04.php|app/architecture.manifest.json|app/prontoo.php|app/update.manifest.json|br/index.php|CHANGELOG.md|design/styles/application.css|public/assets/app.js|public/assets/presentation.css|tools/temp-finalize-design-system.py) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolida Design System sem estilos legados'
          git push origin HEAD:agent/avisos-design-system-consolidation
      - name: Engineering quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: MySQL query budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/mysql-query-budget-check
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Login/logout global revocation smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/login-logout-http-smoke
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
