name: Architecture Contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-ssd-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssd-persistence-1.7.22.6
          fetch-depth: 0

      - name: Apply SSD persistence policy
        shell: bash
        run: |
          set -euo pipefail
          cp .automation/apply_ssd_persistence.py /tmp/apply_ssd_persistence.py
          python3 /tmp/apply_ssd_persistence.py | tee /tmp/ssd-apply.log

      - name: Record provisional validation
        shell: bash
        run: |
          set +e
          {
            while IFS= read -r -d '' file; do
              php -l "$file"
            done < <(find . -path './.git' -prune -o -path './ssd' -prune -o -name '*.php' -type f -print0)
            php tools/install-security-check.php
          } > /tmp/ssd-validation.log 2>&1
          cat /tmp/ssd-validation.log
          exit 0

      - name: Publish transformed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prontoo 1.7.22.6 — migra persistência para ssd'
          git push origin HEAD:agent/ssd-persistence-1.7.22.6
