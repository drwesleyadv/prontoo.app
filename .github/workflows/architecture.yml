name: Architecture Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-release:
    if: github.head_ref == 'agent/1.7.20.6-clean-schema-layer2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/1.7.20.6-clean-schema-layer2
          fetch-depth: 0

      - name: Assemble and dry-run patch
        shell: bash
        run: |
          set -u
          cat .release/patch.part.* > assembled.patch
          sha256sum assembled.patch | tee patch-diagnostic.txt
          echo 'expected 3aee9505e14c6a218400d53f8753ebacc4d189c11c6194a0e9140aff3eff499e' >> patch-diagnostic.txt
          git show origin/main:.github/workflows/architecture.yml > .github/workflows/architecture.yml
          patch --dry-run --batch --forward -p1 < assembled.patch > patch-dry-run.txt 2>&1 || true

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-patch-diagnostic
          path: |
            assembled.patch
            patch-diagnostic.txt
            patch-dry-run.txt
          if-no-files-found: error
          retention-days: 1
