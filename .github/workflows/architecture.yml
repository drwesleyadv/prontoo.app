name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/novo-aviso-design-system
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Reconcile Novo Aviso branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-reconcile-novo-aviso.yml
          git checkout origin/prontoo -- .github/workflows/architecture.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          unexpected="$(git status --short | grep -vE '^M  \.github/workflows/architecture\.yml$|^D  \.github/workflows/temp-reconcile-novo-aviso\.yml$|^ M app/update\.manifest\.json$' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            echo 'Unexpected reconciliation drift.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/architecture.yml app/update.manifest.json
          git commit -m 'Finaliza reconciliação do Novo Aviso'
          git push origin HEAD:agent/novo-aviso-design-system
      - name: Engineering quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: MySQL query budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/mysql-query-budget-check
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Login/logout global revocation smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/login-logout-http-smoke
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
