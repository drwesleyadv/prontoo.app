name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

concurrency:
  group: architecture-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Prepare final phase 15 release candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/architecture-phase-15-release-governance'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/prontoo -- version.json .github/workflows/architecture.yml .github/workflows/documentation.yml
          php tools/release-version --write --date=2026-08-10 --timestamp=2026-08-10T22:24:08+00:00 --expected-current=1.8.9.1
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          git add -A
      - name: Engineering quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: MySQL query budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/mysql-query-budget-check
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
      - name: Materialize final phase 15 non-workflow files
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/architecture-phase-15-release-governance'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin prontoo agent/architecture-phase-15-release-governance
          git checkout -B agent/architecture-phase-15-release-governance origin/agent/architecture-phase-15-release-governance
          git reset --hard origin/agent/architecture-phase-15-release-governance
          git checkout origin/prontoo -- version.json .github/workflows/architecture.yml .github/workflows/documentation.yml
          php tools/release-version --write --date=2026-08-10 --timestamp=2026-08-10T22:24:08+00:00 --expected-current=1.8.9.1
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          git checkout origin/agent/architecture-phase-15-release-governance -- .github/workflows/architecture.yml .github/workflows/documentation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Engenharia 15/15 — corrigir changelog canônico da versão 1.8.10.1'
          git push origin HEAD:agent/architecture-phase-15-release-governance
