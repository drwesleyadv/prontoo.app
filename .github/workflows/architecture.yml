name: Apply Certified Release 1.7.21.2

on:
  pull_request:

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  apply-certified-release:
    if: github.event.pull_request.number == 14
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download certified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-1.7.21.2-files
          path: /tmp/prontoo-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 29840074630

      - name: Apply certified files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/prontoo-release/ChangeLog.txt ChangeLog.txt
          cp /tmp/prontoo-release/HOTFIX-1.7.21.2.md HOTFIX-1.7.21.2.md
          cp /tmp/prontoo-release/app/Core/Integrity/PiIntegrity.php app/Core/Integrity/PiIntegrity.php
          cp /tmp/prontoo-release/app/Database/operational-schema.contract.json app/Database/operational-schema.contract.json
          cp /tmp/prontoo-release/app/architecture.manifest.json app/architecture.manifest.json
          cp /tmp/prontoo-release/app/prontoo.php app/prontoo.php
          cp /tmp/prontoo-release/app/update.manifest.json app/update.manifest.json
          cp /tmp/prontoo-release/br/index.php br/index.php
          cp /tmp/prontoo-release/version.json version.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt HOTFIX-1.7.21.2.md \
            app/Core/Integrity/PiIntegrity.php \
            app/Database/operational-schema.contract.json \
            app/architecture.manifest.json app/prontoo.php app/update.manifest.json \
            br/index.php version.json
          if git diff --cached --quiet; then
            echo "Certified release files already match."
          else
            git commit -m "Restaura artefatos certificados da versão 1.7.21.2"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
