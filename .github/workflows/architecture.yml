name: Full Maturation Audit Snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 100 percent tracked-file inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from collections import defaultdict
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          paths = [p.decode("utf-8") for p in files if p]
          inventory = []
          findings = []
          content_hashes = defaultdict(list)
          php_functions = defaultdict(list)
          text_cache = {}

          legacy_file_rx = re.compile(r"(?:^|/)(?:old|legacy|backup|bak|copy|temp|tmp|deprecated)(?:[._-]|/|$)|(?:\.bak|\.old|~)$", re.I)
          version_symbol_rx = re.compile(r"\b(?:function|class|const)\s+([A-Za-z_][A-Za-z0-9_]*(?:1_7_|v1_7_|_v\d+)[A-Za-z0-9_]*)", re.I)
          removed_symbols = [
              "CleanInstallReset", "ActionCapabilityCatalog", "CapabilityInvariant",
              "Prontoo\\Core\\Integrity\\PiSequence", "Prontoo\\Core\\Integrity\\ActionProof"
          ]

          for path in paths:
              p = Path(path)
              data = p.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              content_hashes[digest].append(path)
              binary = b"\0" in data[:8192]
              text = None
              lines = None
              if not binary:
                  try:
                      text = data.decode("utf-8")
                      text_cache[path] = text
                      lines = text.count("\n") + (1 if text and not text.endswith("\n") else 0)
                  except UnicodeDecodeError:
                      binary = True
              inventory.append({
                  "path": path,
                  "bytes": len(data),
                  "sha256": digest,
                  "extension": p.suffix.lower(),
                  "binary": binary,
                  "lines": lines,
              })

              if legacy_file_rx.search(path):
                  findings.append({"severity":"high","kind":"legacy_filename","path":path,"detail":"Nome indica cópia, backup, temporário ou legado versionado."})
              if len(data) == 0:
                  findings.append({"severity":"medium","kind":"empty_file","path":path,"detail":"Arquivo versionado vazio."})
              if lines and lines > 1400:
                  findings.append({"severity":"medium","kind":"large_file","path":path,"line":1,"detail":f"Arquivo possui {lines} linhas; candidato a decomposição segura."})

              if text is None:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  stripped = line.strip()
                  if re.search(r"\b(?:TODO|FIXME|HACK|XXX)\b", line, re.I):
                      findings.append({"severity":"medium","kind":"unfinished_marker","path":path,"line":n,"detail":stripped[:240]})
                  if p.suffix.lower() == ".php" and re.search(r"(?<![A-Za-z0-9_])@(?!@)", line):
                      findings.append({"severity":"low","kind":"error_suppression","path":path,"line":n,"detail":stripped[:240]})
                  if p.suffix.lower() == ".php" and re.search(r"\b(?:die|exit)\s*(?:\(|;)", line) and not path.startswith("tools/"):
                      findings.append({"severity":"low","kind":"direct_exit","path":path,"line":n,"detail":stripped[:240]})
                  if p.suffix.lower() == ".php" and re.search(r"\b(?:include|require)(?:_once)?\s*\(?\s*\$", line):
                      findings.append({"severity":"medium","kind":"dynamic_include","path":path,"line":n,"detail":stripped[:240]})
                  for symbol in removed_symbols:
                      if symbol in line and path not in {"ChangeLog.txt", "app/architecture.manifest.json", "app/update.manifest.json"} and not path.startswith(".github/"):
                          findings.append({"severity":"high","kind":"removed_legacy_reference","path":path,"line":n,"detail":stripped[:240]})
                  m = version_symbol_rx.search(line)
                  if m:
                      findings.append({"severity":"high","kind":"version_specific_symbol","path":path,"line":n,"detail":m.group(1)})

              if p.suffix.lower() == ".php":
                  for m in re.finditer(r"(?m)^\s*function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", text):
                      php_functions[m.group(1)].append(path)

          for digest, dup_paths in content_hashes.items():
              if len(dup_paths) > 1:
                  findings.append({"severity":"medium","kind":"duplicate_file_content","paths":sorted(dup_paths),"detail":"Arquivos possuem conteúdo byte a byte idêntico.","sha256":digest})

          for name, fn_paths in php_functions.items():
              unique = sorted(set(fn_paths))
              if len(unique) > 1:
                  findings.append({"severity":"high","kind":"duplicate_php_function","paths":unique,"detail":name})

          # Every tracked file must appear exactly once.
          if len(inventory) != len(paths) or len({x["path"] for x in inventory}) != len(paths):
              raise SystemExit("Inventário não cobre exatamente todos os arquivos versionados")

          summary = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tracked_file_count": len(paths),
              "tracked_total_bytes": sum(x["bytes"] for x in inventory),
              "text_files": sum(not x["binary"] for x in inventory),
              "binary_files": sum(x["binary"] for x in inventory),
              "php_files": sum(x["extension"] == ".php" for x in inventory),
              "findings_count": len(findings),
              "coverage_percent": 100.0,
          }
          Path("maturation-inventory.json").write_text(json.dumps({"summary":summary,"files":inventory}, ensure_ascii=False, indent=2)+"\n")
          Path("maturation-findings.json").write_text(json.dumps({"summary":summary,"findings":findings}, ensure_ascii=False, indent=2)+"\n")
          Path("maturation-paths.txt").write_text("\n".join(paths)+"\n")
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Archive every tracked file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null --files-from=- -czf tracked-source.tar.gz
          test "$(tar -tzf tracked-source.tar.gz | wc -l)" -eq "$(git ls-files | wc -l)"

      - name: Upload complete audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: full-maturation-audit-snapshot
          path: |
            tracked-source.tar.gz
            maturation-inventory.json
            maturation-findings.json
            maturation-paths.txt
          if-no-files-found: error
          retention-days: 7
