name: Architecture Contract

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - prontoo

permissions:
  contents: write
  issues: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  apply_telemetry_display_precision:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/telemetry-display-two-decimals-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout functional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply and validate display precision
        id: execute
        continue-on-error: true
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/telemetry-display-two-decimals-executor.py 2>&1 | tee /tmp/telemetry-executor.log
      - name: Report executor failure
        if: steps.execute.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            printf 'O executor da precisão visual falhou. Saída técnica:\n\n```text\n'
            tail -c 45000 /tmp/telemetry-executor.log
            printf '\n```\n'
          } > /tmp/executor-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$(cat /tmp/executor-comment.md)"
      - name: Enforce executor success
        if: steps.execute.outcome == 'failure'
        run: exit 1
