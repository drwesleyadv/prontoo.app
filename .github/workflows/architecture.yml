name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/avisos-design-system-consolidation
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Consolidate Avisos Design System
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/!important//g' tools/temp-avisos-design-system.py
          python3 tools/temp-avisos-design-system.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('design/styles/application.css')
          css = path.read_text()
          base_css = subprocess.check_output(
              ['git', 'show', 'origin/prontoo:design/styles/application.css'],
              text=True,
          )
          rule_pattern = re.compile(r'([^{}]+)\{([^{}]*)\}')

          def normalize(selector: str) -> str:
              return re.sub(r'\s+', ' ', selector.strip())

          def selector_counts(source: str) -> dict[str, int]:
              counts: dict[str, int] = {}
              for match in rule_pattern.finditer(source):
                  selector = normalize(match.group(1))
                  if selector and not selector.startswith('@'):
                      counts[selector] = counts.get(selector, 0) + 1
              return counts

          def dedupe_selector_lists(match):
              raw = match.group(1)
              selector = raw.strip()
              if selector.startswith('@') or ',' not in selector:
                  return raw + '{'
              items = [normalize(item) for item in selector.split(',')]
              unique = []
              for item in items:
                  if item and item not in unique:
                      unique.append(item)
              if len(unique) == len(items):
                  return raw + '{'
              prefix = raw[: len(raw) - len(raw.lstrip())]
              return prefix + ','.join(unique) + '{'

          css = re.sub(r'([^{}]+)\{', dedupe_selector_lists, css)
          base_counts = selector_counts(base_css)
          current_counts = selector_counts(css)
          new_duplicates = {
              selector
              for selector, count in current_counts.items()
              if count > 1 and base_counts.get(selector, 0) <= 1
          }
          remaining = dict(current_counts)

          def remove_earlier_new_duplicate(match):
              selector = normalize(match.group(1))
              if selector in new_duplicates and remaining.get(selector, 0) > 1:
                  remaining[selector] -= 1
                  return ''
              return match.group(0)

          css = rule_pattern.sub(remove_earlier_new_duplicate, css)
          final_counts = selector_counts(css)
          unresolved = sorted(
              selector
              for selector, count in final_counts.items()
              if count > 1 and base_counts.get(selector, 0) <= 1
          )
          if unresolved:
              raise SystemExit('new duplicate selectors remain: ' + ' | '.join(unresolved))
          path.write_text(css)
          PY
          git checkout origin/prontoo -- .github/workflows/architecture.yml
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php -l app/Runtime/TasksNotices/TasksNoticesRuntimeOperations05.php
          php -l app/Runtime/TasksNotices/TasksNoticesRuntimeOperations06.php
          php tools/quality-gate
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/architecture.yml|.github/workflows/documentation.yml|app/Runtime/TasksNotices/TasksNoticesRuntimeOperations05.php|app/Runtime/TasksNotices/TasksNoticesRuntimeOperations06.php|app/architecture.manifest.json|app/prontoo.php|app/update.manifest.json|br/index.php|CHANGELOG.md|design/styles/application.css|public/assets/app.js|public/assets/presentation.css|tools/temp-avisos-design-system.py) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/architecture.yml .github/workflows/documentation.yml app/Runtime/TasksNotices/TasksNoticesRuntimeOperations05.php app/Runtime/TasksNotices/TasksNoticesRuntimeOperations06.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php CHANGELOG.md design/styles/application.css public/assets/app.js public/assets/presentation.css tools/temp-avisos-design-system.py
          git commit -m 'Padroniza Avisos com o Design System'
          git push origin HEAD:agent/avisos-design-system-consolidation
      - name: Engineering quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: MySQL query budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/mysql-query-budget-check
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Login/logout global revocation smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/login-logout-http-smoke
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
