name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply PHP 8.0 list compatibility
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -R -q --include='*.php' 'array_is_list(' app; then
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def patch_class(path_text: str, negative: bool) -> None:
              path = root / path_text
              text = path.read_text(encoding='utf-8')
              old = 'if (!array_is_list($value)) {' if negative else 'if (array_is_list($value)) {'
              new = 'if (!self::isList($value)) {' if negative else 'if (self::isList($value)) {'
              if text.count(old) != 1:
                  raise SystemExit(f'{path_text}: ocorrência esperada uma vez, encontrada {text.count(old)}.')
              text = text.replace(old, new, 1)
              canonical = text.find('private static function canonicalize(')
              if canonical < 0:
                  canonical = text.find('public static function value(')
              if canonical < 0:
                  raise SystemExit(f'{path_text}: função canônica não localizada.')
              next_private = text.find('\n    private static function ', canonical + 1)
              next_public = text.find('\n    public static function ', canonical + 1)
              candidates = [position for position in (next_private, next_public) if position >= 0]
              if not candidates:
                  raise SystemExit(f'{path_text}: limite de inserção não localizado.')
              next_method = min(candidates)
              helper = '''
    private static function isList(array $value): bool
    {

        return array_keys($value) === array_keys(array_values($value));
    }
'''
              text = text[:next_method] + helper + text[next_method:]
              path.write_text(text, encoding='utf-8')

          patch_class('app/Core/Invariant/Canonical.php', False)
          patch_class('app/Core/Integrity/AuditChain.php', True)
          patch_class('app/Core/Integrity/PiIntegrity.php', True)

          telemetry_path = root / 'app/Support/Telemetry.php'
          telemetry = telemetry_path.read_text(encoding='utf-8')
          old = 'if (array_is_list($value)) {'
          if telemetry.count(old) != 1:
              raise SystemExit(f'Telemetry.php: ocorrência esperada uma vez, encontrada {telemetry.count(old)}.')
          telemetry = telemetry.replace(old, 'if (maestro_deferred_array_is_list($value)) {', 1)
          anchor = 'function maestro_deferred_canonicalize(mixed $value): mixed\n'
          if telemetry.count(anchor) != 1:
              raise SystemExit('Telemetry.php: âncora canônica não localizada uma vez.')
          helper = '''function maestro_deferred_array_is_list(array $value): bool
{

    return array_keys($value) === array_keys(array_values($value));
}
'''
          telemetry = telemetry.replace(anchor, helper + anchor, 1)
          telemetry_path.write_text(telemetry, encoding='utf-8')
          PY
          if grep -R --line-number --include='*.php' 'array_is_list(' app; then
            echo 'Dependência PHP 8.1 array_is_list ainda presente.' >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app tools br cron -type f -name '*.php' -print0)
          php tools/security-regression-check.php
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $path = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/') || str_starts_with($relative, 'audit-output/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app app/update.manifest.json
          git commit -m "Compatibilizar listas canônicas com PHP 8.0"
          git push origin HEAD:"$HEAD_BRANCH"
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
      - name: Canonical JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $contracts = [];
          foreach (['version.json', 'app/update.manifest.json', 'app/architecture.manifest.json'] as $file) {
              $contracts[$file] = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($contracts[$file])) {
                  throw new RuntimeException('Contrato JSON inválido: ' . $file);
              }
          }
          $version = trim((string) ($contracts['version.json']['version'] ?? ''));
          if ($version === '' ||
              trim((string) ($contracts['version.json']['release'] ?? '')) !== $version ||
              trim((string) ($contracts['app/update.manifest.json']['version'] ?? '')) !== $version ||
              trim((string) ($contracts['app/update.manifest.json']['release'] ?? '')) !== $version ||
              trim((string) ($contracts['app/architecture.manifest.json']['version'] ?? '')) !== $version) {
              throw new RuntimeException('Contrato canônico de versão divergente');
          }
          foreach ([
              'app/prontoo.php' => 'PRONTOO_VERSION_FALLBACK',
              'br/index.php' => 'BR_LANDING_VERSION_FALLBACK',
          ] as $file => $constant) {
              $source = (string) file_get_contents($file);
              $pattern = '/const\s+' . preg_quote($constant, '/') . '\s*=\s*["\x27]([^"\x27]+)["\x27]\s*;/';
              if (!preg_match($pattern, $source, $match) || trim((string) ($match[1] ?? '')) !== $version) {
                  throw new RuntimeException('Fallback de versão divergente: ' . $file);
              }
          }
          PHP
      - name: Documentation and comment contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/documentation-check.php
          php tools/code-comment-check.php
      - name: Security regressions
        shell: bash
        run: |
          set -euo pipefail
          php tools/security-regression-check.php
      - name: Architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          php tools/architecture-check.php
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
