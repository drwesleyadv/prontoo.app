name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/engineering-phase-08-composition-roots
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Finalize deterministic branch contract
        shell: bash
        env:
          HEAD_BRANCH: agent/engineering-phase-08-composition-roots
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/architecture.yml > .github/workflows/architecture.yml
          php tools/release-contract-reconcile --write
          git add .github/workflows/documentation.yml app/prontoo.php br/index.php CHANGELOG.md app/architecture.manifest.json app/update.manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "prontoo-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: reconcile phase 8 release contract"
          git push origin HEAD:"${HEAD_BRANCH}"
      - name: Fast unit suite
        shell: bash
        run: |
          set -euo pipefail
          php tools/test-fast
      - name: Composition root boundary
        shell: bash
        run: |
          set -euo pipefail
          php tools/composition-root-check
      - name: Operation gateway debt budget
        shell: bash
        run: |
          set -euo pipefail
          php tools/operation-gateway-budget-check
      - name: PHP syntax and deprecations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            if grep -qi 'deprecated' <<<"$output"; then
              echo "Depreciação PHP 8.4 em $file" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
      - name: Canonical JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $contracts = [];
          foreach (['version.json', 'app/update.manifest.json', 'app/architecture.manifest.json'] as $file) {
              $contracts[$file] = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($contracts[$file])) {
                  throw new RuntimeException('Contrato JSON inválido: ' . $file);
              }
          }
          $version = mb_trim((string) ($contracts['version.json']['version'] ?? ''));
          if ($version === '' ||
              mb_trim((string) ($contracts['version.json']['release'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/update.manifest.json']['version'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/update.manifest.json']['release'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/architecture.manifest.json']['version'] ?? '')) !== $version) {
              throw new RuntimeException('Contrato canônico de versão divergente');
          }
          foreach ([
              'app/prontoo.php' => 'PRONTOO_VERSION_FALLBACK',
              'br/index.php' => 'BR_LANDING_VERSION_FALLBACK',
          ] as $file => $constant) {
              $source = (string) file_get_contents($file);
              $pattern = '/const\s+' . preg_quote($constant, '/') . '\s*=\s*["\x27]([^"\x27]+)["\x27]\s*;/';
              if (!preg_match($pattern, $source, $match) || mb_trim((string) ($match[1] ?? '')) !== $version) {
                  throw new RuntimeException('Fallback de versão divergente: ' . $file);
              }
          }
          PHP
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/release-contract-reconcile --check
      - name: Documentation and comment contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/documentation-check.php
          php tools/code-comment-check.php
      - name: Security regressions
        shell: bash
        run: |
          set -euo pipefail
          php tools/security-regression-check.php
      - name: Architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          php tools/architecture-check.php
          php tools/native-unit-check
      - name: Runtime symbol contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/runtime-symbol-contract-check
      - name: SOLID structural audit
        shell: bash
        run: |
          set -euo pipefail
          php tools/solid-audit --strict
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/login-post-password-runtime-check
      - name: Maestro runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/maestro-runtime-regression-check
      - name: Critical runtime smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          php tools/critical-runtime-smoke-check
      - name: HTTP front-controller smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tools/http-runtime-smoke-check
