name: Architecture Contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory-persistence-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory persistence references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== STORAGE/PDFS/UPLOAD REFERENCES ==='
          grep -RInE --exclude-dir=.git --exclude='app/update.manifest.json' --exclude='*.map' '(storage|pdfs|move_uploaded_file|\$_FILES|image/(png|jpeg|webp|gif))' . || true
          echo '=== DIRECTORIES ==='
          find . -maxdepth 3 -type d | sort
