name: Architecture Contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-ssd-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssd-persistence-1.7.22.6
          fetch-depth: 0

      - name: Repair PHP escape and seal manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          target = Path('app/Domain/Clinic/SubscriptionSettings.php')
          source = target.read_text(encoding='utf-8')
          broken = '$proofPath = str_replace("\\", "/", $proofPath);'
          fixed = '$proofPath = str_replace("\\\\", "/", $proofPath);'
          if broken not in source:
              raise RuntimeError('Linha de escape inválida não localizada.')
          target.write_text(source.replace(broken, fixed, 1), encoding='utf-8')

          canonical = subprocess.check_output(
              ['git', 'show', 'origin/main:.github/workflows/architecture.yml'],
          ).decode('utf-8')
          canonical = canonical.replace("-path './storage' -prune", "-path './ssd' -prune")
          canonical = canonical.replace("str_contains($path, '/storage/')", "str_contains($path, '/ssd/')")
          canonical_bytes = canonical.encode('utf-8')

          manifest_path = Path('app/update.manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = dict(manifest['files'])
          total = 0
          for name in files:
              if name == '.github/workflows/architecture.yml':
                  data = canonical_bytes
              else:
                  data = Path(name).read_bytes()
              files[name] = hashlib.sha256(data).hexdigest()
              total += len(data)
          manifest['files'] = files
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = total
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=4) + '\n',
              encoding='utf-8',
          )
          PY

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -path './ssd' -prune -o -name '*.php' -type f -print0)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Clinic/SubscriptionSettings.php app/update.manifest.json
          git commit -m 'Corrige escape e sela manifesto da 1.7.22.6'
          git push origin HEAD:agent/ssd-persistence-1.7.22.6
