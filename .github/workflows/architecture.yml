name: Architecture Contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  assemble-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatch branch
        uses: actions/checkout@v4
        with:
          ref: agent/dispatch-hardening-1.7.22.5
          fetch-depth: 0

      - name: Assemble final branch from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/reapply-hardening-1.7.22.5 agent/final-hardening-1.7.22.5
          git checkout -B agent/final-hardening-1.7.22.5 origin/main
          git checkout origin/agent/reapply-hardening-1.7.22.5 -- \
            .htaccess \
            ChangeLog.txt \
            app/Core/Database/SchemaMutationLock.php \
            app/Core/Install/InstallAccess.php \
            app/Database/operational-schema.contract.json \
            app/Runtime/Runner.php \
            app/Ui/Components.php \
            app/architecture.manifest.json \
            app/prontoo.php \
            app/update.manifest.json \
            br/index.php \
            tools/install-security-check.php \
            tools/schema-check.php \
            version.json
          git rm -f -- \
            .automation/kick-hardening-1.7.22.5.txt \
            .github/workflows/bootstrap-reapply-hardening-1.7.22.5.yml \
            .github/workflows/reapply-hardening-1.7.22.5.yml
          git add -A
          git commit -m "Prontoo 1.7.22.5 — finaliza hardening pós-reinstalação"
          git push origin HEAD:agent/final-hardening-1.7.22.5
