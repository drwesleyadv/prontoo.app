name: Admin Panel Inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect admin panel contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ROLE ACTIONS ==='
          grep -RInE --include='*.php' 'function role_actions|"gerente" => \[|"painel" => \[|"appointments" => \[' app/Support app/Ui || true
          echo '=== PANEL ROUTE AND AUTHORIZATION ==='
          grep -RInE --include='*.php' 'page_gerente_painel|page_painel|painel.*view|"painel"|painel:' app/Application app/Domain app/Infrastructure app/Pages app/Runtime app/Support || true
          echo '=== MANAGER DASHBOARD CSS ==='
          grep -nE 'manager-(kpis|stat|goal|finance|actions|action|procedure|mini|dashboard)' public/assets/design-system.css || true
          echo '=== ROUTES AND PAGE DISPATCH ==='
          grep -RInE --include='*.php' 'painel.*page_painel|page_painel.*painel|"painel".*page' app/Runtime app/Support app/Application || true
