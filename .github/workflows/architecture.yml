name: Architecture Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: read

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: PHP syntax and deprecations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            if grep -qi 'deprecated' <<<"$output"; then
              echo "Depreciação PHP 8.4 em $file" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
      - name: Canonical JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $contracts = [];
          foreach (['version.json', 'app/update.manifest.json', 'app/architecture.manifest.json'] as $file) {
              $contracts[$file] = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($contracts[$file])) {
                  throw new RuntimeException('Contrato JSON inválido: ' . $file);
              }
          }
          $version = mb_trim((string) ($contracts['version.json']['version'] ?? ''));
          if ($version === '' ||
              mb_trim((string) ($contracts['version.json']['release'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/update.manifest.json']['version'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/update.manifest.json']['release'] ?? '')) !== $version ||
              mb_trim((string) ($contracts['app/architecture.manifest.json']['version'] ?? '')) !== $version) {
              throw new RuntimeException('Contrato canônico de versão divergente');
          }
          foreach ([
              'app/prontoo.php' => 'PRONTOO_VERSION_FALLBACK',
              'br/index.php' => 'BR_LANDING_VERSION_FALLBACK',
          ] as $file => $constant) {
              $source = (string) file_get_contents($file);
              $pattern = '/const\s+' . preg_quote($constant, '/') . '\s*=\s*["\x27]([^"\x27]+)["\x27]\s*;/';
              if (!preg_match($pattern, $source, $match) || mb_trim((string) ($match[1] ?? '')) !== $version) {
                  throw new RuntimeException('Fallback de versão divergente: ' . $file);
              }
          }
          PHP
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
      - name: Documentation and comment contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/documentation-check.php
          php tools/code-comment-check.php
      - name: Security regressions
        shell: bash
        run: |
          set -euo pipefail
          php tools/security-regression-check.php
      - name: Architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          php tools/architecture-check.php
          php tools/native-unit-check
      - name: SOLID structural audit
        shell: bash
        run: |
          set -euo pipefail
          php tools/solid-audit --strict
      - name: Schema contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/schema-check.php
      - name: Installer security
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Login post-password runtime regression
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $tempRoot = sys_get_temp_dir() . '/prontoo-login-runtime-' . getmypid();
          if (!is_dir($tempRoot) && !mkdir($tempRoot, 0750, true) && !is_dir($tempRoot)) {
              throw new RuntimeException('Não foi possível criar diretório temporário do teste de login.');
          }
          $configPath = $tempRoot . '/config.php';
          $config = [
              'db_host' => getenv('DB_HOST') ?: '127.0.0.1',
              'db_name' => getenv('DB_DATABASE') ?: 'prontoo_schema',
              'db_user' => getenv('DB_USERNAME') ?: 'root',
              'db_pass' => getenv('DB_PASSWORD') ?: 'root',
              'secret' => 'prontoo-login-runtime-ci-secret',
              'debug' => true,
              'app_env' => 'development',
          ];
          file_put_contents($configPath, '<?php return ' . var_export($config, true) . ';' . PHP_EOL, LOCK_EX);
          putenv('PRONTOO_CONFIG_PATH=' . $configPath);
          $dsn = sprintf('mysql:host=%s;dbname=%s;charset=utf8mb4', $config['db_host'], $config['db_name']);
          $admin = PDO::connect($dsn, $config['db_user'], $config['db_pass'], [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
              PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
          ]);
          $tables = $admin->query("SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'")->fetchAll(PDO::FETCH_COLUMN);
          $admin->exec('SET FOREIGN_KEY_CHECKS=0');
          try {
              foreach ((array) $tables as $table) {
                  $admin->exec('DROP TABLE `' . str_replace('`', '``', (string) $table) . '`');
              }
          } finally {
              $admin->exec('SET FOREIGN_KEY_CHECKS=1');
          }
          require $root . '/app/prontoo.php';
          \Prontoo\Core\Database\SchemaMutationLock::runForInstaller(static function (): void {
              install_fresh_schema();
          });
          $now = time();
          $pdo = pdo();
          $person = $pdo->prepare('INSERT INTO pi_persons (full_name,cpf,created_at) VALUES (?,?,?)');
          $person->execute(['Login Runtime CI', '52998224725', $now]);
          $personId = (int) $pdo->lastInsertId();
          $user = $pdo->prepare('INSERT INTO pi_users (person_id,name,email,password_hash,is_global_admin,active,created_at) VALUES (?,?,?,?,0,1,?)');
          $user->execute([$personId, 'Login Runtime CI', 'login-runtime-ci@example.invalid', password_hash('Prontoo-CI-2026', PASSWORD_DEFAULT), $now]);
          $userId = (int) $pdo->lastInsertId();
          $marker = prontoo_schema_boot_marker_path();
          if (is_file($marker)) {
              prontoo_fs_unlink($marker, false);
          }
          $result = prontoo_login_post_password_maintenance($userId);
          if (empty($result['ok'])) {
              throw new RuntimeException('Manutenção pós-senha não confirmou sucesso.');
          }
          if (!prontoo_schema_boot_marker_valid()) {
              throw new RuntimeException('Manutenção pós-senha não registrou marcador de runtime válido.');
          }
          echo json_encode([
              'ok' => true,
              'policy' => 'login-post-password-runtime-v1',
              'user_id' => $userId,
              'maintenance' => $result,
              'schema_marker' => basename($marker),
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), PHP_EOL;
          PHP
