name: Publish Prontoo 1.7.27.6 baseline rewrite

on:
  push:
    branches:
      - agent/release-1-7-27-6
    paths:
      - .github/workflows/release-1-7-27-6.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-1-7-27-6
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate neutral full-baseline release
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          VERSION = "1.7.27.6"
          PREVIOUS = "1.7.27.5"
          now = datetime.now(timezone.utc).replace(microsecond=0)
          timestamp = now.strftime("%Y-%m-%dT%H:%M:%SZ")
          compact = now.strftime("%Y%m%dT%H%M%SZ")
          unix = int(time.time())
          notes = (
              "Republica integralmente todos os arquivos do manifesto a partir da baseline 1.7.27.5, "
              "sem alterações funcionais, visuais, de banco, schema, segurança, permissões ou regras de negócio."
          )

          def load_json(path: str):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save_json(path: str, value):
              Path(path).write_text(
                  json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          version = load_json("version.json")
          if version.get("version") != PREVIOUS:
              raise SystemExit(f"Baseline inesperada: {version.get('version')}")
          version.update({
              "version": VERSION,
              "release": VERSION,
              "generated_at_unix": unix,
              "generated_at": timestamp,
              "updated_at": timestamp,
              "build": "1.7.27.6-baseline-full-rewrite",
              "package_type": "baseline_full_rewrite",
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": False,
              "visual_changes": False,
              "documentation_changes": True,
              "functional_equivalence_policy": "full_manifest_rewrite_preserves_1_7_27_5_runtime_behavior_security_permissions_financial_workflows_database_schema_and_assets",
              "notes": notes,
              "previous_version": PREVIOUS,
              "baseline_source": PREVIOUS,
              "full_baseline_rewrite": True,
              "rewrite_scope": "all_update_manifest_files",
              "deployment_sync_id": f"hostoo-baseline-full-rewrite-{compact}",
              "deployment_sync_requested_at": timestamp,
          })
          save_json("version.json", version)

          architecture = load_json("app/architecture.manifest.json")
          architecture.update({
              "version": VERSION,
              "generated_at": timestamp,
              "updated_at": timestamp,
              "logic_changes": False,
              "baseline_source": PREVIOUS,
              "full_baseline_rewrite": True,
          })
          save_json("app/architecture.manifest.json", architecture)

          prontoo_path = Path("app/prontoo.php")
          prontoo = prontoo_path.read_text(encoding="utf-8")
          prontoo, n1 = re.subn(
              r'const PRONTOO_VERSION_FALLBACK = "[^"]+";',
              f'const PRONTOO_VERSION_FALLBACK = "{VERSION}";',
              prontoo,
              count=1,
          )
          prontoo, n2 = re.subn(
              r'const PRONTOO_PREVIOUS_VERSION = "[^"]+";',
              f'const PRONTOO_PREVIOUS_VERSION = "{PREVIOUS}";',
              prontoo,
              count=1,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit("Constantes canônicas de versão não encontradas em app/prontoo.php")
          prontoo_path.write_text(prontoo, encoding="utf-8")

          landing_path = Path("br/index.php")
          landing = landing_path.read_text(encoding="utf-8")
          landing, n3 = re.subn(
              r'const BR_LANDING_VERSION_FALLBACK = "[^"]+";',
              f'const BR_LANDING_VERSION_FALLBACK = "{VERSION}";',
              landing,
              count=1,
          )
          if n3 != 1:
              raise SystemExit("Fallback da landing não encontrado")
          landing_path.write_text(landing, encoding="utf-8")

          changelog_path = Path("ChangeLog.txt")
          changelog = changelog_path.read_text(encoding="utf-8")
          release_note = (
              "Prontoo 1.7.27.6 — republicação integral da baseline\n\n"
              "- Regrava integralmente os arquivos descritos no manifesto de atualização a partir da baseline 1.7.27.5.\n"
              "- Não altera funcionalidades, interface, banco de dados, schema, segurança, permissões ou regras de negócio.\n"
              "- Regenera os contratos canônicos de versão e os hashes SHA-256 do pacote completo.\n"
              "- Solicita nova sincronização integral do repositório com o ambiente Hostoo.\n\n"
          )
          changelog_path.write_text(release_note + changelog, encoding="utf-8")

          manifest = load_json("app/update.manifest.json")
          files = list(manifest.get("files", {}).keys())
          if len(files) != 99:
              raise SystemExit(f"Inventário inesperado: {len(files)} arquivos")

          # Regrava cada arquivo da baseline byte a byte antes de recalcular o pacote.
          for item in files:
              path = Path(item)
              if not path.is_file():
                  raise SystemExit(f"Arquivo ausente: {item}")
              payload = path.read_bytes()
              path.write_bytes(payload)

          hashes = {}
          total_bytes = 0
          for item in files:
              payload = Path(item).read_bytes()
              hashes[item] = hashlib.sha256(payload).hexdigest()
              total_bytes += len(payload)

          manifest.update({
              "version": VERSION,
              "release": VERSION,
              "build": "1.7.27.6-baseline-full-rewrite",
              "package_type": "baseline_full_rewrite",
              "generated_at": timestamp,
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": False,
              "visual_changes": False,
              "documentation_changes": True,
              "file_count": len(files),
              "total_uncompressed_bytes": total_bytes,
              "files": hashes,
              "previous_version": PREVIOUS,
              "updated_at": timestamp,
              "notes": notes,
              "baseline_source": PREVIOUS,
              "full_baseline_rewrite": True,
              "rewrite_scope": "all_update_manifest_files",
              "deployment_sync_id": f"hostoo-baseline-full-rewrite-{compact}",
              "deployment_sync_requested_at": timestamp,
          })
          save_json("app/update.manifest.json", manifest)
          PY

          rm -f .github/workflows/release-1-7-27-6.yml

          git config user.name "Prontoo Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.6 — republicação integral da baseline"
          git push origin HEAD:agent/release-1-7-27-6
