name: Temporary Admin Telemetry Release

on:
  push:
    branches:
      - agent/admin-telemetry-two-by-two

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/admin-telemetry-two-by-two
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring

      - name: Reconcile release 1.8.13.1
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-admin-telemetry-release.yml
          php tools/release-version --write --date=2026-08-13 --timestamp=2026-08-13T08:18:00-04:00 --expected-current=1.8.12.24
          php -r '
          $p="version.json";
          $v=json_decode(file_get_contents($p),true,512,JSON_THROW_ON_ERROR);
          $v["build"]="1.8.13.1-admin-telemetry-two-by-two";
          $v["database_changes"]=false;
          $v["schema_changes"]=false;
          $v["logic_changes"]=true;
          $v["visual_changes"]=true;
          $v["documentation_changes"]=true;
          $v["functional_equivalence_policy"]="intentional_visual_change_admin_panel_and_status_telemetry_two_by_two";
          $v["notes"]="Painel do Desenvolvedor e Status passam a distribuir os quatro cards de telemetria em duas colunas e duas linhas, reutilizando a grade responsiva existente.";
          $v["changelog"]=["title"=>"KPIs do Painel e Status em grade 2×2","items"=>["distribui os quatro cards de telemetria do Painel do Desenvolvedor em duas colunas e duas linhas","aplica a mesma composição 2×2 aos quatro cards da página pública de Status","reutiliza o renderer compartilhado dos KPIs para evitar duplicação de layout","mantém cálculos, fontes e indicadores de tendência da telemetria inalterados","mantém banco e schema inalterados"]];
          $v["deployment_sync_id"]="github-prontoo-1.8.13.1-admin-telemetry-two-by-two";
          $v["deployment_sync_requested_at"]="2026-08-13T08:18:00-04:00";
          $v["rewrite_scope"]="admin_panel_and_status_telemetry_layout_only";
          file_put_contents($p,json_encode($v,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR).PHP_EOL,LOCK_EX);
          '
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate

      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -Fq '.github/workflows/tmp-admin-telemetry-release.yml'; then
            echo 'Temporary workflow leaked into final diff.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'chore(release): publish 1.8.13.1'
          git push origin HEAD:agent/admin-telemetry-two-by-two
