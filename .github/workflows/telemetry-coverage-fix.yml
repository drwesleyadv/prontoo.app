name: Telemetry Coverage Fix

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-coverage-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply coverage semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit('missing token in '+path+': '+old[:100])
              p.write_text(s.replace(old,new,1))

          ops='app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php'
          rep(ops,
              '                "value" => 0,\n                "period" => $offset > 15 ? "previous" : "current",',
              '                "value" => null,\n                "observed" => false,\n                "period" => $offset > 15 ? "previous" : "current",')
          rep(ops,
              '            if (isset($days[$key])) {\n                $days[$key]["value"] += (int) ($sample["delta_records"] ?? 0);\n            }',
              '            if (isset($days[$key])) {\n                if (empty($days[$key]["observed"])) {\n                    $days[$key]["value"] = 0;\n                    $days[$key]["observed"] = true;\n                }\n                $days[$key]["value"] += (int) ($sample["delta_records"] ?? 0);\n            }')
          rep(ops,
              '                static fn(array $row): int => (int) ($row["value"] ?? 0),',
              '                static fn(array $row): int => !empty($row["observed"]) ? (int) ($row["value"] ?? 0) : 0,')
          rep(ops,
              '                static fn(array $row): int => (int) ($row["value"] ?? 0),\n                $current,',
              '                static fn(array $row): int => !empty($row["observed"]) ? (int) ($row["value"] ?? 0) : 0,\n                $current,')

          pres='app/Presentation/AdminPages/AdminPagesPresentationOperations03.php'
          rep(pres,
              '        $responseValues = array_map(\n             fn($r) => (float) ($r["value"] ?? 0),\n            $responseSeries,\n        );',
              '        $responseValues = array_values(\n            array_map(\n                static fn(array $r): float => (float) $r["value"],\n                array_filter(\n                    $responseSeries,\n                    static fn(array $r): bool =>\n                        (!array_key_exists("observed", $r) || !empty($r["observed"])) &&\n                        isset($r["value"]) &&\n                        is_numeric($r["value"]),\n                ),\n            ),\n        );')
          rep(pres,
              '            foreach ($series as $idx => $row) {\n                $v = (float) ($row["value"] ?? 0);\n                $x = $padL + ($n <= 1 ? 0 : $idx * ($plotW / ($n - 1)));',
              '            foreach ($series as $idx => $row) {\n                if (\n                    (array_key_exists("observed", $row) && empty($row["observed"])) ||\n                    !isset($row["value"]) ||\n                    !is_numeric($row["value"])\n                ) {\n                    continue;\n                }\n                $v = (float) $row["value"];\n                $x = $padL + ($n <= 1 ? 0 : $idx * ($plotW / ($n - 1)));')

          admin='app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php'
          rep(admin,
              '        $records = \\Prontoo\\Runtime\\AdminPages\\AdminPagesRuntimeOperations02::admin_global_sequence_series_20d();\n        return',
              '        $records = \\Prontoo\\Runtime\\AdminPages\\AdminPagesRuntimeOperations02::admin_global_sequence_series_20d();\n        $recordObservedDays = count(\n            array_filter(\n                $records,\n                static fn(array $row): bool => !empty($row["observed"]),\n            ),\n        );\n        $recordCoverageNote = $recordObservedDays >= 30\n            ? "dados de Visualizações e Registros dos últimos 30 dias completos, em dias civis de America/Cuiaba."\n            : "Visualizações cobrem os últimos 30 dias completos. Registros têm " .\n                $recordObservedDays .\n                " dia(s) completo(s) observado(s) desde o início da nova coleta; dias sem amostra não são tratados como zero.";\n        return')
          rep(admin,
              '                    "summary_lead" => "dados de Visualizações e Registros dos últimos 30 dias completos, em dias civis de America/Cuiaba.",',
              '                    "summary_lead" => $recordCoverageNote,')

          test='tools/database-record-telemetry-contract-check'
          rep(test,
              '$series = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations03::telemetry_database_record_series_from_samples($samples, $now);',
              '$emptySeries = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations03::telemetry_database_record_series_from_samples([], $now);\n$assert(count($emptySeries) === 30, "série vazia ainda deve preservar as 30 fronteiras civis");\n$assert(count(array_filter($emptySeries, static fn(array $row): bool => !empty($row["observed"]))) === 0, "dias sem amostra não podem ser tratados como zero observado");\n$series = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations03::telemetry_database_record_series_from_samples($samples, $now);')
          rep(test,
              '$assert((int) ($series[29][\'value\'] ?? 0) === -7, "deltas negativos devem ser preservados");',
              '$assert(count(array_filter($series, static fn(array $row): bool => !empty($row["observed"]))) === 30, "dias com amostra devem ser marcados como observados");\n$assert((int) ($series[29][\'value\'] ?? 0) === -7, "deltas negativos devem ser preservados");')
          PY
          for file in app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php app/Presentation/AdminPages/AdminPagesPresentationOperations03.php app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php; do php -l "$file" >/dev/null; done
          php tools/database-record-telemetry-contract-check
          php tools/page-load-telemetry-contract-check
          git diff --check
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add app tools
          git commit -m 'fix(telemetry): distinguish missing record history from zero'
          echo READY_FOR_CLEANUP
          sleep 60
          git fetch origin +refs/heads/agent/telemetry-audit-live:refs/remotes/origin/agent/telemetry-audit-live
          git rebase origin/agent/telemetry-audit-live
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          git diff --check
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/telemetry-audit-live
