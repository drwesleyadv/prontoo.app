name: Reconcile Maintenance Release

on:
  push:
    branches:
      - agent/maintenance-security-refactor-touch

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Reconcile candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-maintenance-release.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              .github/workflows/*) continue ;;
            esac
            git add -- "$path"
          done < <(git diff --name-only)
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): reconcile 1.8.11.2 candidate hashes'
            git push origin HEAD:agent/maintenance-security-refactor-touch
          fi
