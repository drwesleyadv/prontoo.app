name: Align Telemetry Characterization

on:
  push:
    branches:
      - agent/fix-performance-architecture-contract

permissions:
  contents: write

concurrency:
  group: agent-align-telemetry-characterization
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-performance-architecture-contract
          fetch-depth: 0
      - name: Align characterization to retention policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/architecture-check.php')
          text = path.read_text(encoding='utf-8')
          old = '20 * 86400 * 1000000'
          new = '31 * 86400 * 1000000'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected exactly one retention characterization token, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/agent-align-telemetry-characterization.yml
          git config user.name "Prontoo Release"
          git config user.email "release@prontoo.app"
          git add -A
          git commit -m "Arquitetura: alinhar caracterização à retenção vigente"
          git push origin HEAD:agent/fix-performance-architecture-contract
