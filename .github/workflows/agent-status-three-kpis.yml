name: Apply status three KPIs

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-three-kpis' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply indicators
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          import re

          admin = Path('app/Admin/AdminPages.php')
          text = admin.read_text(encoding='utf-8')
          start = text.index('function page_status(): void')
          end = text.index('function page_admin_operations(): void', start)
          section = text[start:end]
          pattern = re.compile(
              r'    \$summary = function_exists\("telemetry_route_performance_summary"\).*?'
              r'    \$card = \$landingCard \. admin_performance_card_html\(true\);\n',
              re.S,
          )
          replacement = '''    $summary = function_exists("telemetry_route_performance_summary")
              ? telemetry_route_performance_summary(24)
              : ["total" => 0, "avg_ms" => 0.0, "routes" => []];
          $requests24h = max(0, (int) ($summary["total"] ?? 0));
          $averageResponseMs = max(0.0, (float) ($summary["avg_ms"] ?? 0.0));
          $landingRequests24h = 0;
          foreach ((array) ($summary["routes"] ?? []) as $routePerformance) {
              if ((string) ($routePerformance["route"] ?? "") !== "landing") {
                  continue;
              }
              $landingRequests24h = max(
                  0,
                  (int) ($routePerformance["count"] ?? 0),
              );
              break;
          }
          $overviewCards = card(
              '<div class="stats-grid admin-overview-kpis status-three-kpis">' .
                  stat_card(
                      "Requisições",
                      $requests24h,
                      "sync_alt",
                      "requisições nas últimas 24 horas",
                  ) .
                  stat_card(
                      "Tempo Médio",
                      number_format($averageResponseMs, 1, ",", ".") . " ms",
                      "speed",
                      "tempo médio nas últimas 24 horas",
                  ) .
                  stat_card(
                      "Carregamentos da landing page",
                      $landingRequests24h,
                      "web",
                      "carregamentos nas últimas 24 horas",
                  ) .
                  "</div>",
              "status-overview-kpis-card",
          );
          $card = $overviewCards . admin_performance_card_html(true);
          '''
          section, count = pattern.subn(replacement, section, count=1)
          if count != 1:
              raise SystemExit('Bloco atual de indicadores da tela status não localizado.')
          text = text[:start] + section + text[end:]
          admin.write_text(text, encoding='utf-8')

          css = Path('public/assets/design-system.css')
          css_text = css.read_text(encoding='utf-8')
          rule = '\nbody.status-public .status-three-kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important;width:100%!important;}\nbody.status-public .status-three-kpis>.stat-card{min-width:0!important;}\n'
          if 'body.status-public .status-three-kpis{' not in css_text:
              css_text += rule
          css.write_text(css_text, encoding='utf-8')

          marker = Path('ssd/.status-three-kpis')
          if marker.exists():
              marker.unlink()
          PY
          php -l app/Admin/AdminPages.php
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Admin/AdminPages.php public/assets/design-system.css app/update.manifest.json ssd/.status-three-kpis
          git commit -m "Exibir três indicadores na mesma linha da tela status"
          git push origin HEAD:"$HEAD_BRANCH"
