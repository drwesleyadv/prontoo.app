name: Phase 11 Apply

on:
  push:
    branches:
      - agent/architecture-phase-11-dependency-closure
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-phase-11-dependency-closure
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring,pdo_mysql
      - name: Apply typed dependency closure
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/re.subn(pattern, repl, s, count=count, flags=flags)/re.subn(pattern, lambda m: repl, s, count=count, flags=flags)/' tools/phase11-apply.py
          sed -i 's/re\.sub(/literal_sub(/g' tools/phase11-apply.py
          sed -i '3i\def literal_sub(pattern, repl, string, count=0, flags=0):\n    return re.sub(pattern, lambda m: repl, string, count=count, flags=flags)\n' tools/phase11-apply.py
          sed -i "s/if not file.is_file() or file == Path(__file__):/if not file.is_file() or file == Path(__file__) or file.relative_to(ROOT).as_posix() == 'tools\/operation-gateway-budget-check':/" tools/phase11-apply.py
          python3 tools/phase11-apply.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          root = Path('.')
          names = subprocess.check_output(['git','diff','--name-only','--','*.php']).decode().splitlines()
          for name in names:
              p = root / name
              if not p.is_file():
                  continue
              s = p.read_text()
              s = s.replace('Prontoo\\\\', 'Prontoo\\')
              for token in ['Prontoo', 'PDO', 'PDOStatement', 'Throwable', 'RuntimeException']:
                  s = s.replace('\\\\' + token, '\\' + token)
              s = s.replace("'/\\\\\\\\s+/'", "'/\\\\s+/'")
              p.write_text(s)
          inspector = root / 'app/Infrastructure/Database/TenantIntegrityInspector.php'
          s = inspector.read_text().replace('strtolower(trim((string)', 'strtolower(mb_trim((string)')
          inspector.write_text(s)
          architecture_check = root / 'tools/architecture-check.php'
          s = architecture_check.read_text().replace(
              "'new PdoPatientRevenueReceiptRepository()'",
              "'new PdoPatientRevenueReceiptRepository(new PatientRevenueSettlementAdapter())'",
          )
          architecture_check.write_text(s)
          version_path = root / 'version.json'
          version = json.loads(version_path.read_text())
          migrations = version.setdefault('php84_baseline_path_migrations', {})
          migrations['app/Core/Database/SchemaHardening.php'] = 'app/Infrastructure/DatabaseSchema/DatabaseSchemaInfrastructureOperations01.php'
          migrations['app/Core/Database/TenantIntegrity.php'] = 'app/Infrastructure/Database/TenantIntegrityInspector.php'
          source_migrations = version.setdefault('architecture_source_path_migrations', {})
          source_migrations['app/Core/Database/SchemaHardening.php'] = 'app/Infrastructure/DatabaseSchema/DatabaseSchemaInfrastructureOperations01.php'
          source_migrations['app/Core/Database/TenantIntegrity.php'] = 'app/Infrastructure/Database/TenantIntegrityInspector.php'
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n')
          PY
          git rm -f tools/phase11-apply.py .github/workflows/phase11-apply.yml
          php tools/release-contract-reconcile --write
          git add -A
          php tools/quality-gate --fast
          php tools/quality-gate
          if git grep -nE 'OperationGateway::|OperationRegistry::' -- '*.php' 'tools/*' 'cron/*' ':!docs/*' ':!tools/operation-gateway-budget-check'; then
            echo 'Generic operation gateway reference remains.' >&2
            exit 1
          fi
      - name: Commit phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Engenharia 11/15 — encerrar service locator e tipar dependências'
          git push origin HEAD:agent/architecture-phase-11-dependency-closure
