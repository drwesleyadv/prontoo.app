name: Phase 11 Apply

on:
  push:
    branches:
      - agent/architecture-phase-11-dependency-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-phase-11-dependency-closure
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring,pdo_mysql
      - name: Apply typed dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/phase11-apply.py
          git rm tools/phase11-apply.py .github/workflows/phase11-apply.yml
          php tools/release-contract-reconcile --write
          php tools/quality-gate --fast
          php tools/quality-gate
          if git grep -nE 'OperationGateway::|OperationRegistry::' -- '*.php' 'tools/*' 'cron/*' ':!docs/*'; then
            echo 'Generic operation gateway reference remains.' >&2
            exit 1
          fi
      - name: Commit phase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Engenharia 11/15 — encerrar service locator e tipar dependências'
          git push origin HEAD:agent/architecture-phase-11-dependency-closure
