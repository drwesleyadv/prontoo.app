name: Consolidation Native Fixtures Temporary

on:
  pull_request:
    branches: [prontoo]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/consolidation-audit-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/consolidation-audit-20260809
          git checkout -B agent/consolidation-audit-20260809 origin/agent/consolidation-audit-20260809
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Migrate fixtures and reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacement = r'\Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations03::install_fresh_schema();'
          for name in [
              'tools/login-post-password-runtime-check',
              'tools/maestro-runtime-regression-check',
              'tools/critical-runtime-smoke-check',
          ]:
              p = Path(name)
              s = p.read_text()
              if 'install_fresh_schema();' in s:
                  s = s.replace('install_fresh_schema();', replacement)
                  p.write_text(s)
          PY
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Consolidar fixtures de runtime em schema nativo'
          git push origin HEAD:agent/consolidation-audit-20260809
