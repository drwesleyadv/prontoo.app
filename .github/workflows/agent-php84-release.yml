name: Agent PHP 8.4 Exclusive Release

on:
  push:
    branches:
      - agent/php84-exclusive-runtime-1-8-5-2
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'
  RELEASE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[php84-generated]') && !contains(github.event.pull_request.title || '', '[php84-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_HEAD_BRANCH }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Generate release
        run: python3 .agent-php84-inline-fix.py
      - name: Assert current runtime family
        shell: bash
        run: |
          set -euo pipefail
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 4 ? 0 : 1);'
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
      - name: Runtime and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/php84-runtime-contract-check
          php tools/version-asset-contract-check.php
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-agent"
          git config user.email "prontoo-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publicar 1.8.5.2 com runtime exclusivo PHP 8.4 [php84-generated]"
          git push origin HEAD:${RELEASE_HEAD_BRANCH}
