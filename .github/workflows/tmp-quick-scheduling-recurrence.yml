name: Temporary quick scheduling recurrence

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-1-9-15-1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register application test contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/application.test-contract.json')
          data = json.loads(path.read_text())
          target = next((case for case in data['cases'] if case.get('id') == 'operational.appointment.commands'), None)
          if target is None:
              raise SystemExit('Contrato operational.appointment.commands não encontrado.')
          for entry in ['removeBlock', 'createAppointmentBatch']:
              if entry not in target['entry_points']:
                  target['entry_points'].append(entry)
          for assertion in [
              'application.appointment_commands.remove_block',
              'application.appointment_commands.batch_ids',
              'application.appointment_commands.batch_financial_sync',
          ]:
              if assertion not in target['assertions']:
                  target['assertions'].append(assertion)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Prepare canonical responsive selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/tmp-quick-scheduling-recurrence').read_text()
          old = '@media(max-width:720px){.agenda-recurrence-row{grid-template-columns:1fr}.agenda-recurrence-remove{justify-self:start}}'
          new = '@media(max-width:720px){.agenda-quick-recurrence .agenda-recurrence-row{grid-template-columns:1fr}.agenda-quick-recurrence .agenda-recurrence-remove{justify-self:start}}'
          if old not in source:
              raise SystemExit('Trecho responsivo da recorrência não encontrado.')
          Path('/tmp/tmp-quick-scheduling-recurrence').write_text(source.replace(old, new, 1))
          PY
      - name: Apply recurrence feature
        run: bash /tmp/tmp-quick-scheduling-recurrence
