name: Agent DTCG Manifest Fix

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Remove transient workflow before manifest generation
        run: rm -f .github/workflows/agent-dtcg-manifest-fix.yml
      - name: Reconcile exact final tree
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
      - name: Commit reconciled manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcilia manifesto final da release 1.8.18.5'
          git push origin HEAD:agent/dtcg-design-tokens
