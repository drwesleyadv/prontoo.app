name: Agent CSS Documentation Reconcile

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/remove-legacy-css-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/remove-legacy-css-architecture
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-css-doc-reconcile.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/documentation-check.php
          php tools/superseded-reference-contract-check
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          test ! -d app/Presentation/Styles
          test ! -f design/tokens/css-bridge.json
          git add -A
      - name: Commit reconciled documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcilia documentação da arquitetura de design 1.8.18.6'
          git push origin HEAD:agent/remove-legacy-css-architecture
