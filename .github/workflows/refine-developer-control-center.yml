name: Refine Developer Control Center

on:
  push:
    branches:
      - agent/developer-control-center-audit

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_BASE_REF: prontoo
      CI: 'true'
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Apply refinement
        run: python3 tools/refine-developer-control-center.py
      - name: Remove temporary runner
        run: rm -f tools/refine-developer-control-center.py .github/workflows/refine-developer-control-center.yml
      - name: Reconcile release contract
        run: |
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
      - name: Lint changed PHP
        run: |
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations01.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations04.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations06.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations08.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations09.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations01.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l tools/telemetry-json-source-contract-check
      - name: Engineering quality gate
        run: php tools/quality-gate
      - name: Commit clean tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: simplify developer control center'
          git push
