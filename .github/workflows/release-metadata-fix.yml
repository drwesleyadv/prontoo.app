name: Sync Release Metadata

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize manifest timestamp
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("app/update.manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["updated_at"] = "2026-07-24T12:32:45Z"
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          php -r 'json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);'
          git diff --check

      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/update.manifest.json
          git commit -m "release: sincronizar data da 1.7.24.1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
