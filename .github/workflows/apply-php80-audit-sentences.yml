name: Apply PHP 8.0 Audit Sentences

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/php80-modernization-followup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - name: Replace consecutive ternary sentences
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Domain/Audit/AuditActivity.php')
          text = path.read_text(encoding='utf-8')
          anchor = '''    if ($windowLabel === "") {
              $windowLabel = "do sistema";
          }
              return match ($event) {
          '''
          replacement = '''    if ($windowLabel === "") {
              $windowLabel = "do sistema";
          }
          $environmentLabel = activity_environment_label($ctx);
          $entrySentence = $who . " entrou no sistema";
          $automaticEntrySentence = $who . " entrou pelo dispositivo reconhecido";
          $exitSentence = $who . " saiu do sistema";
          if ($environmentLabel !== "") {
              $entrySentence = $who . " entrou no ambiente " . $environmentLabel;
              $automaticEntrySentence =
                  $who .
                  " entrou no ambiente " .
                  $environmentLabel .
                  " pelo dispositivo reconhecido";
              $exitSentence = $who . " saiu do ambiente " . $environmentLabel;
          }
          return match ($event) {
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'Âncora esperada uma vez; encontrada {text.count(anchor)}.')
          text = text.replace(anchor, replacement, 1)
          old = '''        "entrada_realizada" => ($env = activity_environment_label($ctx)) !== ""
                      ? $who . " entrou no ambiente " . $env
                      : $who . " entrou no sistema",
                  "entrada_automatica_dispositivo" => ($env = activity_environment_label(
                      $ctx,
                  )) !== ""
                      ? $who .
                          " entrou no ambiente " .
                          $env .
                          " pelo dispositivo reconhecido"
                      : $who . " entrou pelo dispositivo reconhecido",
                  "saida_realizada" => ($env = activity_environment_label($ctx)) !== ""
                      ? $who . " saiu do ambiente " . $env
                      : $who . " saiu do sistema",
          '''
          new = '''        "entrada_realizada" => $entrySentence,
                  "entrada_automatica_dispositivo" => $automaticEntrySentence,
                  "saida_realizada" => $exitSentence,
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Bloco de frases esperado uma vez; encontrado {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          php -l app/Domain/Audit/AuditActivity.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Domain/Audit/AuditActivity.php
          git commit -m "Eliminar ternários consecutivos da auditoria"
          git push origin HEAD:"$HEAD_BRANCH"
