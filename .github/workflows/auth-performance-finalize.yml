name: Auth Performance Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/auth-performance-20260724'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-performance-20260724
          fetch-depth: 0
          show-progress: false

      - name: Finalize authentication performance changes
        shell: bash
        run: |
          set +e
          python3 tools/finalize-auth-performance.py > /tmp/auth-finalize.out 2> /tmp/auth-finalize.err
          status=$?
          cat /tmp/auth-finalize.out
          cat /tmp/auth-finalize.err >&2
          if [ "$status" -ne 0 ]; then
            {
              echo "status=$status"
              echo "--- stdout ---"
              cat /tmp/auth-finalize.out
              echo "--- stderr ---"
              cat /tmp/auth-finalize.err
            } > tools/auth-finalize-error.txt
          fi
          exit "$status"

      - name: Publish diagnostic on failure
        if: failure() && hashFiles('tools/auth-finalize-error.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/auth-finalize-error.txt
          git commit -m "Registrar diagnóstico final da autenticação" || exit 0
          git push origin HEAD:agent/auth-performance-20260724

      - name: Validate generated sources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Auth/AuthOnboarding.php >/dev/null
          php -l app/Support/SecurityAccess.php >/dev/null
          php -l app/Runtime/Runner.php >/dev/null
          php -l tools/architecture-check.php >/dev/null
          python3 -m json.tool version.json >/dev/null
          python3 -m json.tool app/update.manifest.json >/dev/null
          python3 -m json.tool app/architecture.manifest.json >/dev/null

      - name: Publish target branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nenhuma alteração produzida" >&2; exit 1; }
          git commit -m "Refinar segurança e consistência do caminho de autenticação"
          git push origin HEAD:agent/auth-performance-20260724
