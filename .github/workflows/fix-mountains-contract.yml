name: Fix telemetry mountains contract

on:
  push:
    branches:
      - agent/login-telemetry-mountains-20260804
    paths:
      - tools/fix-mountains-contract-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/login-telemetry-mountains-20260804
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, hashlib
          p = Path('tools/architecture-check.php')
          s = p.read_text()
          old = "        'body:not(.public) .login-telemetry-wave{z-index:0}',"
          new = "        'body:not(.public) .login-telemetry-wave{',\n        'z-index:0;',"
          if old not in s:
              raise SystemExit('contract token not found')
          p.write_text(s.replace(old, new, 1))
          manifest_path = Path('app/update.manifest.json')
          manifest = json.loads(manifest_path.read_text())
          total = 0
          for rel in manifest['files']:
              data = Path(rel).read_bytes()
              manifest['files'][rel] = hashlib.sha256(data).hexdigest()
              total += len(data)
          manifest['total_uncompressed_bytes'] = total
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/architecture-check.php app/update.manifest.json
          git commit -m "Ajustar contrato das montanhas"
          git push
