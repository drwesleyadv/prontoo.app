name: Temp Sync Release 1.9.15.2

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-ux-1-9-15-2

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/quick-scheduling-recurrence-ux-1-9-15-2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Sync release references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          version_path = Path('version.json')
          version = json.loads(version_path.read_text())
          version['asset_version'] = '1.9.15.2'
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n')

          for path in [Path('app/presentation.visual-contract.json'), Path('docs/index.md')]:
              text = path.read_text()
              if '1.9.15.1' not in text:
                  raise SystemExit(f'expected old release literal not found in {path}')
              path.write_text(text.replace('1.9.15.1', '1.9.15.2'))
          PY
          git mv public/assets/app-icon-1.9.15.1.png public/assets/app-icon-1.9.15.2.png
          git mv public/assets/favicon-1.9.15.1.ico public/assets/favicon-1.9.15.2.ico
          git mv public/assets/favicon-1.9.15.1.png public/assets/favicon-1.9.15.2.png
          git mv public/assets/pix-1.9.15.1.svg public/assets/pix-1.9.15.2.svg
          git mv public/assets/prontoo-mark-1.9.15.1.png public/assets/prontoo-mark-1.9.15.2.png
          git rm .github/workflows/zz-temp-sync-release-1-9-15-2.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/presentation-visual-contract-check
          php tools/quality-gate --fast
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sincroniza referências da release 1.9.15.2"
          git push origin HEAD:feature/quick-scheduling-recurrence-ux-1-9-15-2
