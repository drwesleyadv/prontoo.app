name: Prepare 1.7.20.5

on:
  push:
    branches:
      - agent/hotfix-1.7.20.5-runtime-architecture-profile

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotfix-1.7.20.5-runtime-architecture-profile
          fetch-depth: 0
      - name: Synchronize release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          version = '1.7.20.5'
          previous = '1.7.20.4'
          now = datetime.now(timezone.utc).replace(microsecond=0)
          iso = now.isoformat().replace('+00:00', 'Z')

          p = Path('app/prontoo.php')
          text = p.read_text()
          text = text.replace('const PRONTOO_VERSION_FALLBACK = "1.7.20.4";', 'const PRONTOO_VERSION_FALLBACK = "1.7.20.5";')
          text = text.replace('const PRONTOO_PREVIOUS_VERSION = "1.7.20.3";', 'const PRONTOO_PREVIOUS_VERSION = "1.7.20.4";')
          p.write_text(text)

          p = Path('br/index.php')
          text = p.read_text().replace('const BR_LANDING_VERSION_FALLBACK = "1.7.20.4";', 'const BR_LANDING_VERSION_FALLBACK = "1.7.20.5";')
          p.write_text(text)

          version_file = Path('version.json')
          data = json.loads(version_file.read_text())
          data.update({
              'version': version,
              'release': version,
              'generated_at_unix': int(now.timestamp()),
              'generated_at': iso,
              'updated_at': iso,
              'build': '1.7.20.5-runtime-architecture-profile-hotfix',
              'package_type': 'runtime_architecture_profile_hotfix',
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': False,
              'functional_equivalence_policy': 'environment_php_files_are_excluded_from_repository_architecture_inventory_and_repository_migration_metrics_do_not_block_runtime_boot',
              'architecture_policy': 'php-layered-invariants-v2',
              'notes': 'Corrige a contagem arquitetural no ambiente real sem elevar o teto de migração e separa métricas de repositório das invariantes fatais do runtime.'
          })
          version_file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          architecture_file = Path('app/architecture.manifest.json')
          architecture = json.loads(architecture_file.read_text())
          architecture['version'] = version
          architecture['runtime_profile_policy'] = 'environment_php_excluded_and_repository_migration_metrics_non_fatal_at_boot'
          architecture_file.write_text(json.dumps(architecture, ensure_ascii=False, indent=2) + '\n')

          files = [
              'HOTFIX-1.7.20.5.md',
              'app/Core/Architecture/LayerMap.php',
              'app/Core/Install/RuntimeContract.php',
              'app/architecture.manifest.json',
              'app/prontoo.php',
              'br/index.php',
              'version.json',
          ]
          hashes = {}
          total = 0
          for name in files:
              raw = Path(name).read_bytes()
              hashes[name] = hashlib.sha256(raw).hexdigest()
              total += len(raw)
          manifest = {
              'version': version,
              'release': version,
              'schema_revision': data.get('schema_revision', ''),
              'build': data['build'],
              'package_type': 'runtime_architecture_profile_hotfix_incremental',
              'generated_at': iso,
              'version_format': '1.month.day.sequence',
              'minimum_php': data.get('minimum_php', '8.4.0'),
              'minimum_mysql': data.get('minimum_mysql', '8.0.30'),
              'database_changes': False,
              'schema_changes': False,
              'hash_algorithm': 'sha256',
              'signature_policy': 'hostoo_github_repository_sync',
              'architecture_policy': 'php-layered-invariants-v2',
              'architecture_classification_coverage_target_percent': 100,
              'architecture_native_files_min': 11,
              'architecture_transitional_files_max': 79,
              'file_count': len(files),
              'total_uncompressed_bytes': total,
              'files': hashes,
              'removed_files': [
                  'app/Core/Invariant/ActionCapabilityCatalog.php',
                  'app/Core/Invariant/CapabilityInvariant.php'
              ]
          }
          Path('app/update.manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit synchronized release
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/prontoo.php br/index.php version.json app/architecture.manifest.json app/update.manifest.json
          git commit -m 'Sincroniza versão canônica 1.7.20.5'
          git push origin HEAD:agent/hotfix-1.7.20.5-runtime-architecture-profile
