name: Refactor observability runtime

on:
  push:
    branches:
      - agent/developer-control-center

permissions:
  contents: write

env:
  GITHUB_BASE_REF: prontoo

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-control-center
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Extract observability presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp-extract-observability-presentation.py
      - name: Remove temporary files
        shell: bash
        run: |
          rm -f tools/tmp-extract-observability-presentation.py
          rm -f .github/workflows/refactor-observability-runtime.yml
      - name: Validate and reconcile
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations09.php >/dev/null
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php >/dev/null
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate
      - name: Commit clean extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract observability presentation"
          git push origin HEAD:agent/developer-control-center
