name: Agent DTCG Asset Finalize

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  finalize-assets:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Publish current-state versioned assets
        shell: bash
        run: |
          set -euo pipefail
          old='1.8.18.4'
          new='1.8.18.5'
          for stem in app-icon prontoo-mark favicon; do
            if [ "$stem" = favicon ]; then
              for ext in png ico; do
                cp "public/assets/${stem}-${old}.${ext}" "public/assets/${stem}-${new}.${ext}"
                rm "public/assets/${stem}-${old}.${ext}"
              done
            else
              cp "public/assets/${stem}-${old}.png" "public/assets/${stem}-${new}.png"
              rm "public/assets/${stem}-${old}.png"
            fi
          done
          cp "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"
          rm "public/assets/pix-${old}.svg"
          while IFS= read -r -d '' file; do
            sed -i "s/${old//./\\.}/${new}/g" "$file"
          done < <(git grep -Il -z "$old" -- . || true)
      - name: Reconcile presentation source integrity after same-length asset revision
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path('app/Presentation/Styles/styles.manifest.json')
          manifest = json.loads(manifest_path.read_text())
          root = Path('app/Presentation/Styles')
          sources = {}
          for source in manifest.get('sources', []):
              rel = source['path']
              data = (root / rel).read_bytes()
              text = data.decode('utf-8')
              sources[rel] = data
              source['sha256'] = hashlib.sha256(data).hexdigest()
              source['bytes'] = len(data)
              source['important_count'] = text.count('!important')
              source['route_scope_count'] = text.count('body[data-route=')
          built = bytearray()
          covered = {rel: 0 for rel in sources}
          for expected_order, segment in enumerate(manifest.get('sequence', []), start=1):
              if int(segment.get('order', 0)) != expected_order:
                  raise SystemExit('sequence order drift')
              rel = segment['source']
              offset = int(segment['offset'])
              length = int(segment['bytes'])
              if offset != covered[rel]:
                  raise SystemExit(f'sequence coverage drift {rel}')
              piece = sources[rel][offset:offset + length]
              if len(piece) != length:
                  raise SystemExit(f'sequence length drift {rel}:{expected_order}')
              segment['sha256'] = hashlib.sha256(piece).hexdigest()
              text = piece.decode('utf-8')
              segment['important_count'] = text.count('!important')
              segment['route_scope_count'] = text.count('body[data-route=')
              built.extend(piece)
              covered[rel] += length
          for rel, data in sources.items():
              if covered[rel] != len(data):
                  raise SystemExit(f'uncovered bytes {rel}')
          manifest.setdefault('artifact_contract', {})['sha256'] = hashlib.sha256(built).hexdigest()
          manifest['artifact_contract']['bytes'] = len(built)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n')
          PY
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
      - name: Refresh visual delivery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('app/presentation.visual-contract.json')
          data = json.loads(p.read_text())
          css = Path('public/assets/presentation.css').read_bytes()
          data['version'] = '1.8.18.5'
          data.setdefault('delivery', {})['current_sha256'] = hashlib.sha256(css).hexdigest()
          data['delivery']['current_bytes'] = len(css)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Reconcile exact final release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-dtcg-asset-finalize.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/presentation-visual-contract-check
          node tools/design-tokens-build.mjs --check
          if git grep -n '1\.8\.18\.4' -- . ':!design/tokens/css-bridge.json'; then
            echo 'superseded 1.8.18.4 reference remains' >&2
            exit 1
          fi
          for path in \
            public/assets/app-icon-1.8.18.5.png \
            public/assets/prontoo-mark-1.8.18.5.png \
            public/assets/favicon-1.8.18.5.png \
            public/assets/favicon-1.8.18.5.ico \
            public/assets/pix-1.8.18.5.svg; do
            test -f "$path"
          done
      - name: Commit canonical release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica assets canônicos da release 1.8.18.5'
          git push origin HEAD:agent/dtcg-design-tokens
