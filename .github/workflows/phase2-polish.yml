name: Phase 2 Polish

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Polish facade
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Auth/AuthOnboarding.php')
          source = path.read_text()
          old = '    return prontoo_onboarding_tip_render($tip, $key, $return, csrf_field());}\n'
          new = '    return prontoo_onboarding_tip_render($tip, $key, $return, csrf_field());\n}\n'
          if source.count(old) != 1:
              raise SystemExit('Fachada de onboarding divergente')
          path.write_text(source.replace(old, new))
          PY
      - name: Validate final state
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Auth/AuthOnboarding.php
          git diff --cached --quiet && exit 0
          git commit -m "Polir fachada de onboarding"
          git push origin HEAD:${GITHUB_HEAD_REF}
