name: Agent CSS Architecture Finalize

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/remove-legacy-css-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/remove-legacy-css-architecture
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned design toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Materialize independent architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agent-css-architecture-migrate.py
          node tools/design-tokens-build.mjs --write
          php tools/presentation-css-build --write
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('app/presentation.visual-contract.json')
          data = json.loads(path.read_text())
          css = Path('public/assets/presentation.css').read_bytes()
          data['version'] = '1.8.18.6'
          data.setdefault('delivery', {})['current_sha256'] = hashlib.sha256(css).hexdigest()
          data['delivery']['current_bytes'] = len(css)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Prove observable equivalence before publication
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          node tools/design-tokens-build.mjs --check
          node tools/design-tokens-contract.mjs
          node tools/presentation-ux-contract.mjs --check
          php tools/presentation-visual-contract-check
      - name: Reconcile exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-css-architecture-finalize.yml
          rm -f tools/agent-css-architecture-migrate.py
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/documentation-check.php
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          node tools/design-tokens-build.mjs --check
          node tools/design-tokens-contract.mjs
          node tools/presentation-ux-contract.mjs --check
          php tools/presentation-visual-contract-check
          php tools/quality-gate --fast
          test ! -d app/Presentation/Styles
          test ! -f design/tokens/css-bridge.json
          test -f design/tokens/runtime.tokens.json
          test -f design/generated/tokens.css
          test -f design/styles/application.css
          ! grep -q '"base64"[[:space:]]*:' design/tokens/runtime.tokens.json
          git add -A
          test -z "$(git ls-files 'app/Presentation/Styles/**')"
          test -z "$(git ls-files 'design/tokens/css-bridge.json')"
          for path in \
            public/assets/app-icon-1.8.18.6.png \
            public/assets/prontoo-mark-1.8.18.6.png \
            public/assets/favicon-1.8.18.6.png \
            public/assets/favicon-1.8.18.6.ico \
            public/assets/pix-1.8.18.6.svg; do
            test -f "$path"
          done
      - name: Commit canonical design architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove arquitetura CSS anterior e publica Design System independente'
          git push origin HEAD:agent/remove-legacy-css-architecture
