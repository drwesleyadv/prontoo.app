name: Temp Quick Recurrence UX 1.9.15.2

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-ux-1-9-15-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/quick-scheduling-recurrence-ux-1-9-15-2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/zz-temp-quick-recurrence-ux.py
          php tools/release-version --write --date=2026-09-15 --timestamp=2026-09-15T09:16:00-04:00 --expected-current=1.9.15.1 --metadata-file=/tmp/prontoo-release.json
          php tools/release-contract-reconcile --write
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          node --check public/assets/app.js
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/test-fast
          php tools/runtime-refactor-on-touch-check --base-ref=origin/prontoo
          php tools/presentation-visual-contract-check
          php tools/quality-gate --fast
          git diff --check
          git rm .github/workflows/zz-temp-quick-recurrence-ux-1-9-15-2.yml tools/zz-temp-quick-recurrence-ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplifica recorrência e Agendamento Rápido"
          git push origin HEAD:feature/quick-scheduling-recurrence-ux-1-9-15-2
