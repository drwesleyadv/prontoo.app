name: Presentation Priority Batch Cleanup
on:
  push:
    branches:
      - agent/presentation-priority-batch-1
    paths:
      - .github/workflows/presentation-priority-batch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Precompute final state without temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/presentation-priority-batch-materialize.yml \
            .github/workflows/presentation-priority-batch-reconcile.yml \
            .github/workflows/presentation-priority-batch-finalize.yml \
            .github/workflows/presentation-priority-batch-publish.yml \
            .github/workflows/presentation-priority-batch-cleanup.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
      - name: Validate final ordinary state
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          php tools/release-version
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          php tools/presentation-ux-baseline-check
          php tools/quality-gate
          ! grep -Fq 'Janela móvel de 30 dias · 15 dias recentes comparados aos 15 imediatamente anteriores' app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          grep -Fq 'class="pagehead-version">Versão: ' app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          test "$(php -r '$v=json_decode(file_get_contents("version.json"),true); echo $v["version"] ?? "";')" = '1.8.12.16'
      - name: Validate final Chromium UX contract
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium
          node tools/presentation-ux-contract.mjs --check
      - name: Publish final ordinary manifest state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          cat > /tmp/publish-cleanup.mjs <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedHead = process.env.GITHUB_SHA;
          const branch = 'agent/presentation-priority-batch-1';
          if (!token || !repository || !expectedHead) throw new Error('GitHub publication environment is incomplete');
          const api = 'https://api.github.com/repos/' + repository;
          async function request(method, path, body = undefined) {
            const response = await fetch(api + path, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
              },
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${method} ${path} failed (${response.status}): ${text}`);
            return text === '' ? {} : JSON.parse(text);
          }
          const changed = execFileSync('git', ['diff', '--name-only', 'HEAD', '--', '.'], { encoding: 'utf8' })
            .split('\n').map(value => value.trim()).filter(Boolean);
          const paths = [...new Set(changed)].filter(path => !path.startsWith('.github/workflows/')).sort();
          if (paths.length === 0) throw new Error('No ordinary cleanup state changed');
          const ref = await request('GET', '/git/ref/heads/' + branch);
          if (ref.object?.sha !== expectedHead) throw new Error(`branch advanced concurrently: expected ${expectedHead}, found ${ref.object?.sha}`);
          const parent = await request('GET', '/git/commits/' + expectedHead);
          const entries = [];
          for (const path of paths) {
            const treeLine = execFileSync('git', ['ls-tree', 'HEAD', '--', path], { encoding: 'utf8' }).trim();
            const mode = treeLine === '' ? '100644' : treeLine.split(/\s+/)[0];
            if (!fs.existsSync(path)) {
              entries.push({ path, mode, type: 'blob', sha: null });
              continue;
            }
            const blob = await request('POST', '/git/blobs', { content: fs.readFileSync(path).toString('base64'), encoding: 'base64' });
            entries.push({ path, mode, type: 'blob', sha: blob.sha });
          }
          const tree = await request('POST', '/git/trees', { base_tree: parent.tree.sha, tree: entries });
          const commit = await request('POST', '/git/commits', {
            message: 'chore(release): reconcile priority batch manifest',
            tree: tree.sha,
            parents: [expectedHead]
          });
          await request('PATCH', '/git/refs/heads/' + branch, { sha: commit.sha, force: false });
          console.log(JSON.stringify({ published: true, commit: commit.sha, files: paths }, null, 2));
          NODE
          node /tmp/publish-cleanup.mjs
