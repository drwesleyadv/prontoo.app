name: Native CSS Reconcile Probe

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/native-presentation-css'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-presentation-css
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/native-css-reconcile-probe.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git add app/update.manifest.json
          git diff --cached --check
          git commit -m "chore(release): reconcile native CSS manifest"
          git push origin HEAD:agent/native-presentation-css
