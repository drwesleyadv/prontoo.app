name: Apply Public Installer Config Guard Hotfix 1.7.22.1

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/fix-public-installer-config-guard-1.7.22.1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-public-installer-config-guard-1.7.22.1
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply canonical installer guard
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .automation/apply-public-installer-config-guard-hotfix.py | tee /tmp/installer-config-guard-apply.json

      - name: PHP syntax and documentation coverage
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './storage' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          test -z "$(find . -type f -name '*.md' -print -quit)"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $functions = 0;
          $guides = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator('.', FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || strtolower($file->getExtension()) !== 'php') continue;
              $source = (string) file_get_contents($file->getPathname());
              foreach (token_get_all($source) as $token) {
                  if (is_array($token) && ($token[0] === T_FUNCTION || $token[0] === T_FN)) $functions++;
              }
              $guides += substr_count($source, 'GUIA DE MANUTENÇÃO —');
              $guides += substr_count($source, 'Guia de manutenção:');
          }
          if ($functions !== 1865 || $guides !== $functions) {
              throw new RuntimeException("Cobertura documental inválida: {$guides}/{$functions}");
          }
          echo "Cobertura documental: {$guides}/{$functions}", PHP_EOL;
          PHP

      - name: JSON and sealed release manifest
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json", "app/Database/operational-schema.contract.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) throw new RuntimeException("JSON inválido: " . $file);
            }
            $version = json_decode((string) file_get_contents("version.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($version["version"] ?? "") !== "1.7.22.1" || ($version["previous_version"] ?? "") !== "1.7.21.8") throw new RuntimeException("Versão divergente");
            $manifest = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $bytes = 0;
            foreach ((array) $manifest["files"] as $file => $hash) {
              if (!is_file($file) || !hash_equals((string) $hash, hash_file("sha256", $file))) throw new RuntimeException("Hash divergente: " . $file);
              $bytes += filesize($file);
            }
            if ($bytes !== (int) $manifest["total_uncompressed_bytes"]) throw new RuntimeException("Bytes divergentes");
          '

      - name: Installer, schema and architecture contracts
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          php tools/install-security-check.php | tee /tmp/install-security-report.json
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php | tee /tmp/schema-report.json
          php tools/architecture-check.php | tee /tmp/architecture-report.json
          test "$(sha256sum app/Database/schema.sql | cut -d' ' -f1)" = "28515f46af3081e5ac0dded5723e6d2d7ceddec11e9c6f782975f31931a69d33"

      - name: Commit certified product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ChangeLog.txt \
            app/Core/Install/InstallAccess.php \
            app/Runtime/Runner.php \
            app/Database/operational-schema.contract.json \
            app/architecture.manifest.json \
            app/prontoo.php \
            app/update.manifest.json \
            br/index.php \
            tools/install-security-check.php \
            version.json
          git commit -m "corrige a guarda pública do instalador na 1.7.22.1"
          git push origin HEAD:agent/fix-public-installer-config-guard-1.7.22.1

      - name: Upload certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-installer-config-guard-hotfix-1.7.22.1
          path: |
            /tmp/installer-config-guard-apply.json
            /tmp/install-security-report.json
            /tmp/schema-report.json
            /tmp/architecture-report.json
          if-no-files-found: warn
          retention-days: 7
