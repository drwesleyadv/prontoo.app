name: Commit Public Installer 1.7.22.4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  commit:
    if: github.head_ref == 'agent/restore-public-installer-1.7.22.4' || github.ref_name == 'agent/restore-public-installer-1.7.22.4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rollback branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-public-installer-1.7.22.4
          fetch-depth: 0

      - name: Restore and seal public installer release
        shell: bash
        run: |
          set -euo pipefail
          cp .automation/restore_public_installer_1_7_22_4.py /tmp/restore_public_installer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git read-tree --reset -u 7e7908e3efe89ef3944bdff7c82c2e7882144879
          python3 /tmp/restore_public_installer.py | tee /tmp/restore-public-installer-report.json

      - name: Validate syntax and public window
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php -r '
            $v=json_decode((string)file_get_contents("version.json"),true,512,JSON_THROW_ON_ERROR);
            if(($v["version"]??"")!=="1.7.22.4") throw new RuntimeException("Versão divergente");
            $w=(array)($v["temporary_public_installer"]??[]);
            if(($w["host"]??"")!=="prontoo.app"||empty($w["https_required"])) throw new RuntimeException("Host ou HTTPS divergente");
            if((int)($w["start_unix"]??0)!==1784735640||(int)($w["end_unix"]??0)!==1784750040) throw new RuntimeException("Janela divergente");
            if(empty($w["automatic_revocation"])) throw new RuntimeException("Revogação ausente");
            echo "Contrato público temporário válido\n";
          '

      - name: Commit restored release
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Prontoo 1.7.22.4 — restaura instalador público para reinstalação"
          git push origin HEAD:agent/restore-public-installer-1.7.22.4
