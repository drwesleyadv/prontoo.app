name: Apply status landing load card

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-landing-load-card' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply status-only landing load card
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
            python3 <<'PY'
          from pathlib import Path

          path = Path('app/Admin/AdminPages.php')
          text = path.read_text(encoding='utf-8')
          old = '''function admin_performance_card_content_html(bool $public = false): string
          {
              return '<div class="section-head admin-performance-head"><h2>Desempenho geral</h2>' .
                  admin_maestro_health_pill_html(!$public) .
                  "</div>" .
                  admin_global_perf_charts_html();
          }
          '''
          new = '''function admin_performance_card_content_html(bool $public = false): string
          {
              $landingCard = "";
              if ($public) {
                  $summary = function_exists("telemetry_route_performance_summary")
                      ? telemetry_route_performance_summary(24)
                      : ["routes" => []];
                  $landingRequests24h = 0;
                  foreach ((array) ($summary["routes"] ?? []) as $routePerformance) {
                      if ((string) ($routePerformance["route"] ?? "") !== "landing") {
                          continue;
                      }
                      $landingRequests24h = max(
                          0,
                          (int) ($routePerformance["count"] ?? 0),
                      );
                      break;
                  }
                  $landingCard =
                      '<div class="stats-grid admin-overview-kpis status-landing-kpi">' .
                      stat_card(
                          "Landing Page",
                          $landingRequests24h,
                          "web",
                          "carregamentos nas últimas 24 horas",
                      ) .
                      "</div>";
              }
              return '<div class="section-head admin-performance-head"><h2>Desempenho geral</h2>' .
                  admin_maestro_health_pill_html(!$public) .
                  "</div>" .
                  $landingCard .
                  admin_global_perf_charts_html();
          }
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Contrato de função inesperado.')
          marker = Path('ssd/.status-landing-load-card-ci')
          if marker.exists():
              marker.unlink()
          PY
            php -l app/Admin/AdminPages.php >/dev/null
            php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/Admin/AdminPages.php app/update.manifest.json ssd/.status-landing-load-card-ci 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Exibir carregamentos da landing na tela status"
            if git push origin HEAD:"$HEAD_BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
