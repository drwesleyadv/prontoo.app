name: Apply SOLID Stage 5

on:
  push:
    branches:
      - agent/solid-native-facades

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          cat .solid-stage5/payload.* | base64 -d > /tmp/solid-stage5.tar.gz
          mkdir -p /tmp/solid-stage5
          tar -xzf /tmp/solid-stage5.tar.gz -C /tmp/solid-stage5
          php /tmp/solid-stage5/migrate.php "$GITHUB_WORKSPACE"
          tar -xzf /tmp/solid-stage5/overrides.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f solid-migration-map.json
          rm -rf .solid-stage5
          rm -f .github/workflows/solid-stage5-apply.yml
      - name: Publish final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'SOLID stage 5: migrate procedural modules to native facades'
          git push origin HEAD:agent/solid-native-facades
