name: Apply status UX audit

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-ux-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply audited UX refinements
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          admin = Path('app/Admin/AdminPages.php')
          text = admin.read_text(encoding='utf-8')
          old = '''$card = $overviewCards . admin_performance_card_html(true);
              echo '<!doctype html><html lang="pt-BR"><head>'''
          new = '''$statusHeader =
              '<header class="status-page-header">' .
              '<span class="status-page-icon" aria-hidden="true">' . icon("monitor_heart") . "</span>" .
              '<div><h1>Status do Prontoo</h1><p>Visão operacional das últimas 24 horas</p></div>' .
              "</header>";
          $card = $statusHeader . $overviewCards . admin_performance_card_html(true);
              echo '<!doctype html><html lang="pt-BR"><head>'''
          if old not in text:
              raise SystemExit('Ponto de inserção do cabeçalho de status não localizado.')
          text = text.replace(old, new, 1)
          text = text.replace('<main id="conteudo" tabindex="-1">', '<main id="conteudo" tabindex="-1" aria-label="Status operacional do Prontoo">', 1)
          admin.write_text(text, encoding='utf-8')

          css = Path('public/assets/design-system.css')
          css_text = css.read_text(encoding='utf-8')
          rule = '''
          body.status-public .status-page-header{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 20px;padding:2px 2px 0;}
          body.status-public .status-page-icon{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:16px;background:var(--clinic-accent-soft);color:var(--clinic-accent-dark);}
          body.status-public .status-page-icon .pt-icon-glyph{font-size:28px;}
          body.status-public .status-page-header h1{margin:0;color:var(--md-sys-color-on-surface);font:var(--md-sys-typescale-headline-small);font-weight:800;letter-spacing:-.025em;}
          body.status-public .status-page-header p{margin:3px 0 0;color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-body-medium);}
          body.status-public #conteudo>.stat-card .stat-title{min-width:0;overflow-wrap:anywhere;}
          body.status-public #conteudo>.stat-card .stat-value{font-variant-numeric:tabular-nums;white-space:nowrap;}
          body.status-public #conteudo>.stat-card+.admin-performance-card{margin-top:24px!important;}
          @media(max-width:620px){
            body.status-public .status-page-header{margin-bottom:14px;gap:11px;padding-inline:2px;}
            body.status-public .status-page-icon{flex-basis:42px;width:42px;height:42px;border-radius:14px;}
            body.status-public .status-page-icon .pt-icon-glyph{font-size:24px;}
            body.status-public .status-page-header h1{font-size:1.25rem;}
            body.status-public .status-page-header p{font-size:.82rem;}
            body.status-public #conteudo>.stat-card{grid-template-columns:auto minmax(0,1fr)!important;grid-template-rows:auto auto!important;column-gap:12px!important;row-gap:3px!important;min-height:88px!important;padding:15px 16px!important;}
            body.status-public #conteudo>.stat-card .stat-icon{grid-column:1!important;grid-row:1/3!important;}
            body.status-public #conteudo>.stat-card .stat-title{grid-column:2!important;grid-row:1!important;align-self:end!important;}
            body.status-public #conteudo>.stat-card .stat-value{grid-column:2!important;grid-row:2!important;align-self:start!important;text-align:left!important;}
            body.status-public #conteudo>.stat-card+.admin-performance-card{margin-top:18px!important;}
          }
          '''
          if 'body.status-public .status-page-header{' not in css_text:
              css_text += rule
          css.write_text(css_text, encoding='utf-8')

          for path in [Path('ssd/.status-ux-audit'), Path('.github/workflows/agent-status-ux-audit.yml')]:
              if path.exists():
                  path.unlink()
          PY
          php -l app/Admin/AdminPages.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refinar UX da tela pública de status"
          git push origin HEAD:"$HEAD_BRANCH"
