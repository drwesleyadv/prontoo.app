          NODE
          old=1.8.18.4
          new=1.8.18.5
          for base in app-icon favicon prontoo-mark; do
            if [ -f "public/assets/${base}-${old}.png" ]; then cp "public/assets/${base}-${old}.png" "public/assets/${base}-${new}.png"; rm "public/assets/${base}-${old}.png"; fi
          done
          if [ -f "public/assets/favicon-${old}.ico" ]; then cp "public/assets/favicon-${old}.ico" "public/assets/favicon-${new}.ico"; rm "public/assets/favicon-${old}.ico"; fi
          if [ -f "public/assets/pix-${old}.svg" ]; then cp "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"; rm "public/assets/pix-${old}.svg"; fi
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const files=cp.execFileSync('git',['grep','-Il','1.8.18.4','--','.'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const file of files){
            if(file==='.github/workflows/agent-dtcg-migrate.yml') continue;
            const source=fs.readFileSync(file,'utf8');
            fs.writeFileSync(file,source.replaceAll('1.8.18.4','1.8.18.5'));
          }
          NODE
          node tools/design-tokens-build.mjs --write
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='app/Presentation/Styles/styles.manifest.json',root='app/Presentation/Styles/';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          for(const s of m.sources){const css=fs.readFileSync(root+s.path,'utf8');s.sha256=crypto.createHash('sha256').update(css).digest('hex');s.bytes=Buffer.byteLength(css);s.important_count=(css.match(/!important/g)||[]).length;s.route_scope_count=(css.match(/body\[data-route=/g)||[]).length;}
          for(const seg of m.sequence){const css=fs.readFileSync(root+seg.source,'utf8');const slice=Buffer.from(css).subarray(seg.offset,seg.offset+seg.bytes).toString();if(Buffer.byteLength(slice)!==seg.bytes)throw new Error(`sequence size drift ${seg.source}`);seg.sha256=crypto.createHash('sha256').update(slice).digest('hex');seg.important_count=(slice.match(/!important/g)||[]).length;seg.route_scope_count=(slice.match(/body\[data-route=/g)||[]).length;}
          let built='';for(const seg of m.sequence){const css=fs.readFileSync(root+seg.source,'utf8');built+=Buffer.from(css).subarray(seg.offset,seg.offset+seg.bytes).toString();}
          m.artifact_contract={...(m.artifact_contract||{}),sha256:crypto.createHash('sha256').update(built).digest('hex'),bytes:Buffer.byteLength(built),deterministic_source_required:true};
          fs.writeFileSync(p,JSON.stringify(m,null,4)+'\n');fs.writeFileSync('public/assets/presentation.css',built);
          const vc=JSON.parse(fs.readFileSync('app/presentation.visual-contract.json','utf8'));vc.version='1.8.18.5';vc.delivery.current_sha256=crypto.createHash('sha256').update(built).digest('hex');vc.delivery.current_bytes=Buffer.byteLength(built);fs.writeFileSync('app/presentation.visual-contract.json',JSON.stringify(vc,null,4)+'\n');
          NODE
          rm .github/workflows/agent-dtcg-migrate.yml
          for i in 1 2 3 4; do php tools/release-contract-reconcile --write; done
          php tools/release-contract-reconcile --check
