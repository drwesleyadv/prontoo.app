name: Agent DTCG Design Tokens Migration

on:
  push:
    branches:
      - agent/dtcg-design-tokens

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Migrate token source
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact style-dictionary@5.5.0
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = {
            clinic: 'app/Presentation/Styles/tokens/clinic.css',
            material: 'app/Presentation/Styles/tokens/material.css',
            semantic: 'app/Presentation/Styles/tokens/semantic.css'
          };
          const bridge = { schema: 'prontoo-design-token-css-bridge-v1', entries: [], rules: [] };
          const canonical = {
            '--md-ref-palette-primary40':'var(--pt-sys-color-accent)',
            '--md-ref-palette-primary30':'var(--pt-sys-color-accent-strong)',
            '--md-sys-color-primary':'var(--pt-sys-color-accent)',
            '--md-sys-color-on-primary':'var(--pt-sys-color-on-accent)',
            '--md-sys-color-primary-container':'var(--pt-sys-color-accent-container)',
            '--md-sys-color-on-primary-container':'var(--pt-sys-color-on-accent-container)',
            '--md-sys-color-secondary':'var(--pt-sys-color-secondary)',
            '--md-sys-color-on-secondary':'var(--pt-sys-color-on-secondary)',
            '--md-sys-color-secondary-container':'var(--pt-sys-color-secondary-container)',
            '--md-sys-color-on-secondary-container':'var(--pt-sys-color-on-secondary-container)',
            '--md-sys-color-tertiary':'var(--pt-sys-color-tertiary)',
            '--md-sys-color-on-tertiary':'var(--pt-sys-color-on-tertiary)',
            '--md-sys-color-tertiary-container':'var(--pt-sys-color-tertiary-container)',
            '--md-sys-color-on-tertiary-container':'var(--pt-sys-color-on-tertiary-container)',
            '--md-sys-color-error':'var(--pt-sys-color-error)',
            '--md-sys-color-on-error':'var(--pt-sys-color-on-error)',
            '--md-sys-color-error-container':'var(--pt-sys-color-error-container)',
            '--md-sys-color-on-error-container':'var(--pt-sys-color-on-error-container)',
            '--brand':'var(--pt-sys-color-accent)',
            '--brand-dark':'var(--pt-sys-color-accent-strong)',
            '--brand-soft':'var(--pt-sys-color-accent-container)',
            '--brand-soft-2':'var(--pt-sys-color-accent-subtle)',
            '--on-brand':'var(--pt-sys-color-on-accent)',
            '--pt-color-success':'var(--pt-sys-color-success)',
            '--pt-color-on-success':'var(--pt-sys-color-on-success)',
            '--pt-color-success-container':'var(--pt-sys-color-success-container)',
            '--pt-color-on-success-container':'var(--pt-sys-color-on-success-container)',
            '--pt-color-warning':'var(--pt-sys-color-warning)',
            '--pt-color-on-warning':'var(--pt-sys-color-on-warning)',
            '--pt-color-warning-container':'var(--pt-sys-color-warning-container)',
            '--pt-color-on-warning-container':'var(--pt-sys-color-on-warning-container)',
            '--pt-color-info':'var(--pt-sys-color-info)',
            '--pt-color-info-container':'var(--pt-sys-color-info-container)',
            '--pt-color-on-info-container':'var(--pt-sys-color-on-info-container)',
            '--pt-pagehead-control-accent':'var(--pt-cmp-pagehead-accent)',
            '--pt-pagehead-control-on-accent':'var(--pt-cmp-pagehead-on-accent)',
            '--pt-pagehead-control-hover':'var(--pt-cmp-pagehead-hover)',
            '--pt-pagehead-control-container':'var(--pt-cmp-pagehead-container)',
            '--pt-pagehead-control-on-container':'var(--pt-cmp-pagehead-on-container)',
            '--pt-ds-accent':'var(--pt-sys-color-accent)'
          };
          const runtimeSource = fs.readFileSync('app/Domain/ClinicConfig/ClinicConfigDomainOperations02.php','utf8');
          const dynamicSeeds = new Set([...runtimeSource.matchAll(/--([a-z0-9-]+):/gi)].map(m => `--${m[1]}`));
          const declarations = [];
          let globalOrder = 10000;
          for (const [target, file] of Object.entries(roots)) {
            const css = fs.readFileSync(file, 'utf8');
            const blockRe = /([^{}]+)\{([^{}]*)\}/g;
            let block;
            while ((block = blockRe.exec(css))) {
              const selector = block[1].trim();
              const body = block[2];
              const propRe = /(--[a-z0-9-]+)\s*:\s*([^;]+);/gi;
              const tokenRanges = [];
              let prop;
              while ((prop = propRe.exec(body))) {
                let value = prop[2].trim();
                const important = /!important\s*$/i.test(value);
                value = value.replace(/!important\s*$/i, '').trim();
                declarations.push({ target, selector, name: prop[1], value, important, order: globalOrder++ });
                tokenRanges.push([prop.index, prop.index + prop[0].length]);
              }
              if (tokenRanges.length) {
                let remainder = '';
                let cursor = 0;
                for (const [start,end] of tokenRanges) {
                  remainder += body.slice(cursor,start);
                  cursor = end;
                }
                remainder += body.slice(cursor);
                const cleaned = remainder.replace(/\s+/g,' ').trim().replace(/^;+|;+$/g,'').trim();
                if (cleaned) bridge.rules.push({ target, selector, declarations: cleaned, order: globalOrder++ });
              } else {
                const cleaned = body.replace(/\s+/g,' ').trim();
                if (cleaned) bridge.rules.push({ target, selector, declarations: cleaned, order: globalOrder++ });
              }
            }
          }
          const byName = new Map();
          for (const item of declarations) {
            if (!byName.has(item.name)) byName.set(item.name, []);
            byName.get(item.name).push(item);
          }
          const dynamic = new Set(dynamicSeeds);
          let changed = true;
          while (changed) {
            changed = false;
            for (const item of declarations.filter(item => item.selector === ':root')) {
              if (dynamic.has(item.name)) continue;
              const deps = [...item.value.matchAll(/var\((--[a-z0-9-]+)/gi)].map(m => m[1]);
              if (deps.some(dep => dep.startsWith('--clinic-') || dynamic.has(dep))) {
                dynamic.add(item.name);
                changed = true;
              }
            }
          }
          for (const item of declarations) {
            let selector = item.selector;
            if (selector === ':root' && dynamic.has(item.name)) selector = 'body';
            bridge.entries.push({ ...item, selector, value: canonical[item.name] || item.value });
          }
          bridge.policy = {
            source: 'generated-from-pre-dtcg-token-css',
            authored_css_is_not_source_of_truth: true,
            runtime_sensitive_aliases_resolve_on_body: true
          };
          fs.mkdirSync('design/tokens', {recursive:true});
          fs.writeFileSync('design/tokens/css-bridge.json', JSON.stringify(bridge,null,2)+'\n');

          const c = hex => {
            const h = hex.replace('#','').toLowerCase();
            const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
            return {colorSpace:'srgb',components:[r/255,g/255,b/255],hex:'#'+h};
          };
          const ca = (hex, alpha) => ({...c(hex), alpha});
          const meta = (cssName,target='clinic',selector=':root',order=-10000,cssValue=null,important=false) => ({'com.prontoo':{cssName,target,selector,order,...(cssValue?{cssValue}:{}),...(important?{important:true}:{})}});
          const tok = (type,value,cssName,target='clinic',selector=':root',order=-10000,cssValue=null,important=false) => ({$type:type,$value:value,$extensions:meta(cssName,target,selector,order,cssValue,important)});
          const ref = {
            ref:{
              color:{
                brand:{default:tok('color',c('#2f6652'),'--pt-ref-color-brand-default'),strong:tok('color',c('#1d583f'),'--pt-ref-color-brand-strong'),soft:tok('color',c('#d9f0df'),'--pt-ref-color-brand-soft'),subtle:tok('color',c('#f6fbf7'),'--pt-ref-color-brand-subtle'),global:tok('color',c('#238763'),'--pt-ref-color-brand-global'),globalStrong:tok('color',c('#105e44'),'--pt-ref-color-brand-global-strong'),public:tok('color',c('#2d6f55'),'--pt-ref-color-brand-public')},
                neutral:{white:tok('color',c('#ffffff'),'--pt-ref-color-neutral-white'),ink:tok('color',c('#191d1a'),'--pt-ref-color-neutral-ink'),muted:tok('color',c('#414941'),'--pt-ref-color-neutral-muted'),n98:tok('color',c('#fbfdf9'),'--pt-ref-color-neutral-98'),n95:tok('color',c('#f2f5f0'),'--pt-ref-color-neutral-95'),n90:tok('color',c('#e3e8e1'),'--pt-ref-color-neutral-90')},
                semantic:{success:tok('color',c('#146c43'),'--pt-ref-color-success'),successContainer:tok('color',c('#d8f5e5'),'--pt-ref-color-success-container'),successInk:tok('color',c('#05391f'),'--pt-ref-color-success-ink'),warning:tok('color',c('#865900'),'--pt-ref-color-warning'),warningContainer:tok('color',c('#ffefc2'),'--pt-ref-color-warning-container'),warningInk:tok('color',c('#3d2b00'),'--pt-ref-color-warning-ink'),info:tok('color',c('#286b73'),'--pt-ref-color-info'),infoContainer:tok('color',c('#d6f4f7'),'--pt-ref-color-info-container'),infoInk:tok('color',c('#063b42'),'--pt-ref-color-info-ink'),error:tok('color',c('#ba1a1a'),'--pt-ref-color-error'),errorContainer:tok('color',c('#ffdad6'),'--pt-ref-color-error-container'),errorInk:tok('color',c('#410002'),'--pt-ref-color-error-ink')}
              }
            }
          };
          const sys = {sys:{color:{
            accent:tok('color','{ref.color.brand.default}','--pt-sys-color-accent','clinic','body',-9000,'var(--pt-theme-accent,var(--pt-ref-color-brand-default))'),
            accentStrong:tok('color','{ref.color.brand.strong}','--pt-sys-color-accent-strong','clinic','body',-8999,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),
            onAccent:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-accent','clinic','body',-8998,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),
            accentContainer:tok('color','{ref.color.brand.soft}','--pt-sys-color-accent-container','clinic','body',-8997,'var(--pt-theme-accent-soft,var(--pt-ref-color-brand-soft))'),
            onAccentContainer:tok('color','{ref.color.brand.strong}','--pt-sys-color-on-accent-container','clinic','body',-8996,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),
            accentSubtle:tok('color','{ref.color.brand.subtle}','--pt-sys-color-accent-subtle','clinic','body',-8995,'var(--pt-theme-accent-subtle,var(--pt-ref-color-brand-subtle))'),
            secondary:tok('color','{ref.color.brand.strong}','--pt-sys-color-secondary','clinic','body',-8994,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),
            onSecondary:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-secondary','clinic','body',-8993,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),
            secondaryContainer:tok('color','{ref.color.brand.subtle}','--pt-sys-color-secondary-container','clinic','body',-8992,'var(--pt-theme-accent-subtle,var(--pt-ref-color-brand-subtle))'),
            onSecondaryContainer:tok('color','{ref.color.brand.strong}','--pt-sys-color-on-secondary-container','clinic','body',-8991,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),
            tertiary:tok('color','{ref.color.brand.default}','--pt-sys-color-tertiary','clinic','body',-8990,'var(--pt-theme-accent-hover,var(--pt-theme-accent,var(--pt-ref-color-brand-default)))'),
            onTertiary:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-tertiary','clinic','body',-8989,'var(--pt-theme-on-accent,var(--pt-ref-color-neutral-white))'),
            tertiaryContainer:tok('color','{ref.color.brand.soft}','--pt-sys-color-tertiary-container','clinic','body',-8988,'var(--pt-theme-accent-muted,var(--pt-ref-color-brand-soft))'),
            onTertiaryContainer:tok('color','{ref.color.brand.strong}','--pt-sys-color-on-tertiary-container','clinic','body',-8987,'var(--pt-theme-accent-strong,var(--pt-ref-color-brand-strong))'),
            success:tok('color','{ref.color.semantic.success}','--pt-sys-color-success'),onSuccess:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-success'),successContainer:tok('color','{ref.color.semantic.successContainer}','--pt-sys-color-success-container'),onSuccessContainer:tok('color','{ref.color.semantic.successInk}','--pt-sys-color-on-success-container'),
            warning:tok('color','{ref.color.semantic.warning}','--pt-sys-color-warning'),onWarning:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-warning'),warningContainer:tok('color','{ref.color.semantic.warningContainer}','--pt-sys-color-warning-container'),onWarningContainer:tok('color','{ref.color.semantic.warningInk}','--pt-sys-color-on-warning-container'),
            info:tok('color','{ref.color.semantic.info}','--pt-sys-color-info'),infoContainer:tok('color','{ref.color.semantic.infoContainer}','--pt-sys-color-info-container'),onInfoContainer:tok('color','{ref.color.semantic.infoInk}','--pt-sys-color-on-info-container'),
            error:tok('color','{ref.color.semantic.error}','--pt-sys-color-error'),onError:tok('color','{ref.color.neutral.white}','--pt-sys-color-on-error'),errorContainer:tok('color','{ref.color.semantic.errorContainer}','--pt-sys-color-error-container'),onErrorContainer:tok('color','{ref.color.semantic.errorInk}','--pt-sys-color-on-error-container')
          }}};
          const cmp = {cmp:{pagehead:{
            accent:tok('color','{sys.color.accent}','--pt-cmp-pagehead-accent','clinic','body',-8000,'var(--pt-theme-identity-accent,var(--pt-sys-color-accent))'),
            onAccent:tok('color','{sys.color.onAccent}','--pt-cmp-pagehead-on-accent','clinic','body',-7999,'var(--pt-theme-identity-on-accent,var(--pt-sys-color-on-accent))'),
            hover:tok('color','{sys.color.accentStrong}','--pt-cmp-pagehead-hover','clinic','body',-7998,'var(--pt-theme-identity-hover,var(--pt-sys-color-accent-strong))'),
            container:tok('color','{sys.color.accentContainer}','--pt-cmp-pagehead-container','clinic','body',-7997,'color-mix(in srgb,var(--pt-cmp-pagehead-accent) 15%,var(--md-sys-color-surface-container-lowest))'),
            onContainer:tok('color','{sys.color.accentStrong}','--pt-cmp-pagehead-on-container','clinic','body',-7996,'color-mix(in srgb,var(--pt-cmp-pagehead-accent) 74%,#102018)')
          },icon:{foreground:tok('color','{sys.color.accent}','--pt-cmp-icon-foreground','clinic','body',-7995,'var(--pt-sys-color-accent)')}}};
          const themeToken = (name,hex,selector,order) => tok('color',c(hex),name,'material',selector,order,null,true);
          const themes = {theme:{global:{accent:themeToken('--pt-theme-accent','#238763','body.scope-global',-7000),strong:themeToken('--pt-theme-accent-strong','#105e44','body.scope-global',-6999),hover:themeToken('--pt-theme-accent-hover','#105e44','body.scope-global',-6998),soft:themeToken('--pt-theme-accent-soft','#dff3ea','body.scope-global',-6997),subtle:themeToken('--pt-theme-accent-subtle','#f1fbf6','body.scope-global',-6996),muted:themeToken('--pt-theme-accent-muted','#dff3ea','body.scope-global',-6995),on:themeToken('--pt-theme-on-accent','#ffffff','body.scope-global',-6994),identity:themeToken('--pt-theme-identity-accent','#238763','body.scope-global',-6993),identityHover:themeToken('--pt-theme-identity-hover','#105e44','body.scope-global',-6992),identityOn:themeToken('--pt-theme-identity-on-accent','#ffffff','body.scope-global',-6991)},public:{accent:themeToken('--pt-theme-accent','#2d6f55','body.public',-6980),strong:themeToken('--pt-theme-accent-strong','#1d583f','body.public',-6979),hover:themeToken('--pt-theme-accent-hover','#1d583f','body.public',-6978),soft:themeToken('--pt-theme-accent-soft','#d9f0df','body.public',-6977),subtle:themeToken('--pt-theme-accent-subtle','#f6fbf7','body.public',-6976),muted:themeToken('--pt-theme-accent-muted','#d9f0df','body.public',-6975),on:themeToken('--pt-theme-on-accent','#ffffff','body.public',-6974),identity:themeToken('--pt-theme-identity-accent','#2d6f55','body.public',-6973),identityHover:themeToken('--pt-theme-identity-hover','#1d583f','body.public',-6972),identityOn:themeToken('--pt-theme-identity-on-accent','#ffffff','body.public',-6971)}}};
          fs.writeFileSync('design/tokens/reference.tokens.json',JSON.stringify(ref,null,2)+'\n');
          fs.writeFileSync('design/tokens/system.tokens.json',JSON.stringify(sys,null,2)+'\n');
          fs.writeFileSync('design/tokens/component.tokens.json',JSON.stringify(cmp,null,2)+'\n');
          fs.writeFileSync('design/tokens/themes.tokens.json',JSON.stringify(themes,null,2)+'\n');

          let domain = runtimeSource;
          const needle = '        return [\n            "brand" => $base,';
          if (!domain.includes(needle)) throw new Error('clinic theme return anchor missing');
          const runtimeCanonical = `        $css .=\n            "--pt-theme-identity-accent:" . $base .\n            ";--pt-theme-identity-hover:" . $hover .\n            ";--pt-theme-identity-pressed:" . $pressed .\n            ";--pt-theme-identity-on-accent:" . $on .\n            ";--pt-theme-accent:" . $base .\n            ";--pt-theme-accent-strong:" . $strong .\n            ";--pt-theme-accent-hover:" . $hover .\n            ";--pt-theme-accent-pressed:" . $pressed .\n            ";--pt-theme-accent-soft:" . $soft .\n            ";--pt-theme-accent-subtle:" . $subtle .\n            ";--pt-theme-accent-muted:" . $muted .\n            ";--pt-theme-accent-border:" . $border .\n            ";--pt-theme-on-accent:" . $on .\n            ";";\n`;
          domain = domain.replace(needle, runtimeCanonical + needle);
          fs.writeFileSync('app/Domain/ClinicConfig/ClinicConfigDomainOperations02.php',domain);

          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts = {...(pkg.scripts||{}), 'tokens:build':'node tools/design-tokens-build.mjs --write','tokens:check':'node tools/design-tokens-build.mjs --check','tokens:contract':'node tools/design-tokens-contract.mjs'};
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,4)+'\n');
          NODE
          node tools/design-tokens-build.mjs --write
      - name: Reconcile CSS source contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const manifestPath='app/Presentation/Styles/styles.manifest.json';
          const root='app/Presentation/Styles/';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          manifest.token_source_model='dtcg-2025.10-style-dictionary-v5';
          manifest.token_source_root='design/tokens';
          manifest.token_compiler='tools/design-tokens-build.mjs';
          manifest.token_generated_sources=['tokens/clinic.css','tokens/material.css','tokens/semantic.css'];
          const tokenSet=new Set(manifest.token_generated_sources);
          for(const source of manifest.sources){
            const css=fs.readFileSync(root+source.path,'utf8');
            source.sha256=crypto.createHash('sha256').update(css).digest('hex');
            source.bytes=Buffer.byteLength(css);
            source.important_count=(css.match(/!important/g)||[]).length;
            source.route_scope_count=(css.match(/body\[data-route=/g)||[]).length;
          }
          const seq=manifest.sequence;
          const indices=[];
          seq.forEach((segment,index)=>{if(tokenSet.has(segment.source))indices.push(index)});
          if(!indices.length) throw new Error('token sequence span missing');
          const min=Math.min(...indices),max=Math.max(...indices);
          for(let i=min;i<=max;i++) if(!tokenSet.has(seq[i].source)) throw new Error(`token sequence is interleaved at ${i}`);
          const before=seq.slice(0,min),after=seq.slice(max+1);
          const tokenSegments=manifest.token_generated_sources.map(source=>{
            const css=fs.readFileSync(root+source,'utf8');
            return {source,offset:0,bytes:Buffer.byteLength(css),sha256:crypto.createHash('sha256').update(css).digest('hex'),important_count:(css.match(/!important/g)||[]).length,route_scope_count:(css.match(/body\[data-route=/g)||[]).length};
          });
          const next=[...before,...tokenSegments,...after];
          next.forEach((segment,index)=>{
            segment.order=index+1;
            if(!tokenSet.has(segment.source)){
              const css=fs.readFileSync(root+segment.source,'utf8');
              const slice=Buffer.from(css).subarray(segment.offset,segment.offset+segment.bytes).toString();
              if(Buffer.byteLength(slice)!==segment.bytes) throw new Error(`slice outside source ${segment.source}`);
              segment.sha256=crypto.createHash('sha256').update(slice).digest('hex');
              segment.important_count=(slice.match(/!important/g)||[]).length;
              segment.route_scope_count=(slice.match(/body\[data-route=/g)||[]).length;
            }
          });
          manifest.sequence=next;
          manifest.sequence_segment_count=next.length;
          let built='';
          for(const segment of next){
            const css=fs.readFileSync(root+segment.source,'utf8');
            built+=Buffer.from(css).subarray(segment.offset,segment.offset+segment.bytes).toString();
          }
          manifest.artifact_contract={...(manifest.artifact_contract||{}),sha256:crypto.createHash('sha256').update(built).digest('hex'),bytes:Buffer.byteLength(built),deterministic_source_required:true};
          fs.writeFileSync(manifestPath,JSON.stringify(manifest,null,4)+'\n');
          fs.writeFileSync('public/assets/presentation.css',built);
          NODE
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
      - name: Install browser and validate migration
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node tools/presentation-ux-contract.mjs --check
          node tools/design-tokens-contract.mjs
      - name: Integrate permanent CI and documentation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let workflow=fs.readFileSync('.github/workflows/presentation-ux.yml','utf8');
          const needle='      - name: Verify computed-style UX baseline\n        run: node tools/presentation-ux-contract.mjs --check\n';
          if(!workflow.includes(needle)) throw new Error('presentation ux anchor missing');
          workflow=workflow.replace(needle,'      - name: Verify DTCG design token contract\n        run: node tools/design-tokens-contract.mjs\n'+needle);
          fs.writeFileSync('.github/workflows/presentation-ux.yml',workflow);
          let architecture=fs.readFileSync('.github/workflows/architecture.yml','utf8');
          const phpSetup="      - name: Engineering quality gate\n";
          if(!architecture.includes(phpSetup)) throw new Error('architecture anchor missing');
          architecture=architecture.replace(phpSetup,"      - name: Setup Node 24\n        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020\n        with:\n          node-version: '24'\n      - name: Install design token contract dependencies\n        shell: bash\n        run: |\n          set -euo pipefail\n          npm ci --ignore-scripts\n          npx playwright install --with-deps chromium\n      - name: DTCG design token contract\n        run: node tools/design-tokens-contract.mjs\n"+phpSetup);
          fs.writeFileSync('.github/workflows/architecture.yml',architecture);
          fs.mkdirSync('docs/design',{recursive:true});
          fs.writeFileSync('docs/design/design-tokens.md',`# Design Tokens\n\nO Design System do Prontoo usa tokens DTCG 2025.10 como fonte de verdade e Style Dictionary como compilador determinístico para CSS Custom Properties.\n\nA hierarquia canônica é Reference → System → Component. Cores semânticas de sucesso, aviso, erro e informação permanecem independentes da identidade visual do consultório. A identidade dinâmica entra no runtime por variáveis \`--pt-theme-*\` no corpo da página; aliases dependentes de tema são resolvidos nesse mesmo escopo para evitar congelamento no tema padrão.\n\nOs arquivos \`app/Presentation/Styles/tokens/*.css\` são artefatos gerados e não devem ser editados manualmente. A fonte editável está em \`design/tokens/*.tokens.json\` e a ponte de compatibilidade em \`design/tokens/css-bridge.json\`.\n\nComandos canônicos:\n\n- \`npm run tokens:build\` recompila os artefatos.\n- \`npm run tokens:check\` verifica determinismo.\n- \`npm run tokens:contract\` valida geração, escopo e quatro temas de contraste.\n\nA CI rejeita tokens canônicos \`--pt-ref-*\`, \`--pt-sys-*\` ou \`--pt-cmp-*\` declarados manualmente fora do gerador.\n`);
          fs.writeFileSync('docs/adr/0005-dtcg-design-tokens.md',`# ADR 0005 — Design Tokens DTCG\n\n## Status\n\nAceita.\n\n## Contexto\n\nO tema por consultório era entregue por CSS Custom Properties, porém aliases derivados podiam ser calculados em \`:root\` antes das variáveis de identidade injetadas no \`body\`, produzindo componentes presos ao tema padrão.\n\n## Decisão\n\nAdotar DTCG 2025.10 como fonte de verdade, Style Dictionary 5 como compilador, três camadas Reference/System/Component e uma ponte gerada para preservar a ABI CSS existente. Tokens dependentes do tema são materializados no escopo do \`body\`; cores operacionais semânticas não dependem da identidade do consultório.\n\nA entrega CSS permanece por compatibilidade com o navegador, mas deixa de ser fonte editável. O contrato multitema executa verde, azul, vinho e violeta e mantém sucesso/aviso/erro/informação invariantes.\n\n## Consequências\n\nA identidade passa a ter uma cadeia única e testável, a geração é determinística e alterações futuras de tokens são feitas em JSON. A ponte permite evolução gradual dos nomes CSS sem alterar geometria, tipografia ou fluxos atuais.\n`);
          let index=fs.readFileSync('docs/index.md','utf8');
          if(!index.includes('docs/design/design-tokens.md')) index += '\n- `docs/design/design-tokens.md` — fonte DTCG, compilação e contrato multitema do Design System.\n- `docs/adr/0005-dtcg-design-tokens.md` — decisão arquitetural da migração de tokens.\n';
          fs.writeFileSync('docs/index.md',index);
          NODE
      - name: Publish incremental release
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-version --write --date=2026-08-18 --timestamp=2026-08-18T11:26:00-04:00 --expected-current=1.8.18.4
