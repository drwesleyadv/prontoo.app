            'adiciona contrato multitema verde, azul, vinho e violeta preservando cores semânticas de sucesso, aviso, erro e informação',
            'mantém geometria, tipografia, fluxos, banco e schema sem alterações estruturais'
          ]};
          version.deployment_sync_id=`github-prontoo-${next}-dtcg-design-tokens`;
