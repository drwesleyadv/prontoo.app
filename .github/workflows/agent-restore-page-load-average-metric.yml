name: Agent Restore Page Load Average Metric

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'agent/restore-page-load-average-metric'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/restore-page-load-average-metric
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned presentation toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Restore page-load average metric
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/agent-restore-page-load-average-metric.py')
          text = path.read_text()
          old = 'replace("design/styles/application.css", f"pix-{OLD_VERSION}.svg", f"pix-{NEW_VERSION}.svg")'
          new = 'replace("design/styles/application.css", f"pix-{OLD_VERSION}.svg", f"pix-{NEW_VERSION}.svg", 2)'
          if text.count(old) != 1:
              raise SystemExit('PIX migration guard drift')
          path.write_text(text.replace(old, new))
          PY
          python3 tools/agent-restore-page-load-average-metric.py
          sed -i 's/1\.8\.18\.6/1.8.18.7/g' docs/index.md
          php tools/presentation-css-build --write
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('app/presentation.visual-contract.json')
          data = json.loads(path.read_text())
          css = Path('public/assets/presentation.css').read_bytes()
          data['version'] = '1.8.18.7'
          data.setdefault('delivery', {})['current_sha256'] = hashlib.sha256(css).hexdigest()
          data['delivery']['current_bytes'] = len(css)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Validate restored metric before publication
        shell: bash
        run: |
          set -euo pipefail
          php tools/telemetry-json-source-contract-check
          node tools/presentation-ux-contract.mjs --check
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          node tools/design-tokens-build.mjs --check
          node tools/design-tokens-contract.mjs
      - name: Reconcile final release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-restore-page-load-average-metric.yml
          rm -f tools/agent-restore-page-load-average-metric.py
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/documentation-check.php
          php tools/telemetry-json-source-contract-check
          node tools/presentation-ux-contract.mjs --check
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          node tools/design-tokens-build.mjs --check
          node tools/design-tokens-contract.mjs
          php tools/quality-gate --fast
          test ! -f .github/workflows/agent-restore-page-load-average-metric.yml
          test ! -f tools/agent-restore-page-load-average-metric.py
          test -f public/assets/app-icon-1.8.18.7.png
          test -f public/assets/prontoo-mark-1.8.18.7.png
          test -f public/assets/favicon-1.8.18.7.png
          test -f public/assets/favicon-1.8.18.7.ico
          test -f public/assets/pix-1.8.18.7.svg
          test ! -e public/assets/app-icon-1.8.18.6.png
          git diff --exit-code --check
      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restaura Tempo médio de carregamento em Métricas'
          git push origin HEAD:agent/restore-page-load-average-metric
