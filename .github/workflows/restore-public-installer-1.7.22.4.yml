name: Restore Public Installer 1.7.22.4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  restore:
    if: github.head_ref == 'agent/restore-public-installer-1.7.22.4' || github.ref_name == 'agent/restore-public-installer-1.7.22.4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rollback branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-public-installer-1.7.22.4
          fetch-depth: 0

      - name: Restore certified public installer tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restaura integralmente a última árvore certificada com o instalador público funcional.
          git read-tree --reset -u 7e7908e3efe89ef3944bdff7c82c2e7882144879

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          VERSION = '1.7.22.4'
          PREVIOUS = '1.7.22.3'
          BUILD = '1.7.22.4-public-reinstall-window'
          PACKAGE = 'public_reinstall_window'
          GENERATED_AT = '2026-07-22T15:54:00Z'
          GENERATED_UNIX = 1784735640
          START_UNIX = 1784735640
          END_UNIX = 1784750040
          START_UTC = '2026-07-22T15:54:00Z'
          END_UTC = '2026-07-22T19:54:00Z'
          START_LOCAL = '22/07/2026 11:54:00 America/Cuiaba'
          END_LOCAL = '22/07/2026 15:54:00 America/Cuiaba'

          def load_json(path: str) -> dict:
              data = json.loads((ROOT / path).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise RuntimeError(f'JSON raiz inválido: {path}')
              return data

          def write_json(path: str, data: dict, indent: int = 2) -> None:
              (ROOT / path).write_text(
                  json.dumps(data, ensure_ascii=False, indent=indent) + '\n',
                  encoding='utf-8',
              )

          window = {
              'host': 'prontoo.app',
              'https_required': True,
              'start_unix': START_UNIX,
              'end_unix': END_UNIX,
              'start_utc': START_UTC,
              'end_utc': END_UTC,
              'start_local': START_LOCAL,
              'end_local': END_LOCAL,
              'automatic_revocation': True,
          }

          version = load_json('version.json')
          version.update({
              'version': VERSION,
              'release': VERSION,
              'generated_at_unix': GENERATED_UNIX,
              'generated_at': GENERATED_AT,
              'updated_at': GENERATED_AT,
              'build': BUILD,
              'package_type': PACKAGE,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': True,
              'previous_version': PREVIOUS,
              'notes': 'Rollback temporário para a base certificada 1.7.22.2, com nova janela pública controlada para reinstalação completa e revogação automática.',
              'temporary_public_installer': window,
          })
          for key in ('installer_locked', 'installer_access_policy', 'schema_mutation_policy', 'deployment_sync_id', 'deployment_sync_requested_at'):
              version.pop(key, None)
          write_json('version.json', version, 2)

          for path in ('app/architecture.manifest.json', 'app/Database/operational-schema.contract.json'):
              data = load_json(path)
              data['version'] = VERSION
              if 'release' in data:
                  data['release'] = VERSION
              if 'generated_at' in data:
                  data['generated_at'] = GENERATED_AT
              write_json(path, data, 2)

          prontoo_path = ROOT / 'app/prontoo.php'
          prontoo = prontoo_path.read_text(encoding='utf-8')
          prontoo = re.sub(
              r'const PRONTOO_VERSION_FALLBACK = "[^"]+";',
              f'const PRONTOO_VERSION_FALLBACK = "{VERSION}";',
              prontoo,
              count=1,
          )
          prontoo = re.sub(
              r'const PRONTOO_PREVIOUS_VERSION = "[^"]+";',
              f'const PRONTOO_PREVIOUS_VERSION = "{PREVIOUS}";',
              prontoo,
              count=1,
          )
          prontoo_path.write_text(prontoo, encoding='utf-8')

          landing_path = ROOT / 'br/index.php'
          landing = landing_path.read_text(encoding='utf-8')
          landing = re.sub(
              r'BR_LANDING_VERSION_FALLBACK\s*=\s*["\'][^"\']+["\']',
              f'BR_LANDING_VERSION_FALLBACK = "{VERSION}"',
              landing,
              count=1,
          )
          landing_path.write_text(landing, encoding='utf-8')

          replacements = {
              '1784722014': str(START_UNIX),
              '1784736414': str(END_UNIX),
              '2026-07-22T12:06:54Z': START_UTC,
              '2026-07-22T16:06:54Z': END_UTC,
              '22/07/2026 08:06:54': '22/07/2026 11:54:00',
              '22/07/2026 12:06:54': '22/07/2026 15:54:00',
          }
          for relative in (
              '.htaccess',
              'app/Core/Install/InstallAccess.php',
              'tools/install-security-check.php',
          ):
              path = ROOT / relative
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          changelog_path = ROOT / 'ChangeLog.txt'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = f'''Prontoo {VERSION} — restauração temporária do instalador público para reinstalação\n\n- Restaura integralmente a base certificada da 1.7.22.2, incluindo o hotfix `assertInstallerEntry()`.\n- Reabre temporariamente `https://prontoo.app/install.php` somente no host exato `prontoo.app` e sob HTTPS.\n- Janela autorizada: {START_LOCAL} até {END_LOCAL}; o limite final é exclusivo e a revogação é automática.\n- Preserva o schema r7, as 62 tabelas do instalador limpo e não aplica migração sobre banco existente.\n- Esta é uma release transitória para reinstalação completa; após o comissionamento, o hardening da versão mais recente deverá ser reaplicado.\n- Alteração de banco: não. Alteração de schema: não. Alteração de dados: não.\n\n'''
          changelog_path.write_text(entry + changelog, encoding='utf-8')

          manifest = load_json('app/update.manifest.json')
          manifest.update({
              'version': VERSION,
              'release': VERSION,
              'build': BUILD,
              'package_type': PACKAGE,
              'generated_at': GENERATED_AT,
              'updated_at': GENERATED_AT,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': True,
              'previous_version': PREVIOUS,
              'notes': 'Restaura temporariamente a base pública certificada para reinstalação completa, com revogação automática.',
              'temporary_public_installer': window,
          })
          for key in ('installer_policy', 'schema_mutation_policy', 'deployment_sync_id'):
              manifest.pop(key, None)

          files = manifest.get('files')
          if not isinstance(files, dict):
              raise RuntimeError('Manifesto sem mapa de arquivos.')
          for relative in list(files):
              path = ROOT / relative
              if not path.is_file():
                  raise RuntimeError(f'Arquivo ausente no pacote restaurado: {relative}')
              files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = sum((ROOT / relative).stat().st_size for relative in files)
          write_json('app/update.manifest.json', manifest, 4)

          # Validação final da selagem.
          sealed = load_json('app/update.manifest.json')
          for relative, expected in sealed['files'].items():
              actual = hashlib.sha256((ROOT / relative).read_bytes()).hexdigest()
              if actual != expected:
                  raise RuntimeError(f'Hash divergente: {relative}')

          print(json.dumps({
              'ok': True,
              'version': VERSION,
              'base_commit': '7e7908e3efe89ef3944bdff7c82c2e7882144879',
              'window_start': START_UTC,
              'window_end': END_UTC,
              'files': len(sealed['files']),
          }, ensure_ascii=False))
          PY

      - name: Validate restored release
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php tools/install-security-check.php
          php tools/schema-check.php
          php tools/architecture-check.php

      - name: Commit restored release
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Prontoo 1.7.22.4 — restaura instalador público para reinstalação"
          git push origin HEAD:agent/restore-public-installer-1.7.22.4
