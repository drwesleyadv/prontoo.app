name: Baseline Cleanup Materializer

on:
  push:
    branches:
      - agent/baseline-only-cleanup-1-8-14-1

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
  PRONTOO_SCHEMA_USER: root
  PRONTOO_SCHEMA_PASS: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Remove superseded material and reconcile contracts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/baseline-cleanup-materialize.yml
          rm docs/architecture/phase-1-refactoring.md
          rm docs/architecture/phase-2-presentation-boundaries.md
          rm docs/architecture/phase-3-read-use-cases.md
          rm docs/architecture/phase-4-transactional-commands.md
          rm docs/architecture/phase-5-critical-financial-command.md
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          git add -A
      - name: Validate baseline-only policy and quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/superseded-reference-contract-check
          php tools/documentation-check.php
          php tools/version-asset-contract-check.php
          php tools/quality-gate
      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit."
            exit 0
          fi
          git commit -m "chore: reconcile baseline-only cleanup contracts"
          git push origin HEAD:agent/baseline-only-cleanup-1-8-14-1
