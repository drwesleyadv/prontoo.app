name: Apply public status design

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-public-ds' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Redesign public status page
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          admin = Path('app/Admin/AdminPages.php')
          text = admin.read_text(encoding='utf-8')
          old = '''    $overviewCards = admin_telemetry_seven_day_cards_html($comparison);
$statusHeader =
    '<header class="status-page-header">' .
    '<span class="status-page-icon" aria-hidden="true">' . icon("monitor_heart") . "</span>" .
    '<div><h1>Status do Prontoo</h1><p>Visão operacional dos últimos 7 dias</p></div>' .
    "</header>";
$card = $statusHeader . $overviewCards . admin_performance_card_html(true);
'''
          new = '''    $overviewCards = admin_telemetry_seven_day_cards_html($comparison);
    $statusHeader =
        '<header class="status-page-header">' .
        '<div class="status-page-brand">' .
        '<span class="status-page-icon" aria-hidden="true">' . icon("monitor_heart") . "</span>" .
        '<div><span class="status-page-eyebrow">Transparência operacional</span><h1>Status do Prontoo</h1><p>Acompanhe a estabilidade e o desempenho recente da plataforma.</p></div>' .
        "</div>" .
        '<span class="status-operational-state"><span aria-hidden="true"></span>Operação normal</span>' .
        "</header>";
    $statusSummary =
        '<section class="status-summary" aria-labelledby="status-summary-title">' .
        '<div class="status-section-heading"><div><span>Últimos 7 dias</span><h2 id="status-summary-title">Resumo operacional</h2></div><p>Comparação automática com os 7 dias anteriores.</p></div>' .
        '<div class="status-summary-grid">' . $overviewCards . "</div>" .
        "</section>";
    $statusPerformance =
        '<section class="status-performance" aria-labelledby="status-performance-title">' .
        '<div class="status-section-heading"><div><span>Histórico recente</span><h2 id="status-performance-title">Desempenho da plataforma</h2></div><p>Leituras consolidadas para acompanhamento público.</p></div>' .
        admin_performance_card_html(true) .
        "</section>";
    $card = '<div class="status-public-shell">' . $statusHeader . $statusSummary . $statusPerformance . "</div>";
'''
          if old not in text:
              raise SystemExit('Bloco atual da página status não localizado.')
          text = text.replace(old, new, 1)
          admin.write_text(text, encoding='utf-8')

          css = Path('public/assets/design-system.css')
          css_text = css.read_text(encoding='utf-8')
          marker = 'body.status-public{margin:0!important;padding:0!important;background:'
          start = css_text.index(marker)
          replacement = r'''body.status-public{margin:0!important;padding:0!important;background:linear-gradient(180deg,var(--md-sys-color-surface-container-low,#eef5f1) 0,var(--md-sys-color-surface,#f7faf8) 360px)!important;}
body.status-public #conteudo{width:100%!important;max-width:none!important;margin:0!important;padding:clamp(18px,4vw,52px) clamp(14px,4vw,48px) 56px!important;}
body.status-public .status-public-shell{width:min(1180px,100%);margin-inline:auto;display:grid;gap:28px;}
body.status-public .status-page-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:clamp(20px,3vw,32px);border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 72%,transparent);border-radius:32px;background:color-mix(in srgb,var(--md-sys-color-surface-container-lowest) 94%,transparent);box-shadow:var(--md-sys-elevation-level1);}
body.status-public .status-page-brand{display:flex;align-items:center;gap:18px;min-width:0;}
body.status-public .status-page-icon{display:grid;place-items:center;flex:0 0 58px;width:58px;height:58px;border-radius:20px;background:var(--clinic-accent-soft);color:var(--clinic-accent-dark);}
body.status-public .status-page-icon .pt-icon-glyph{font-size:31px;}
body.status-public .status-page-eyebrow,body.status-public .status-section-heading span{display:block;margin:0 0 5px;color:var(--clinic-accent-dark);font:var(--md-sys-typescale-label-medium);font-weight:800;letter-spacing:.045em;text-transform:uppercase;}
body.status-public .status-page-header h1{margin:0;color:var(--md-sys-color-on-surface);font:var(--md-sys-typescale-headline-medium);font-weight:850;letter-spacing:-.035em;}
body.status-public .status-page-header p{margin:6px 0 0;color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-body-large);line-height:1.45;}
body.status-public .status-operational-state{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;color:var(--clinic-accent-dark);background:var(--clinic-accent-soft);font:var(--md-sys-typescale-label-large);font-weight:800;white-space:nowrap;}
body.status-public .status-operational-state>span{width:9px;height:9px;border-radius:50%;background:var(--clinic-accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--clinic-accent) 15%,transparent);}
body.status-public .status-summary,body.status-public .status-performance{display:grid;gap:16px;}
body.status-public .status-section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;padding-inline:4px;}
body.status-public .status-section-heading h2{margin:0;color:var(--md-sys-color-on-surface);font:var(--md-sys-typescale-title-large);font-weight:850;letter-spacing:-.025em;}
body.status-public .status-section-heading p{max-width:420px;margin:0;color:var(--md-sys-color-on-surface-variant);font:var(--md-sys-typescale-body-medium);text-align:right;}
body.status-public .status-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
body.status-public .status-summary-grid>.stat-card{display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;grid-template-rows:auto auto auto!important;column-gap:14px!important;row-gap:3px!important;min-width:0!important;min-height:154px!important;margin:0!important;padding:20px!important;border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 76%,transparent)!important;border-radius:24px!important;background:var(--md-sys-color-surface-container-lowest)!important;box-shadow:none!important;}
body.status-public .status-summary-grid>.stat-card .stat-icon{grid-column:1!important;grid-row:1/3!important;align-self:start!important;margin:0!important;}
body.status-public .status-summary-grid>.stat-card .stat-title{grid-column:2!important;grid-row:1!important;align-self:end!important;min-width:0!important;margin:0!important;overflow-wrap:anywhere;}
body.status-public .status-summary-grid>.stat-card .stat-value{grid-column:2!important;grid-row:2!important;align-self:start!important;margin:0!important;text-align:left!important;font-variant-numeric:tabular-nums;white-space:nowrap;}
body.status-public .status-summary-grid>.stat-card .stat-subtitle,body.status-public .status-summary-grid>.stat-card small{display:block!important;grid-column:1/3!important;grid-row:3!important;align-self:end!important;margin:13px 0 0!important;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 70%,transparent);color:var(--md-sys-color-on-surface-variant)!important;font:var(--md-sys-typescale-label-medium)!important;font-variant-numeric:tabular-nums;line-height:1.35;}
body.status-public .admin-performance-card{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 76%,transparent)!important;border-radius:28px!important;box-shadow:none!important;background:var(--md-sys-color-surface-container-lowest)!important;overflow:hidden!important;}
body.status-public .admin-performance-card>.section-head{display:none!important;}
body.status-public .global-performance-charts{width:auto!important;max-width:none!important;margin:0!important;padding:16px!important;gap:14px!important;border:0!important;border-radius:0!important;background:transparent!important;}
body.status-public .global-performance-charts>.metric-area-chart{width:100%!important;max-width:none!important;margin:0!important;padding:18px!important;border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 74%,transparent)!important;border-radius:20px!important;box-shadow:none!important;background:var(--md-sys-color-surface-container-low)!important;}
body.status-public .global-performance-charts>.metric-area-chart svg{display:block;width:100%!important;max-width:none!important;}
@media(max-width:860px){body.status-public .status-summary-grid{grid-template-columns:1fr;}body.status-public .status-summary-grid>.stat-card{min-height:126px!important;}body.status-public .status-section-heading{align-items:start;flex-direction:column;gap:5px;}body.status-public .status-section-heading p{text-align:left;}}
@media(max-width:620px){body.status-public #conteudo{padding:10px 10px 32px!important;}body.status-public .status-public-shell{gap:22px;}body.status-public .status-page-header{align-items:flex-start;flex-direction:column;padding:20px;border-radius:24px;}body.status-public .status-page-brand{align-items:flex-start;gap:13px;}body.status-public .status-page-icon{flex-basis:46px;width:46px;height:46px;border-radius:16px;}body.status-public .status-page-icon .pt-icon-glyph{font-size:25px;}body.status-public .status-page-header h1{font-size:1.45rem;}body.status-public .status-page-header p{font-size:.9rem;}body.status-public .status-operational-state{min-height:36px;padding-inline:13px;}body.status-public .status-summary-grid{gap:10px;}body.status-public .status-summary-grid>.stat-card{min-height:118px!important;padding:17px!important;border-radius:20px!important;}body.status-public .admin-performance-card{border-radius:22px!important;}body.status-public .global-performance-charts{padding:10px!important;gap:10px!important;}body.status-public .global-performance-charts>.metric-area-chart{padding:13px!important;border-radius:16px!important;}}
'''
          css_text = css_text[:start] + replacement
          css.write_text(css_text, encoding='utf-8')

          for path in [Path('ssd/.status-public-ds'), Path('.github/workflows/agent-status-public-ds.yml')]:
              if path.exists():
                  path.unlink()
          PY
          php -l app/Admin/AdminPages.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reformular UX pública da tela status"
          git push origin HEAD:"$HEAD_BRANCH"
