name: Temporary Telemetry KPI Single Line Reconcile

"on":
  push:
    branches:
      - agent/telemetry-kpi-single-line

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telemetry-kpi-single-line
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply and validate single-line KPI layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          css_path = Path('public/assets/design-system.css')
          css = css_path.read_text()
          replacements = {
              '.stat-card.telemetry-kpi-card .telemetry-kpi-value{display:flex;align-items:baseline;gap:7px;white-space:nowrap}': '.stat-card.telemetry-kpi-card .telemetry-kpi-value{display:inline-flex;align-items:center;flex-wrap:nowrap;gap:7px;white-space:nowrap;width:max-content;min-width:max-content}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-value>b{display:inline-block}': '.stat-card.telemetry-kpi-card .telemetry-kpi-value>b{display:inline-block;flex:0 0 auto;white-space:nowrap}',
              '.stat-card.telemetry-kpi-card .telemetry-kpi-trend{display:inline-flex!important;align-items:center;gap:2px;position:relative;top:-.28em;font-size:.72rem!important;line-height:1!important;font-weight:800!important;letter-spacing:-.01em;white-space:nowrap}': '.stat-card.telemetry-kpi-card .telemetry-kpi-trend{display:inline-flex!important;align-items:center;flex:0 0 auto;gap:2px;position:static;top:auto;font-size:.72rem!important;line-height:1!important;font-weight:800!important;letter-spacing:-.01em;white-space:nowrap}',
          }
          for old, new in replacements.items():
              if css.count(old) != 1:
                  raise SystemExit('CSS KPI target count != 1: ' + old)
              css = css.replace(old, new, 1)
          css_path.write_text(css)
          contract_path = Path('tools/telemetry-json-source-contract-check')
          contract = contract_path.read_text()
          old_token = "    'top:-.28em',"
          new_tokens = "    '.stat-card.telemetry-kpi-card .telemetry-kpi-value{display:inline-flex;align-items:center;flex-wrap:nowrap;gap:7px;white-space:nowrap;width:max-content;min-width:max-content}',\n    '.stat-card.telemetry-kpi-card .telemetry-kpi-value>b{display:inline-block;flex:0 0 auto;white-space:nowrap}',\n    '.stat-card.telemetry-kpi-card .telemetry-kpi-trend{display:inline-flex!important;align-items:center;flex:0 0 auto;gap:2px;position:static;top:auto;',"
          if contract.count(old_token) != 1:
              raise SystemExit('contract superscript token count != 1')
          contract = contract.replace(old_token, new_tokens, 1)
          needle = "    $assert(str_contains($css, $trendCssToken), 'CSS minimalista dos KPIs divergente: ' . $trendCssToken);\n}\n"
          addition = needle + "$assert(!str_contains($css, 'top:-.28em'), 'KPIs não podem deslocar a tendência para fora da linha do valor');\n"
          if contract.count(needle) != 1:
              raise SystemExit('contract trend loop count != 1')
          contract_path.write_text(contract.replace(needle, addition, 1))
          PY
          php -l tools/telemetry-json-source-contract-check
          php tools/telemetry-json-source-contract-check
          php tools/code-comment-check.php
          rm .github/workflows/reconcile-telemetry-kpi-single-line.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/telemetry-json-source-contract-check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(telemetry): keep KPI value trend on one line'
          git push
