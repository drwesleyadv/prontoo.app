name: Presentation UX Contract Finalizer
on:
  push:
    branches: [agent/presentation-ux-regression-contract]
    paths:
      - .github/workflows/presentation-ux-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-ux-regression-contract
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Integrate contract and reconcile release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/quality-gate')
          s=p.read_text()
          old="$run('presentation-css-artifact-equivalence', 'tools/presentation-css-build', ['--check']);"
          new=old+"\n$run('presentation-observable-ux-baseline', 'tools/presentation-ux-baseline-check.php');"
          if s.count(old)!=1:
              raise SystemExit('quality gate Presentation anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git rm -f .github/workflows/presentation-ux-finalize.yml
          php tools/presentation-ux-baseline-check.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check
          git commit -m "ci(presentation): enforce observable UX regression contract"
          git push origin HEAD:agent/presentation-ux-regression-contract
