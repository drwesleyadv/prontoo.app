name: Documentation Release Fix

on:
  push:
    branches:
      - docs/session-idle-rationale
    paths:
      - .github/workflows/documentation-release-fix.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          path = Path('version.json')
          data = json.loads(path.read_text())
          if data.get('version') != '1.9.15.8':
              raise SystemExit('release canônica inesperada')
          data['logic_changes'] = True
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
          rm .github/workflows/documentation-release-fix.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/superseded-reference-contract-check
          php tools/version-asset-contract-check.php
          php tools/install-security-check.php
          php tools/security-regression-check.php
          php tools/quality-gate --fast
          php tools/documentation-check.php
          git diff --check
      - name: Commit reconciled metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Corrige metadado contratual da release 1.9.15.8"
          git push origin HEAD:docs/session-idle-rationale
