name: Reconcile status landing card

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-landing-load-card' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Reconcile implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
            python3 <<'PY'
          from pathlib import Path
          path = Path('app/Admin/AdminPages.php')
          text = path.read_text(encoding='utf-8')
          shared_start = text.index('function admin_performance_card_content_html(bool $public = false): string')
          shared_end = text.index('function admin_performance_card_html(bool $public = false): string', shared_start)
          shared = '''function admin_performance_card_content_html(bool $public = false): string
          {
              return '<div class="section-head admin-performance-head"><h2>Desempenho geral</h2>' .
                  admin_maestro_health_pill_html(!$public) .
                  "</div>" .
                  admin_global_perf_charts_html();
          }
          '''
          text = text[:shared_start] + shared + text[shared_end:]
          status_start = text.index('function page_status(): void')
          status_end = text.index('function page_admin_operations(): void', status_start)
          status = text[status_start:status_end]
          anchor = '    $card = admin_performance_card_html(true);\n'
          implementation = '''    $summary = function_exists("telemetry_route_performance_summary")
              ? telemetry_route_performance_summary(24)
              : ["routes" => []];
              $landingRequests24h = 0;
              foreach ((array) ($summary["routes"] ?? []) as $routePerformance) {
                  if ((string) ($routePerformance["route"] ?? "") !== "landing") {
                      continue;
                  }
                  $landingRequests24h = max(
                      0,
                      (int) ($routePerformance["count"] ?? 0),
                  );
                  break;
              }
              $landingCard = card(
                  '<div class="stats-grid admin-overview-kpis status-landing-kpi">' .
                      stat_card(
                          "Carregamentos da landing page",
                          $landingRequests24h,
                          "web",
                          "carregamentos nas últimas 24 horas",
                      ) .
                      "</div>",
                  "status-landing-load-card",
              );
              $card = $landingCard . admin_performance_card_html(true);
          '''
          existing_marker = '    $summary = function_exists("telemetry_route_performance_summary")'
          if existing_marker in status:
              prefix = status[:status.index(existing_marker)]
              echo_pos = status.index('    echo ', status.index(existing_marker))
              status = prefix + implementation + status[echo_pos:]
          elif anchor in status:
              status = status.replace(anchor, implementation, 1)
          else:
              raise SystemExit('Ponto de inserção da tela status não localizado.')
          text = text[:status_start] + status + text[status_end:]
          path.write_text(text, encoding='utf-8')
          for marker_name in ['ssd/.status-landing-final', 'ssd/.status-landing-load-card-ci', 'ssd/.status-landing-verify']:
              marker = Path(marker_name)
              if marker.exists(): marker.unlink()
          PY
            php -l app/Admin/AdminPages.php >/dev/null
            php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/Admin/AdminPages.php app/update.manifest.json ssd/.status-landing-final ssd/.status-landing-load-card-ci ssd/.status-landing-verify 2>/dev/null || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Restringir card de carregamentos à tela status"
            if git push origin HEAD:"$HEAD_BRANCH"; then exit 0; fi
            sleep 3
          done
          exit 1
