name: Presentation CSS Selector Audit
on:
  push:
    branches: [agent/presentation-css-debt-reduction-1]
    paths:
      - tools/presentation-css-selector-audit
      - .github/workflows/presentation-css-selector-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-debt-reduction-1
      - name: Audit duplicated selector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tinycss2
          python3 tools/presentation-css-selector-audit
