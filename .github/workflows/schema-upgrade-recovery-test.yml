name: Schema Upgrade Recovery Test

on:
  push:
    branches:
      - fix/schema-contract-upgrade-1-9-15-9

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.43@sha256:3e646bcda0d9448ffa3d2024eef04e1bca95528ec19b9e8b76749da9d97d4a10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prontoo_schema
      DB_USERNAME: root
      DB_PASSWORD: root
      PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;dbname=prontoo_schema;charset=utf8mb4
      PRONTOO_SCHEMA_USER: root
      PRONTOO_SCHEMA_PASS: root
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      PRONTOO_SCHEMA_TEST_MODE: '1'
      PRONTOO_INSTALLER_CLI_MODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Syntax and schema baseline
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Core/Database/SchemaMutationLock.php
          php -l app/Infrastructure/DatabaseSchema/KnownSchemaUpgrade.php
          php -l app/Infrastructure/DatabaseSchema/RuntimeSchemaReadiness.php
          php tools/schema-check.php
      - name: Reproduce predecessor and auto-upgrade
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prontoo-schema-upgrade-test.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = getcwd();
          $config = [
              'db_host' => '127.0.0.1',
              'db_name' => 'prontoo_schema',
              'db_user' => 'root',
              'db_pass' => 'root',
              'app_env' => 'development',
          ];
          $configPath = '/tmp/prontoo-schema-upgrade-config.php';
          file_put_contents($configPath, "<?php\nreturn " . var_export($config, true) . ";\n");
          putenv('PRONTOO_CONFIG_PATH=' . $configPath);
          putenv('GITHUB_ACTIONS=true');
          putenv('CI=true');
          putenv('PRONTOO_SCHEMA_TEST_MODE=1');
          putenv('PRONTOO_INSTALLER_CLI_MODE=1');

          require $root . '/app/prontoo.php';

          $pdo = \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations01::pdo();
          $tables = $pdo->query("SELECT TABLE_NAME FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'")->fetchAll(PDO::FETCH_COLUMN);
          $pdo->exec('SET FOREIGN_KEY_CHECKS=0');
          foreach ($tables as $table) {
              $pdo->exec('DROP TABLE `' . str_replace('`', '``', (string) $table) . '`');
          }
          $pdo->exec('SET FOREIGN_KEY_CHECKS=1');
          \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations01::prontoo_schema_clear_caches();

          \Prontoo\Core\Database\SchemaMutationLock::runForInstaller(static function (): void {
              \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations03::install_fresh_schema();
          });

          $pdo = \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations01::pdo();
          $expected = \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations02::prontoo_schema_contract_hash();
          $previous = '28515f46af3081e5ac0dded5723e6d2d7ceddec11e9c6f782975f31931a69d33';
          if (hash_equals($expected, $previous)) {
              throw new RuntimeException('O contrato atual não divergiu do predecessor esperado.');
          }

          \Prontoo\Core\Database\SchemaMutationLock::runForInstaller(static function (): void {
              foreach ([
                  'ALTER TABLE `pi_agenda_notes` DROP FOREIGN KEY `fk_agenda_notes_doctor_user`',
                  'ALTER TABLE `pi_agenda_notes` DROP INDEX `idx_agenda_notes_timed`',
                  'ALTER TABLE `pi_agenda_notes` DROP INDEX `idx_fk_agenda_notes_doctor_user_id`',
                  'ALTER TABLE `pi_agenda_notes` DROP COLUMN `end_at`',
                  'ALTER TABLE `pi_agenda_notes` DROP COLUMN `start_at`',
                  'ALTER TABLE `pi_agenda_notes` DROP COLUMN `doctor_user_id`',
              ] as $ddl) {
                  \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations02::run_schema_sql($ddl);
              }
          });

          $meta = $pdo->prepare("UPDATE pi_meta SET meta_value=?,updated_at=? WHERE meta_key='schema_contract_hash'");
          $meta->execute([$previous, time()]);
          file_put_contents(
              \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations02::schema_lock_file(),
              json_encode(['revision' => PRONTOO_SCHEMA_REV, 'contract' => $previous, 'generated_at' => gmdate('c')], JSON_UNESCAPED_SLASHES),
              LOCK_EX,
          );

          \Prontoo\Infrastructure\DatabaseSchema\RuntimeSchemaReadiness::ensure();

          foreach (['doctor_user_id', 'start_at', 'end_at'] as $column) {
              if (!\Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations02::db_column_exists('pi_agenda_notes', $column)) {
                  throw new RuntimeException('Coluna não restaurada: ' . $column);
              }
          }
          $stored = (string) $pdo->query("SELECT meta_value FROM pi_meta WHERE meta_key='schema_contract_hash' LIMIT 1")->fetchColumn();
          if (!hash_equals($expected, $stored)) {
              throw new RuntimeException('Hash persistido não foi atualizado.');
          }
          $marker = json_decode((string) file_get_contents(\Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations02::schema_lock_file()), true);
          if (!is_array($marker) || !hash_equals($expected, (string) ($marker['contract'] ?? ''))) {
              throw new RuntimeException('Marcador do schema não foi atualizado.');
          }
          $blocked = false;
          try {
              \Prontoo\Infrastructure\DatabaseSchema\DatabaseSchemaInfrastructureOperations01::db_reject_runtime_ddl('ALTER TABLE pi_meta ADD COLUMN forbidden int');
          } catch (RuntimeException $error) {
              $blocked = str_contains($error->getMessage(), 'estrutura do banco está congelada');
          }
          if (!$blocked) {
              throw new RuntimeException('DDL arbitrário deixou de ser bloqueado.');
          }
          echo json_encode(['ok' => true, 'previous' => $previous, 'current' => $expected], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES), PHP_EOL;
          PHP
          php /tmp/prontoo-schema-upgrade-test.php
      - name: Security regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/install-security-check.php
