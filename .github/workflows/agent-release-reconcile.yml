name: Agent Release Reconcile

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/cache-json-scoped-generations
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Finalize cache release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Infrastructure/ServerJsonCache/ScopedServerJsonCacheInfrastructureOperations01.php')
          source = path.read_text()
          old = "'appointments' => ['agenda', 'recepcao', 'dashboard'],"
          new = "'appointments' => ['agenda', 'recepcao', 'financial', 'gavetas', 'dashboard'],"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Contrato de dependências de appointments não localizado.')
          path.write_text(source)
          PY
          rm -f .github/workflows/agent-release-reconcile.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php -l app/Infrastructure/ServerJsonCache/ScopedServerJsonCacheInfrastructureOperations01.php
          php -l app/Runtime/ServerJsonCache/ServerJsonCacheRuntimeOperations01.php
          php -l app/Runtime/Runner.php
      - name: Commit canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reconcilia contratos da versão 1.8.18.1"
          git push origin HEAD:agent/cache-json-scoped-generations
