name: Agent Release Reconcile

on:
  pull_request:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Generate deterministic release outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-release-reconcile.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php -l app/Infrastructure/ServerJsonCache/ScopedServerJsonCacheInfrastructureOperations01.php
          php -l app/Runtime/ServerJsonCache/ServerJsonCacheRuntimeOperations01.php
          php -l app/Runtime/Runner.php
          echo "PRONTOO_ARCHITECTURE_MANIFEST_B64=$(base64 -w0 app/architecture.manifest.json)"
          echo "PRONTOO_UPDATE_MANIFEST_B64=$(base64 -w0 app/update.manifest.json)"
