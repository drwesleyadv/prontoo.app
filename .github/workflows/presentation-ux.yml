name: Presentation UX Contract
on:
  pull_request:
    branches: [prontoo]
  push:
    branches: [prontoo]
permissions:
  contents: read
jobs:
  computed-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned browser contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify computed-style UX baseline
        run: node tools/presentation-ux-contract.mjs --check
