name: Finalize Smoke Isolation

on:
  push:
    branches:
      - agent/maintenance-security-refactor-touch
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/maintenance-security-refactor-touch' || github.ref == 'refs/heads/agent/maintenance-security-refactor-touch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/maintenance-security-refactor-touch
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Patch real deferred-audit spools and reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('tools/login-logout-http-smoke')
          text = p.read_text()
          old = '''AUDIT_SPOOL="$ROOT/ssd/cache/maestro-audit"
AUDIT_BEFORE="$TMP/audit-before.txt"
SERVER_PID=""
STEP="bootstrap"

if [[ -d "$AUDIT_SPOOL" ]]; then
  find "$AUDIT_SPOOL" -maxdepth 1 -type f -name 'audit-*.json' -printf '%f\\n' | sort >"$AUDIT_BEFORE"
else
  : >"$AUDIT_BEFORE"
fi
'''
          new = '''AUDIT_DIRS=("$ROOT/ssd/maestro-deferred" "$ROOT/ssd/logs/maestro-deferred-emergency")
AUDIT_BEFORE="$TMP/audit-before.txt"
SERVER_PID=""
STEP="bootstrap"

: >"$AUDIT_BEFORE"
for audit_dir in "${AUDIT_DIRS[@]}"; do
  if [[ -d "$audit_dir" ]]; then
    find "$audit_dir" -type f -print
  fi
done | sort -u >"$AUDIT_BEFORE"
'''
          if text.count(old) != 1:
              raise SystemExit(f'audit header anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_cleanup = '''  if [[ -d "$AUDIT_SPOOL" ]]; then
    while IFS= read -r file; do
      base="$(basename "$file")"
      if ! grep -Fxq "$base" "$AUDIT_BEFORE"; then
        rm -f -- "$file"
      fi
    done < <(find "$AUDIT_SPOOL" -maxdepth 1 -type f -name 'audit-*.json' -print)
  fi
'''
          new_cleanup = '''  for audit_dir in "${AUDIT_DIRS[@]}"; do
    if [[ -d "$audit_dir" ]]; then
      while IFS= read -r file; do
        if ! grep -Fxq "$file" "$AUDIT_BEFORE"; then
          rm -f -- "$file"
        fi
      done < <(find "$audit_dir" -type f -print)
      find "$audit_dir" -depth -type d -empty -delete 2>/dev/null || true
    fi
  done
'''
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'audit cleanup anchor count={text.count(old_cleanup)}')
          p.write_text(text.replace(old_cleanup, new_cleanup, 1))
          PY
          rm -f .github/workflows/finalize-smoke-isolation.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/runtime-input-boundary-check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/quality-gate --fast
          bash -n tools/login-logout-http-smoke
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              .github/workflows/*) continue ;;
            esac
            git add -- "$path"
          done < <(git diff --name-only)
          if ! git diff --cached --quiet; then
            git commit -m 'test(security): isolate real deferred-audit spools'
            git push origin HEAD:agent/maintenance-security-refactor-touch
          fi
