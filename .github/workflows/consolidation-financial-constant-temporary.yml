name: Consolidation Financial Constant Temporary

on:
  pull_request:
    branches: [prontoo]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/consolidation-audit-20260809'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-audit-20260809
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Fix native financial constant and reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/Domain/Financial/FinancialDomainOperations01.php')
          s = p.read_text()
          marker = "final class FinancialDomainOperations01\n{\n"
          if marker not in s:
              raise SystemExit('financial domain class marker not found')
          if 'private const FINANCIAL_MAX_CENTS' not in s:
              s = s.replace(marker, marker + '    private const FINANCIAL_MAX_CENTS = 2147483647;\n\n', 1)
          if 'PRONTOO_FINANCIAL_MAX_CENTS' not in s:
              raise SystemExit('legacy financial constant reference not found')
          s = s.replace('PRONTOO_FINANCIAL_MAX_CENTS', 'self::FINANCIAL_MAX_CENTS')
          p.write_text(s)
          PY
          php -l app/Domain/Financial/FinancialDomainOperations01.php
          php tools/release-contract-reconcile --write
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Domain/Financial/FinancialDomainOperations01.php app/update.manifest.json app/architecture.manifest.json version.json app/prontoo.php br/index.php CHANGELOG.md .github/workflows/architecture.yml .github/workflows/documentation.yml
          git commit -m 'fix: internalize financial amount ceiling constant'
          git push origin HEAD:agent/consolidation-audit-20260809
