name: Agent Developer Clinics Reconcile

on:
  push:
    branches:
      - agent/developer-clinics-filters-login-order

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/developer-clinics-filters-login-order
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply developer clinic directory policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          root = Path('.')
          old_version = '1.8.18.1'
          new_version = '1.8.18.2'

          sql_path = root / 'app/Infrastructure/Operational/AdminPagesSqlCatalog08.php'
          sql = sql_path.read_text(encoding='utf-8')
          old_sql = "SELECT id,display_name,responsible_profession,active,onboarding_done,owner_user_id,manager_user_id,created_at,trial_started_at,trial_ends_at,subscription_status,paid_until,monthly_price_cents FROM pi_clinics ORDER BY CASE WHEN active=0 THEN 4 WHEN subscription_status='exempt' THEN 3 WHEN subscription_status='read_only' OR (subscription_status<>'active' AND (paid_until IS NULL OR paid_until<CURDATE()) AND (trial_ends_at IS NULL OR trial_ends_at<NOW())) THEN 0 ELSE 2 END ASC, updated_at DESC, id DESC LIMIT 120"
          new_sql = "SELECT c.id,c.display_name,c.responsible_profession,c.active,c.onboarding_done,c.owner_user_id,c.manager_user_id,c.created_at,c.trial_started_at,c.trial_ends_at,c.subscription_status,c.paid_until,c.monthly_price_cents,ll.last_collaborator_login_at FROM pi_clinics c LEFT JOIN (SELECT ur.clinic_id,MAX(u.last_login_at) AS last_collaborator_login_at FROM pi_user_roles ur JOIN pi_users u ON u.id=ur.user_id AND u.active=1 WHERE ur.active=1 GROUP BY ur.clinic_id) ll ON ll.clinic_id=c.id ORDER BY ll.last_collaborator_login_at IS NULL ASC,ll.last_collaborator_login_at DESC,c.id DESC LIMIT 120"
          if sql.count(old_sql) != 1:
              raise SystemExit('SQL canônico da lista de consultórios não localizado exatamente uma vez.')
          sql_path.write_text(sql.replace(old_sql, new_sql, 1), encoding='utf-8')

          presentation_path = root / 'app/Presentation/AdminPages/AdminPagesPresentationOperations03.php'
          source = presentation_path.read_text(encoding='utf-8')
          old_views = '["all", "attention", "onboarding", "readonly", "expiring"]'
          new_views = '["all", "active", "expiring", "readonly"]'
          if source.count(old_views) != 2:
              raise SystemExit(f'Esperadas 2 listas de views antigas; encontrado {source.count(old_views)}.')
          source = source.replace(old_views, new_views)

          old_filters = '''        $filterSpecs = [
            "all" => ["Todos", "format_list_bulleted"],
            "attention" => ["Atenção", "priority_high"],
            "onboarding" => ["Onboarding", "playlist_add_check"],
            "readonly" => ["Somente leitura", "lock"],
            "expiring" => ["Vencendo", "event_upcoming"],
        ];'''
          new_filters = '''        $filterSpecs = [
            "all" => ["Todos", "format_list_bulleted"],
            "active" => ["Ativos", "verified"],
            "expiring" => ["Vencendo", "event_upcoming"],
            "readonly" => ["Somente Leitura", "lock"],
        ];'''
          if source.count(old_filters) != 1:
              raise SystemExit('Bloco canônico de filtros não localizado.')
          source = source.replace(old_filters, new_filters, 1)

          old_clock = '''        $now = time();
        foreach ($rows as $entry) {'''
          new_clock = '''        $todayStart = strtotime("today");
        if ($todayStart === false) {
            $todayStart = time();
        }
        $expiringLimit = $todayStart + 10 * 86400 + 86399;
        foreach ($rows as $entry) {'''
          if source.count(old_clock) != 1:
              raise SystemExit('Relógio canônico da lista não localizado.')
          source = source.replace(old_clock, new_clock, 1)

          old_expiring = '''            $expiresSoon = empty($billing["exempt"]) &&
                $dueTimestamp !== false &&
                $dueTimestamp >= $now &&
                $dueTimestamp <= $now + 7 * 86400;'''
          new_expiring = '''            $expiresSoon = empty($billing["exempt"]) &&
                $dueTimestamp !== false &&
                $dueTimestamp >= $todayStart &&
                $dueTimestamp <= $expiringLimit;'''
          if source.count(old_expiring) != 1:
              raise SystemExit('Regra antiga de vencimento não localizada.')
          source = source.replace(old_expiring, new_expiring, 1)

          old_match = '''            $matchesFilter = match ($view) {
                "attention" => $needsAttention,
                "onboarding" => $onboardingPending,
                "readonly" => !empty($billing["read_only"]),
                "expiring" => $expiresSoon,
                default => true,
            };'''
          new_match = '''            $isActive = (int) ($r["active"] ?? 0) === 1 && empty($billing["read_only"]);
            $matchesFilter = match ($view) {
                "active" => $isActive,
                "expiring" => $expiresSoon,
                "readonly" => !empty($billing["read_only"]),
                default => true,
            };'''
          if source.count(old_match) != 1:
              raise SystemExit('Match antigo de filtros não localizado.')
          source = source.replace(old_match, new_match, 1)
          presentation_path.write_text(source, encoding='utf-8')

          excluded = {'.git', 'ssd', 'vendor', 'node_modules'}
          workflow = Path('.github/workflows/agent-developer-clinics-reconcile.yml')
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts) or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old_version in text:
                  path.write_text(text.replace(old_version, new_version), encoding='utf-8')

          version_path = root / 'version.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if version.get('version') != new_version or version.get('release') != new_version:
              raise SystemExit('Substituição canônica da versão não convergiu para 1.8.18.2.')
          now = datetime.now(ZoneInfo('America/Cuiaba')).replace(microsecond=0)
          iso = now.isoformat()
          version.update({
              'version': new_version,
              'release': new_version,
              'asset_version': new_version,
              'generated_at_unix': int(now.timestamp()),
              'generated_at': iso,
              'updated_at': iso,
              'build': '1.8.18.2-developer-clinics-login-order',
              'package_type': 'incremental_refinement',
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': False,
              'functional_equivalence_policy': 'developer_clinic_directory_filters_and_collaborator_login_recency_order_without_schema_change',
              'notes': 'Consultórios do Desenvolvedor passam a usar somente os filtros Todos, Ativos, Vencendo e Somente Leitura; Vencendo cobre até 10 dias e todas as listas seguem o login mais recente dos colaboradores.',
              'deployment_sync_id': 'github-prontoo-1.8.18.2-developer-clinics-login-order',
              'deployment_sync_requested_at': iso,
              'release_date': now.date().isoformat(),
              'changelog': {
                  'title': 'Filtros e ordenação dos consultórios por atividade',
                  'items': [
                      'reordena os filtros da lista global para Todos, Ativos, Vencendo e Somente Leitura',
                      'considera Vencendo os consultórios cuja assinatura termina entre hoje e os próximos 10 dias',
                      'ordena todas as listas pelo login mais recente entre colaboradores ativos do consultório, do mais recente para o mais antigo',
                      'mantém consultórios sem login de colaborador ao final e não altera schema ou banco de dados'
                  ]
              }
          })
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

          old='1.8.18.1'
          new='1.8.18.2'
          cp "public/assets/app-icon-${old}.png" "public/assets/app-icon-${new}.png"
          cp "public/assets/favicon-${old}.png" "public/assets/favicon-${new}.png"
          cp "public/assets/favicon-${old}.ico" "public/assets/favicon-${new}.ico"
          cp "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"
          cp "public/assets/prontoo-mark-${old}.png" "public/assets/prontoo-mark-${new}.png"
          rm -f \
            "public/assets/app-icon-${old}.png" \
            "public/assets/favicon-${old}.ico" \
            "public/assets/favicon-${old}.png" \
            "public/assets/pix-${old}.svg" \
            "public/assets/prontoo-mark-${old}.png"

          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'app/Presentation/Styles/styles.manifest.json'
          source_root = root / 'app/Presentation/Styles'
          target = 'components/components.css'
          old_literal = b'1.8.18.1'
          new_literal = b'1.8.18.2'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          old_source = subprocess.check_output(['git', 'show', f'origin/prontoo:app/Presentation/Styles/{target}'])
          new_source = (source_root / target).read_bytes()
          if old_source.replace(old_literal, new_literal) != new_source:
              raise SystemExit('Mudança em components.css excede a troca canônica da versão dos assets.')
          source_entry = next((entry for entry in manifest['sources'] if entry['path'] == target), None)
          if source_entry is None:
              raise SystemExit('Fonte components/components.css ausente do manifesto.')
          source_entry['sha256'] = hashlib.sha256(new_source).hexdigest()
          source_entry['bytes'] = len(new_source)
          source_entry['important_count'] = new_source.count(b'!important')
          source_entry['route_scope_count'] = new_source.count(b'body[data-route=')
          reconstructed = bytearray()
          new_offset = 0
          component_segments = [seg for seg in manifest['sequence'] if seg['source'] == target]
          for segment in component_segments:
              old_offset = int(segment['offset'])
              old_bytes = int(segment['bytes'])
              old_slice = old_source[old_offset:old_offset + old_bytes]
              new_slice = old_slice.replace(old_literal, new_literal)
              segment['offset'] = new_offset
              segment['bytes'] = len(new_slice)
              segment['sha256'] = hashlib.sha256(new_slice).hexdigest()
              segment['important_count'] = new_slice.count(b'!important')
              segment['route_scope_count'] = new_slice.count(b'body[data-route=')
              reconstructed.extend(new_slice)
              new_offset += len(new_slice)
          if bytes(reconstructed) != new_source:
              raise SystemExit('Sequência de components.css não reconstrói a fonte canônica.')
          source_data = {entry['path']: (source_root / entry['path']).read_bytes() for entry in manifest['sources']}
          built = bytearray()
          next_offsets = {path: 0 for path in source_data}
          for segment in manifest['sequence']:
              source = segment['source']
              offset = int(segment['offset'])
              size = int(segment['bytes'])
              if offset != next_offsets[source]:
                  raise SystemExit(f'Cobertura descontínua em {source}.')
              chunk = source_data[source][offset:offset + size]
              if len(chunk) != size or hashlib.sha256(chunk).hexdigest() != segment['sha256']:
                  raise SystemExit(f'Hash de slice divergente em {source}.')
              built.extend(chunk)
              next_offsets[source] += size
          for source, data in source_data.items():
              if next_offsets[source] != len(data):
                  raise SystemExit(f'Fonte não integralmente coberta: {source}.')
          artifact = manifest['artifact_contract']
          artifact['sha256'] = hashlib.sha256(bytes(built)).hexdigest()
          artifact['bytes'] = len(built)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          (root / manifest['artifact']).write_bytes(bytes(built))
          PY

          rm -f .github/workflows/agent-developer-clinics-reconcile.yml
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git add -A
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/php84-runtime-contract-check
          php tools/presentation-visual-contract-check
          php -l app/Infrastructure/Operational/AdminPagesSqlCatalog08.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          git show origin/prontoo:public/assets/app-icon-1.8.18.1.png | cmp - public/assets/app-icon-1.8.18.2.png
          git show origin/prontoo:public/assets/favicon-1.8.18.1.ico | cmp - public/assets/favicon-1.8.18.2.ico
          git show origin/prontoo:public/assets/favicon-1.8.18.1.png | cmp - public/assets/favicon-1.8.18.2.png
          git show origin/prontoo:public/assets/pix-1.8.18.1.svg | cmp - public/assets/pix-1.8.18.2.svg
          git show origin/prontoo:public/assets/prontoo-mark-1.8.18.1.png | cmp - public/assets/prontoo-mark-1.8.18.2.png
      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ordena consultórios por atividade recente"
          git push origin HEAD:agent/developer-clinics-filters-login-order
