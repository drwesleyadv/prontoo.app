name: Finalize Prontoo Single Branch Baseline

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/finalize-consolidation-cleanup' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout canonical baseline
        uses: actions/checkout@v4
        with:
          ref: prontoo
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Build final single-branch manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/consolidate-prontoo-branches.yml
          python3 <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json

          manifest_path = Path('app/update.manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = {}
          total = 0
          excluded = ('.git/', 'ssd/', 'vendor/', 'node_modules/')
          for file in Path('.').rglob('*'):
              if not file.is_file() or file.is_symlink():
                  continue
              relative = file.as_posix()
              if relative == 'app/update.manifest.json' or relative.startswith(excluded):
                  continue
              data = file.read_bytes()
              files[relative] = hashlib.sha256(data).hexdigest()
              total += len(data)
          manifest['files'] = dict(sorted(files.items()))
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = total
          manifest['updated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=4) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Validate final baseline tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
      - name: Publish final manifest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/update.manifest.json
          git commit -m "Finalizar manifesto da baseline de branch único"
          git push origin HEAD:prontoo
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Delete finalization trigger branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/delete-branch-response -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_HEAD_REF}")
          if [[ "$status" != "204" ]]; then
            cat /tmp/delete-branch-response
            exit 1
          fi
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "prontoo" ]]; then
            printf 'Branches remanescentes:\n%s\n' "${remaining[*]}"
            exit 1
          fi
          {
            echo '## Baseline de branch único preparada'
            echo
            echo "- Commit do manifesto final: \`${{ steps.publish.outputs.commit }}\`"
            echo '- Branch remanescente: `prontoo`'
            echo '- Rotina temporária pronta para remoção pelo conector.'
          } >> "$GITHUB_STEP_SUMMARY"
