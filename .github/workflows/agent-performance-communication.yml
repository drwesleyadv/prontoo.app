name: Finalizar comunicação de Performance

on:
  push:
    branches:
      - prontoo

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-performance-communication-1-8-6-3
  cancel-in-progress: false

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: true
  CI: true
  PRONTOO_SCHEMA_TEST_MODE: 1
  PRONTOO_INSTALLER_CLI_MODE: 1

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout do branch proposto
        uses: actions/checkout@v4
        with:
          ref: agent/performance-communication-1-8-6-3
          fetch-depth: 0
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Reconstruir candidato sobre prontoo atual
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-performance-communication.py /tmp/agent.py
          cp docs/operations/page-load-telemetry.md /tmp/page-load-telemetry.md
          cp docs/performance/telemetry.md /tmp/performance-telemetry.md
          git fetch origin prontoo
          git reset --hard origin/prontoo
          cp /tmp/agent.py .agent-performance-communication.py
          cp /tmp/page-load-telemetry.md docs/operations/page-load-telemetry.md
          cp /tmp/performance-telemetry.md docs/performance/telemetry.md
          rm -f .github/workflows/agent-performance-communication.yml
          rm -f .github/workflows/finalize-performance-now.yml
          rm -f .trigger-performance-1.8.6.3
          python3 <<'PY'
          from pathlib import Path
          p = Path('.agent-performance-communication.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("timezone = '''function telemetry_cuiaba_tz(): DateTimeZone", "timezone_helper = '''function telemetry_cuiaba_tz(): DateTimeZone", 1)
          s = s.replace('telemetry = once(telemetry, timezone, timezone +', 'telemetry = once(telemetry, timezone_helper, timezone_helper +', 1)
          check_marker = 'check = read("tools/architecture-check.php")'
          check_pos = s.find(check_marker)
          if check_pos < 0:
              raise RuntimeError('Bloco architecture-check não localizado')
          needle = '    ("telemetry_sequence_records_series_20d", "telemetry_sequence_records_series_30d"),\n'
          bad_pos = s.find(needle, check_pos)
          if bad_pos < 0:
              raise RuntimeError('Token inválido do architecture-check não localizado')
          s = s[:bad_pos] + s[bad_pos + len(needle):]
          s = s.replace('    (\'"primary_label" => "Requisições"\', \'"primary_label" => "Visualizações"\'),\n', '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 .agent-performance-communication.py
          test ! -e .agent-performance-communication.py
          test ! -e .github/workflows/agent-performance-communication.yml
          test ! -e .github/workflows/finalize-performance-now.yml
          test ! -e .trigger-performance-1.8.6.3
      - name: Reconciliar manifesto final
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path.cwd()
          manifest_path = root / 'app/update.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = {}
          total = 0
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative == 'app/update.manifest.json' or relative.startswith('.git/') or relative.startswith('ssd/') or relative.startswith('vendor/') or relative.startswith('node_modules/'):
                  continue
              data = path.read_bytes()
              files[relative] = hashlib.sha256(data).hexdigest()
              total += len(data)
          manifest['files'] = files
          manifest['file_count'] = len(files)
          manifest['total_uncompressed_bytes'] = total
          manifest['updated_at'] = datetime.now(timezone.utc).isoformat()
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
      - name: Validar candidato final
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            if grep -qi 'deprecated' <<<"$output"; then
              echo "Depreciação PHP 8.4 em $file" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
          php -r 'require "app/Support/Telemetry.php"; $series=telemetry_route_requests_series_30d(1786032000000000); if(count($series)!==30){throw new RuntimeException("Série diária divergente");} foreach($series as $row){if(!preg_match("/^[DSTQ][0-9]{2}$/", (string)($row["label"]??""))){throw new RuntimeException("Label SDD divergente");}} if(telemetry_retention_microseconds()!==31*86400*1000000){throw new RuntimeException("Retenção divergente");}'
          grep -F '"Visualizações",' app/Admin/AdminPages.php
          grep -F '"Velocidade média",' app/Admin/AdminPages.php
          grep -F '"Visualizações da Landing",' app/Admin/AdminPages.php
          grep -F '<h2>Performance</h2>' app/Admin/AdminPages.php
          grep -F '"Últimas 24 horas",' app/Admin/AdminPages.php
          grep -F '"Últimos 30 dias",' app/Admin/AdminPages.php
          grep -F '"version": "1.8.6.3"' version.json
      - name: Publicar candidato final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prontoo Release"
          git config user.email "release@prontoo.app"
          git add -A
          git commit -m "Release 1.8.6.3 — consolidar comunicação de Performance"
          git push --force-with-lease origin HEAD:agent/performance-communication-1-8-6-3
