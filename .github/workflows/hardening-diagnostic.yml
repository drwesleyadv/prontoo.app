name: Diagnose Hardening 1.7.21.3

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 15
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Extract embedded script
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path
          workflow = Path('.github/workflows/architecture.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", workflow)
          if not match:
              raise RuntimeError('Payload comprimido não encontrado.')
          Path('/tmp/apply-hardening.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/architecture.yml > .github/workflows/architecture.yml

      - name: Execute diagnostic
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          python3 /tmp/apply-hardening.py > /tmp/apply-hardening.log 2>&1

      - name: Capture temporary diff
        if: always()
        shell: bash
        run: |
          git diff --binary > /tmp/hardening.diff || true
          git status --short > /tmp/hardening-status.txt || true

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-1.7.21.3-diagnostic-final
          path: |
            /tmp/apply-hardening.log
            /tmp/hardening.diff
            /tmp/hardening-status.txt
          if-no-files-found: error
          retention-days: 2

      - name: Fail when apply failed
        if: steps.apply.outcome != 'success'
        run: exit 1
