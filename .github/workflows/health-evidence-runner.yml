name: Health Evidence Refactor Runner

on:
  push:
    branches:
      - agent/health-evidence-registry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Apply health evidence registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/health-evidence-refactor.py
          php tools/release-contract-reconcile --write
          php -l app/Infrastructure/Health/HealthEvidenceStore.php
          php -l app/Runtime/Health/HealthEvidenceRegistry.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations01.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations06.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l cron/maestro.php
          php -l tools/health-evidence-contract-check
          php tools/quality-gate
      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/health-evidence-runner.yml
          test ! -e tools/health-evidence-refactor.py
          test ! -e tools/.health-evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: rastrear evidências de saúde"
          git push origin HEAD
