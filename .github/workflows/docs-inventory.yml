name: Documentation Rewrite Apply

on:
  push:
    branches:
      - agent/documentation-rewrite-final-architecture
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-rewrite-final-architecture
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Rewrite all documentation and reconcile release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rewrite-documentation.py
          rm tools/rewrite-documentation.py
          rm .github/workflows/docs-inventory.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/quality-gate --fast
          test "$(find . -type f -name '*.md' -not -path './.git/*' -not -path './vendor/*' -not -path './node_modules/*' -not -path './ssd/*' | wc -l | tr -d ' ')" = "64"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git restore --staged .github/workflows/docs-inventory.yml
          git status --short
          git commit -m 'docs: rewrite complete documentation for consolidated architecture'
          git push origin HEAD:agent/documentation-rewrite-final-architecture
