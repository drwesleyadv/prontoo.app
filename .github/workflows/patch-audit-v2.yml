name: Patch Audit V2

on:
  push:
    branches:
      - audit/consolidation-1-9-14-1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/consolidation-1-9-14-1
          fetch-depth: 0
      - name: Patch V2 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/audit-consolidation-v2.yml')
          text = p.read_text()
          needle = "          $tracked = shell_exec('git -C ' . escapeshellarg($root) . ' ls-files -z --cached');"
          replacement = "          $rootPrefix = rtrim(str_replace('\\\\', '/', $root), '/') . '/';\n" + needle
          if text.count(needle) != 1:
              raise SystemExit(f'expected one tracked-files anchor, found {text.count(needle)}')
          p.write_text(text.replace(needle, replacement))
          PY
          git rm .github/workflows/patch-audit-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserva rootPrefix no reconciliador materializado"
          git push origin HEAD:audit/consolidation-1-9-14-1
