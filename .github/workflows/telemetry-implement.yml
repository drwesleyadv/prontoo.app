          now_local = datetime.now(ZoneInfo('America/Cuiaba')).replace(microsecond=0)
          version['previous_version'] = version.get('version', '1.8.11.2')
          version['version'] = '1.8.11.3'
          version['release'] = '1.8.11.3'
          version['generated_at_unix'] = int(now_local.timestamp())
          version['generated_at'] = now_local.isoformat()
          version['updated_at'] = now_local.isoformat()
          version['build'] = '1.8.11.3-telemetry-30d'
          version['release_date'] = now_local.date().isoformat()
          version['database_changes'] = False
          version['schema_changes'] = False
          version['logic_changes'] = True
          version['visual_changes'] = False
          version['notes'] = 'Telemetria coerente de 30 dias: Visualizações por page_load e Registros por estoque total do banco amostrado pelo Maestro, com comparação civil 15x15 em America/Cuiaba.'
          version['deployment_sync_id'] = 'github-prontoo-1.8.11.3-telemetry-30d'
          version['deployment_sync_requested_at'] = now_local.isoformat()
          version['database_record_telemetry_policy'] = 'maestro_exact_total_snapshot_json_31d_delta_current_minus_previous_cuiaba_complete_30d_15x15'
          version['database_record_telemetry_path'] = 'ssd/telemetry/database-record-counts.json'
          version['changelog'] = {
              'title': 'Telemetria confiável de Visualizações e Registros',
              'items': [
                  'padroniza o gráfico em 30 dias civis completos de America/Cuiaba, divididos em 15 dias recentes e 15 imediatamente anteriores',
                  'mantém Visualizações como eventos page_load válidos e deduplicados por evento_id',
                  'substitui a inferência de Registros pelo estoque exato de linhas de todas as tabelas base, amostrado pelo Maestro a cada execução válida',
                  'calcula Registros como total atual menos o total imediatamente anterior, preservando inclusive deltas negativos',
                  'persiste a série em ssd/telemetry/database-record-counts.json com retenção móvel de 31 dias',
                  'preserva schema e banco sem DDL e adiciona contrato executável para as fronteiras 30d e 15x15'
              ]
          }
          for mapping_key in ['php84_baseline_path_migrations', 'architecture_source_path_migrations']:
              mapping = version.get(mapping_key)
              if isinstance(mapping, dict) and isinstance(mapping.get('app/Support/Telemetry.php'), list):
                  values = mapping['app/Support/Telemetry.php']
                  new_path = 'app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php'
                  if new_path not in values:
                      insert_at = values.index('app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php') if 'app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php' in values else len(values)
                      values.insert(insert_at, new_path)
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n')

          architecture_path = root / 'app/architecture.manifest.json'
          architecture = json.loads(architecture_path.read_text())
          architecture['version'] = '1.8.11.3'
          architecture['database_record_telemetry_policy'] = 'exact_database_row_stock_sampled_by_maestro_json_31d_and_daily_delta_current_minus_previous'
          architecture['database_record_telemetry_contract'] = 'tools/database-record-telemetry-contract-check'
          architecture_path.write_text(json.dumps(architecture, ensure_ascii=False, indent=4) + '\n')

          workflow = root / '.github/workflows/telemetry-implement.yml'
