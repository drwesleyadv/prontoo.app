name: Apply Source Maintenance Guide 1.7.21.7

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.head_ref == 'agent/source-maintenance-guide-1.7.21.7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-maintenance-guide-1.7.21.7
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Restore deterministic transformer
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/source-guide.part* | tr -d '\n\r' | base64 --decode > /tmp/source-guide-scripts.tar.gz
          tar -xzf /tmp/source-guide-scripts.tar.gz -C /tmp
          php -l /tmp/annotate_prontoo.php
          python3 -m py_compile /tmp/finalize_1_7_21_7.py

      - name: Apply source documentation baseline
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/annotate_prontoo.php . | tee /tmp/source-guide-inventory.json
          python3 /tmp/finalize_1_7_21_7.py | tee /tmp/source-guide-finalize.json

      - name: Validate syntax and documentation coverage
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f -name '*.md' -print -quit)"
          test -f ChangeLog.txt
          test ! -e ChangeLog.history.txt
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './storage' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $functions = 0;
          $guides = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator('.', FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || strtolower($file->getExtension()) !== 'php') continue;
              $source = (string) file_get_contents($file->getPathname());
              foreach (token_get_all($source) as $token) {
                  if (is_array($token) && ($token[0] === T_FUNCTION || $token[0] === T_FN)) $functions++;
              }
              $guides += substr_count($source, 'GUIA DE MANUTENÇÃO —');
              $guides += substr_count($source, 'Guia de manutenção:');
          }
          if ($functions !== 1865 || $guides !== $functions) {
              throw new RuntimeException("Cobertura documental inválida: {$guides}/{$functions}");
          }
          echo "Cobertura documental: {$guides}/{$functions}", PHP_EOL;
          PHP

      - name: Validate contracts and authorization
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) throw new RuntimeException("JSON inválido: " . $file);
            }
          '
          php <<'PHP'
          <?php
          require 'app/Core/Invariant/Canonical.php';
          require 'app/Core/Invariant/Decision.php';
          require 'app/Domain/Authorization/ActionContract.php';
          require 'app/Application/Authorization/CapabilityProvider.php';
          require 'app/Application/Authorization/ActionCatalog.php';
          require 'app/Infrastructure/Authorization/RuntimeCapabilityProvider.php';
          use Prontoo\Application\Authorization\ActionCatalog;
          use Prontoo\Infrastructure\Authorization\RuntimeCapabilityProvider;
          foreach ([ActionCatalog::logicSelfTest(), RuntimeCapabilityProvider::logicSelfTest()] as $result) {
              if (empty($result['ok'])) throw new RuntimeException(implode(', ', (array) ($result['failed'] ?? [])));
          }
          PHP
          php -r '
            $manifest = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $bytes = 0;
            foreach ($manifest["files"] as $file => $hash) {
              if (!is_file($file) || !hash_equals((string) $hash, hash_file("sha256", $file))) throw new RuntimeException("Hash divergente: " . $file);
              $bytes += filesize($file);
            }
            if ($bytes !== (int) $manifest["total_uncompressed_bytes"]) throw new RuntimeException("Bytes divergentes");
            foreach ($manifest["removed_files"] as $file) if (file_exists((string) $file)) throw new RuntimeException("Arquivo removido ainda presente: " . $file);
          '

      - name: Validate installer schema and architecture
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          php tools/install-security-check.php | tee /tmp/install-security-report.json
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php | tee /tmp/schema-report.json
          php tools/architecture-check.php | tee /tmp/architecture-report.json
          test "$(sha256sum app/Database/schema.sql | cut -d' ' -f1)" = "28515f46af3081e5ac0dded5723e6d2d7ceddec11e9c6f782975f31931a69d33"

      - name: Commit certified documentation baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-source-guide-1.7.21.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "documenta internamente o Prontoo 1.7.21.7"
          git push origin HEAD:agent/source-maintenance-guide-1.7.21.7

      - name: Upload certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-maintenance-guide-1.7.21.7
          path: |
            /tmp/source-guide-inventory.json
            /tmp/source-guide-finalize.json
            /tmp/install-security-report.json
            /tmp/schema-report.json
            /tmp/architecture-report.json
          if-no-files-found: warn
          retention-days: 7
