name: Temporary Novo Aviso Manifest Reconcile

on:
  push:
    branches:
      - agent/novo-aviso-design-system

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/novo-aviso-design-system
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile, validate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-reconcile-novo-aviso.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php -l app/Runtime/Routing/RouteRegistry.php >/dev/null
          php -l app/Runtime/TasksNotices/TasksNoticesRuntimeOperations05.php >/dev/null
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          unexpected="$(git status --short | grep -vE '^D  \.github/workflows/temp-reconcile-novo-aviso\.yml$|^ M app/update\.manifest\.json$' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            echo 'Unexpected reconciliation drift.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/update.manifest.json .github/workflows/temp-reconcile-novo-aviso.yml
          git commit -m 'Reconcilia manifesto do Novo Aviso'
          git push origin HEAD:agent/novo-aviso-design-system
