name: Consolidation Audit Issue Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: github.event.issue.title == 'RUN CONSOLIDATION AUDIT 1.8.9.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch and helper
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin prontoo agent/consolidation-audit-20260809
          git show origin/prontoo:tools/consolidation-audit-materialize.py > /tmp/consolidation-audit-materialize.py
          git checkout -B agent/consolidation-audit-20260809 origin/agent/consolidation-audit-20260809
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring, pdo_mysql
      - name: Materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/consolidation-audit-materialize.py
          php tools/release-contract-reconcile --write
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --check
          php tools/native-unit-check
          php tools/architecture-check.php
          php tools/solid-audit --strict
          php tools/security-regression-check.php
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Publish validated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Auditoria de consolidação pós-zero-legacy 1.8.9.1'
          git push origin HEAD:agent/consolidation-audit-20260809
