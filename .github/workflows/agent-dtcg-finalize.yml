name: Agent DTCG Finalize

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p = 'version.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          if data.get('version') != '1.8.18.4' or data.get('release') != '1.8.18.4':
              raise SystemExit('canonical version changed before DTCG finalize')
          now = datetime.now(ZoneInfo('America/Cuiaba')).replace(microsecond=0)
          stamp = now.isoformat()
          version = '1.8.18.5'
          data.update({
              'version': version,
              'release': version,
              'generated_at_unix': int(now.timestamp()),
              'generated_at': stamp,
              'updated_at': stamp,
              'build': version + '-dtcg-design-tokens',
              'asset_version': version,
              'package_type': 'incremental_refinement',
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'functional_equivalence_policy': 'dtcg_design_tokens_default_visual_equivalence_multitheme_identity_propagation_without_schema_change',
              'notes': 'Design System usa DTCG 2025.10 como fonte canônica, Style Dictionary gera os tokens CSS e aliases dependentes da identidade resolvem no escopo runtime do consultório; layout e baseline padrão permanecem equivalentes.',
              'documentation_changes': True,
              'deployment_sync_id': 'github-prontoo-' + version + '-dtcg-design-tokens',
              'deployment_sync_requested_at': stamp,
              'release_date': '2026-08-18',
              'design_token_policy': 'dtcg_2025_10_reference_system_component_style_dictionary_5_5',
              'design_token_source': 'design/tokens',
              'design_token_compiler': 'style-dictionary@5.5.0',
              'design_token_runtime_policy': 'generated_css_custom_properties_runtime_body_scope',
              'design_token_contract': 'tools/design-tokens-contract.mjs',
              'changelog': {
                  'title': 'Design Tokens DTCG e tema por consultório',
                  'items': [
                      'adota Design Tokens DTCG 2025.10 em camadas Reference, System e Component como fonte canônica do Design System',
                      'usa Style Dictionary 5.5.0 para gerar deterministicamente os arquivos CSS de tokens e retira deles a autoridade de edição manual',
                      'resolve aliases dependentes da identidade no escopo runtime do consultório para eliminar tokens presos à cor padrão',
                      'mantém sucesso, aviso, erro e informação como cores semânticas independentes da identidade do consultório',
                      'adiciona contrato multitema obrigatório com verde, azul, vinho e violeta além do baseline computado já existente',
                      'preserva geometria, tipografia, espaçamento e fluxos do tema padrão sem alterar banco ou schema'
                  ]
              }
          })
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
              f.write('\n')
          PY
      - name: Rebuild generated design-token artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/design-tokens-build.mjs --write
      - name: Reconcile release contracts
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
      - name: Validate DTCG and visual equivalence before commit
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium
          node tools/design-tokens-build.mjs --check
          node tools/design-tokens-contract.mjs
          node tools/presentation-ux-contract.mjs --check
      - name: Commit final release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-dtcg-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica Design Tokens DTCG 1.8.18.5'
          git push origin HEAD:agent/dtcg-design-tokens
