name: Apply Clean Schema Release

on:
  push:
    branches:
      - agent/1.7.20.6-clean-schema-layer2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/1.7.20.6-clean-schema-layer2
          fetch-depth: 0
      - name: Apply release patch
        shell: bash
        run: |
          set -euo pipefail
          marker='.release/apply.ready'
          if [ ! -f "$marker" ]; then
            echo 'Partes recebidas; aguardando marcador final.'
            exit 0
          fi
          cat .release/patch.part.* > /tmp/prontoo.patch.b64
          echo '95ed51e967ae217b870fe7575ba8c9edd165fecc9dd18a264f25bc84e7db66d1  /tmp/prontoo.patch.b64' | sha256sum -c -
          base64 --decode /tmp/prontoo.patch.b64 | gzip -dc > /tmp/prontoo.patch
          patch --batch --forward -p1 < /tmp/prontoo.patch
          rm -f .release/patch.part.* "$marker"
          rmdir .release 2>/dev/null || true
          rm -f .github/workflows/source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implementa schema limpo 1.7.20.6 alinhado à camada 2'
          git push origin HEAD:agent/1.7.20.6-clean-schema-layer2
