name: Source Export

on:
  push:
    branches:
      - agent/1.7.20.6-clean-schema-layer2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          tar --exclude=.git --exclude=source-export.tar.gz -czf source-export.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: source-export.tar.gz
          retention-days: 1
