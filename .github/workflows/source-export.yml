name: Apply Clean Schema Release

on:
  push:
    branches:
      - agent/1.7.20.6-clean-schema-layer2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/1.7.20.6-clean-schema-layer2
          fetch-depth: 0
      - name: Apply release payload
        shell: bash
        run: |
          set -euo pipefail
          payload='.release/prontoo-1.7.20.6.payload.b64'
          if [ ! -f "$payload" ]; then
            echo 'Payload ainda não publicado; nenhuma alteração aplicada.'
            exit 0
          fi
          base64 --decode "$payload" | tar -xzf -
          rm -f app/Core/Integrity/PiSequence.php
          rm -f app/Core/Integrity/ActionProof.php
          rm -f "$payload"
          rmdir .release 2>/dev/null || true
          rm -f .github/workflows/source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implementa schema limpo 1.7.20.6 alinhado à camada 2'
          git push origin HEAD:agent/1.7.20.6-clean-schema-layer2
