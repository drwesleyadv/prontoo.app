name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          git archive --format=tar.gz --output=source-export.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-export
          path: source-export.tar.gz
          retention-days: 1
