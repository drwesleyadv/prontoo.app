name: Temporary agenda day block fix 1.9.15.5

on:
  push:
    branches:
      - feature/agenda-day-block-timestamp-fix-1-9-15-5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Apply source and regression fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service = Path('app/Application/Operational/AppointmentCommandService.php')
          source = service.read_text()
          old = '''        $dayStartTs = strtotime($dayStartAt);
                  $dayEndTs = strtotime($dayEndAt);
                  $blockStartTs = strtotime($blockStartAt);
                  $blockEndTs = strtotime($blockEndAt);'''
          new = '''        $storageTimestamp = static function (string $value): int|false {
                      $value = mb_trim($value);
                      if ($value === "") {
                          return false;
                      }
                      if (preg_match('/^-?\\d+$/', $value) === 1) {
                          return (int) $value;
                      }
                      $timestamp = strtotime($value . " UTC");
                      return $timestamp !== false ? $timestamp : strtotime($value);
                  };
                  $dayStartTs = $storageTimestamp($dayStartAt);
                  $dayEndTs = $storageTimestamp($dayEndAt);
                  $blockStartTs = $storageTimestamp($blockStartAt);
                  $blockEndTs = $storageTimestamp($blockEndAt);'''
          if source.count(old) != 1:
              raise SystemExit('setDayBlocked temporal guard not found exactly once')
          service.write_text(source.replace(old, new, 1))

          runtime = Path('app/Runtime/Appointments/AppointmentsRuntimeOperations05.php')
          source = runtime.read_text()
          source = source.replace('        $dayBlockToggle = "";\n', '        $dayBlockForm = "";\n        $dayBlockToggle = "";\n', 1)
          source = source.replace('$dayBlockIcon = $dayBlocked ? "event_available" : "event_busy";', '$dayBlockIcon = $dayBlocked ? "lock_open" : "lock";', 1)
          old = '''            $dayBlockToggle =
                          '<form method="post" class="agenda-day-toggle-form">' .
                          \\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::csrf_field() .
                          '<input type="hidden" name="act" value="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($dayBlockAct) .
                          '\"><input type="hidden" name="return_day" value="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($day) .
                          '\"><input type="hidden" name="return_doctor" value="' .
                          $agendaDoctor .
                          '\"><button type="submit" class="pagehead-control pagehead-control--secondary agenda-day-toggle-button">' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon($dayBlockIcon) .
                          '<span>' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($dayBlockLabel) .
                          '</span></button></form>';'''
          new = '''            $dayBlockForm =
                          '<form method="post" id="agenda-day-toggle-action" class="agenda-day-toggle-form">' .
                          \\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::csrf_field() .
                          '<input type="hidden" name="act" value="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($dayBlockAct) .
                          '\"><input type="hidden" name="return_day" value="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($day) .
                          '\"><input type="hidden" name="return_doctor" value="' .
                          $agendaDoctor .
                          '\"></form>';
                      $dayBlockToggle =
                          '<button type="submit" form="agenda-day-toggle-action" class="pagehead-control pagehead-control--secondary agenda-day-toggle-button" aria-label="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($dayBlockLabel) .
                          '" title="' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::e($dayBlockLabel) .
                          '">' .
                          \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon($dayBlockIcon) .
                          '</button>';'''
          if source.count(old) != 1:
              raise SystemExit('day block toggle markup not found exactly once')
          source = source.replace(old, new, 1)
          old = '''        $navDay =
                      '<div class="agenda-crown-row"><form method="get" class="agenda-crown-picker" aria-label="Selecionar dia e profissional">' .'''
          new = '''        $navDay =
                      '<div class="agenda-crown-row">' .
                      $dayBlockForm .
                      '<form method="get" class="agenda-crown-picker" aria-label="Selecionar dia e profissional">' .'''
          if source.count(old) != 1:
              raise SystemExit('agenda crown start not found exactly once')
          source = source.replace(old, new, 1)
          old = '''            $navDoctorOptions .
                      "</select>" .
                      '<a class="agenda-crown-arrow" href="' .'''
          new = '''            $navDoctorOptions .
                      "</select>" .
                      $dayBlockToggle .
                      '<a class="agenda-crown-arrow" href="' .'''
          if source.count(old) != 1:
              raise SystemExit('doctor select insertion point not found exactly once')
          source = source.replace(old, new, 1)
          old = '''            "</a>" .
                      "</form>" .
                      $dayBlockToggle .
                      "</div>";'''
          new = '''            "</a>" .
                      "</form></div>";'''
          if source.count(old) != 1:
              raise SystemExit('old trailing day toggle placement not found exactly once')
          runtime.write_text(source.replace(old, new, 1))

          css = Path('design/styles/application.css')
          source = css.read_text()
          old = '''body[data-route="appointments"] .agenda-crown-row{display:flex;align-items:center;gap:10px;width:100%;min-width:0;flex-wrap:wrap}
          body[data-route="appointments"] .agenda-crown-row>.agenda-crown-picker{flex:1 1 420px;min-width:0;width:auto!important;max-width:none!important}
          body[data-route="appointments"] .agenda-day-toggle-form{display:flex;align-items:center;flex:0 0 auto;margin-left:auto}
          body[data-route="appointments"] .agenda-day-toggle-button{min-height:36px!important;white-space:nowrap}'''
          new = '''body[data-route="appointments"] .agenda-crown-row{display:flex;align-items:center;gap:10px;width:100%;min-width:0;flex-wrap:wrap}
          body[data-route="appointments"] .agenda-crown-row>.agenda-crown-picker{flex:1 1 420px;min-width:0}
          body[data-route="appointments"] .agenda-day-toggle-form{display:none}
          body[data-route="appointments"] .agenda-day-toggle-button{flex:0 0 auto;padding-inline:8px;white-space:nowrap}'''
          if source.count(old) != 1:
              raise SystemExit('agenda day toggle css block not found exactly once')
          css.write_text(source.replace(old, new, 1))

          tests = Path('tools/test-fast')
          source = tests.read_text()
          old = '''        '2026-08-12 04:00:00',
                  '2026-08-13 04:00:00',
                  '2026-08-12 12:00:00',
                  '2026-08-12 21:00:00','''
          new = '''        '1786507200',
                  '1786593600',
                  '1786536000',
                  '1786568400','''
          count = source.count(old)
          if count < 4:
              raise SystemExit(f'expected at least four day block test ranges, found {count}')
          source = source.replace(old, new)
          old = '''        str_contains($agendaRuntimeSource, 'Desbloquear dia') &&
                  str_contains($agendaRuntimeSource, 'agenda-day-toggle-form'),'''
          new = '''        str_contains($agendaRuntimeSource, 'Desbloquear dia') &&
                  str_contains($agendaRuntimeSource, '$dayBlockIcon = $dayBlocked ? "lock_open" : "lock";') &&
                  str_contains($agendaRuntimeSource, 'form="agenda-day-toggle-action"') &&
                  str_contains($agendaRuntimeSource, 'agenda-day-toggle-form'),'''
          if source.count(old) != 1:
              raise SystemExit('agenda presentation test contract not found exactly once')
          tests.write_text(source.replace(old, new, 1))

          docs = Path('docs/domain/appointments.md')
          source = docs.read_text()
          old = 'Na visualização diária, quando o profissional selecionado não possui consultas na data, a própria barra de navegação pode alternar entre **Bloquear dia** e **Desbloquear dia**. O bloqueio cobre o expediente configurado do profissional, usa o mesmo fallback temporal da Agenda quando não há expediente cadastrado e é serializado com a criação de consultas para impedir corrida entre bloqueio e agendamento. Bloqueios parciais continuam independentes e não são apagados pela alternância do dia.'
          new = 'Na visualização diária, quando o profissional selecionado não possui consultas na data, um controle por ícone aparece imediatamente após o nome do profissional no seletor: cadeado fechado bloqueia o dia e cadeado aberto desbloqueia. O bloqueio cobre o expediente configurado do profissional, usa o mesmo fallback temporal da Agenda quando não há expediente cadastrado e é serializado com a criação de consultas para impedir corrida entre bloqueio e agendamento. Os limites do dia e do expediente são comparados no formato temporal canônico armazenado pela Agenda, inclusive quando chegam como timestamps UTC. Bloqueios parciais continuam independentes e não são apagados pela alternância do dia.'
          if source.count(old) != 1:
              raise SystemExit('appointments day block documentation paragraph not found exactly once')
          docs.write_text(source.replace(old, new, 1))
          PY
      - name: Bump release and assets
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/release-1.9.15.5.json <<'JSON'
          {
            "build": "1.9.15.5-agenda-day-block-time-fix",
            "package_type": "micro_fix",
            "notes": "Corrige o bloqueio diário para aceitar os timestamps UTC canônicos da Agenda e posiciona o toggle por cadeado junto ao profissional.",
            "logic_changes": true,
            "visual_changes": true,
            "documentation_changes": true,
            "changelog": {
              "title": "Correção do bloqueio diário da Agenda",
              "items": [
                "Corrige a validação do bloqueio diário para aceitar limites temporais armazenados como timestamps UTC.",
                "Mantém a leitura do expediente configurado no perfil do profissional sem converter timestamps válidos por strtotime.",
                "Preserva a revalidação transacional contra consultas concorrentes e as regras de propriedade do bloqueio.",
                "Move o controle para imediatamente após o profissional no seletor diário, sem rótulo visual.",
                "Usa cadeado fechado para Bloquear dia e cadeado aberto para Desbloquear dia, preservando rótulos acessíveis."
              ]
            }
          }
          JSON
          php tools/release-version --write --date=2026-09-15 --timestamp=2026-09-15T11:12:21-04:00 --expected-current=1.9.15.4 --metadata-file=/tmp/release-1.9.15.5.json
          python3 <<'PY'
          import json
          from pathlib import Path
          version = Path('version.json')
          data = json.loads(version.read_text())
          data['asset_version'] = '1.9.15.5'
          version.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')

          app = Path('app/prontoo.php')
          source = app.read_text()
          old = 'const PRONTOO_ASSET_REV_FALLBACK = "1.9.15.4";'
          new = 'const PRONTOO_ASSET_REV_FALLBACK = "1.9.15.5";'
          if source.count(old) != 1:
              raise SystemExit('asset fallback not found exactly once')
          app.write_text(source.replace(old, new, 1))

          css = Path('design/styles/application.css')
          source = css.read_text()
          if source.count('pix-1.9.15.4.svg') != 2:
              raise SystemExit('expected two source pix references')
          css.write_text(source.replace('pix-1.9.15.4.svg', 'pix-1.9.15.5.svg'))

          visual = Path('app/presentation.visual-contract.json')
          data = json.loads(visual.read_text())
          data['version'] = '1.9.15.5'
          visual.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')

          docs = Path('docs/index.md')
          source = docs.read_text()
          if '1.9.15.4' not in source:
              raise SystemExit('canonical docs release literal not found')
          docs.write_text(source.replace('1.9.15.4', '1.9.15.5'))
          PY
          for asset in app-icon favicon prontoo-mark; do :; done
          git mv public/assets/app-icon-1.9.15.4.png public/assets/app-icon-1.9.15.5.png
          git mv public/assets/favicon-1.9.15.4.ico public/assets/favicon-1.9.15.5.ico
          git mv public/assets/favicon-1.9.15.4.png public/assets/favicon-1.9.15.5.png
          git mv public/assets/pix-1.9.15.4.svg public/assets/pix-1.9.15.5.svg
          git mv public/assets/prontoo-mark-1.9.15.4.png public/assets/prontoo-mark-1.9.15.5.png
          php tools/presentation-css-build --write
          git rm .github/workflows/tmp-agenda-day-block-fix-1-9-15-5.yml
          php tools/release-contract-reconcile --write
      - name: Validate full change
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Operational/AppointmentCommandService.php
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          php tools/quality-gate --fast
          php tools/quality-gate
          git diff --check
          test ! -e .github/workflows/tmp-agenda-day-block-fix-1-9-15-5.yml
      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige bloqueio diário com timestamps canônicos"
          git push origin HEAD:feature/agenda-day-block-timestamp-fix-1-9-15-5
