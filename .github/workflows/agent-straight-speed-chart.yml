name: Agent straight speed chart

on:
  push:
    branches:
      - agent/straight-speed-chart-20260804

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/straight-speed-chart-20260804
          fetch-depth: 0
      - name: Apply scoped chart refinement
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re
          from datetime import datetime, timezone

          p = Path('app/Admin/AdminPages.php')
          s = p.read_text()

          marker = '''    if (!in_array($valueType, ["ms", "count"], true)) {
              $valueType = "ms";
          }
          '''
          replacement = marker + '''    $straightEdges = (bool) ($presentation["straight_edges"] ?? false);
              $showOutline = (bool) ($presentation["show_outline"] ?? true);
          '''
          if marker not in s:
              raise SystemExit('presentation marker not found')
          s = s.replace(marker, replacement, 1)

          pattern = re.compile(r'''    \$path = static function \(array \$points\): string \{.*?^    \};\n    \$fill = static function''', re.S | re.M)
          path_replacement = '''    $path = static function (array $points) use ($straightEdges): string {

              $count = count($points);
              if ($count === 0) {
                  return "";
              }
              if ($count === 1) {
                  return "M" . $points[0][0] . " " . $points[0][1];
              }
              $d = "M" . $points[0][0] . " " . $points[0][1];
              if ($straightEdges) {
                  for ($i = 1; $i < $count; $i++) {
                      $d .= " L " . $points[$i][0] . " " . $points[$i][1];
                  }
                  return $d;
              }
              $tension = 0.72;
              for ($i = 0; $i < $count - 1; $i++) {
                  $p0 = $points[max(0, $i - 1)];
                  $p1 = $points[$i];
                  $p2 = $points[$i + 1];
                  $p3 = $points[min($count - 1, $i + 2)];
                  $cp1x = $p1[0] + (($p2[0] - $p0[0]) * $tension) / 6;
                  $cp1y = $p1[1] + (($p2[1] - $p0[1]) * $tension) / 6;
                  $cp2x = $p2[0] - (($p3[0] - $p1[0]) * $tension) / 6;
                  $cp2y = $p2[1] - (($p3[1] - $p1[1]) * $tension) / 6;
                  $segmentMinY = min($p1[1], $p2[1]);
                  $segmentMaxY = max($p1[1], $p2[1]);
                  $cp1y = max($segmentMinY, min($segmentMaxY, $cp1y));
                  $cp2y = max($segmentMinY, min($segmentMaxY, $cp2y));
                  $d .=
                      " C " .
                      round($cp1x, 2) .
                      " " .
                      round($cp1y, 2) .
                      " " .
                      round($cp2x, 2) .
                      " " .
                      round($cp2y, 2) .
                      " " .
                      $p2[0] .
                      " " .
                      $p2[1];
              }
              return $d;
          };
          $fill = static function'''
          s, n = pattern.subn(path_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'path block replacement count={n}')

          s = s.replace('''        ($loadD !== ""
              ? '<path d="' . e($loadD) . '" class="metric-chart-line-load"/>'
              : "") .
          ($responseD !== ""
              ? '<path d="' .
                  e($responseD) .
                  '" class="metric-chart-line-response"/>'
              : "") .
          ''', '''        ($showOutline && $loadD !== ""
              ? '<path d="' . e($loadD) . '" class="metric-chart-line-load"/>'
              : "") .
          ($showOutline && $responseD !== ""
              ? '<path d="' .
                  e($responseD) .
                  '" class="metric-chart-line-response"/>'
              : "") .
          ''', 1)

          speed_marker = '''                "summary_lead" => "dados de duração de rotas e da Landing Page.",
              ],
          ) .
          '''
          speed_replacement = '''                "summary_lead" => "dados de duração de rotas e da Landing Page.",
                  "straight_edges" => true,
                  "show_outline" => false,
              ],
          ) .
          '''
          if speed_marker not in s:
              raise SystemExit('speed chart marker not found')
          s = s.replace(speed_marker, speed_replacement, 1)
          p.write_text(s)

          now = datetime.now(timezone.utc).isoformat()
          ts = int(datetime.now(timezone.utc).timestamp())
          version = '1.8.4.10'
          build = '1.8.4.10-straight-speed-chart'

          vpath = Path('version.json')
          data = json.loads(vpath.read_text())
          data.update({
              'version': version,
              'release': version,
              'generated_at_unix': ts,
              'generated_at': now,
              'updated_at': now,
              'build': build,
              'previous_version': '1.8.4.9',
              'functional_equivalence_policy': 'preserves_telemetry_data_and_interactions_while_rendering_the_speed_areas_with_straight_edges_and_without_outline',
              'notes': 'Remove os contornos e aplica segmentos retos exclusivamente ao gráfico Velocidade compartilhado entre Desenvolvedor e Status.',
              'deployment_sync_id': 'github-straight-speed-chart-1-8-4-10',
              'deployment_sync_requested_at': now,
              'rewrite_scope': 'shared_speed_chart_visual_geometry_only',
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': True,
          })
          vpath.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')

          for file in ['app/prontoo.php', 'br/index.php']:
              q = Path(file)
              text = q.read_text()
              text = text.replace('1.8.4.9-auth-telemetry-route-contract', build)
              text = text.replace('1.8.4.9', version)
              q.write_text(text)

          upath = Path('app/update.manifest.json')
          u = json.loads(upath.read_text())
          for key in ('version', 'release'):
              if key in u:
                  u[key] = version
          if 'build' in u:
              u['build'] = build
          if 'previous_version' in u:
              u['previous_version'] = '1.8.4.9'
          if 'updated_at' in u:
              u['updated_at'] = now
          if 'generated_at' in u:
              u['generated_at'] = now
          if 'generated_at_unix' in u:
              u['generated_at_unix'] = ts
          if 'notes' in u:
              u['notes'] = 'Gráfico Velocidade com áreas de arestas retas e sem contorno nas telas Desenvolvedor e Status.'
          upath.write_text(json.dumps(u, ensure_ascii=False, indent=4) + '\n')

          entry_md = '''## 1.8.4.10 — 04/08/2026\n\n- Gráfico **Velocidade** nas telas Desenvolvedor e Status passa a usar arestas retas.\n- Removidos os contornos das duas áreas, preservando preenchimentos, dados, tooltips e demais gráficos.\n- Sem alterações de banco de dados ou schema.\n\n'''
          c = Path('CHANGELOG.md')
          text = c.read_text()
          if '## 1.8.4.10' not in text:
              c.write_text(entry_md + text)

          entry_txt = '''1.8.4.10 - 04/08/2026\n- Velocidade: áreas com arestas retas e sem contorno no Desenvolvedor e Status.\n- Dados, preenchimentos e demais gráficos preservados.\n- Sem alterações de banco de dados ou schema.\n\n'''
          c = Path('ChangeLog.txt')
          text = c.read_text()
          if '1.8.4.10 - 04/08/2026' not in text:
              c.write_text(entry_txt + text)

          Path('.github/workflows/agent-straight-speed-chart.yml').unlink()
          PY
          php -l app/Admin/AdminPages.php
          php -l app/prontoo.php
          php -l br/index.php
          php tools/version-asset-contract-check.php
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refinar gráfico de velocidade"
          git push
