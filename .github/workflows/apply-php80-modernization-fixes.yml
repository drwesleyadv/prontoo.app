name: Apply PHP 8.0 Modernization Fixes

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/php80-modernization-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Apply confirmed PHP 8.0 fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          import re

          audit = Path('app/Domain/Audit/AuditActivity.php')
          text = audit.read_text(encoding='utf-8')
          clinic_line = '    $clinic = $clinic !== "" ? $clinic : "consultório";\n'
          if text.count(clinic_line) != 1:
              raise SystemExit(f'Linha da clínica esperada uma vez; encontrada {text.count(clinic_line)}.')
          insertion = clinic_line + '''    $windowLabel = activity_text_value($ctx["janela"] ?? $title);
          if ($windowLabel === "") {
              $windowLabel = "do sistema";
          }
          '''
          text = text.replace(clinic_line, insertion, 1)
          pattern = re.compile(
              r': \$who \.\s*" abriu a tela " \.\s*\(activity_text_value\(\$ctx\["janela"\] \?\? \$title\) \?: "do sistema"\),'
          )
          text, count = pattern.subn(': $who . " abriu a tela " . $windowLabel,', text, count=1)
          if count != 1:
              raise SystemExit(f'Ternário aninhado esperado uma vez; encontrado {count}.')
          audit.write_text(text, encoding='utf-8')
          PY
          php -l app/Domain/Audit/AuditActivity.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Domain/Audit/AuditActivity.php
          git commit -m "Corrigir ternário incompatível com PHP 8.0"
          git push origin HEAD:"$HEAD_BRANCH"
