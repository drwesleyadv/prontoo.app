name: Zero Legacy Phase 1
on:
  pull_request:
    branches: [prontoo]
permissions:
  contents: write
jobs:
  migrate:
    if: github.head_ref == 'agent/zero-legacy-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zero-legacy-phase1
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Move Legacy units into native layer paths
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            target="${f/\/Legacy\//\/}"
            mkdir -p "$(dirname "$target")"
            git mv "$f" "$target"
          done < <(find app -type f -path '*/Legacy/*' | sort)
          python3 - <<'PY'
          from pathlib import Path
          roots=[Path('app'),Path('br'),Path('public'),Path('cron'),Path('tools'),Path('docs')]
          exts={'.php','.md','.json','.txt','.yml','.yaml',''}
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in exts: continue
                  try: s=p.read_text()
                  except UnicodeDecodeError: continue
                  old=s
                  for layer in ('Core','Domain','Application','Infrastructure','Presentation','Runtime'):
                      s=s.replace(f'Prontoo\\{layer}\\Legacy\\', f'Prontoo\\{layer}\\')
                      s=s.replace(f'app/{layer}/Legacy/', f'app/{layer}/')
                  if s!=old: p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/Core/Architecture/LayerMap.php')
          s=p.read_text()
          old="        'app/Domain/',\n"
          paths=[
            'Appointments/AppointmentsDomainOperations01.php',
            'AuditActivity/ActivityDisplayPolicy.php','AuditActivity/ActivityTargetPolicy.php','AuditActivity/ActivityTaxonomy.php','AuditActivity/ActivityValuePolicy.php','AuditActivity/AuditActivityDomainOperations03.php','AuditActivity/AuditCopyPolicy.php','AuditActivity/AuditDocumentPolicy.php','AuditActivity/AuditRecordPolicy.php','AuditActivity/AuditTargetPolicy.php','AuditActivity/AuditWritePolicy.php',
            'ClinicConfig/ClinicConfigDomainOperations01.php','ClinicConfig/ClinicConfigDomainOperations02.php',
            'DocumentPdf/DocumentPdfDomainOperations01.php',
            'Documents/DocumentHtmlPolicy.php','Documents/DocumentIdentifierPolicy.php','Documents/DocumentTemplatePolicy.php','Documents/DocumentTypePolicy.php','Documents/DocumentsCompatibilityOperations01.php','Documents/DocumentsDomainOperations02.php',
            'Financial/FinancialDomainOperations01.php','Leads/LeadsDomainOperations01.php','Maestro/MaestroDomainOperations01.php','Maestro/MaestroDomainOperations02.php','Patients/PatientsDomainOperations01.php','SubscriptionSettings/SubscriptionSettingsDomainOperations01.php','TasksNotices/TasksNoticesDomainOperations01.php','UsersPermissions/UsersPermissionsDomainOperations01.php'
          ]
          repl=''.join(f"        'app/Domain/{x}',\n" for x in paths)
          if old not in s: raise SystemExit('generic domain native prefix not found')
          p.write_text(s.replace(old,repl,1))
          PY
          test "$(find app -type f -path '*/Legacy/*' | wc -l)" -eq 0
          if grep -RIl --exclude-dir=.git -E 'Prontoo\\(Core|Domain|Application|Infrastructure|Presentation|Runtime)\\Legacy\\|app/(Core|Domain|Application|Infrastructure|Presentation|Runtime)/Legacy/' app br public cron tools docs >/tmp/legacy_refs; then
            cat /tmp/legacy_refs
            exit 1
          fi
      - name: Validate phase before reconciliation
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -not -path './ssd/*' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l >/dev/null
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/solid-audit
          php tools/php84-runtime-contract-check
      - name: Finalize deterministic branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zero-legacy-phase1.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name 'Prontoo Architecture Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fase 1 zero legacy: promover unidades Legacy para paths nativos'
          git push origin HEAD:agent/zero-legacy-phase1
