name: Temporary Audited Baseline Finalizer

on:
  push:
    branches:
      - audit/baseline-1.8.13.2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/baseline-1.8.13.2
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Finalize audited baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-baseline-publisher.yml
          rm -f .github/workflows/audit-baseline-finalizer.yml
          php tools/tmp-audit-baseline-1-8-13-2.php
          rm -f tools/tmp-audit-baseline-1-8-13-2.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/presentation-css-build --check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/quality-gate
      - name: Commit audited baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -Eq 'audit-baseline-(publisher|finalizer)|tmp-audit-baseline'; then
            echo 'Temporary audit tooling leaked into final diff.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'chore(release): publish audited baseline 1.8.13.2'
          git push origin HEAD:audit/baseline-1.8.13.2
