name: Agent DTCG Selector Fix

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regenerate DTCG sources and ordered-slice integrity
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/design-tokens-build.mjs --write
          python3 <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          manifest_path = Path('app/Presentation/Styles/styles.manifest.json')
          manifest = json.loads(manifest_path.read_text())
          bridge = json.loads(Path('design/tokens/css-bridge.json').read_text())
          root = Path('app/Presentation/Styles')
          target_to_rel = {
              'clinic': 'tokens/clinic.css',
              'material': 'tokens/material.css',
              'semantic': 'tokens/semantic.css',
          }
          generated = set(target_to_rel.values())
          source_bytes = {}
          for source in manifest.get('sources', []):
              rel = source.get('path')
              if rel not in generated:
                  continue
              data = (root / rel).read_bytes()
              text = data.decode('utf-8')
              source_bytes[rel] = data
              source['sha256'] = hashlib.sha256(data).hexdigest()
              source['bytes'] = len(data)
              source['important_count'] = text.count('!important')
              source['route_scope_count'] = text.count('body[data-route=')

          for target, rel in target_to_rel.items():
              legacy = base64.b64decode(bridge['legacy'][target]['base64'])
              data = source_bytes[rel]
              if not data.startswith(legacy):
                  raise SystemExit(f'legacy prefix changed for {rel}')
              tail_segments = [s for s in manifest.get('sequence', []) if s.get('source') == rel and int(s.get('offset', -1)) >= len(legacy)]
              if len(tail_segments) != 1:
                  raise SystemExit(f'expected one generated tail segment for {rel}, got {len(tail_segments)}')
              tail = data[len(legacy):]
              if not tail:
                  raise SystemExit(f'empty generated tail for {rel}')
              segment = tail_segments[0]
              segment['offset'] = len(legacy)
              segment['bytes'] = len(tail)
              segment['sha256'] = hashlib.sha256(tail).hexdigest()
              text = tail.decode('utf-8')
              segment['important_count'] = text.count('!important')
              segment['route_scope_count'] = text.count('body[data-route=')

          all_sources = {s['path']: (root / s['path']).read_bytes() for s in manifest.get('sources', [])}
          built = bytearray()
          next_offset = {path: 0 for path in all_sources}
          for expected_order, segment in enumerate(manifest.get('sequence', []), start=1):
              if int(segment.get('order', 0)) != expected_order:
                  raise SystemExit('sequence order drift')
              rel = segment['source']
              offset = int(segment['offset'])
              length = int(segment['bytes'])
              if offset != next_offset[rel]:
                  raise SystemExit(f'sequence coverage drift {rel}')
              piece = all_sources[rel][offset:offset + length]
              if len(piece) != length or hashlib.sha256(piece).hexdigest() != segment['sha256']:
                  raise SystemExit(f'sequence integrity drift {rel}:{expected_order}')
              built.extend(piece)
              next_offset[rel] += length
          for rel, data in all_sources.items():
              if next_offset[rel] != len(data):
                  raise SystemExit(f'uncovered bytes {rel}')

          artifact = manifest.setdefault('artifact_contract', {})
          artifact['sha256'] = hashlib.sha256(built).hexdigest()
          artifact['bytes'] = len(built)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Rebuild published presentation artifact
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
      - name: Refresh visual contract delivery metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('app/presentation.visual-contract.json')
          data = json.loads(p.read_text())
          css = Path('public/assets/presentation.css').read_bytes()
          data['version'] = '1.8.18.5'
          data.setdefault('delivery', {})['current_sha256'] = hashlib.sha256(css).hexdigest()
          data['delivery']['current_bytes'] = len(css)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Validate structural and observable visual contracts
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install chromium
          node tools/design-tokens-build.mjs --check
          php tools/presentation-visual-contract-check
          node tools/design-tokens-contract.mjs
          node tools/presentation-ux-contract.mjs --check
      - name: Remove transient workflow and reconcile exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-dtcg-selector-fix.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/presentation-visual-contract-check
          node tools/design-tokens-build.mjs --check
      - name: Commit final DTCG scope fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica escopos DTCG sem dívida visual adicional'
          git push origin HEAD:agent/dtcg-design-tokens
