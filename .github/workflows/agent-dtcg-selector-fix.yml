name: Agent DTCG Selector Fix

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - name: Identify newly duplicated selector headers
        shell: bash
        run: |
          set -euo pipefail
          git show origin/prontoo:public/assets/presentation.css > /tmp/base.css
          python3 <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          def counts(path):
              css=Path(path).read_text()
              out=Counter()
              for selector,_body in re.findall(r'([^{}]+)\{([^{}]*)\}', css):
                  selector=re.sub(r'\s+',' ',selector.strip())
                  if selector and not selector.startswith('@'):
                      out[selector]+=1
              return out
          base=counts('/tmp/base.css')
          head=counts('public/assets/presentation.css')
          newly=[(s,base[s],head[s]) for s in head if base[s] <= 1 and head[s] > 1]
          resolved=[(s,base[s],head[s]) for s in base if base[s] > 1 and head[s] <= 1]
          print('NEWLY_DUPLICATED', newly)
          print('RESOLVED_DUPLICATES', resolved)
          print('BASE_DUPLICATE_HEADERS', sum(1 for n in base.values() if n>1))
          print('HEAD_DUPLICATE_HEADERS', sum(1 for n in head.values() if n>1))
          if len(newly) != 1:
              raise SystemExit(f'expected exactly one newly duplicated selector, got {len(newly)}')
          PY
