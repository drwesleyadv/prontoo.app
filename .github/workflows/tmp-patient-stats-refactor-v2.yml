name: Temporary patient stats refactor v2

on:
  push:
    branches:
      - feature/patient-all-filter-count-1-9-14-4
    paths:
      - .github/workflows/tmp-patient-stats-refactor-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply refactor
        shell: bash
        run: |
          set -euo pipefail
          php tools/tmp-patient-stats-refactor.php
          git rm -f .github/workflows/tmp-patient-stats-refactor.yml .github/workflows/tmp-patient-stats-refactor-v2.yml tools/tmp-patient-stats-refactor.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/test-fast
          php tools/runtime-refactor-on-touch-check
          php -l app/Infrastructure/Operational/PatientsSqlCatalog05.php
          php -l app/Runtime/Patients/PatientsRuntimeOperations05.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolida leituras de resumo em Pacientes'
          git push origin HEAD:feature/patient-all-filter-count-1-9-14-4
