name: Temporary patient birthdays release

on:
  push:
    branches:
      - feature/patient-birthdays-1-9-14-3
    paths:
      - .github/workflows/tmp-patient-birthdays-release.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/patient-birthdays-1-9-14-3
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Apply focused patient filter release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-patient-birthdays-release.yml

          python3 - <<'PY'
          from pathlib import Path

          domain = Path('app/Domain/Patients/PatientsDomainOperations01.php')
          text = domain.read_text()
          text = text.replace('            "incomplete" => "Cadastro Incompleto",', '            "birthdays" => "Aniversariantes",')
          text = text.replace('            "incomplete" => "fact_check",', '            "birthdays" => "cake",')
          domain.write_text(text)

          sql = Path('app/Infrastructure/Operational/PatientDirectorySql.php')
          text = sql.read_text()
          old = "            'incomplete' => \" AND ((p.birth_date IS NOT NULL AND p.birth_date>DATE_SUB(CURDATE(), INTERVAL 18 YEAR) AND NOT EXISTS (SELECT 1 FROM pi_patient_guardians pg WHERE pg.clinic_id=pp.clinic_id AND pg.patient_link_id=pp.id AND pg.active=1)) OR COALESCE(pp.phone,'')='' OR COALESCE(pp.updated_at,pp.created_at,0)<DATE_SUB(NOW(), INTERVAL 180 DAY))\"," 
          new = "            'birthdays' => \" AND p.birth_date IS NOT NULL AND MONTH(p.birth_date)=MONTH(CURDATE()) AND DAY(p.birth_date)=DAY(CURDATE())\"," 
          if old not in text:
              raise SystemExit('patient directory incomplete filter source not found')
          sql.write_text(text.replace(old, new))
          PY

          cat >/tmp/release.json <<'JSON'
          {
            "build": "1.9.14.3-patient-birthdays",
            "package_type": "micro_ux",
            "notes": "Substitui o filtro Cadastro Incompleto por Aniversariantes na tela de Pacientes, listando somente pacientes ativos cujo dia e mês de nascimento coincidem com a data corrente, sem alterar os demais filtros, schema ou fluxo de cadastro.",
            "logic_changes": true,
            "visual_changes": true,
            "documentation_changes": true,
            "changelog": {
              "title": "Aniversariantes nos filtros de Pacientes",
              "items": [
                "substitui o filtro Cadastro Incompleto por Aniversariantes na tela de Pacientes",
                "mantém Hoje, Essa semana e Desistentes sem alteração de comportamento",
                "filtra aniversariantes pelo dia e mês de nascimento correspondentes à data corrente",
                "considera apenas pacientes ativos do consultório atual, preservando o isolamento existente",
                "não altera schema, persistência, fluxo de cadastro nem regras dos demais filtros"
              ]
            }
          }
          JSON

          php tools/release-version --write --date=2026-09-14 --timestamp=2026-09-14T16:55:00-04:00 --expected-current=1.9.14.2 --metadata-file=/tmp/release.json

          old='1.9.14.2'
          new='1.9.14.3'
          for stem in app-icon favicon pix prontoo-mark; do
            case "$stem" in
              app-icon) ext=png ;;
              favicon)
                git mv "public/assets/favicon-${old}.ico" "public/assets/favicon-${new}.ico"
                git mv "public/assets/favicon-${old}.png" "public/assets/favicon-${new}.png"
                continue
                ;;
              pix) ext=svg ;;
              prontoo-mark) ext=png ;;
            esac
            git mv "public/assets/${stem}-${old}.${ext}" "public/assets/${stem}-${new}.${ext}"
          done

          while IFS= read -r -d '' file; do
            python3 - "$file" "$old" "$new" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          old, new = sys.argv[2], sys.argv[3]
          s = p.read_text()
          if old in s:
              p.write_text(s.replace(old, new))
          PY
          done < <(git grep -Ilz "$old" -- ':!app/update.manifest.json' || true)

          php tools/presentation-css-build --lint
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          git diff --check

          git add -A
          git commit -m "Substitui filtro de cadastro por aniversariantes"
          git push origin HEAD:feature/patient-birthdays-1-9-14-3
