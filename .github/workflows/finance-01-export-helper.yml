name: Finance 01 Reconcile Helper

on:
  push:
    branches:
      - 'codex/finance-01-export-helper'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/finance-01-characterization
          fetch-depth: 0
      - name: Guard expected candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "456af257673eabdb323a73015e514c033abaddcc"
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reconcile and publish deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git add \
            public/assets/presentation.css \
            .github/workflows/architecture.yml \
            .github/workflows/documentation.yml \
            app/prontoo.php \
            br/index.php \
            CHANGELOG.md \
            app/architecture.manifest.json \
            app/update.manifest.json
          if git diff --cached --quiet; then
            echo "No deterministic drift to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: reconciliar artefatos determinísticos da etapa financeira 1"
          git push origin HEAD:codex/finance-01-characterization
