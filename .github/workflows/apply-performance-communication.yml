name: Aplicar comunicação de Performance

on:
  push:
    branches:
      - prontoo
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize

permissions:
  contents: write
  pull-requests: read

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: true
  CI: true
  PRONTOO_SCHEMA_TEST_MODE: 1
  PRONTOO_INSTALLER_CLI_MODE: 1

concurrency:
  group: apply-performance-communication-1-8-6-3
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prontoo
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Aplicar alterações
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          VERSION = '1.8.6.3'
          PREVIOUS = '1.8.6.2'

          def read(path): return (root/path).read_text(encoding='utf-8')
          def write(path, text): (root/path).write_text(text, encoding='utf-8')
          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: esperado 1, encontrado {n}: {old}')
              return text.replace(old, new, 1)
          def mutate(text, name, next_name, pairs):
              start = text.find(f'function {name}(')
              end = len(text) if next_name is None else text.find(f'function {next_name}(', start + 1)
              if start < 0 or end <= start:
                  raise RuntimeError(f'Função não localizada: {name}')
              block = text[start:end]
              for old,new in pairs:
                  block = once(block, old, new, f'{name}:{old}')
              return text[:start] + block + text[end:]

          admin = read('app/Admin/AdminPages.php')
          admin = mutate(admin, 'admin_global_sequence_series_20d', 'admin_maestro_health_time_label', [
              ('function admin_global_sequence_series_20d(', 'function admin_global_sequence_series_30d('),
              ('for ($i = 19; $i >= 0; $i--)', 'for ($i = 29; $i >= 0; $i--)'),
              ('"label" => $day->format("d")', '"label" => telemetry_day_axis_label($day)'),
              ('(19 - $i)', '(29 - $i)'),
          ])
          admin = mutate(admin, 'admin_global_perf_charts_html', 'admin_performance_card_content_html', [
              ('$requests = telemetry_route_requests_series_20d();', '$views = telemetry_route_requests_series_30d();'),
              ('$records = admin_global_sequence_series_20d();', '$records = admin_global_sequence_series_30d();'),
              ('"Velocidade",', '"Últimas 24 horas",'),
              ('"secondary_label" => "Landing Page"', '"secondary_label" => "Landing"'),
              ('"Tempo médio das rotas nos últimos 5 minutos"', '"Velocidade média nos últimos 5 minutos"'),
              ('"Tempo médio das rotas nos últimos 30 minutos"', '"Velocidade média nos últimos 30 minutos"'),
              ('"Tempo médio das rotas nas últimas 24 horas"', '"Velocidade média nas últimas 24 horas"'),
              ('"dados de duração de rotas e da Landing Page."', '"dados de velocidade das rotas e da Landing."'),
              ('"Leitura e gravação",', '"Últimos 30 dias",'),
              ('$requests,', '$views,'),
              ('"primary_label" => "Requisições"', '"primary_label" => "Visualizações"'),
              ('"Requisições de hoje"', '"Visualizações de hoje"'),
              ('"Média diária de requisições nos últimos 7 dias"', '"Média diária de visualizações nos últimos 7 dias"'),
              ('"Média diária de requisições nos últimos 20 dias"', '"Média diária de visualizações nos últimos 30 dias"'),
              ('"dados de Requisições e Registros dos últimos 20 dias."', '"dados de Visualizações e Registros dos últimos 30 dias, incluindo hoje."'),
          ])
          admin = once(admin, '<h2>Telemetria das últimas 24 horas</h2>', '<h2>Performance</h2>', 'titulo Performance')
          admin = once(admin, '"Requisições",', '"Visualizações",', 'card Visualizacoes')
          admin = once(admin, '"Tempo médio das rotas",', '"Velocidade média",', 'card Velocidade media')
          admin = once(admin, '"Execuções da Landing Page",', '"Visualizações da Landing",', 'card Landing')
          write('app/Admin/AdminPages.php', admin)

          telemetry = read('app/Support/Telemetry.php')
          telemetry = mutate(telemetry, 'telemetry_retention_microseconds', 'telemetry_comparison_microseconds', [
              ('20 * 86400 * 1000000', '31 * 86400 * 1000000'),
          ])
          tz = '''function telemetry_cuiaba_tz(): DateTimeZone\n{\n    static $timezone = null;\n    return $timezone ??= new DateTimeZone("America/Cuiaba");\n}\n'''
          telemetry = once(telemetry, tz, tz + '''\nfunction telemetry_day_axis_label(DateTimeImmutable $day): string\n{\n    $weekdays = ["D", "S", "T", "Q", "Q", "S", "S"];\n    return $weekdays[(int) $day->format("w")] . $day->format("d");\n}\n''', 'helper SDD')
          telemetry = mutate(telemetry, 'telemetry_route_requests_series_20d', 'telemetry_sequence_records_series_20d', [
              ('function telemetry_route_requests_series_20d(', 'function telemetry_route_requests_series_30d('),
              ('for ($offset = 19; $offset >= 0; $offset--)', 'for ($offset = 29; $offset >= 0; $offset--)'),
              ('"label" => $day->format("d/m")', '"label" => telemetry_day_axis_label($day)'),
          ])
          telemetry = mutate(telemetry, 'telemetry_sequence_records_series_20d', None, [
              ('function telemetry_sequence_records_series_20d(', 'function telemetry_sequence_records_series_30d('),
              ('for ($i = 19; $i >= 0; $i--)', 'for ($i = 29; $i >= 0; $i--)'),
              ('"label" => $day->format("d")', '"label" => telemetry_day_axis_label($day)'),
              ('(19 - $i)', '(29 - $i)'),
          ])
          write('app/Support/Telemetry.php', telemetry)

          auth = read('app/Auth/AuthOnboarding.php')
          auth = auth.replace('telemetry_route_requests_series_20d', 'telemetry_route_requests_series_30d')
          auth = auth.replace('telemetry_sequence_records_series_20d', 'telemetry_sequence_records_series_30d')
          write('app/Auth/AuthOnboarding.php', auth)

          check = read('tools/architecture-check.php')
          replacements = [
              ('20 * 86400 * 1000000', '31 * 86400 * 1000000'),
              ('telemetry_route_requests_series_20d', 'telemetry_route_requests_series_30d'),
              ('admin_global_sequence_series_20d', 'admin_global_sequence_series_30d'),
              ('"Requisições"', '"Visualizações"'),
              ('"Tempo médio das rotas"', '"Velocidade média"'),
              ('"Execuções da Landing Page"', '"Visualizações da Landing"'),
              ('"Leitura e gravação"', '"Últimos 30 dias"'),
              ('"Velocidade",', '"Últimas 24 horas",'),
              ('$requests = telemetry_route_requests_series_30d();', '$views = telemetry_route_requests_series_30d();'),
              ("        '$requests,',", "        '$views,',"),
              ('canonical-route-telemetry-velocity-and-ledger-write-series-20d', 'canonical-page-view-velocity-and-ledger-write-series-30d'),
          ]
          for old,new in replacements:
              if old in check:
                  check = check.replace(old,new)
          needle = "'function telemetry_page_response_candidate(',\n"
          if "'function telemetry_day_axis_label('," not in check:
              check = once(check, needle, needle + "    'function telemetry_day_axis_label(',\n", 'check helper')
          write('tools/architecture-check.php', check)

          app = read('app/prontoo.php')
          app = re.sub(r'const PRONTOO_VERSION_FALLBACK = ["\'][^"\']+["\'];', f'const PRONTOO_VERSION_FALLBACK = "{VERSION}";', app, count=1)
          app = re.sub(r'const PRONTOO_PREVIOUS_VERSION = ["\'][^"\']+["\'];', f'const PRONTOO_PREVIOUS_VERSION = "{PREVIOUS}";', app, count=1)
          app = app.replace('canonical-route-telemetry-velocity-and-ledger-write-series-20d', 'canonical-page-view-velocity-and-ledger-write-series-30d')
          write('app/prontoo.php', app)

          landing = read('br/index.php')
          landing = re.sub(r'const BR_LANDING_VERSION_FALLBACK = ["\'][^"\']+["\'];', f'const BR_LANDING_VERSION_FALLBACK = "{VERSION}";', landing, count=1)
          write('br/index.php', landing)

          version_path = root/'version.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version.update({
              'version': VERSION, 'release': VERSION, 'build': '1.8.6.3-performance-communication-30d',
              'previous_version': PREVIOUS, 'logic_changes': True, 'visual_changes': True,
              'documentation_changes': True,
              'functional_equivalence_policy': 'performance-copy-unified-and-thirty-calendar-day-series',
              'rewrite_scope': 'performance_communication_shared_renderer_thirty_day_daily_series_and_supporting_retention',
              'notes': 'Performance unificada entre Status e Painel do Desenvolvedor, com Visualizações, Velocidade média e 30 dias incluindo hoje.',
              'deployment_sync_id': 'github-prontoo-1.8.6.3-performance-communication-30d',
              'release_date': '2026-08-06',
          })
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          arch_path = root/'app/architecture.manifest.json'
          arch = json.loads(arch_path.read_text(encoding='utf-8'))
          arch.update({
              'version': VERSION, 'release': VERSION, 'build': '1.8.6.3-performance-communication-30d',
              'previous_version': PREVIOUS, 'logic_changes': True, 'visual_changes': True,
              'documentation_changes': True,
              'deployment_sync_id': 'github-prontoo-1.8.6.3-performance-communication-30d',
              'developer_dashboard_observability_policy': 'status_and_developer_panel_share_ten_day_kpis_twenty_four_hour_velocity_and_thirty_day_views_and_writes',
              'performance_communication_policy': 'visualizacoes_velocidade_media_visualizacoes_da_landing_performance_24h_30d',
              'performance_daily_series_policy': 'thirty_civil_days_including_today_with_weekday_initial_and_two_digit_day_axis_labels',
          })
          arch_path.write_text(json.dumps(arch, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          changelog_path = root/'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## 1.8.6.3 — Comunicação de Performance e série de 30 dias\n\n- consolida Visualizações, Velocidade média e Visualizações da Landing;\n- renomeia os blocos para Performance, Últimas 24 horas e Últimos 30 dias;\n- mantém Status e Painel do Desenvolvedor no mesmo renderer;\n- amplia Visualizações e Registros para 30 dias civis, incluindo hoje;\n- apresenta o eixo diário no formato `SDD` e mantém a data completa no tooltip;\n- amplia a retenção técnica para 31 dias, sem alterar banco ou schema.\n\n'''
          if '## 1.8.6.3 —' not in changelog:
              changelog = changelog.replace('# Histórico de versões\n\n', '# Histórico de versões\n\n' + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          for p in ['.github/workflows/apply-performance-communication.yml', '.github/workflows/agent-performance-communication.yml']:
              Path(p).unlink(missing_ok=True)
          PY
      - name: Reconciliar manifesto
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          p=root/'app/update.manifest.json'
          m=json.loads(p.read_text(encoding='utf-8'))
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          for k in ['version','release','build','database_changes','schema_changes','logic_changes','visual_changes','documentation_changes','previous_version','deployment_sync_id']:
              if k in v: m[k]=v[k]
          m['functional_equivalence_policy']='performance-copy-unified-and-thirty-calendar-day-series'
          m['notes']='Performance compartilhada com nomenclatura consolidada e séries diárias de 30 dias incluindo hoje.'
          files={}; total=0
          for f in sorted(root.rglob('*')):
              if not f.is_file() or f.is_symlink(): continue
              rel=f.relative_to(root).as_posix()
              if rel=='app/update.manifest.json' or rel.startswith('.git/') or rel.startswith('ssd/') or rel.startswith('vendor/') or rel.startswith('node_modules/'): continue
              b=f.read_bytes(); files[rel]=hashlib.sha256(b).hexdigest(); total+=len(b)
          m['files']=files; m['file_count']=len(files); m['total_uncompressed_bytes']=total
          p.write_text(json.dumps(m, ensure_ascii=False, indent=4)+'\n', encoding='utf-8')
          PY
      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            ! grep -qi 'deprecated' <<<"$output"
          done < <(git ls-files -z '*.php')
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
          php -r 'require "app/Support/Telemetry.php"; $s=telemetry_route_requests_series_30d(1786032000000000); if(count($s)!==30) throw new RuntimeException("30d"); foreach($s as $r){if(!preg_match("/^[DSTQ][0-9]{2}$/",(string)($r["label"]??""))) throw new RuntimeException("SDD");} if(telemetry_retention_microseconds()!==31*86400*1000000) throw new RuntimeException("retention");'
          grep -F '"Visualizações",' app/Admin/AdminPages.php
          grep -F '"Velocidade média",' app/Admin/AdminPages.php
          grep -F '"Visualizações da Landing",' app/Admin/AdminPages.php
          grep -F '<h2>Performance</h2>' app/Admin/AdminPages.php
          grep -F '"Últimas 24 horas",' app/Admin/AdminPages.php
          grep -F '"Últimos 30 dias",' app/Admin/AdminPages.php
          grep -F '"version": "1.8.6.3"' version.json
      - name: Publicar release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prontoo Release"
          git config user.email "release@prontoo.app"
          git add -A
          git commit -m "Release 1.8.6.3 — consolidar comunicação de Performance"
          git push origin HEAD:prontoo
