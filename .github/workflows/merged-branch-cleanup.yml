name: Repository Baseline Hygiene

on:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  BASELINE_VERSION: "1.8.14.1"
  BASELINE_SHA: "eb9b261cc6ec8c3c3d28e8c60cb3c99b08a7867d"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Remove superseded historical branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          echo "Repository baseline: ${BASELINE_VERSION} (${BASELINE_SHA})"
          for namespace in agent archive diagnostic; do
            while IFS= read -r ref; do
              branch="${ref#refs/remotes/origin/}"
              delete_reason=""
              if git merge-base --is-ancestor "$ref" origin/prontoo; then
                delete_reason="merged-into-canonical"
              elif ! git merge-base --is-ancestor "$BASELINE_SHA" "$ref"; then
                case "$branch" in
                  agent/*-1-8-13-*|agent/*probe*|agent/*diagnostic*|agent/*inventory*|agent/*issue-trigger*|agent/*publisher*|agent/*runner*|agent/zero-legacy-phase*|agent/presentation-priority-*|agent/presentation-important-audit|agent/register-zero-legacy-finalizer|archive/*|diagnostic/*)
                    delete_reason="explicit-pre-baseline-history"
                    ;;
                esac
              fi
              if [[ -n "$delete_reason" ]]; then
                echo "Deleting ${branch}: ${delete_reason}"
                git push origin --delete "$branch"
              fi
            done < <(git for-each-ref --format='%(refname)' "refs/remotes/origin/${namespace}/*")
          done
