name: Asset Release Reconcile

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/design-system-2026-modernization
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Promote release assets
        shell: bash
        run: |
          set -euo pipefail
          old='1.8.18.7'
          new='1.8.21.1'
          git mv "public/assets/app-icon-${old}.png" "public/assets/app-icon-${new}.png"
          git mv "public/assets/favicon-${old}.ico" "public/assets/favicon-${new}.ico"
          git mv "public/assets/favicon-${old}.png" "public/assets/favicon-${new}.png"
          git mv "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"
          git mv "public/assets/prontoo-mark-${old}.png" "public/assets/prontoo-mark-${new}.png"
          php -r '$p="version.json"; $j=json_decode((string)file_get_contents($p),true,512,JSON_THROW_ON_ERROR); $j["asset_version"]="1.8.21.1"; file_put_contents($p,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR).PHP_EOL);'
          perl -0pi -e 's/PRONTOO_ASSET_REV_FALLBACK = "1\.8\.18\.7"/PRONTOO_ASSET_REV_FALLBACK = "1.8.21.1"/g' app/prontoo.php
          perl -0pi -e 's/pix-1\.8\.18\.7\.svg/pix-1.8.21.1.svg/g' design/styles/application.css
          rm -f .github/workflows/asset-release-reconcile.yml
      - name: Rebuild deterministic artifacts
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
      - name: Commit promoted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/asset-release-reconcile.yml \
            .github/workflows/architecture.yml \
            .github/workflows/documentation.yml \
            CHANGELOG.md \
            app/architecture.manifest.json \
            app/update.manifest.json \
            app/prontoo.php \
            br/index.php \
            design/styles/application.css \
            public/assets/app-icon-1.8.18.7.png \
            public/assets/app-icon-1.8.21.1.png \
            public/assets/favicon-1.8.18.7.ico \
            public/assets/favicon-1.8.21.1.ico \
            public/assets/favicon-1.8.18.7.png \
            public/assets/favicon-1.8.21.1.png \
            public/assets/pix-1.8.18.7.svg \
            public/assets/pix-1.8.21.1.svg \
            public/assets/prontoo-mark-1.8.18.7.png \
            public/assets/prontoo-mark-1.8.21.1.png \
            public/assets/presentation.css \
            version.json
          git status --short
          git diff --cached --check
          git commit -m "Promove assets da release 1.8.21.1"
          git push origin HEAD:agent/design-system-2026-modernization
