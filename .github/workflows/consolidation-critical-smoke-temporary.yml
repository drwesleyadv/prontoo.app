name: Consolidation Critical Smoke Temporary

on:
  pull_request:
    branches: [prontoo]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'agent/consolidation-audit-20260809'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-audit-20260809
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Migrate critical smoke and reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('tools/critical-runtime-smoke-check')
          s = p.read_text()
          exact = {
              '$pdo = pdo();': "$pdo = \\Prontoo\\Core\\Architecture\\OperationGateway::invoke('pdo');",
          }
          for old, new in exact.items():
              if old not in s:
                  raise SystemExit(f'critical smoke token not found: {old}')
              s = s.replace(old, new)
          operations = [
              'active_clinic_roles_for_user',
              'login_resolve_user_credential',
              'user_auth_generation_ensure',
              'user_auth_generation_rotate',
              'user_auth_generation_current',
              'mfa_totp_secret_generate',
              'mfa_record_save',
              'mfa_secret_encrypt',
              'mfa_enrollment_state',
              'mfa_record_load',
              'mfa_secret_decrypt',
              'val',
          ]
          for name in operations:
              old = name + '('
              new = "\\Prontoo\\Core\\Architecture\\OperationGateway::invoke('" + name + "', "
              if old not in s:
                  raise SystemExit(f'critical smoke operation not found: {name}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          php -l tools/critical-runtime-smoke-check
          php tools/release-contract-reconcile --write
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/critical-runtime-smoke-check app/update.manifest.json app/architecture.manifest.json version.json app/prontoo.php br/index.php CHANGELOG.md .github/workflows/architecture.yml .github/workflows/documentation.yml
          git commit -m 'test: migrate critical smoke to native operation gateway'
          git push origin HEAD:agent/consolidation-audit-20260809
