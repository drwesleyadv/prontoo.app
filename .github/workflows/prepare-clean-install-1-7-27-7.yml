name: Prepare Prontoo 1.7.27.7 clean installation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-clean-install-1-7-27-7.yml
      - tools/prepare-clean-install-1-7-27-7.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Generate temporary commissioning release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare-clean-install-1-7-27-7.py
          find . -type f -name '*.php' -not -path './ssd/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          php tools/security-regression-check.php
          php tools/install-security-check.php
          php tools/schema-check.php
          PRONTOO_SCHEMA_DSN='mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4' \
          PRONTOO_SCHEMA_USER=root \
          PRONTOO_SCHEMA_PASS=root \
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php
          php tools/architecture-check.php
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json[$file] = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
            }
            $version = (string) $json["version.json"]["version"];
            if ($version !== "1.7.27.7" ||
                (string) $json["version.json"]["release"] !== $version ||
                (string) $json["app/update.manifest.json"]["version"] !== $version ||
                (string) $json["app/architecture.manifest.json"]["version"] !== $version) {
              throw new RuntimeException("Contrato de versão divergente");
            }
            $manifest = $json["app/update.manifest.json"];
            $files = (array) ($manifest["files"] ?? []);
            if (count($files) !== (int) ($manifest["file_count"] ?? -1)) {
              throw new RuntimeException("file_count divergente");
            }
            $bytes = 0;
            foreach ($files as $file => $expected) {
              if (!is_file($file) || !hash_equals((string) $expected, hash_file("sha256", $file))) {
                throw new RuntimeException("Manifesto divergente: " . $file);
              }
              $bytes += filesize($file);
            }
            if ($bytes !== (int) ($manifest["total_uncompressed_bytes"] ?? -1)) {
              throw new RuntimeException("Tamanho do manifesto divergente");
            }
          '

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prontoo Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.7 — instalação limpa temporária"
          git push origin HEAD:main
          git push origin --delete agent/clean-install-1-7-27-7 || true
