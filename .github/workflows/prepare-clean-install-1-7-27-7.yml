name: Prepare Prontoo 1.7.27.7 clean installation

on:
  push:
    branches:
      - agent/clean-install-1-7-27-7
    paths:
      - .github/workflows/prepare-clean-install-1-7-27-7.yml
      - tools/prepare-clean-install-1-7-27-7.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-install-1-7-27-7
          fetch-depth: 0
          persist-credentials: true

      - name: Generate temporary commissioning release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare-clean-install-1-7-27-7.py
          php -l app/Core/Install/InstallAccess.php
          php -l app/Install/Installer.php
          php -l app/prontoo.php
          php -l br/index.php
          php -l tools/install-security-check.php
          php tools/install-security-check.php

      - name: Commit generated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prontoo Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.7 — instalação limpa temporária"
          git push origin HEAD:agent/clean-install-1-7-27-7
