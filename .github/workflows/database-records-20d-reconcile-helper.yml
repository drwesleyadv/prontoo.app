name: Database records 20d reconcile helper

on:
  push:
    branches:
      - agent/database-records-20d

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Decode patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/db20-core.part1a .github/db20-core.part1b .github/db20-core.part2 .github/db20-core.part3 .github/db20-core.part4 | base64 -d | gzip -d > /tmp/db20-core.patch
      - name: Check patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/db20-core.patch
      - name: Apply core patch
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/db20-core.patch
      - name: Apply canonical reconciliations
        shell: bash
        run: |
          set -euo pipefail
          python .github/db20-reconcile.py
      - name: Reconcile release
        shell: bash
        run: |
          set -euo pipefail
          rm .github/db20-core.patch.gz.b64 .github/db20-core.part1 .github/db20-core.part1a .github/db20-core.part1b .github/db20-core.part2 .github/db20-core.part3 .github/db20-core.part4
          rm .github/db20-reconcile.py
          rm .github/workflows/database-records-20d-reconcile-helper.yml
          php tools/release-contract-reconcile --write
      - name: Validate record telemetry
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php
          php -l app/Presentation/AuthOnboarding/AuthOnboardingPresentationOperations01.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations07.php
          php tools/database-record-telemetry-contract-check
          php tools/telemetry-json-source-contract-check
          php tools/version-asset-contract-check.php
      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          php tools/documentation-check.php
      - name: Validate release contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --check
      - name: Validate fast quality gate
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate --fast
      - name: Commit reconciled change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta Registros e sobreposição do rodapé"
          git push origin HEAD:agent/database-records-20d
