name: SOL dashboard release

on:
  push:
    branches:
      - deploy-sol-dashboard

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: deploy-sol-dashboard
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Assemble dashboard
        shell: bash
        run: |
          set -euo pipefail
          cat .release/sol-dashboard/part-* | base64 -d > /tmp/sol-dashboard.zip
          echo '549b8b8e4d451c20a8872f9efe2dc6c311bec7586f94c7263bc32a0db5f6a0d8  /tmp/sol-dashboard.zip' | sha256sum -c -
          rm -rf sol
          mkdir -p sol
          unzip -q /tmp/sol-dashboard.zip -d sol
          rm -rf .release
          rm -f .github/workflows/sol-dashboard-release.yml
      - name: Bump release metadata
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          date_default_timezone_set("America/Cuiaba");
          $p="version.json";
          $j=json_decode(file_get_contents($p),true,512,JSON_THROW_ON_ERROR);
          $v="1.8.25.1";
          $now=date("c");
          $j["version"]=$v;
          $j["release"]=$v;
          $j["asset_version"]=$v;
          $j["generated_at_unix"]=time();
          $j["generated_at"]=$now;
          $j["updated_at"]=$now;
          $j["release_date"]="2026-08-25";
          $j["build"]=$v."-sol-dashboard";
          $j["package_type"]="incremental_sol_dashboard_publish";
          $j["database_changes"]=false;
          $j["schema_changes"]=false;
          $j["logic_changes"]=true;
          $j["visual_changes"]=true;
          $j["documentation_changes"]=true;
          $j["functional_equivalence_policy"]="prontoo_product_behavior_preserved_sol_dashboard_isolated_under_public_sol_path";
          $j["notes"]="Publica o dashboard pessoal SOL/USDT em /sol, isolado do runtime, banco, sessão e domínios do Prontoo.";
          $j["deployment_sync_id"]="github-prontoo-".$v."-sol-dashboard";
          $j["deployment_sync_requested_at"]=$now;
          $j["changelog"]=["title"=>"Dashboard pessoal SOL/USDT em /sol","items"=>[
            "publica o dashboard pessoal SOL/USDT em /sol sem integrar domínio, banco ou sessão do Prontoo",
            "preserva preço ao vivo via Jupiter/Binance e WebSocket, candles, volume e painel operacional",
            "mantém replay histórico, backtest, carteira teórica e motor de decisão em armazenamento próprio sob sol/cache",
            "bloqueia acesso HTTP direto a bibliotecas, cron, aprendizado, logs e JSONs de runtime do painel",
            "marca o dashboard como noindex e mantém os artefatos internos fora da indexação pública",
            "preserva banco, schema e comportamento funcional do Prontoo sem qualquer migração"
          ]];
          file_put_contents($p,json_encode($j,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL);
          '
          php tools/release-contract-reconcile --write
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --check
          find sol -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sol/js/app.js
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/quality-gate --fast
          test "$(sha256sum /tmp/sol-dashboard.zip | cut -d' ' -f1)" = '549b8b8e4d451c20a8872f9efe2dc6c311bec7586f94c7263bc32a0db5f6a0d8'
      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publica dashboard SOL em /sol e reconcilia 1.8.25.1'
          git push origin HEAD:deploy-sol-dashboard
