name: Fix PHP84 Security Contract

on:
  push:
    branches:
      - agent/reconcile-security-release-1-8-14-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Fix PHP84 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; paths=[Path("app/Infrastructure/Integrity/PiIntegrity.php"),Path("app/Infrastructure/SecurityAccess/PdoMfaRecordRepository.php")]; [(lambda p: (lambda s: (s.count("$secret = trim($value);")==1 and s.count("$secret = trim((string) ($config['\"'\"'secret'\"'\"] ?? '\"'\"''\"'\"'));")==1) or (_ for _ in ()).throw(SystemExit("trim alvo não único: "+str(p))))(p.read_text()))(p) for p in paths]; [p.write_text(p.read_text().replace("$secret = trim($value);","$secret = mb_trim($value);",1).replace("$secret = trim((string) ($config['\"'\"'secret'\"'\"] ?? '\"'\"''\"'\"'));","$secret = mb_trim((string) ($config['\"'\"'secret'\"'\"] ?? '\"'\"''\"'\"'));",1)) for p in paths]'
          git rm .github/workflows/fix-php84-contract-reconcile.yml
          php -l app/Infrastructure/Integrity/PiIntegrity.php
          php -l app/Infrastructure/SecurityAccess/PdoMfaRecordRepository.php
          php tools/php84-runtime-contract-check
          php tools/security-regression-check.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy php84 security string contract"
          git push origin HEAD:agent/reconcile-security-release-1-8-14-1
