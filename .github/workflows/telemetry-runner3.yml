name: Telemetry Runner 3

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-runner3.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Implement and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new,1)); return
              parts=[x for x in re.split(r'\s+',old.strip()) if x]
              pattern=r'\s+'.join(re.escape(x) for x in parts)
              s2,n=re.subn(pattern,lambda m:new,s,count=1)
              if n!=1: raise SystemExit('patch token missing: '+path+' :: '+old[:100])
              p.write_text(s2)

          def replace_method(path, signature, next_signature, body):
              p=Path(path); s=p.read_text(); a=s.find(signature)
              if a<0: raise SystemExit('method start missing: '+signature)
              b=s.find(next_signature,a)
              if b<0: raise SystemExit('method end missing: '+next_signature)
              p.write_text(s[:a]+body+s[b:])

          ops3='''<?php
