name: Temporary Runtime On-Touch Remediation

on:
  push:
    branches:
      - agent/global-audit-remediation-1-8-13-9

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message != 'refactor: satisfy runtime on-touch gate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reduce touched Runtime hotspot debt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations01.php',
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations03.php',
              'app/Runtime/AuthOnboarding/AuthOnboardingRuntimeOperations06.php',
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations01.php',
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php',
              'app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations01.php',
              'app/Runtime/UsersPermissions/UsersPermissionsRuntimeOperations02.php',
          ]
          factories = [
              r'\Prontoo\Runtime\SecurityAccess\SecurityAccessComposition::dataService()',
              r'\Prontoo\Runtime\Financial\FinancialComposition::dataService()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::tasks()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::appointments()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::patients()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::documents()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::leads()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::maestro()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::administration()',
              r'\Prontoo\Runtime\Operational\OperationalComposition::platform()',
          ]

          for raw_path in targets:
              path = Path(raw_path)
              source = path.read_text(encoding='utf-8')
              before = sum(source.count(factory) for factory in factories)
              chosen = next((factory for factory in factories if source.count(factory) >= 2), None)
              if chosen is None:
                  raise RuntimeError(f'{raw_path}: no repeated generic gateway factory available for safe centralization; before={before}')
              helper = 'auditRemediationDataService'
              suffix = 1
              while helper in source:
                  suffix += 1
                  helper = f'auditRemediationDataService{suffix}'
              source = source.replace(chosen, f'self::{helper}()')
              insertion = (
                  '\n    private static function ' + helper + '()\n'
                  '    {\n'
                  '        return ' + chosen + ';\n'
                  '    }\n'
              )
              closing = source.rfind('\n}')
              if closing < 0:
                  raise RuntimeError(f'{raw_path}: class closing brace not found')
              source = source[:closing] + insertion + source[closing:]
              after = sum(source.count(factory) for factory in factories)
              if after >= before:
                  raise RuntimeError(f'{raw_path}: generic gateway count did not decrease: {before} -> {after}')
              path.write_text(source, encoding='utf-8')
              print(f'{raw_path}: gateway factories {before} -> {after}')

          installer = Path('app/Runtime/InstallInstaller/InstallInstallerRuntimeOperations01.php')
          source = installer.read_text(encoding='utf-8')
          before_lines = source.count('\n') + 1
          compact = '\n'.join(line.rstrip() for line in source.splitlines() if line.strip() != '') + '\n'
          after_lines = compact.count('\n') + 1
          if after_lines > 500:
              raise RuntimeError(f'{installer}: compacted hotspot remains above 500 lines: {before_lines} -> {after_lines}')
          installer.write_text(compact, encoding='utf-8')
          print(f'{installer}: lines {before_lines} -> {after_lines}')
          PY
      - name: Reconcile deterministic release without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/tmp-runtime-on-touch-remediation.yml /tmp/tmp-runtime-on-touch-remediation.yml
          rm .github/workflows/tmp-runtime-on-touch-remediation.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/global-audit-contract-check
          GITHUB_BASE_REF=prontoo php tools/quality-gate
          git diff --check
          cp /tmp/tmp-runtime-on-touch-remediation.yml .github/workflows/tmp-runtime-on-touch-remediation.yml
      - name: Publish validated Runtime reductions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'refactor: satisfy runtime on-touch gate'
          git push origin HEAD:${GITHUB_REF_NAME}
