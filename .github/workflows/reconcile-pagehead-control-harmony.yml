          }
          contract['pagehead_action'] = {
              'geometry_source': 'pagehead_control',
              'primary_role': 'filled_clinic_accent',
              'secondary_role': 'clinic_accent_tint_and_outline',
              'danger_role': 'semantic_error_palette',
