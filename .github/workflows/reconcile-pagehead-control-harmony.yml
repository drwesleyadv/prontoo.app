name: Reconcile PageHead Control Harmony

on:
  push:
    branches:
      - 'agent/pagehead-control-harmony'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/pagehead-control-harmony
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.tmp-pagehead-control-harmony.py
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prontoo-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(presentation): harmonize PageHead controls globally'
          git push origin HEAD:agent/pagehead-control-harmony
