name: Reconcile PageHead Control Harmony

on:
  push:
    branches:
      - 'agent/pagehead-control-harmony'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/pagehead-control-harmony
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Harmonize PageHead controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          css_path = Path('public/assets/design-system.css')
          contract_path = Path('app/presentation.visual-contract.json')
          checker_path = Path('tools/presentation-visual-contract-check')
          css = css_path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return source.replace(old, new, 1)

          def selector_metrics(source):
              identity = re.compile(r'(^|;)\s*(?:min-height|height|padding(?:-[a-z]+)?|gap|border(?:-[a-z]+)?|border-radius|background(?:-[a-z]+)?|color|box-shadow|font(?:-[a-z]+)?|line-height|white-space|align-items|justify-content)\s*:', re.I)
              counts = {}
              route_action = 0
              route_operation = 0
              legacy_direct = 0
              for match in re.finditer(r'([^{}]+)\{([^{}]*)\}', source):
                  selector = re.sub(r'\s+', ' ', match.group(1).strip())
                  declarations = match.group(2)
                  if selector and not selector.startswith('@'):
                      counts[selector] = counts.get(selector, 0) + 1
                  if 'body[data-route=' in selector and re.search(r'\.pagehead-actions\s+(?:[>+~]|\.)', selector) and identity.search(declarations):
                      route_action += 1
                  if 'body[data-route=' in selector and '.pagehead-operations .operation-chip' in selector and identity.search(declarations):
                      route_operation += 1
                  if re.search(r'\.pagehead-actions\s*>\s*(?:a|button|summary)', selector) and identity.search(declarations):
                      legacy_direct += 1
              php = ''.join(p.read_text(errors='ignore') for p in Path('app').rglob('*.php'))
              return {
                  'lines': source.count('\n') + 1,
                  'nonblank_lines': sum(1 for line in source.splitlines() if line.strip()),
                  'bytes': len(source.encode()),
                  'important_count': source.count('!important'),
                  'route_scope_count': source.count('body[data-route='),
                  'duplicate_selector_headers': sum(1 for count in counts.values() if count > 1),
                  'legacy_primary_small_cmdlike': php.count('primary small cmdlike'),
                  'pagehead_route_identity_overrides': route_action,
                  'pagehead_route_operation_identity_overrides': route_operation,
                  'pagehead_legacy_direct_identity_overrides': legacy_direct,
                  'doc_pagehead_primary_overrides': source.count('.doc-page-actions .primary{'),
                  'pagehead_ds_action_overrides': source.count('.pagehead-actions .ds-pagehead-action{'),
                  'finance_cash_pagehead_geometry_overrides': source.count('.finance-cash-pagehead-actions .finance-cash-action{\n  min-height:'),
                  'canonical_pagehead_geometry_rules': source.count('.pagehead-actions :is(a,button,summary){min-height:var(--pt-pagehead-control-height)'),
                  'canonical_pagehead_operation_geometry_rules': source.count('.pagehead-operations .operation-chip{min-height:var(--pt-pagehead-control-height)'),
              }

          before = selector_metrics(css)

          old_tokens = '''  --pt-pagehead-action-height:34px;
  --pt-pagehead-action-radius:var(--md-sys-shape-corner-large);
  --pt-pagehead-action-padding-block:7px;
  --pt-pagehead-action-padding-inline:12px;
  --pt-pagehead-action-gap:8px;
  --pt-pagehead-action-icon-size:20px;
  --pt-pagehead-action-mobile-height:42px;
  --pt-pagehead-action-mobile-padding-inline:13px;
  --pt-pagehead-action-font:var(--md-sys-typescale-label-medium);
  --pt-pagehead-action-weight:700;
  --pt-pagehead-action-accent:var(--clinic-identity-accent,var(--md-sys-color-primary));
  --pt-pagehead-action-on-accent:var(--clinic-identity-on-accent,var(--md-sys-color-on-primary));
  --pt-pagehead-action-hover:var(--clinic-identity-hover,var(--md-ref-palette-primary30));
  --pt-pagehead-action-accent-strong:var(--md-ref-palette-primary30);'''
          new_tokens = '''  --pt-pagehead-control-height:38px;
  --pt-pagehead-control-radius:var(--md-sys-shape-corner-large);
  --pt-pagehead-control-padding-block:7px;
  --pt-pagehead-control-padding-inline:12px;
  --pt-pagehead-control-gap:8px;
  --pt-pagehead-control-icon-size:20px;
  --pt-pagehead-control-mobile-height:42px;
  --pt-pagehead-control-mobile-padding-inline:13px;
  --pt-pagehead-control-font:var(--md-sys-typescale-label-medium);
  --pt-pagehead-control-weight:700;
  --pt-pagehead-operation-gap:3px;
  --pt-pagehead-group-gap:16px;
  --pt-pagehead-control-accent:var(--clinic-identity-accent,var(--md-sys-color-primary));
  --pt-pagehead-control-on-accent:var(--clinic-identity-on-accent,var(--md-sys-color-on-primary));
  --pt-pagehead-control-hover:var(--clinic-identity-hover,var(--md-ref-palette-primary30));
  --pt-pagehead-control-container:color-mix(in srgb,var(--pt-pagehead-control-accent) 15%,var(--md-sys-color-surface-container-lowest));
  --pt-pagehead-control-on-container:color-mix(in srgb,var(--pt-pagehead-control-accent) 74%,#102018);
  --pt-pagehead-action-height:var(--pt-pagehead-control-height);
  --pt-pagehead-action-radius:var(--pt-pagehead-control-radius);
  --pt-pagehead-action-padding-block:var(--pt-pagehead-control-padding-block);
  --pt-pagehead-action-padding-inline:var(--pt-pagehead-control-padding-inline);
  --pt-pagehead-action-gap:var(--pt-pagehead-control-gap);
  --pt-pagehead-action-icon-size:var(--pt-pagehead-control-icon-size);
  --pt-pagehead-action-mobile-height:var(--pt-pagehead-control-mobile-height);
  --pt-pagehead-action-mobile-padding-inline:var(--pt-pagehead-control-mobile-padding-inline);
  --pt-pagehead-action-font:var(--pt-pagehead-control-font);
  --pt-pagehead-action-weight:var(--pt-pagehead-control-weight);
  --pt-pagehead-action-accent:var(--pt-pagehead-control-accent);
  --pt-pagehead-action-on-accent:var(--pt-pagehead-control-on-accent);
  --pt-pagehead-action-hover:var(--pt-pagehead-control-hover);
  --pt-pagehead-action-accent-strong:var(--md-ref-palette-primary30);'''
          css = replace_once(css, old_tokens, new_tokens, 'root pagehead tokens')

          old_readonly = 'body.is-read-only{--pt-pagehead-action-accent:var(--clinic-identity-readonly,var(--md-sys-color-secondary));--pt-pagehead-action-on-accent:var(--clinic-identity-on-readonly,var(--md-sys-color-on-secondary));--pt-pagehead-action-hover:var(--clinic-identity-readonly-hover,color-mix(in srgb,var(--pt-pagehead-action-accent) 88%,#000));--pt-pagehead-action-accent-strong:var(--pt-pagehead-action-hover)}'
          new_readonly = 'body.is-read-only{--pt-pagehead-control-accent:var(--clinic-identity-readonly,var(--md-sys-color-secondary));--pt-pagehead-control-on-accent:var(--clinic-identity-on-readonly,var(--md-sys-color-on-secondary));--pt-pagehead-control-hover:var(--clinic-identity-readonly-hover,color-mix(in srgb,var(--pt-pagehead-control-accent) 88%,#000));--pt-pagehead-control-container:color-mix(in srgb,var(--pt-pagehead-control-accent) 15%,var(--md-sys-color-surface-container-lowest));--pt-pagehead-control-on-container:color-mix(in srgb,var(--pt-pagehead-control-accent) 74%,#102018);--pt-pagehead-action-accent:var(--pt-pagehead-control-accent);--pt-pagehead-action-on-accent:var(--pt-pagehead-control-on-accent);--pt-pagehead-action-hover:var(--pt-pagehead-control-hover);--pt-pagehead-action-accent-strong:var(--pt-pagehead-control-hover)}'
          css = replace_once(css, old_readonly, new_readonly, 'read-only pagehead tokens')

          old_ops = '''.pagehead.has-operations{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.pagehead-operations{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;min-width:0}
.pagehead-operations .operation-chip{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 13px;border-radius:16px;font:var(--md-sys-typescale-label-large);font-weight:800;white-space:nowrap;text-decoration:none;background:var(--md-sys-color-surface-container-lowest);border:1px solid color-mix(in srgb,var(--md-sys-color-outline-variant) 86%,transparent);color:var(--md-sys-color-primary);transition:background var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast)}
.pagehead-operations .operation-chip:hover{background:var(--state-hover);border-color:color-mix(in srgb,var(--md-sys-color-primary) 30%,var(--md-sys-color-outline-variant));color:var(--md-sys-color-primary)}
.pagehead-operations .operation-chip.is-active,.pagehead-operations .operation-chip[aria-current]{background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);border-color:color-mix(in srgb,var(--md-sys-color-primary) 18%,transparent)}
.pagehead-operations .operation-chip.is-active .material-symbols-rounded,.pagehead-operations .operation-chip[aria-current] .material-symbols-rounded{font-variation-settings:\"FILL\" 1,\"wght\" 650,\"GRAD\" 0,\"opsz\" 24}
.contextsbar{scroll-padding-inline:18px}
@media(max-width:980px){.pagehead.has-operations{grid-template-columns:1fr}.pagehead-operations{justify-content:flex-start;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:1px}.pagehead-operations::-webkit-scrollbar{display:none}.pagehead-operations .operation-chip{flex:0 0 auto}.pagehead-actions{width:100%}}
@media(max-width:640px){.pagehead-operations .operation-chip{min-height:40px;padding-inline:12px}.pagehead-operations .operation-chip:not(.is-active):not([aria-current]) span:not(.material-symbols-rounded):not(.pt-icon-glyph){display:none}.pagehead-operations .operation-chip:not(.is-active):not([aria-current]){width:42px;padding-inline:0}.pagehead-operations .operation-chip.is-active,.pagehead-operations .operation-chip[aria-current]{max-width:min(72vw,220px)}}'''
          new_ops = '''.pagehead.has-operations{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.pagehead-operations{display:flex;align-items:center;justify-content:flex-end;gap:var(--pt-pagehead-operation-gap);flex-wrap:wrap;min-width:0}
.pagehead-operations .operation-chip{min-height:var(--pt-pagehead-control-height);display:inline-flex;align-items:center;justify-content:center;gap:var(--pt-pagehead-control-gap);padding:var(--pt-pagehead-control-padding-block) var(--pt-pagehead-control-padding-inline);border-radius:var(--pt-pagehead-control-radius);font:var(--pt-pagehead-control-font);font-weight:var(--pt-pagehead-control-weight);line-height:1;white-space:nowrap;text-decoration:none;background:transparent;border:1px solid transparent;color:var(--pt-pagehead-control-accent);transition:background var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast)}
.pagehead-operations .operation-chip:hover{background:color-mix(in srgb,var(--pt-pagehead-control-hover) 8%,var(--md-sys-color-surface-container-lowest));border-color:transparent;color:var(--pt-pagehead-control-hover)}
.pagehead-operations .operation-chip.is-active,.pagehead-operations .operation-chip[aria-current]{background:var(--pt-pagehead-control-container);color:var(--pt-pagehead-control-on-container);border-color:transparent}
.pagehead-operations .operation-chip :is(.material-symbols-rounded,.pt-icon-glyph){font-size:var(--pt-pagehead-control-icon-size);line-height:1;flex:0 0 auto}
.pagehead-operations .operation-chip.is-active .material-symbols-rounded,.pagehead-operations .operation-chip[aria-current] .material-symbols-rounded{font-variation-settings:\"FILL\" 1,\"wght\" 650,\"GRAD\" 0,\"opsz\" 24}
.contextsbar{scroll-padding-inline:18px}
@media(max-width:980px){.pagehead.has-operations{grid-template-columns:1fr}.pagehead-operations{justify-content:flex-start;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:1px}.pagehead-operations::-webkit-scrollbar{display:none}.pagehead-operations .operation-chip{flex:0 0 auto}.pagehead-actions{width:100%}}
@media(max-width:640px){.pagehead-operations .operation-chip{min-height:var(--pt-pagehead-control-mobile-height);padding-inline:var(--pt-pagehead-control-mobile-padding-inline)}.pagehead-operations .operation-chip:not(.is-active):not([aria-current]) span:not(.material-symbols-rounded):not(.pt-icon-glyph){display:none}.pagehead-operations .operation-chip:not(.is-active):not([aria-current]){width:42px;padding-inline:0}.pagehead-operations .operation-chip.is-active,.pagehead-operations .operation-chip[aria-current]{max-width:min(72vw,220px)}}'''
          css = replace_once(css, old_ops, new_ops, 'pagehead operations block')

          css = replace_once(css, '.pagehead.has-operations{\n  gap:12px!important;\n}', '.pagehead.has-operations{\n  gap:var(--pt-pagehead-group-gap)!important;\n}', 'pagehead group gap')
          css = replace_once(css, '.pagehead-operations :is(a,button){\n  border-radius:var(--md-sys-shape-corner-large)!important;\n}', '.pagehead-operations :is(a,button){\n  border-radius:var(--pt-pagehead-control-radius)!important;\n}', 'operation radius compatibility')

          old_settings = '''body[data-route=\"settings\"] .pagehead-operations .operation-chip,
body[data-route=\"procedures\"] .pagehead-operations .operation-chip{
  flex:0 0 auto;
  min-height:40px;
  border-radius:999px;
  padding-inline:12px;
}'''
          new_settings = '''body[data-route=\"settings\"] .pagehead-operations .operation-chip,
body[data-route=\"procedures\"] .pagehead-operations .operation-chip{
  flex:0 0 auto;
}'''
          css = replace_once(css, old_settings, new_settings, 'settings/procedures operation geometry')

          css = replace_once(css, 'body[data-route=\"settings\"] .pagehead-operations .operation-chip:not(.is-active):not([aria-current]),\n  body[data-route=\"procedures\"] .pagehead-operations .operation-chip:not(.is-active):not([aria-current]){width:auto;padding-inline:12px;}', 'body[data-route=\"settings\"] .pagehead-operations .operation-chip:not(.is-active):not([aria-current]),\n  body[data-route=\"procedures\"] .pagehead-operations .operation-chip:not(.is-active):not([aria-current]){width:auto;}', 'settings/procedures mobile geometry')

          css = replace_once(css, 'body[data-route=\"profile\"] .pagehead-operations .operation-chip{white-space:nowrap}\n', '', 'profile operation white-space')
          css = replace_once(css, '@media(max-width:640px){body[data-route=\"profile\"] .pagehead-operations .operation-chip{width:auto!important;padding-inline:12px!important}body[data-route=\"profile\"] .pagehead-operations .operation-chip span:not(.material-symbols-rounded):not(.pt-icon-glyph){display:inline!important}}', '@media(max-width:640px){body[data-route=\"profile\"] .pagehead-operations .operation-chip{width:auto!important}body[data-route=\"profile\"] .pagehead-operations .operation-chip span:not(.material-symbols-rounded):not(.pt-icon-glyph){display:inline!important}}', 'profile mobile operation geometry')

          old_finance = '''.finance-cash-pagehead-actions .finance-cash-action{
  min-height:40px;
  padding-inline:12px;
  border-radius:999px;
}
.finance-cash-pagehead-actions .finance-cash-action.active{
  background:var(--md-sys-color-primary-container);
  color:var(--md-sys-color-on-primary-container);
  border-color:color-mix(in srgb,var(--md-sys-color-primary) 22%,var(--md-sys-color-outline-variant));
}'''
          new_finance = '''.finance-cash-pagehead-actions .finance-cash-action.active{
  background:var(--pt-pagehead-control-container);
  color:var(--pt-pagehead-control-on-container);
  border-color:color-mix(in srgb,var(--pt-pagehead-control-accent) 22%,var(--md-sys-color-outline-variant));
}'''
          css = replace_once(css, old_finance, new_finance, 'finance cash pagehead geometry')

          old_actions = '''.pagehead-actions :where(a,button,summary){min-height:var(--pt-pagehead-action-height);display:inline-flex;align-items:center;justify-content:center;gap:var(--pt-pagehead-action-gap);padding:var(--pt-pagehead-action-padding-block) var(--pt-pagehead-action-padding-inline);border-radius:var(--pt-pagehead-action-radius);font:var(--pt-pagehead-action-font);font-weight:var(--pt-pagehead-action-weight);line-height:1;white-space:nowrap;text-decoration:none;box-shadow:none}
.pagehead-actions :where(.primary){background:var(--pt-pagehead-action-accent);color:var(--pt-pagehead-action-on-accent);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pagehead-actions :where(.ghost,.cmdlike):not(.primary){background:color-mix(in srgb,var(--pt-pagehead-action-accent) 4%,var(--md-sys-color-surface-container-lowest));color:var(--pt-pagehead-action-accent);border-color:color-mix(in srgb,var(--pt-pagehead-action-accent) 18%,var(--md-sys-color-outline-variant));box-shadow:none}
.pagehead-actions :where(.ghost,.cmdlike):not(.primary):hover{background:color-mix(in srgb,var(--pt-pagehead-action-hover) 10%,var(--md-sys-color-surface-container-lowest));border-color:color-mix(in srgb,var(--pt-pagehead-action-hover) 34%,var(--md-sys-color-outline-variant));color:var(--pt-pagehead-action-hover)}.pagehead-actions :where(.primary):hover{background:var(--pt-pagehead-action-hover);color:var(--pt-pagehead-action-on-accent);box-shadow:var(--md-sys-elevation-level2)}
.pagehead-actions :where(.material-symbols-rounded,.pt-icon-glyph){font-size:var(--pt-pagehead-action-icon-size);line-height:1;flex:0 0 auto}
@media(max-width:640px){.pagehead-actions :where(a,button,summary){min-height:var(--pt-pagehead-action-mobile-height);padding-inline:var(--pt-pagehead-action-mobile-padding-inline)}}'''
          new_actions = '''.pagehead-actions :is(a,button,summary){min-height:var(--pt-pagehead-control-height);display:inline-flex;align-items:center;justify-content:center;gap:var(--pt-pagehead-control-gap);padding:var(--pt-pagehead-control-padding-block) var(--pt-pagehead-control-padding-inline);border-radius:var(--pt-pagehead-control-radius);font:var(--pt-pagehead-control-font);font-weight:var(--pt-pagehead-control-weight);line-height:1;white-space:nowrap;text-decoration:none;box-shadow:none}
.pagehead-actions :is(.primary){background:var(--pt-pagehead-action-accent);color:var(--pt-pagehead-action-on-accent);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pagehead-actions :is(.ghost,.cmdlike):not(.primary){background:color-mix(in srgb,var(--pt-pagehead-action-accent) 4%,var(--md-sys-color-surface-container-lowest));color:var(--pt-pagehead-action-accent);border-color:color-mix(in srgb,var(--pt-pagehead-action-accent) 18%,var(--md-sys-color-outline-variant));box-shadow:none}
.pagehead-actions :is(.ghost,.cmdlike):not(.primary):hover{background:color-mix(in srgb,var(--pt-pagehead-action-hover) 10%,var(--md-sys-color-surface-container-lowest));border-color:color-mix(in srgb,var(--pt-pagehead-action-hover) 34%,var(--md-sys-color-outline-variant));color:var(--pt-pagehead-action-hover)}.pagehead-actions :is(.primary):hover{background:var(--pt-pagehead-action-hover);color:var(--pt-pagehead-action-on-accent);box-shadow:var(--md-sys-elevation-level1)}
.pagehead-actions :is(.material-symbols-rounded,.pt-icon-glyph){font-size:var(--pt-pagehead-control-icon-size);line-height:1;flex:0 0 auto}
@media(max-width:640px){.pagehead-actions :is(a,button,summary){min-height:var(--pt-pagehead-control-mobile-height);padding-inline:var(--pt-pagehead-control-mobile-padding-inline)}}'''
          css = replace_once(css, old_actions, new_actions, 'canonical pagehead actions')

          css_path.write_text(css)
          after = selector_metrics(css)

          contract = json.loads(contract_path.read_text())
          contract['version'] = '1.8.12.4'
          contract['reference']['visual_reference'] = 'unified_pagehead_control_38px'
          contract['reference']['ux_policy'] = 'preserve_daily_use_memory_layout_flow_information_hierarchy_touch_targets_and_semantic_action_roles'
          old_action = contract.get('pagehead_action', {})
          color_contract = old_action.get('color_contract', {})
          contract['pagehead_control'] = {
              'desktop': {
                  'min_height_px': 38,
                  'radius_px': 16,
                  'padding_block_px': 7,
                  'padding_inline_px': 12,
                  'gap_px': 8,
                  'icon_px': 20,
