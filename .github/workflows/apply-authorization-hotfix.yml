name: Apply Authorization Hotfix 1.7.21.6

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-1.7.21.6-authorization-scopes
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply exact authorization contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-auth-hotfix-1.7.21.6.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '- ferramenta permanente `tools/authorization-scope-check.php`.': '- autotestes permanentes no catálogo e no provedor, certificados pela matriz de CI.',
              'architecture["authorization_scope_check"] = "tools/authorization-scope-check.php"': 'architecture["authorization_scope_check"] = "ActionCatalog::logicSelfTest + RuntimeCapabilityProvider::logicSelfTest + .github/workflows/architecture.yml"',
              '    "tools/authorization-scope-check.php",\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('marcador ausente: ' + old)
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/apply-auth-hotfix-1.7.21.6.py

      - name: Validate authorization, runtime and schema
        shell: bash
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -path './.git' -prune -o -path './storage' -prune -o -name '*.php' -print0)
          php tools/authorization-scope-check.php | tee authorization-scope-report.json
          rm -f tools/authorization-scope-check.php
          php tools/install-security-check.php
          php -d auto_prepend_file=app/Core/Integrity/PiIntegrity.php tools/schema-check.php
          php tools/architecture-check.php
          php -r '
            $m=json_decode((string)file_get_contents("app/update.manifest.json"),true,512,JSON_THROW_ON_ERROR); $bytes=0;
            foreach($m["files"] as $file=>$hash){if(!is_file($file)||!hash_equals((string)$hash,hash_file("sha256",$file)))throw new RuntimeException("hash: ".$file);$bytes+=filesize($file);} if($bytes!==(int)$m["total_uncompressed_bytes"])throw new RuntimeException("bytes");
          '
          test "$(sha256sum app/Database/schema.sql | cut -d' ' -f1)" = "28515f46af3081e5ac0dded5723e6d2d7ceddec11e9c6f782975f31931a69d33"

      - name: Commit certified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-auth-hotfix-1.7.21.6.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt AUTHORIZATION-AUDIT-1.7.21.6.md app/Admin/AdminPages.php app/Application/Authorization/ActionCatalog.php app/Database/operational-schema.contract.json app/Infrastructure/Authorization/RuntimeCapabilityProvider.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php version.json
          git add -u tools/apply-auth-hotfix-1.7.21.6.py
          git commit -m "corrige autorização por escopo na 1.7.21.6"
          git push origin HEAD:agent/hotfix-1.7.21.6-authorization-scopes

      - name: Upload authorization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-scope-report
          path: authorization-scope-report.json
          if-no-files-found: warn
          retention-days: 7
