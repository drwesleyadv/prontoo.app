name: Apply route cycle 7d comparison

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/route-cycle-7d-comparison' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply seven day consolidation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 .github/scripts/apply_route_cycle_7d.py
          php -l app/Support/Telemetry.php
          php -l app/Admin/AdminPages.php
          grep -Fq '"period" => "rolling_7_civil_days"' app/Support/Telemetry.php
          grep -Fq '"current_start" => $currentStart->format("Y-m-d")' app/Support/Telemetry.php
          grep -Fq '"previous_end" => $previousEnd->format("Y-m-d")' app/Support/Telemetry.php
          grep -Fq 'últimos 7 dias · ' app/Admin/AdminPages.php
          php -r '$today=new DateTimeImmutable("2026-08-02",new DateTimeZone("America/Cuiaba"));if($today->modify("-6 days")->format("Y-m-d")!=="2026-07-27"||$today->modify("-13 days")->format("Y-m-d")!=="2026-07-20"||$today->modify("-7 days")->format("Y-m-d")!=="2026-07-26")exit(1);'
          git show 5f79158b2d3efdc4e302173d09f9ba70c5362df2:.github/workflows/agent-status-three-kpis-fixed.yml > .github/workflows/agent-status-three-kpis-fixed.yml
          rm -f .github/scripts/apply_route_cycle_7d.py
          php <<'PHP'
          <?php
          $root=getcwd();$path=$root.'/app/update.manifest.json';$m=json_decode((string)file_get_contents($path),true,512,JSON_THROW_ON_ERROR);$files=[];$total=0;
          $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS));
          foreach($it as $f){if(!$f->isFile()||$f->isLink())continue;$r=str_replace('\\','/',substr($f->getPathname(),strlen($root)+1));if($r==='app/update.manifest.json'||str_starts_with($r,'.git/')||str_starts_with($r,'ssd/')||str_starts_with($r,'vendor/')||str_starts_with($r,'node_modules/'))continue;$files[$r]=hash_file('sha256',$f->getPathname());$total+=$f->getSize();}
          ksort($files,SORT_STRING);$m['files']=$files;$m['file_count']=count($files);$m['total_uncompressed_bytes']=$total;$m['updated_at']=gmdate('c');file_put_contents($path,json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidar ciclos dos últimos sete dias"
          git push origin HEAD:"$HEAD_BRANCH"
