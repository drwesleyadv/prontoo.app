name: Apply route cycle reset once

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/reset-route-cycle-once' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply one-time reset generation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 .github/scripts/apply_route_cycle_reset_once.py
          php -l app/Support/Telemetry.php
          grep -Fq 'function telemetry_route_cycle_reset_generation' app/Support/Telemetry.php
          grep -Fq 'route-cycles-reset-2026-08-02-1' app/Support/Telemetry.php
          grep -Fq '$state["pending"] = [];' app/Support/Telemetry.php
          grep -Fq '$state["days"] = [];' app/Support/Telemetry.php
          grep -Fq 'reset_applied_at_us' app/Support/Telemetry.php
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/Support/Telemetry.php')
          t=p.read_text(encoding='utf-8')
          assert t.count('route-cycles-reset-2026-08-02-1') == 1
          assert t.count('reset_applied_at_us') == 1
          PY
          rm -f .github/scripts/apply_route_cycle_reset_once.py
          git show feec3d785c402ea7a5fd09d981a95ad6560b4609:.github/workflows/agent-status-three-kpis-fixed.yml > .github/workflows/agent-status-three-kpis-fixed.yml
          php <<'PHP'
          <?php
          $root=getcwd();$path=$root.'/app/update.manifest.json';$m=json_decode((string)file_get_contents($path),true,512,JSON_THROW_ON_ERROR);$files=[];$total=0;
          $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS));
          foreach($it as $f){if(!$f->isFile()||$f->isLink())continue;$r=str_replace('\\','/',substr($f->getPathname(),strlen($root)+1));if($r==='app/update.manifest.json'||str_starts_with($r,'.git/')||str_starts_with($r,'ssd/')||str_starts_with($r,'vendor/')||str_starts_with($r,'node_modules/'))continue;$files[$r]=hash_file('sha256',$f->getPathname());$total+=$f->getSize();}
          ksort($files,SORT_STRING);$m['files']=$files;$m['file_count']=count($files);$m['total_uncompressed_bytes']=$total;$m['updated_at']=gmdate('c');file_put_contents($path,json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Zerar estatísticas uma única vez na próxima execução"
          git push origin HEAD:"$HEAD_BRANCH"
