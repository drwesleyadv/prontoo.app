name: Temporary Manifest Reconcile

on:
  push:
    branches:
      - agent/telemetry-areas-opacity

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telemetry-areas-opacity
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reconcile-telemetry-manifest.yml
          php tools/release-contract-reconcile --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0 || true
          git commit -m "chore(release): reconcile telemetry manifest"
          git push origin HEAD:agent/telemetry-areas-opacity
