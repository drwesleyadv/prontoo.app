name: Temporary Telemetry KPI CSS Hygiene

on:
  push:
    branches:
      - agent/telemetry-kpi-minimal-trends

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/telemetry-kpi-minimal-trends
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Remove CSS comment and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/assets/design-system.css')
          source = path.read_text()
          target = '/* Minimal telemetry KPI trend: compact 15d-over-15d variation beside the primary value. */\n'
          if source.count(target) != 1:
              raise SystemExit('telemetry KPI CSS comment target count != 1')
          path.write_text(source.replace(target, '', 1))
          PY
          rm .github/workflows/reconcile-telemetry-kpi-comment.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/code-comment-check.php
          php tools/telemetry-json-source-contract-check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(telemetry): satisfy CSS hygiene contract'
          git push origin HEAD:agent/telemetry-kpi-minimal-trends
