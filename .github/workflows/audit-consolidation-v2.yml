name: Audit Consolidation V2

on:
  push:
    branches:
      - audit/consolidation-1-9-14-1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: audit/consolidation-1-9-14-1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply audited fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations01.php',
              'array_map("mfa_recovery_code_hash", $codes)',
              'array_map([\\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::class, "mfa_recovery_code_hash"], $codes)',
              1,
          )
          replace_exact(
              'app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations02.php',
              '"mfa_recovery_code_hash"',
              '[\\Prontoo\\Runtime\\SecurityAccess\\SecurityAccessRuntimeOperations01::class, "mfa_recovery_code_hash"]',
              2,
          )
          replace_exact(
              'app/Runtime/Maestro/MaestroRuntimeOperations05.php',
              'array_map("maestro_routine_key", $rules)',
              'array_map([\\Prontoo\\Domain\\Maestro\\MaestroDomainOperations02::class, "maestro_routine_key"], $rules)',
              2,
          )

          arch = Path('app/Core/Architecture/ArchitectureVerifier.php')
          text = arch.read_text()
          old = """            if (LayerMap::isNativePath($relative)) {\n                $nativeFiles[] = $relative;\n            } else {\n                $transitionalFiles[] = $relative;\n            }\n            if (LayerMap::isNativePath($relative)) {\n"""
          new = """            $isNative = LayerMap::isNativePath($relative);\n            if ($isNative) {\n                $nativeFiles[] = $relative;\n            } elseif (str_starts_with($relative, 'app/') && $compositionRole === null) {\n                $transitionalFiles[] = $relative;\n            }\n            if ($isNative) {\n"""
          if text.count(old) != 1:
              raise SystemExit('ArchitectureVerifier target mismatch')
          arch.write_text(text.replace(old, new))

          reconcile = Path('tools/release-contract-reconcile')
          text = reconcile.read_text()
          start = text.index('$manifestFiles = [];')
          end_marker = '$manifestContent = $encodeJson($manifest);'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = r'''$derivedFiles = [
              $architectureWorkflowPath => $architectureWorkflow,
              $root . '/.github/workflows/documentation.yml' => $documentationWorkflow,
              $prontooPath => $prontoo,
              $landingPath => $landing,
              $changelogPath => $changelog,
              $architecturePath => $architectureContent,
          ];

          $rootPrefix = rtrim(str_replace('\\', '/', $root), '/') . '/';
          $tracked = shell_exec('git -C ' . escapeshellarg($root) . ' ls-files -z --cached');
          if (!is_string($tracked)) {
              throw new RuntimeException('Não foi possível enumerar os arquivos rastreados pelo Git.');
          }
          $manifestFiles = [];
          foreach (explode("\0", $tracked) as $relative) {
              if ($relative === '' || $relative === 'app/update.manifest.json') {
                  continue;
              }
              $absolute = $root . '/' . $relative;
              if (!is_file($absolute)) {
                  continue;
              }
              $manifestFiles[$relative] = array_key_exists($absolute, $derivedFiles)
                  ? hash('sha256', $derivedFiles[$absolute])
                  : hash_file('sha256', $absolute);
          }
          ksort($manifestFiles, SORT_STRING);
          $manifest['files'] = $manifestFiles;
          $manifestContent = $encodeJson($manifest);'''
          text = text[:start] + replacement + text[end:]
          old_expected = r'''$expected = [
              $architectureWorkflowPath => $architectureWorkflow,
              $root . '/.github/workflows/documentation.yml' => $documentationWorkflow,
              $prontooPath => $prontoo,
              $landingPath => $landing,
              $changelogPath => $changelog,
              $architecturePath => $architectureContent,
              $manifestPath => $manifestContent,
          ];'''
          new_expected = r'''$expected = $derivedFiles + [
              $manifestPath => $manifestContent,
          ];'''
          if text.count(old_expected) != 1:
              raise SystemExit('release-contract expected block mismatch')
          reconcile.write_text(text.replace(old_expected, new_expected))

          release_version = Path('tools/release-version')
          text = release_version.read_text()
          usage_old = "if ($targetDate === '' || $timestamp === '' || $expectedCurrent === '') {\n        $fail('Use --write --date=YYYY-MM-DD --timestamp=ISO8601 --expected-current=x.y.z.n.');\n    }"
          usage_new = "if ($targetDate === '' || $timestamp === '' || $expectedCurrent === '') {\n        $fail('Use --write --date=YYYY-MM-DD --timestamp=ISO8601 --expected-current=x.y.z.n. --metadata-file=/caminho/release.json.');\n    }"
          if text.count(usage_old) != 1:
              raise SystemExit('release-version usage block mismatch')
          text = text.replace(usage_old, usage_new)
          block_start = text.index("    $version['build'] = $next . '-architecture-21';")
          block_end = text.index("    $version['deployment_sync_requested_at'] = $timestamp;", block_start)
          block_end += len("    $version['deployment_sync_requested_at'] = $timestamp;")
          replacement = r'''    $metadataFile = trim((string) ($argument('metadata-file') ?? ''));
              if ($metadataFile === '' || !is_file($metadataFile)) {
                  $fail('Arquivo de metadados da release ausente.');
              }
              try {
                  $metadata = json_decode((string) file_get_contents($metadataFile), true, 512, JSON_THROW_ON_ERROR);
              } catch (Throwable $error) {
                  $fail('Metadados da release inválidos: ' . $error->getMessage());
              }
              if (!is_array($metadata)) {
                  $fail('Metadados da release inválidos.');
              }
              foreach (['build', 'package_type', 'notes', 'changelog'] as $requiredMetadata) {
                  if (!array_key_exists($requiredMetadata, $metadata)) {
                      $fail('Metadado obrigatório ausente: ' . $requiredMetadata);
                  }
              }
              $metadataChangelog = (array) $metadata['changelog'];
              if (trim((string) ($metadataChangelog['title'] ?? '')) === '' || count((array) ($metadataChangelog['items'] ?? [])) < 5) {
                  $fail('Changelog da release deve conter título e ao menos cinco itens.');
              }
              $version['build'] = (string) $metadata['build'];
              $version['package_type'] = (string) $metadata['package_type'];
              $version['notes'] = (string) $metadata['notes'];
              $version['changelog'] = $metadataChangelog;
              $version['logic_changes'] = (bool) ($metadata['logic_changes'] ?? true);
              $version['visual_changes'] = (bool) ($metadata['visual_changes'] ?? false);
              $version['documentation_changes'] = (bool) ($metadata['documentation_changes'] ?? true);
              if (array_key_exists('functional_equivalence_policy', $metadata)) {
                  $version['functional_equivalence_policy'] = (string) $metadata['functional_equivalence_policy'];
              }
              $version['version_policy'] = 'version_json_is_unique_canonical_source_and_release_version_bump_is_explicit';
              $version['version_format'] = '1.month.day.sequence';
              $version['version_sequence_policy'] = 'sequence_starts_at_1_and_resets_each_publication_day';
              $version['release_version_policy'] = 'explicit_date_sequence_generator_v1';
              $version['release_version_generator'] = 'tools/release-version';
              $version['deployment_sync_id'] = (string) ($metadata['deployment_sync_id'] ?? ('github-prontoo-' . $next . '-release'));
              $version['deployment_sync_requested_at'] = $timestamp;'''
          text = text[:block_start] + replacement + text[block_end:]
          release_version.write_text(text)
          PY

      - name: Materialize release and validate
        shell: bash
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/audit-consolidation-v2.yml
          cat > docs/AUDIT_CONSOLIDATION_2026-09-14.md <<'MD'
          # Consolidação pós-auditoria — 2026-09-14

          Base auditada para esta consolidação: `cbc47ee6ad7075eb22e50f778fbad13be81ad597` (`1.8.21.1`). A auditoria ampla iniciada antes desta publicação permanece parcial; este documento não declara leitura integral dos 657 arquivos rastreados nem cobertura funcional total.

          ## Correções materializadas

          - callbacks MFA e Maestro agora usam referências estáticas válidas, eliminando cinco referências a funções globais inexistentes;
          - a classificação arquitetural considera transitórios apenas arquivos internos de `app/` que não sejam composition roots;
          - o manifesto de release passa a enumerar arquivos rastreados no índice Git, excluindo arquivos operacionais locais ignorados;
          - hashes de artefatos derivados são calculados a partir do conteúdo final esperado, permitindo convergência em uma única execução `--write` seguida de `--check`;
          - o gerador de versão deixa de embutir metadados históricos e exige metadados explícitos para cada publicação.

          ## Evidência incorporada ao commit

          O commit de consolidação só é criado após sucesso de `tools/release-version`, `tools/release-contract-reconcile --write`, `tools/release-contract-reconcile --check`, prova de exclusão de `app/config.php` não rastreado, `tools/runtime-symbol-contract-check`, `tools/quality-gate --fast`, `tools/documentation-check.php`, `tools/code-comment-check.php` e `git diff --check`. Os workflows do PR permanecem a evidência autoritativa para as suítes integrais e contratos dependentes de MySQL/HTTP/Playwright antes do merge.

          ## Pendências deliberadamente não tratadas como falhas confirmadas

          Permanecem hipóteses a reproduzir nos componentes ScopeProof, TemporalQueryNormalizer, ForeignKeyGraph/TenantIntegrityInspector, escape de PDF, cálculo de idade, concorrência de idempotência em TaskCommandService e retorno de rotação em UserCredentialService. Nenhuma delas é classificada aqui como vulnerabilidade sem reprodução.

          A publicação no GitHub não implica implantação em produção.
          MD

          cat > /tmp/prontoo-release.json <<'JSON'
          {
            "build": "1.9.14.1-audit-consolidation",
            "package_type": "audit_consolidation",
            "notes": "Consolidação pós-auditoria com correções de callbacks estáticos, classificação arquitetural e determinismo do fluxo de release, sem alteração deliberada de UX ou schema.",
            "logic_changes": true,
            "visual_changes": false,
            "documentation_changes": true,
            "functional_equivalence_policy": "maintenance_fixes_preserve_user_visible_behavior_and_schema",
            "deployment_sync_id": "github-prontoo-1.9.14.1-audit-consolidation",
            "changelog": {
              "title": "Consolidação pós-auditoria",
              "items": [
                "corrige callbacks MFA convertidos para métodos estáticos nos fluxos de cadastro, regeneração e substituição do autenticador",
                "corrige callbacks do Maestro para usar o método estático canônico de chave de rotina",
                "classifica como transitórios apenas arquivos internos de app que realmente pertencem à migração arquitetural",
                "faz o manifesto de release enumerar exclusivamente arquivos rastreados pelo Git e ignorar arquivos operacionais locais",
                "calcula hashes do manifesto a partir do conteúdo final dos artefatos derivados para convergir em uma única execução",
                "remove metadados históricos hardcoded do gerador de versão e exige metadados explícitos por publicação",
                "preserva schema, banco, aparência, navegação e contratos visuais"
              ]
            }
          }
          JSON
          git add docs/AUDIT_CONSOLIDATION_2026-09-14.md
          php tools/release-version --write --date=2026-09-14 --timestamp=2026-09-14T15:06:00-04:00 --expected-current=1.8.21.1 --metadata-file=/tmp/prontoo-release.json
          printf '<?php return [];\n' > app/config.php
          php tools/release-contract-reconcile --write
          if grep -q '"app/config.php"' app/update.manifest.json; then
            echo 'arquivo operacional local contaminou o manifest' >&2
            exit 1
          fi
          if grep -q 'audit-consolidation-v2.yml' app/update.manifest.json; then
            echo 'workflow temporário contaminou o manifest' >&2
            exit 1
          fi
          php tools/release-contract-reconcile --check
          rm app/config.php
          php tools/release-version
          php tools/runtime-symbol-contract-check
          php tools/quality-gate --fast
          php tools/documentation-check.php
          php tools/code-comment-check.php
          git diff --check

      - name: Commit consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolida auditoria na versão 1.9.14.1"
          git push origin HEAD:audit/consolidation-1-9-14-1
