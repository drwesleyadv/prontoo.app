name: Apply day-only chart labels

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/day-only-chart-label' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply chart-label refinement
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
            python3 <<'PY'
          from pathlib import Path

          old = '"label" => $day->format("d/m"),'
          new = '"label" => $day->format("d"),'
          targets = [
              Path('app/Admin/AdminPages.php'),
              Path('app/Support/Telemetry.php'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(f'Contrato inesperado em {path}: antigo={old_count}, novo={new_count}')
          marker = Path('ssd/.day-only-chart-label-ci')
          if marker.exists():
              marker.unlink()
          PY
            php -l app/Admin/AdminPages.php >/dev/null
            php -l app/Support/Telemetry.php >/dev/null
            php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/Admin/AdminPages.php app/Support/Telemetry.php app/update.manifest.json ssd/.day-only-chart-label-ci 2>/dev/null || true
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Exibir somente o dia no gráfico de leitura e gravação"
            if git push origin HEAD:"$HEAD_BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
