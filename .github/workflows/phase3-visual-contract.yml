name: Phase 3 Presentation Visual Contract

on:
  push:
    branches:
      - 'agent/presentation-visual-contract-v1'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/presentation-visual-contract-v1
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Materialize visual contract
        run: python3 .github/phase3-visual-contract.py
      - name: Increment release version
        run: php tools/release-version --write --date=2026-08-12 --timestamp=2026-08-12T10:33:00-04:00 --expected-current=1.8.11.6
      - name: Describe release
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          path = Path('version.json')
          data = json.loads(path.read_text())
          release = data['version']
          if release != '1.8.12.1':
              raise SystemExit(f'unexpected release: {release}')
          data['build'] = release + '-presentation-visual-contract'
          data['package_type'] = 'incremental_refinement'
          data['logic_changes'] = True
          data['visual_changes'] = True
          data['documentation_changes'] = True
          data['database_changes'] = False
          data['schema_changes'] = False
          data['functional_equivalence_policy'] = 'presentation_visual_canonicalization_without_workflow_information_hierarchy_or_schema_change'
          data['presentation_visual_policy'] = 'presentation-visual-contract-v1'
          data['presentation_visual_contract'] = 'app/presentation.visual-contract.json'
          data['presentation_visual_check'] = 'tools/presentation-visual-contract-check'
          data['presentation_visual_reference_sha'] = 'da597d5af26eae90b66b5a473150ce619310e527'
          data['notes'] = 'Presentation Visual Contract v1: geometria, proporções, alinhamento e paleta contextual das ações fixas do PageHead são canônicos e verificáveis, preservando memória muscular, fluxo e identidade cromática dos consultórios.'
          data['changelog'] = {
              'title': 'Contrato visual canônico da Presentation',
              'items': [
                  'canoniza as ações fixas do PageHead em 34 px de altura no desktop, radius de 16 px, padding de 7 por 12 px, gap de 8 px e ícone de 20 px',
                  'preserva no mobile o alvo tátil mínimo de 42 px e padding horizontal de 13 px sem alterar posição, fluxo ou hierarquia dos comandos',
                  'faz a paleta canônica derivar do destaque configurado por consultório e mantém estados destrutivos na semântica de erro do sistema',
                  'usa no modo somente leitura uma variante secundária derivada da mesma cor do consultório, alterando cor sem alterar geometria',
                  'remove exceções cosméticas específicas de Agenda e Documentos para ações que exercem o mesmo papel estrutural',
                  'institui contrato de Presentation e ratchet monotônico para impedir crescimento de important, overrides de rota e combinações visuais legadas',
                  'integra o contrato visual ao quality gate sem mudança de banco, schema ou regras de negócio',
              ],
          }
          data['deployment_sync_id'] = 'github-prontoo-' + release + '-presentation-visual-contract'
          data['deployment_sync_requested_at'] = '2026-08-12T10:33:00-04:00'
          path.write_text(json.dumps(data, indent=4, ensure_ascii=False) + '\n')
          PY
      - name: Remove temporary phase files
        run: |
          rm .github/phase3-visual-contract.py
          rm .github/workflows/phase3-visual-contract.yml
      - name: Reconcile deterministic release
        run: php tools/release-contract-reconcile --write
      - name: Validate visual and architecture contracts
        run: |
          php tools/presentation-visual-contract-check
          php tools/quality-gate
          php tools/release-contract-reconcile --check
          git diff --check
      - name: Report CSS statistics
        run: |
          php tools/presentation-visual-contract-check
          python3 - <<'PY'
          import json
          data = json.load(open('app/presentation.visual-contract.json'))
          print(json.dumps(data['css_statistics'], indent=2, ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name 'prontoo-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(presentation): enforce visual contract v1'
          git push origin HEAD:agent/presentation-visual-contract-v1
