name: Prepare Maintenance Release

on:
  push:
    branches:
      - agent/maintenance-security-refactor-touch

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Prepare validated maintenance release
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one canonical occurrence, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/Runtime/Routing/RouteRegistry.php',
              "        'logout' => [\\Prontoo\\Runtime\\AuthOnboarding\\AuthOnboardingRuntimeOperations05::class, 'page_logout', true, false, ['*'], []],",
              "        'logout' => [\\Prontoo\\Runtime\\AuthOnboarding\\LogoutCoordinator::class, 'handle', true, false, ['*'], []],",
          )
          replace_once(
              'tools/quality-gate',
              "$run('runtime-input-boundary-contract', 'tools/runtime-input-boundary-check');\n",
              "$run('runtime-input-boundary-contract', 'tools/runtime-input-boundary-check');\n$run('runtime-refactor-on-touch-contract', 'tools/runtime-refactor-on-touch-check');\n",
          )
          replace_once(
              'tools/quality-gate',
              "        'login-post-password',\n        'maestro-runtime',",
              "        'login-post-password',\n        'login-logout-http-smoke',\n        'maestro-runtime',",
          )
          replace_once(
              '.github/workflows/architecture.yml',
              "      - name: Maestro runtime regression\n",
              "      - name: Login/logout global revocation smoke\n        shell: bash\n        run: |\n          set -euo pipefail\n          bash tools/login-logout-http-smoke\n      - name: Maestro runtime regression\n",
          )
          replace_once(
              'docs/security/authentication.md',
              "- geração canônica vinculada ao usuário;\n- logout rotaciona a geração do usuário e invalida contextos incompatíveis no próximo uso;\n- alteração de segurança revoga sessões incompatíveis.",
              "- geração canônica vinculada ao usuário;\n- logout global segue `logout_global_session_revocation_v1`: a rotação da geração canônica é tentada até três vezes;\n- logout sempre destrói a sessão local; se a revogação global não puder ser confirmada, a resposta é `503` e não declara sucesso silencioso;\n- alteração de segurança revoga sessões incompatíveis.",
          )
          PY
          php tools/release-version --write --date=2026-08-11 --timestamp=2026-08-11T10:55:05-04:00 --expected-current=1.8.11.1
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $version = json_decode((string) file_get_contents('version.json'), true, 512, JSON_THROW_ON_ERROR);
          $version['notes'] = 'Manutenção pós-consolidação: hardening de logout global, contrato executável de refactoring-on-touch e formalização da baseline arquitetural consolidada.';
          $version['functional_equivalence_policy'] = 'maintenance_security_hardening_without_schema_or_visual_change';
          $version['architecture_consolidated_baseline'] = '1.8.11.1';
          $version['architecture_evolution_mode'] = 'consolidated_maintenance';
          $version['architecture_maintenance_policy'] = 'no_new_architecture_cycle_without_failed_invariant_or_material_product_risk_refactor_on_touch';
          $version['runtime_refactor_on_touch_check'] = 'tools/runtime-refactor-on-touch-check';
          $version['logout_policy'] = 'logout_global_session_revocation_v1';
          $version['changelog'] = [
              'title' => 'Manutenção arquitetural e hardening de sessão',
              'items' => [
                  'formaliza `1.8.11.1` como baseline arquitetural consolidada e adota modo de manutenção incremental',
                  'institui `refactor-on-touch` executável para hotspots Runtime acima de 500 linhas',
                  'extrai o logout para coordinator dedicado com até três tentativas de revogação global',
                  'torna explícita a degradação do logout com sessão local destruída e resposta HTTP 503 quando a revogação global não é confirmada',
                  'adiciona smoke HTTP real para CSRF, rotação de sessão, revogação multissessão e falha de escrita da geração canônica',
                  'preserva schema, banco e interface e mantém as invariantes arquiteturais de risco em zero',
              ],
          ];
          file_put_contents('version.json', json_encode($version, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR) . PHP_EOL, LOCK_EX);
          $architecture = json_decode((string) file_get_contents('app/architecture.manifest.json'), true, 512, JSON_THROW_ON_ERROR);
          $architecture['architecture_consolidated_baseline'] = '1.8.11.1';
          $architecture['architecture_evolution_mode'] = 'consolidated_maintenance';
          $architecture['architecture_maintenance_policy'] = 'no_new_architecture_cycle_without_failed_invariant_or_material_product_risk_refactor_on_touch';
          $architecture['runtime_refactor_on_touch_check'] = 'tools/runtime-refactor-on-touch-check';
          $architecture['runtime_refactor_on_touch_policy'] = 'touched_runtime_hotspot_must_reduce_gateway_calls_or_hotspot_bucket';
          $architecture['logout_policy'] = 'logout_global_session_revocation_v1';
          $architecture['logout_revocation_attempts'] = 3;
          $architecture['logout_degraded_status'] = 503;
          file_put_contents('app/architecture.manifest.json', json_encode($architecture, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR) . PHP_EOL, LOCK_EX);
          PHP
          rm -f .github/workflows/prepare-maintenance-release.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/runtime-input-boundary-check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/quality-gate --fast
          php -l app/Runtime/AuthOnboarding/LogoutCoordinator.php
          bash -n tools/login-logout-http-smoke
      - name: Publish non-workflow outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md app/Runtime/Routing/RouteRegistry.php app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php docs/security/authentication.md tools/quality-gate version.json
          git commit -m 'release: prepare 1.8.11.2 maintenance outputs'
          git push origin HEAD:agent/maintenance-security-refactor-touch
