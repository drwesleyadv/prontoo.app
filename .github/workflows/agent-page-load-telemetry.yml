name: Finalizar telemetria de carregamento de página

on:
  push:
    branches:
      - agent/page-load-telemetry-final-1-8-6-2
    paths:
      - .github/workflows/agent-page-load-telemetry.yml

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: true
  CI: true
  PRONTOO_SCHEMA_TEST_MODE: 1
  PRONTOO_INSTALLER_CLI_MODE: 1

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout do branch
        uses: actions/checkout@v4
        with:
          ref: agent/page-load-telemetry-final-1-8-6-2
          fetch-depth: 0
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Gerar candidato limpo
        shell: bash
        run: |
          set -euo pipefail
          python3 .agent-page-load-telemetry-fix.py
          test ! -e .agent-page-load-telemetry.py
          test ! -e .agent-page-load-telemetry-fix.py
      - name: Validar PHP e contratos
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            output="$(php -d error_reporting=32767 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1)"
            printf '%s\n' "$output"
            if grep -qi 'deprecated' <<<"$output"; then
              echo "Depreciação PHP 8.4 em $file" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
          php tools/version-asset-contract-check.php
          php tools/php84-runtime-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          php tools/install-window-contract-check
      - name: Publicar somente a árvore funcional
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-page-load-telemetry.yml
          test ! -e .agent-page-load-telemetry.py
          test ! -e .agent-page-load-telemetry-fix.py
          git config user.name "Prontoo Release"
          git config user.email "release@prontoo.app"
          git add -A
          git diff --cached --name-only
          if git diff --cached --name-only | grep -E '^\.agent-|^\.github/workflows/agent-page-load-telemetry\.yml$'; then
            echo "Arquivo transitório permaneceu no candidato" >&2
            exit 1
          fi
          git commit -m "Release 1.8.6.2 — telemetria por carregamento de página"
          git push origin HEAD:agent/page-load-telemetry-final-1-8-6-2
