name: Apply PR45 Manager KPI Icon Fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.ref == 'agent/admin-manager-kpi-icons-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-manager-kpi-icons-20260724
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply residual manager KPI icon correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          version = '1.7.24.3'
          previous = '1.7.24.2'
          build = '1.7.24.3-admin-manager-kpi-icons'
          package_type = 'admin_manager_kpi_icon_fix'
          notes = ('Corrige o seletor tipográfico residual das grades manager-kpis e '
                   'manager-operational-kpis, impedindo que a fonte de texto substitua '
                   'Material Symbols nos indicadores do Painel do Administrador, sem '
                   'alterar dados, regras de negócio, banco ou schema.')
          now = datetime.now(timezone.utc).replace(microsecond=0)
          iso = now.isoformat().replace('+00:00', 'Z')
          unix = int(now.timestamp())
          sync_id = now.strftime('hostoo-admin-manager-kpi-icons-%Y%m%dT%H%M%SZ')

          css_path = root / 'public/assets/design-system.css'
          css = css_path.read_text(encoding='utf-8')
          broad = ') > :where(article,div,a,span) :where(span,small,strong){'
          scoped = (') > :where(article,div,a,span) '
                    ':where(span:not(.material-symbols-rounded):not(.pt-icon-glyph),small,strong){')
          count = css.count(broad)
          if count != 1:
              raise SystemExit(f'Contrato CSS inesperado: seletor residual encontrado {count} vez(es)')
          css_path.write_text(css.replace(broad, scoped, 1), encoding='utf-8')

          tool_path = root / 'tools/architecture-check.php'
          tool = tool_path.read_text(encoding='utf-8')
          first_guard = """if (str_contains(
              $dashboardIconCss,
              '.stat-card span,.ds-kpi span,.notice-kpi span,.kpi-card span,.mini-stat span{',
          )) {
              $dashboardIconFailures[] = 'broad_kpi_span_selector';
          }
          """
          expanded_guard = first_guard + """if (str_contains(
              $dashboardIconCss,
              ') > :where(article,div,a,span) :where(span,small,strong){',
          )) {
              $dashboardIconFailures[] = 'broad_manager_kpi_descendant_span_selector';
          }
          """
          if first_guard not in tool:
              raise SystemExit('Âncora da prova regressiva de ícones não encontrada')
          tool = tool.replace(first_guard, expanded_guard, 1)
          required_anchor = """    '.mini-stat span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.manager-action > .pt-icon-glyph',
          """
          required_replacement = """    '.mini-stat span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              ':where(span:not(.material-symbols-rounded):not(.pt-icon-glyph),small,strong)',
              '.manager-action > .pt-icon-glyph',
          """
          if required_anchor not in tool:
              raise SystemExit('Lista de contratos de ícones não encontrada')
          tool = tool.replace(required_anchor, required_replacement, 1)
          tool_path.write_text(tool, encoding='utf-8')

          version_path = root / 'version.json'
          version_data = json.loads(version_path.read_text(encoding='utf-8'))
          version_data.update({
              'version': version,
              'release': version,
              'generated_at_unix': unix,
              'generated_at': iso,
              'updated_at': iso,
              'build': build,
              'package_type': package_type,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': False,
              'visual_changes': True,
              'previous_version': previous,
              'documentation_changes': True,
              'notes': notes,
              'deployment_sync_id': sync_id,
              'deployment_sync_requested_at': iso,
          })
          version_path.write_text(json.dumps(version_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          arch_path = root / 'app/architecture.manifest.json'
          arch = json.loads(arch_path.read_text(encoding='utf-8'))
          arch.update({
              'version': version,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': False,
              'visual_changes': True,
          })
          arch_path.write_text(json.dumps(arch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          prontoo_path = root / 'app/prontoo.php'
          prontoo = prontoo_path.read_text(encoding='utf-8')
          replacements = {
              'const PRONTOO_VERSION_FALLBACK = "1.7.24.2";': 'const PRONTOO_VERSION_FALLBACK = "1.7.24.3";',
              'const PRONTOO_PREVIOUS_VERSION = "1.7.24.1";': 'const PRONTOO_PREVIOUS_VERSION = "1.7.24.2";',
          }
          for old, new in replacements.items():
              if old not in prontoo:
                  raise SystemExit(f'Contrato de versão ausente em app/prontoo.php: {old}')
              prontoo = prontoo.replace(old, new, 1)
          prontoo_path.write_text(prontoo, encoding='utf-8')

          landing_path = root / 'br/index.php'
          landing = landing_path.read_text(encoding='utf-8')
          old_landing = 'const BR_LANDING_VERSION_FALLBACK = "1.7.24.2";'
          if old_landing not in landing:
              raise SystemExit('Fallback de versão ausente em br/index.php')
          landing_path.write_text(landing.replace(old_landing, 'const BR_LANDING_VERSION_FALLBACK = "1.7.24.3";', 1), encoding='utf-8')

          changelog_path = root / 'ChangeLog.txt'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = f"""Prontoo {version} — ícones dos KPIs gerenciais restaurados integralmente

- Corrige o segundo seletor tipográfico do Design System que ainda alcançava os elementos Material Symbols dentro de manager-kpis e manager-operational-kpis.
- Exclui explicitamente .material-symbols-rounded e .pt-icon-glyph da regra de texto aplicada aos descendentes dos cartões.
- Amplia a prova regressiva para impedir que seletores genéricos de span voltem a substituir a fonte de ícones nessas grades.
- Não altera autenticação, permissões, dados, regras de negócio, banco ou schema.

"""
          changelog_path.write_text(entry + changelog, encoding='utf-8')

          update_path = root / 'app/update.manifest.json'
          update = json.loads(update_path.read_text(encoding='utf-8'))
          update.update({
              'version': version,
              'release': version,
              'build': build,
              'package_type': package_type,
              'generated_at': iso,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': False,
              'visual_changes': True,
              'documentation_changes': True,
              'previous_version': previous,
              'updated_at': iso,
              'notes': notes,
              'deployment_sync_id': sync_id,
              'deployment_sync_requested_at': iso,
          })
          files = update.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('Mapa de arquivos da release ausente')
          refreshed = {}
          total = 0
          for relative in files:
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Arquivo do manifesto ausente: {relative}')
              data = path.read_bytes()
              refreshed[relative] = hashlib.sha256(data).hexdigest()
              total += len(data)
          update['files'] = refreshed
          update['file_count'] = len(refreshed)
          update['total_uncompressed_bytes'] = total
          update_path.write_text(json.dumps(update, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY

      - name: Validate release and icon contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/architecture-check.php >/dev/null
          php tools/architecture-check.php >/tmp/architecture-report.json
          php -r '
            $version = json_decode((string) file_get_contents("version.json"), true, 512, JSON_THROW_ON_ERROR);
            $update = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $arch = json_decode((string) file_get_contents("app/architecture.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($version["version"] ?? "") !== "1.7.24.3" || ($update["version"] ?? "") !== "1.7.24.3" || ($arch["version"] ?? "") !== "1.7.24.3") {
              throw new RuntimeException("Contrato de versão divergente");
            }
            $css = (string) file_get_contents("public/assets/design-system.css");
            if (str_contains($css, ") > :where(article,div,a,span) :where(span,small,strong){")) {
              throw new RuntimeException("Seletor residual de ícones ainda presente");
            }
            if (!str_contains($css, ":where(span:not(.material-symbols-rounded):not(.pt-icon-glyph),small,strong)")) {
              throw new RuntimeException("Exclusão tipográfica dos ícones ausente");
            }
          '

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php public/assets/design-system.css tools/architecture-check.php version.json
          git commit -m "Prontoo 1.7.24.3 — corrige ícones dos KPIs gerenciais"
          git push origin HEAD:agent/admin-manager-kpi-icons-20260724
