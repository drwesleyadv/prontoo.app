name: Appointment Price Snapshot Executor

on:
  push:
    branches:
      - agent/appointment-price-snapshot-20260804

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/appointment-price-snapshot-20260804

jobs:
  apply_change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply business rule
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          version = '1.8.4.1'
          previous = '1.8.3.5'
          build = '1.8.4.1-appointment-price-snapshot'
          sync_id = 'github-appointment-price-snapshot-1-8-4-1'
          now = datetime.now(timezone.utc)
          now_iso = now.isoformat(timespec='microseconds')
          now_unix = int(now.timestamp())

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: substituição esperava 1 ocorrência e encontrou {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: substituição regex esperava 1 ocorrência e encontrou {count}')
              target.write_text(updated, encoding='utf-8')

          regex_once(
              'app/Domain/Appointments/Appointments.php',
              r'function appointment_procedure_price_cents\(\n.*?\n\}\nfunction appointment_payment_post_context\(',
              '''function appointment_procedure_price_cents(
              int $cid,
              ?int $procedureId,
              int $fallback = 0,
          ): int {

              $fallback = max(0, $fallback);
              if ($fallback > 0) {
                  return $fallback;
              }
              if (!$procedureId) {
                  return 0;
              }
              $price =
                  (int) (val(
                      "SELECT price_cents FROM pi_procedures WHERE id=? AND clinic_id=? AND active=1",
                      [$procedureId, $cid],
                  ) ?:
                  0);
              return max(0, $price);
          }
          function appointment_payment_post_context(''',
          )

          replace_once(
              'app/Domain/Appointments/Appointments.php',
              '''    $amount = appointment_procedure_price_cents(
                  $cid,
                  $procedureId,
                  $fallbackAmount,
              );
          ''',
              '',
          )

          replace_once(
              'app/Domain/Appointments/Appointments.php',
              '''    $paid = isset($_POST["payment_confirmed"]);
              if (!$paid) {
                  return [false, "", 0, 0, null];
              }
          ''',
              '''    $amount = appointment_procedure_price_cents(
                  $cid,
                  $procedureId,
                  $fallbackAmount,
              );
              $paid = isset($_POST["payment_confirmed"]);
              if (!$paid) {
                  return [false, "", $amount, 0, null];
              }
          ''',
          )

          replace_once(
              'app/Domain/Appointments/Appointments.php',
              '"SELECT id,patient_link_id,doctor_user_id,status,start_at,arrived_at,consultation_started_at,consultation_finished_at,payment_amount_cents FROM pi_appointments WHERE id=? AND clinic_id=?",',
              '"SELECT id,patient_link_id,doctor_user_id,status,start_at,arrived_at,consultation_started_at,consultation_finished_at,procedure_id,payment_amount_cents FROM pi_appointments WHERE id=? AND clinic_id=?",',
          )

          replace_once(
              'app/Domain/Appointments/Appointments.php',
              '''                    (int) ($a["payment_amount_cents"] ?? 0),
          ''',
              '''                    (int) ($a["procedure_id"] ?? 0) === (int) $procId
                          ? (int) ($a["payment_amount_cents"] ?? 0)
                          : 0,
          ''',
          )

          replace_once(
              'app/Domain/Financial/Financial.php',
              '"Valor do Procedimento",',
              '"Valor fixado no agendamento",',
          )

          check = root / 'tools/appointment-price-snapshot-check.php'
          check.write_text('''<?php
          declare(strict_types=1);
          $appointments = (string) file_get_contents(__DIR__ . "/../app/Domain/Appointments/Appointments.php");
          $financial = (string) file_get_contents(__DIR__ . "/../app/Domain/Financial/Financial.php");
          $required = [
              '$fallback = max(0, $fallback);',
              'if ($fallback > 0) {',
              'return [false, "", $amount, 0, null];',
              'consultation_finished_at,procedure_id,payment_amount_cents FROM pi_appointments',
              '(int) ($a["procedure_id"] ?? 0) === (int) $procId',
              'payment_amount_cents,payment_method,payment_status',
          ];
          foreach ($required as $needle) {
              if (!str_contains($appointments, $needle)) {
                  throw new RuntimeException("Contrato de preço do agendamento ausente: " . $needle);
              }
          }
          if (!str_contains($financial, '"Valor fixado no agendamento"')) {
              throw new RuntimeException("A interface não identifica o valor contratual fixado.");
          }
          if (str_contains($appointments, 'return [false, "", 0, 0, null];')) {
              throw new RuntimeException("Agendamento sem pagamento ainda descarta o preço vigente.");
          }
          echo "appointment-price-snapshot: ok\n";
          ''', encoding='utf-8')

          replace_once(
              '.github/workflows/architecture.yml',
              '          php tools/architecture-check.php\n',
              '          php tools/architecture-check.php\n          php tools/appointment-price-snapshot-check.php\n',
          )

          replace_once(
              'app/prontoo.php',
              'const PRONTOO_VERSION_FALLBACK = "1.8.3.5";',
              'const PRONTOO_VERSION_FALLBACK = "1.8.4.1";',
          )
          replace_once(
              'app/prontoo.php',
              'const PRONTOO_PREVIOUS_VERSION = "1.8.3.4";',
              'const PRONTOO_PREVIOUS_VERSION = "1.8.3.5";',
          )
          replace_once(
              'br/index.php',
              'const BR_LANDING_VERSION_FALLBACK = "1.8.3.5";',
              'const BR_LANDING_VERSION_FALLBACK = "1.8.4.1";',
          )

          version_path = root / 'version.json'
          version_data = json.loads(version_path.read_text(encoding='utf-8'))
          if version_data.get('version') != previous:
              raise RuntimeError('A versão-base mudou antes da aplicação da regra de preço.')
          version_data.update({
              'version': version,
              'release': version,
              'generated_at_unix': now_unix,
              'generated_at': now_iso,
              'updated_at': now_iso,
              'build': build,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'functional_equivalence_policy': 'appointment_procedure_price_is_snapshotted_when_booked_preserved_across_catalog_repricing_and_refreshed_only_when_the_selected_procedure_changes',
              'notes': 'O preço do procedimento é fixado no agendamento e preservado para a cobrança, mesmo após reajustes do catálogo.',
              'previous_version': previous,
              'documentation_changes': True,
              'deployment_sync_id': sync_id,
              'deployment_sync_requested_at': now_iso,
              'rewrite_scope': 'appointment_procedure_price_snapshot',
          })
          version_path.write_text(json.dumps(version_data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          for manifest_name in ['app/update.manifest.json', 'app/architecture.manifest.json']:
              manifest_path = root / manifest_name
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              manifest.update({
                  'version': version,
                  'release': version,
                  'build': build,
                  'generated_at': now_iso,
                  'updated_at': now_iso,
                  'previous_version': previous,
                  'deployment_sync_id': sync_id,
                  'notes': 'O preço informado no agendamento torna-se o valor contratual da cobrança e não acompanha reajustes posteriores do procedimento.',
              })
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          changelog_text = changelog.read_text(encoding='utf-8')
          header = '# Histórico de versões\n\n'
          if not changelog_text.startswith(header):
              raise RuntimeError('Cabeçalho inesperado em CHANGELOG.md')
          entry = '''## 1.8.4.1 — Preço fixado no agendamento

          - grava no agendamento o preço vigente do procedimento no momento da marcação;
          - preserva esse valor quando o catálogo do procedimento é reajustado posteriormente;
          - mantém o valor fixado na confirmação do pagamento e na integração financeira;
          - atualiza o preço somente quando o próprio procedimento do agendamento é substituído;
          - identifica na interface que o valor foi fixado no agendamento;
          - não altera banco de dados nem schema.

          '''
          changelog.write_text(header + entry + changelog_text[len(header):], encoding='utf-8')

          changelog_txt = root / 'ChangeLog.txt'
          old_txt = changelog_txt.read_text(encoding='utf-8')
          entry_txt = '''Prontoo 1.8.4.1 — Preço fixado no agendamento

          - O valor vigente do procedimento passa a ser gravado no momento do agendamento.
          - Reajustes posteriores no cadastro não alteram o valor já informado ao paciente.
          - A cobrança e o lançamento financeiro preservam o preço acordado.
          - A troca do procedimento atualiza o valor para o preço vigente da nova escolha.
          - Banco de dados e schema permanecem inalterados.

          '''
          changelog_txt.write_text(entry_txt + old_txt, encoding='utf-8')
          PY
      - name: Validate change
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Domain/Appointments/Appointments.php
          php -l app/Domain/Financial/Financial.php
          php -l tools/appointment-price-snapshot-check.php
          php tools/appointment-price-snapshot-check.php
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
      - name: Commit functional change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/appointment-price-snapshot-executor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Domain/Appointments/Appointments.php app/Domain/Financial/Financial.php tools/appointment-price-snapshot-check.php .github/workflows/architecture.yml app/prontoo.php br/index.php version.json app/update.manifest.json app/architecture.manifest.json CHANGELOG.md ChangeLog.txt .github/workflows/appointment-price-snapshot-executor.yml
          git commit -m "Fixar preço vigente no agendamento"
          git push origin HEAD:${TARGET_BRANCH}
