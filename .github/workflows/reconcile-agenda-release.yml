name: Reconcile agenda release

on:
  push:
    branches:
      - fix/agenda-blocked-server-rendering

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agenda-blocked-server-rendering
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile final tracked tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-agenda-release.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release: reconcilia manifesto da Agenda"
          git push origin HEAD:fix/agenda-blocked-server-rendering
