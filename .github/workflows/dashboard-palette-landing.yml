name: Apply Dashboard Palette and Landing Count

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apply-dashboard-palette-landing-count:
    if: github.head_ref == 'agent/dashboard-palette-landing-count' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply, validate and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dashboard_palette_landing_apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/architecture-check.php')
          content = path.read_text(encoding='utf-8')
          old = "'dual-area-speed-and-filled-volume-no-series-outline-one-row'"
          new = "'dual-area-shared-palette-filled-volume-no-series-outline-one-row'"
          if content.count(old) != 1:
              raise RuntimeError(f'chart policy contract: expected one occurrence, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          rm tools/dashboard_palette_landing_apply.py
          rm .github/workflows/dashboard-palette-landing.yml
          find tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
          test ! -e tools/dashboard_palette_landing_apply.py
          test ! -e .github/workflows/dashboard-palette-landing.yml
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          grep -F '"Leitura e gravação"' app/Admin/AdminPages.php
          ! grep -F '"Requisições e registros"' app/Admin/AdminPages.php
          grep -F '$landingRequests24h' app/Admin/AdminPages.php
          grep -F '(int) ($routePerformance["count"] ?? 0)' app/Admin/AdminPages.php
          grep -F '"requisições nas últimas 24 horas"' app/Admin/AdminPages.php
          ! grep -F '$landingAverageMs' app/Admin/AdminPages.php
          grep -F '.metric-dual-count-chart .metric-chart-fill-requests{fill:color-mix(in srgb,var(--md-sys-color-primary) 30%,#111827 18%)!important;stroke:none!important;opacity:.38;}' public/assets/design-system.css
          grep -F '.metric-dual-count-chart .metric-chart-fill-records{fill:color-mix(in srgb,var(--md-sys-color-primary) 18%,white 72%)!important;stroke:none!important;opacity:.78;}' public/assets/design-system.css
          grep -F '.metric-dual-time-chart .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 30%,#111827 18%);opacity:.38}' public/assets/design-system.css
          grep -F '.metric-dual-time-chart .metric-chart-fill-response{fill:color-mix(in srgb,var(--md-sys-color-primary) 18%,white 72%);opacity:.78}' public/assets/design-system.css
          ! grep -R --line-number --fixed-strings 'metric-chart-line-requests' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -R --line-number --fixed-strings 'metric-chart-line-records' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -R --line-number --fixed-strings 'metric-chart-dot-requests' app/Admin/AdminPages.php public/assets/design-system.css
          ! grep -R --line-number --fixed-strings 'metric-chart-dot-records' app/Admin/AdminPages.php public/assets/design-system.css
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Alinhar paleta e contagem da Landing Page"
          git push origin HEAD:${GITHUB_HEAD_REF}
