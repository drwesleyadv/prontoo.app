name: Reconcile Security Release

on:
  push:
    branches:
      - agent/security-hardening-public-telemetry

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile deterministic release contract
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/architecture.yml .github/workflows/documentation.yml app/prontoo.php br/index.php CHANGELOG.md app/architecture.manifest.json app/update.manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: reconcile 1.8.14.2 release contract"
          git push origin HEAD
