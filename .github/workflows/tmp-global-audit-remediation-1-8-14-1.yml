name: Temporary Global Audit Follow-up Remediation

on:
  push:
    branches:
      - agent/global-audit-remediation-1-8-14-1

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Apply audited follow-up remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp-global-audit-remediation-1-8-14-1.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          old = '1.8.13.9'
          new = '1.8.14.1'
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for relative in tracked:
              path = Path(relative)
              if not path.is_file() or path.stat().st_size > 3_000_000:
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new))

          assets = [
              ('app-icon', 'png'),
              ('prontoo-mark', 'png'),
              ('favicon', 'png'),
              ('favicon', 'ico'),
              ('pix', 'svg'),
          ]
          for stem, extension in assets:
              source = Path(f'public/assets/{stem}-{old}.{extension}')
              target = Path(f'public/assets/{stem}-{new}.{extension}')
              if not source.is_file():
                  raise SystemExit(f'missing source asset: {source}')
              target.write_bytes(source.read_bytes())
              source.unlink()

          manifest_path = Path('app/Presentation/Styles/styles.manifest.json')
          manifest = json.loads(manifest_path.read_text())
          source_root = Path(manifest['source_root'])
          source_data = {}
          for source in manifest['sources']:
              relative = source['path']
              data = (source_root / relative).read_bytes()
              source_data[relative] = data
              source['sha256'] = hashlib.sha256(data).hexdigest()
              source['bytes'] = len(data)
              source['important_count'] = data.count(b'!important')
              source['route_scope_count'] = data.count(b'body[data-route=')

          built = bytearray()
          next_offset = {relative: 0 for relative in source_data}
          for segment in manifest['sequence']:
              relative = segment['source']
              offset = int(segment['offset'])
              length = int(segment['bytes'])
              if offset != next_offset[relative]:
                  raise SystemExit(f'non-contiguous presentation slice: {relative}@{offset}')
              chunk = source_data[relative][offset:offset + length]
              if len(chunk) != length:
                  raise SystemExit(f'presentation slice outside source: {relative}@{offset}')
              segment['sha256'] = hashlib.sha256(chunk).hexdigest()
              segment['important_count'] = chunk.count(b'!important')
              segment['route_scope_count'] = chunk.count(b'body[data-route=')
              next_offset[relative] += length
              built.extend(chunk)
          for relative, data in source_data.items():
              if next_offset[relative] != len(data):
                  raise SystemExit(f'presentation source coverage changed: {relative}')

          manifest['artifact_contract']['sha256'] = hashlib.sha256(built).hexdigest()
          manifest['artifact_contract']['bytes'] = len(built)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Rebuild deterministic Presentation artifact
        shell: bash
        run: |
          set -euo pipefail
          php tools/presentation-css-build --write
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          contract_path = Path('app/presentation.visual-contract.json')
          css = Path('public/assets/presentation.css').read_bytes()
          contract = json.loads(contract_path.read_text())
          contract['version'] = '1.8.14.1'
          contract['delivery']['current_sha256'] = hashlib.sha256(css).hexdigest()
          contract['delivery']['current_bytes'] = len(css)
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=4) + '\n')
          PY
      - name: Remove temporary publisher infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm tools/tmp-global-audit-remediation-1-8-14-1.py
          rm .github/workflows/tmp-global-audit-remediation-1-8-14-1.yml
      - name: Reconcile deterministic release contract
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          php tools/release-contract-reconcile --write
          git add -A
          php tools/release-contract-reconcile --write
      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          php tools/quality-gate
      - name: Publish validated remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close global audit follow-up findings'
          git push origin HEAD:agent/global-audit-remediation-1-8-14-1
      - name: Attempt canonical branch protection
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"required_status_checks":{"strict":true,"contexts":["verify","validate","computed-style"]},"enforce_admins":true,"required_pull_request_reviews":null,"restrictions":null,"required_linear_history":false,"allow_force_pushes":false,"allow_deletions":false,"block_creations":false,"required_conversation_resolution":true,"lock_branch":false,"allow_fork_syncing":true}'
          code=$(curl -sS -o /tmp/protection.json -w '%{http_code}' -L -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/prontoo/protection" -d "$payload")
          cat /tmp/protection.json
          echo "branch_protection_http=$code"
          test "$code" = "200"
