name: Telemetry Runner 2

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-runner2.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Prepare source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/telemetry-implement.yml').read_text()
          begin = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n      - name: Validate implementation", begin)
          block = source[begin:end]
          lines = []
          skip_next = False
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if line.strip() == "workflow = root / '.github/workflows/telemetry-implement.yml'":
                  skip_next = True
                  continue
              if skip_next and line.strip() == 'workflow.unlink()':
                  skip_next = False
                  continue
              lines.append(line)
          script = '\n'.join(lines) + '\n'
          old_helper = """    if old not in s:\n        raise SystemExit(f'missing exact token in {path}: {old[:100]!r}')\n    s = s.replace(old, new, 1)\n    p.write_text(s)"""
          new_helper = """    if old in s:\n        s = s.replace(old, new, 1)\n    else:\n        parts = [part for part in re.split(r'\\s+', old.strip()) if part]\n        pattern = r'\\s+'.join(re.escape(part) for part in parts)\n        s, count = re.subn(pattern, lambda match: new, s, count=1)\n        if count != 1:\n            raise SystemExit(f'missing normalized token in {path}: {old[:100]!r}')\n    p.write_text(s)"""
          if old_helper not in script:
              raise SystemExit('replace_once helper not found')
          Path('/tmp/telemetry-implement.py').write_text(script.replace(old_helper, new_helper, 1))
          PY
          python3 /tmp/telemetry-implement.py
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php
          php -l app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations01.php
          php -l app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php
          php -l cron/maestro.php
          php tools/database-record-telemetry-contract-check
          php tools/page-load-telemetry-contract-check
          git diff --check
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add app cron tools version.json
          git commit -m 'fix(telemetry): make 30-day views and records coherent'
          echo 'READY_FOR_REMOTE_WORKFLOW_CLEANUP'
          sleep 120
          git fetch origin agent/telemetry-audit-live
          git rebase origin/agent/telemetry-audit-live
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          git diff --check
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/telemetry-audit-live
