name: Temporary patient active filter count

on:
  push:
    branches:
      - feature/patient-active-filter-count-1-9-14-5
    paths:
      - .github/workflows/tmp-patient-active-filter-count.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply patient filter count presentation
        shell: bash
        run: |
          sed -i 's/^git rm /git rm -f /' tools/tmp-patient-active-filter-count
          bash tools/tmp-patient-active-filter-count
