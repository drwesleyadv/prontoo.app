name: PR 371 Architecture Repair

on:
  push:
    branches:
      - fix/vps-homologation-mfa

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/vps-homologation-mfa
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Repair architecture debt classification
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Core/Architecture/ArchitectureVerifier.php')
          text = path.read_text()
          old = '''            if (LayerMap::isNativePath($relative)) {
                $nativeFiles[] = $relative;
            } else {
                $transitionalFiles[] = $relative;
            }
            if (LayerMap::isNativePath($relative)) {
                self::inspectDependencies($root, $relative, $layer, $errors);
                self::inspectLayerNativeFile($root, $relative, $layer, $errors);
            }
'''
          new = '''            $isNative = LayerMap::isNativePath($relative);
            if ($isNative) {
                $nativeFiles[] = $relative;
            } elseif (str_starts_with($relative, 'app/') && $compositionRole === null) {
                $transitionalFiles[] = $relative;
            }
            if ($isNative) {
                self::inspectDependencies($root, $relative, $layer, $errors);
                self::inspectLayerNativeFile($root, $relative, $layer, $errors);
            }
'''
          if text.count(old) != 1:
              raise SystemExit('bloco esperado do ArchitectureVerifier não localizado exatamente uma vez')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/pr371-architecture-diagnostic.yml
          rm -f .github/workflows/pr371-architecture-repair.yml

          php -l app/Core/Architecture/ArchitectureVerifier.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          php tools/quality-gate --fast
          git diff --check

          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add -A
          git commit -m 'fix: separa superfícies de composição da dívida arquitetural'
          git push origin HEAD:fix/vps-homologation-mfa
