name: Fix Asset Fallback

on:
  push:
    branches:
      - feature/timed-agenda-notes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Align asset fallback and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/prontoo.php')
          text = p.read_text()
          old = 'const PRONTOO_ASSET_REV_FALLBACK = "1.9.15.8";'
          new = 'const PRONTOO_ASSET_REV_FALLBACK = "1.9.15.9";'
          if text.count(old) != 1:
              raise SystemExit(f'expected one asset fallback, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-asset-fallback.yml
          git add -A
          php tools/release-contract-reconcile --write
          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/quality-gate --fast
          php tools/documentation-check.php
          php tools/code-comment-check.php
          git diff --check
          test ! -e .github/workflows/fix-asset-fallback.yml
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alinha fallback de assets com a release 1.9.15.9"
          git push origin HEAD:feature/timed-agenda-notes
