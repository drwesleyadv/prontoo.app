name: Full Repository Audit

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-repository-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          ini-file: production
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit parsers
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir PyYAML Pillow
          npm install --prefix "$RUNNER_TEMP/postcss" --no-save --ignore-scripts --no-package-lock postcss@8

      - name: Synchronize update manifest in working tree
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $path = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/') || str_starts_with($relative, 'audit-output/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP

      - name: Audit every tracked file
        run: python tools/full-repository-audit.py

      - name: Parse every CSS file with PostCSS
        env:
          NODE_PATH: ${{ runner.temp }}/postcss/node_modules
        run: |
          node <<'NODE'
          const child = require('child_process');
          const fs = require('fs');
          const postcss = require('postcss');
          const files = child.execFileSync('git', ['ls-files', '*.css'], {encoding: 'utf8'})
            .split(/\r?\n/).filter(Boolean);
          for (const file of files) {
            postcss.parse(fs.readFileSync(file, 'utf8'), {from: file});
            console.log(`CSS OK: ${file}`);
          }
          NODE

      - name: Validate repository whitespace and patches
        run: git diff --check

      - name: Run all repository contracts
        run: |
          set -euo pipefail
          for check in \
            tools/architecture-check.php \
            tools/code-comment-check.php \
            tools/documentation-check.php \
            tools/install-security-check.php \
            tools/install-window-contract-check \
            tools/schema-check.php \
            tools/security-regression-check.php
          do
            if [ ! -f "$check" ]; then
              continue
            fi
            echo "Running $check"
            if [ "$check" = "tools/security-regression-check.php" ]; then
              php -d auto_prepend_file=app/Support/PhpCompat.php "$check"
            else
              php "$check"
            fi
          done

      - name: Validate Composer metadata
        run: |
          if [ -f composer.json ]; then
            composer validate --strict --no-check-publish
          fi

      - name: Upload complete audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repository-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

      - name: Persist synchronized manifest
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- app/update.manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/update.manifest.json
          git commit -m "Sincronizar manifesto após auditoria integral"
          git push origin HEAD:"$HEAD_BRANCH"
