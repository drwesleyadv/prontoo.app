name: Temporary agenda day block toggle

on:
  push:
    branches:
      - feature/agenda-day-block-toggle-1-9-15-4

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agenda-day-block-toggle-1-9-15-4
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Materialize feature
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp-agenda-day-block-toggle-driver-1-9-15-4.py
          python3 tools/tmp-agenda-day-block-adjust-1-9-15-4.py
          shopt -s nullglob
          for source in public/assets/*1.9.15.3*; do
            target="${source/1.9.15.3/1.9.15.4}"
            git mv "$source" "$target"
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/prontoo.php')
          text = path.read_text(encoding='utf-8')
          old = 'PRONTOO_ASSET_REV_FALLBACK = "1.9.15.3"'
          new = 'PRONTOO_ASSET_REV_FALLBACK = "1.9.15.4"'
          if text.count(old) != 1:
              raise SystemExit(f'asset fallback expected once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm \
            tools/tmp-agenda-day-block-toggle-1-9-15-4.py \
            tools/tmp-agenda-day-block-toggle-driver-1-9-15-4.py \
            tools/tmp-agenda-day-block-adjust-1-9-15-4.py \
            .github/workflows/tmp-agenda-day-block-toggle-1-9-15-4.yml
          php tools/release-contract-reconcile --write
      - name: Validate feature
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Operational/AppointmentCommandService.php
          php -l app/Application/Authorization/Definitions/SchedulingActionDefinitions.php
          php -l app/Infrastructure/Operational/AppointmentsSqlCatalog05.php
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          php tools/release-contract-reconcile --check
          php tools/release-version
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/test-fast
          php tools/quality-gate --fast
          git diff --check
      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona bloqueio rápido do dia na Agenda"
          git push origin HEAD:feature/agenda-day-block-toggle-1-9-15-4
