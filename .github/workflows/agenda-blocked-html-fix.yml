name: Agenda blocked HTML fix

on:
  push:
    branches:
      - fix/agenda-blocked-server-rendering

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agenda-blocked-server-rendering
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Fix blocked daily HTML delimiters
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('app/Runtime/Appointments/AppointmentsRuntimeOperations05.php')
          source = path.read_text()
          old_shell = "            '<section class=\"agenda-day-shell agenda-crown-shell' . ($dayBlocked ? ' is-day-blocked' : '') . ' style=\"--agenda-slots:' ."
          new_shell = "            '<section class=\"agenda-day-shell agenda-crown-shell' . ($dayBlocked ? ' is-day-blocked' : '') . '\" style=\"--agenda-slots:' ."
          old_canvas = "            '</div><div class=\"agenda-day-canvas' . ($dayBlocked ? ' is-day-blocked' : '') . '\" data-agenda-canvas data-day-blocked=\"' . ($dayBlocked ? '1' : '0') . ' data-slot-minutes=\"' ."
          new_canvas = "            '</div><div class=\"agenda-day-canvas' . ($dayBlocked ? ' is-day-blocked' : '') . '\" data-agenda-canvas data-day-blocked=\"' . ($dayBlocked ? '1' : '0') . '\" data-slot-minutes=\"' ."
          if source.count(old_shell) != 1:
              raise SystemExit(f'daily shell malformed anchor count={source.count(old_shell)}')
          if source.count(old_canvas) != 1:
              raise SystemExit(f'daily canvas malformed anchor count={source.count(old_canvas)}')
          source = source.replace(old_shell, new_shell, 1).replace(old_canvas, new_canvas, 1)
          if old_shell in source or old_canvas in source:
              raise SystemExit('malformed daily HTML remains')
          path.write_text(source)

          test_path = Path('tools/test-fast')
          test = test_path.read_text()
          anchor = "        str_contains($agendaRuntimeSource, '$blockedDayMarkers = static function') &&\n"
          extra = anchor + "        !str_contains($agendaRuntimeSource, \". ($dayBlocked ? ' is-day-blocked' : '') . ' style=\\\"--agenda-slots:\") &&\n" + "        !str_contains($agendaRuntimeSource, \". ($dayBlocked ? '1' : '0') . ' data-slot-minutes=\\\"'\") &&\n"
          if test.count(anchor) != 1:
              raise SystemExit('test-fast HTML delimiter anchor not found exactly once')
          test_path.write_text(test.replace(anchor, extra, 1))
          PY
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          php tools/test-fast
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          rm -f .github/workflows/agenda-blocked-html-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agenda: corrige atributos HTML do dia bloqueado"
          git push origin HEAD:fix/agenda-blocked-server-rendering
