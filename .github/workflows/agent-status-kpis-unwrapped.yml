name: Apply unwrapped status KPIs

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-kpis-unwrapped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply layout
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin "$HEAD_BRANCH"
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
            python3 <<'PY'
          from pathlib import Path
          import re

          admin = Path('app/Admin/AdminPages.php')
          text = admin.read_text(encoding='utf-8')
          start = text.index('function page_status(): void')
          end = text.index('function page_admin_operations(): void', start)
          section = text[start:end]
          pattern = re.compile(
              r'\$overviewCards = card\(\n\s+\'\<div class="stats-grid admin-overview-kpis status-three-kpis"\>\' \.\n(.*?)\n\s+"\</div\>",\n\s+"status-overview-kpis-card",\n\);',
              re.S,
          )
          match = pattern.search(section)
          if not match:
              if '$overviewCards = stat_card(' not in section:
                  raise SystemExit('Bloco agrupado dos indicadores não localizado.')
          else:
              cards = match.group(1)
              cards = re.sub(r'^\s{8}', '', cards, flags=re.M)
              replacement = '$overviewCards = ' + cards.strip() + ';'
              section = section[:match.start()] + replacement + section[match.end():]
              text = text[:start] + section + text[end:]
              admin.write_text(text, encoding='utf-8')

          css = Path('public/assets/design-system.css')
          css_text = css.read_text(encoding='utf-8')
          css_text = re.sub(
              r'\nbody\.status-public \.status-three-kpis\{[^\n]*\}\nbody\.status-public \.status-three-kpis>\.stat-card\{[^\n]*\}\n?',
              '\n',
              css_text,
              count=1,
          )
          rule = '\nbody.status-public #conteudo>.stat-card{width:100%!important;max-width:none!important;margin:0!important;}\n'
          if 'body.status-public #conteudo>.stat-card{' not in css_text:
              css_text += rule
          css.write_text(css_text, encoding='utf-8')

          for path in [
              Path('ssd/.status-kpis-unwrapped'),
              Path('.github/workflows/agent-status-kpis-unwrapped.yml'),
          ]:
              if path.exists():
                  path.unlink()
          PY
            php -l app/Admin/AdminPages.php >/dev/null
            php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Remover agrupador dos indicadores da tela status"
            if git push origin HEAD:"$HEAD_BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
