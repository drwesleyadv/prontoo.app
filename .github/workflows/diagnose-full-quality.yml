name: Reconcile asset revision

on:
  push:
    branches:
      - agent/database-records-20d

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reconcile asset revision and CSS source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          old = '1.8.17.12'
          new = '1.8.17.13'
          for name in ['version.json', 'app/presentation.visual-contract.json', 'docs/index.md', 'app/prontoo.php']:
              p = Path(name)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'asset revision source missing in {name}')
              p.write_text(s.replace(old, new))

          css_source = Path('app/Presentation/Styles/components/components.css')
          css = css_source.read_text()
          needle = f'pix-{old}.svg'
          if needle not in css:
              raise SystemExit('pix revision source missing in components.css')
          css_source.write_text(css.replace(needle, f'pix-{new}.svg'))

          manifest_path = Path('app/Presentation/Styles/styles.manifest.json')
          manifest = json.loads(manifest_path.read_text())
          source_root = Path(manifest['source_root'])
          sources = {}
          for entry in manifest['sources']:
              data = (source_root / entry['path']).read_bytes()
              sources[entry['path']] = data
              entry['sha256'] = hashlib.sha256(data).hexdigest()
              entry['bytes'] = len(data)
              entry['important_count'] = data.count(b'!important')
              entry['route_scope_count'] = data.count(b'body[data-route=')

          built = bytearray()
          for segment in sorted(manifest['sequence'], key=lambda row: row['order']):
              data = sources[segment['source']]
              offset = int(segment['offset'])
              size = int(segment['bytes'])
              chunk = data[offset:offset + size]
              if len(chunk) != size:
                  raise SystemExit('sequence slice outside source')
              segment['sha256'] = hashlib.sha256(chunk).hexdigest()
              segment['important_count'] = chunk.count(b'!important')
              segment['route_scope_count'] = chunk.count(b'body[data-route=')
              built.extend(chunk)

          artifact_sha = hashlib.sha256(built).hexdigest()
          manifest['artifact_contract']['sha256'] = artifact_sha
          manifest['artifact_contract']['bytes'] = len(built)
          manifest['artifact_contract']['lines'] = bytes(built).count(b'\n')
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=4) + '\n')

          visual_path = Path('app/presentation.visual-contract.json')
          visual = json.loads(visual_path.read_text())
          visual['version'] = new
          visual['delivery']['current_sha256'] = artifact_sha
          visual['delivery']['current_bytes'] = len(built)
          visual_path.write_text(json.dumps(visual, ensure_ascii=False, indent=4) + '\n')
          PY
          for old_asset in \
            public/assets/app-icon-1.8.17.12.png \
            public/assets/favicon-1.8.17.12.ico \
            public/assets/favicon-1.8.17.12.png \
            public/assets/pix-1.8.17.12.svg \
            public/assets/prontoo-mark-1.8.17.12.png
          do
            new_asset="${old_asset/1.8.17.12/1.8.17.13}"
            mv "$old_asset" "$new_asset"
          done
          php tools/presentation-css-build --write
          rm .github/workflows/diagnose-full-quality.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          git add -A
      - name: Validate canonical release
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --cached
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/release-contract-reconcile --check
          php tools/documentation-check.php
          php tools/database-record-telemetry-contract-check
          php tools/telemetry-json-source-contract-check
          php tools/quality-gate
      - name: Commit clean asset revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcilia assets da versão 1.8.17.13"
          git push origin HEAD:agent/database-records-20d
