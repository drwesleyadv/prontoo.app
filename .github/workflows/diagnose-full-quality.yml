name: Diagnose full quality gate

on:
  push:
    branches:
      - agent/database-records-20d

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Version asset contract
        continue-on-error: true
        run: php tools/version-asset-contract-check.php
      - name: PHP 8.4 runtime contract
        continue-on-error: true
        run: php tools/php84-runtime-contract-check
      - name: Superseded reference contract
        continue-on-error: true
        run: php tools/superseded-reference-contract-check
      - name: Release version contract
        continue-on-error: true
        run: php tools/release-version
      - name: Release reconcile contract
        continue-on-error: true
        run: php tools/release-contract-reconcile --check
      - name: Documentation contract
        continue-on-error: true
        run: php tools/documentation-check.php
      - name: Code comment contract
        continue-on-error: true
        run: php tools/code-comment-check.php
      - name: Security regressions
        continue-on-error: true
        run: php tools/security-regression-check.php
      - name: Architecture invariants
        continue-on-error: true
        run: php tools/architecture-check.php
      - name: Native unit contract
        continue-on-error: true
        run: php tools/native-unit-check
