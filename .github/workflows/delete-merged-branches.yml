name: Delete Merged Branches

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'prontoo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}")
          if [[ "$status" != "204" && "$status" != "422" ]]; then
            cat /tmp/delete-response
            exit 1
          fi
