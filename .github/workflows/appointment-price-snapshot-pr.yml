name: Appointment Price Snapshot PR

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  apply_change:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/appointment-price-snapshot-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout functional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply business rule
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/appointment-price-snapshot-executor.yml > /tmp/appointment-price-snapshot.py
          test -s /tmp/appointment-price-snapshot.py
          python3 /tmp/appointment-price-snapshot.py
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          check_path = root / 'tools/appointment-price-snapshot-check.php'
          if check_path.exists():
              check_path.unlink()
          architecture_workflow = root / '.github/workflows/architecture.yml'
          workflow_text = architecture_workflow.read_text(encoding='utf-8')
          workflow_text = workflow_text.replace(
              '          php tools/architecture-check.php\n          php tools/appointment-price-snapshot-check.php\n',
              '          php tools/architecture-check.php\n',
              1,
          )
          architecture_workflow.write_text(workflow_text, encoding='utf-8')

          version_path = root / 'version.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          architecture_path = root / 'app/architecture.manifest.json'
          architecture = json.loads(architecture_path.read_text(encoding='utf-8'))
          update_path = root / 'app/update.manifest.json'
          update = json.loads(update_path.read_text(encoding='utf-8'))
          flags = {
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': True,
              'documentation_changes': True,
          }
          version.update(flags)
          architecture.update(flags)
          architecture['appointment_price_snapshot_policy'] = 'price_cents_is_captured_when_the_appointment_is_created_preserved_during_catalog_repricing_and_refreshed_only_when_the_selected_procedure_changes'
          update.update(flags)
          update['package_type'] = version['package_type']
          update['schema_revision'] = version['schema_revision']
          update['minimum_php'] = version['minimum_php']
          update['minimum_mysql'] = version['minimum_mysql']
          update['previous_version'] = version['previous_version']
          update['deployment_sync_id'] = version['deployment_sync_id']
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          architecture_path.write_text(json.dumps(architecture, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          files = dict(update.get('files') or {})
          files.pop('tools/appointment-price-snapshot-check.php', None)
          total = 0
          normalized = {}
          for relative in sorted(files):
              path = root / relative
              if not path.is_file():
                  raise RuntimeError('Arquivo do manifesto ausente: ' + relative)
              payload = path.read_bytes()
              normalized[relative] = hashlib.sha256(payload).hexdigest()
              total += len(payload)
          update['files'] = normalized
          update['file_count'] = len(normalized)
          update['total_uncompressed_bytes'] = total
          update_path.write_text(json.dumps(update, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
      - name: Validate change
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Domain/Appointments/Appointments.php
          php -l app/Domain/Financial/Financial.php
          python3 <<'PY'
          from pathlib import Path
          appointments = Path('app/Domain/Appointments/Appointments.php').read_text(encoding='utf-8')
          financial = Path('app/Domain/Financial/Financial.php').read_text(encoding='utf-8')
          required = [
              '$fallback = max(0, $fallback);',
              'if ($fallback > 0) {',
              'return [false, "", $amount, 0, null];',
              'consultation_finished_at,procedure_id,payment_amount_cents FROM pi_appointments',
              '(int) ($a["procedure_id"] ?? 0) === (int) $procId',
              'payment_amount_cents,payment_method,payment_status',
          ]
          missing = [needle for needle in required if needle not in appointments]
          if missing:
              raise RuntimeError('Contrato de preço ausente: ' + ', '.join(missing))
          if '"Valor fixado no agendamento"' not in financial:
              raise RuntimeError('A interface não identifica o valor contratual fixado.')
          if 'return [false, "", 0, 0, null];' in appointments:
              raise RuntimeError('Agendamento sem pagamento ainda descarta o preço vigente.')
          print('appointment-price-snapshot: ok')
          PY
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
      - name: Commit functional branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/appointment-price-snapshot-executor.yml
          rm -f .github/workflows/appointment-price-snapshot-pr.yml
          rm -f tools/appointment-price-snapshot-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fixar preço vigente no agendamento"
          git fetch origin agent/appointment-price-snapshot-20260804
          remote_sha="$(git rev-parse FETCH_HEAD)"
          git push --force-with-lease=refs/heads/agent/appointment-price-snapshot-20260804:${remote_sha} origin HEAD:agent/appointment-price-snapshot-20260804
