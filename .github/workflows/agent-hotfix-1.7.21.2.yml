name: Agent Hotfix 1.7.21.2

on:
  push:
    branches:
      - agent/hotfix-1.7.21.2-installer-integrity

permissions:
  contents: write

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-1.7.21.2-installer-integrity
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply hotfix and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          version = '1.7.21.2'
          previous = '1.7.21.1'
          now = datetime.now(timezone.utc).replace(microsecond=0)
          generated_at = now.isoformat().replace('+00:00', 'Z')

          def replace_once(path: str, old: str, new: str) -> None:
              file = root / path
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: trecho esperado não encontrado de forma única')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_run_schema = r'''function run_schema_sql(string $sql): void
          {
              if (empty($GLOBALS["PRONTOO_SCHEMA_INSTALLING"])) {
                  throw new RuntimeException("Comando estrutural fora da instalação.");
              }
              if (!preg_match("/^\s*CREATE\s+TABLE\b/i", $sql)) {
                  throw new RuntimeException(
                      "Somente CREATE TABLE canônico é permitido.",
                  );
              }
              $GLOBALS["PRONTOO_INSTALL_LAST_SCHEMA_SQL"] = $sql;
              try {
                  pdo()->exec($sql);
                  if (class_exists("\\Prontoo\\Core\\Integrity\\PiIntegrity")) {
                      \Prontoo\Core\Integrity\PiIntegrity::proveSchemaOperation(
                          $sql,
                          true,
                          null,
                      );
                  }
              } catch (Throwable $error) {
                  if (class_exists("\\Prontoo\\Core\\Integrity\\PiIntegrity")) {
                      \Prontoo\Core\Integrity\PiIntegrity::proveSchemaOperation(
                          $sql,
                          false,
                          $error->getMessage(),
                      );
                  }
                  db_log_query_failure($error, $sql);
                  throw $error;
              }
          }
          '''
          new_run_schema = r'''function run_schema_sql(string $sql): void
          {
              if (empty($GLOBALS["PRONTOO_SCHEMA_INSTALLING"])) {
                  throw new RuntimeException("Comando estrutural fora da instalação.");
              }
              if (
                  !preg_match(
                      "/^\s*CREATE\s+TABLE\s+`?(pi_[A-Za-z0-9_]+)`?\s*\(/i",
                      $sql,
                      $match,
                  )
              ) {
                  throw new RuntimeException(
                      "Somente CREATE TABLE canônico é permitido.",
                  );
              }
              $table = strtolower((string) ($match[1] ?? ""));
              $GLOBALS["PRONTOO_INSTALL_LAST_SCHEMA_SQL"] = $sql;
              try {
                  pdo()->exec($sql);
                  if (class_exists("\\Prontoo\\Core\\Integrity\\PiIntegrity")) {
                      \Prontoo\Core\Integrity\PiIntegrity::proveSchemaOperation(
                          "create_table",
                          $table,
                          true,
                          null,
                      );
                  }
              } catch (Throwable $error) {
                  if (class_exists("\\Prontoo\\Core\\Integrity\\PiIntegrity")) {
                      \Prontoo\Core\Integrity\PiIntegrity::proveSchemaOperation(
                          "create_table",
                          $table,
                          false,
                          $error->getMessage(),
                      );
                  }
                  db_log_query_failure($error, $sql);
                  throw $error;
              }
          }
          '''
          replace_once('app/Database/DatabaseSchema.php', old_run_schema, new_run_schema)

          replace_once(
              'tools/schema-check.php',
              "require_once $root . '/app/Database/DatabaseSchema.php';",
              "require_once $root . '/app/Core/Integrity/PiIntegrity.php';\nrequire_once $root . '/app/Database/DatabaseSchema.php';",
          )

          replace_once(
              'app/prontoo.php',
              'const PRONTOO_VERSION_FALLBACK = "1.7.21.1";',
              'const PRONTOO_VERSION_FALLBACK = "1.7.21.2";',
          )
          replace_once(
              'app/prontoo.php',
              'const PRONTOO_PREVIOUS_VERSION = "1.7.20.6";',
              'const PRONTOO_PREVIOUS_VERSION = "1.7.21.1";',
          )
          replace_once(
              'br/index.php',
              'const BR_LANDING_VERSION_FALLBACK = "1.7.21.1";',
              'const BR_LANDING_VERSION_FALLBACK = "1.7.21.2";',
          )

          version_file = root / 'version.json'
          version_data = json.loads(version_file.read_text(encoding='utf-8'))
          version_data.update({
              'version': version,
              'release': version,
              'generated_at_unix': int(now.timestamp()),
              'generated_at': generated_at,
              'updated_at': generated_at,
              'build': '1.7.21.2-installer-integrity-signature-hotfix',
              'package_type': 'clean_install_integrity_signature_hotfix',
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': False,
              'notes': 'Corrige a assinatura da prova estrutural usada pelo instalador e faz o CI carregar o Guardião no mesmo contexto da instalação real.',
          })
          version_file.write_text(json.dumps(version_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for path in ['app/Database/operational-schema.contract.json', 'app/architecture.manifest.json']:
              file = root / path
              data = json.loads(file.read_text(encoding='utf-8'))
              data['version'] = version
              if path.endswith('architecture.manifest.json'):
                  data['database_changes'] = False
                  data['schema_changes'] = False
                  data['visual_changes'] = False
              file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          changelog = root / 'ChangeLog.txt'
          entry = '''Prontoo 1.7.21.2 — corrige integração do instalador com o Guardião

- Corrige a chamada de run_schema_sql() para a assinatura atual de PiIntegrity::proveSchemaOperation().
- Extrai e valida o nome canônico da tabela antes da execução de cada CREATE TABLE.
- Impede que um TypeError do Guardião masque o resultado real do DDL durante a instalação limpa.
- Faz tools/schema-check.php carregar PiIntegrity e reproduzir o mesmo contexto do servidor.
- Mantém as 62 tabelas, o schema SQL e a revisão r7 integralmente inalterados.

'''
          current_changelog = changelog.read_text(encoding='utf-8')
          if not current_changelog.startswith('Prontoo 1.7.21.2'):
              changelog.write_text(entry + current_changelog, encoding='utf-8')

          hotfix = root / 'HOTFIX-1.7.21.2.md'
          hotfix.write_text('''# Hotfix Prontoo 1.7.21.2

## Incidente

Na instalação real, `run_schema_sql()` chamava `PiIntegrity::proveSchemaOperation()` usando a assinatura anterior. O segundo argumento recebido pelo Guardião era booleano, embora o contrato atual exija o nome da tabela como `string`. A primeira tabela era criada e, em seguida, um `TypeError` interrompia o instalador e mascarava o resultado do DDL.

## Correção

- o instalador extrai o nome da tabela do `CREATE TABLE` canônico;
- a prova estrutural recebe operação, tabela, sucesso e erro nos tipos corretos;
- o teste de schema carrega o Guardião antes de executar `install_fresh_schema()`;
- o caminho validado pelo CI passa a corresponder ao contexto real do servidor.

## Escopo

Não há alteração no `schema.sql`, na revisão `prontoo_1_7_20_6_clean_schema_r7_layer2_ledger`, nas 62 tabelas, em dados, interface ou ativos.
''', encoding='utf-8')

          changed_files = [
              'ChangeLog.txt',
              'HOTFIX-1.7.21.2.md',
              'app/Database/DatabaseSchema.php',
              'app/Database/operational-schema.contract.json',
              'app/architecture.manifest.json',
              'app/prontoo.php',
              'br/index.php',
              'tools/schema-check.php',
              'version.json',
          ]
          files = {}
          total_bytes = 0
          for path in changed_files:
              raw = (root / path).read_bytes()
              files[path] = hashlib.sha256(raw).hexdigest()
              total_bytes += len(raw)

          manifest_file = root / 'app/update.manifest.json'
          manifest = json.loads(manifest_file.read_text(encoding='utf-8'))
          manifest.update({
              'version': version,
              'release': version,
              'schema_revision': 'prontoo_1_7_20_6_clean_schema_r7_layer2_ledger',
              'build': '1.7.21.2-installer-integrity-signature-hotfix',
              'package_type': 'clean_install_integrity_signature_hotfix_incremental',
              'generated_at': generated_at,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'clean_install_schema': True,
              'requires_empty_database': True,
              'installer_policy': 'runtime_parser_guardian_and_install_fresh_schema_must_pass_together_on_mysql_with_zero_initial_tables',
              'schema_table_count': 62,
              'operational_tables_verified': 60,
              'file_count': len(files),
              'total_uncompressed_bytes': total_bytes,
              'files': files,
          })
          manifest_file.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -path './storage' -prune -o -path './vendor' -prune -o -path './node_modules' -prune -o -name '*.php' -print0)

      - name: Validate release manifest
        shell: bash
        run: |
          php -r '
            $manifest = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $files = (array) ($manifest["files"] ?? []);
            if (count($files) !== (int) ($manifest["file_count"] ?? -1)) { throw new RuntimeException("file_count divergente"); }
            $bytes = 0;
            foreach ($files as $file => $expected) {
              if (!is_file($file)) { throw new RuntimeException("Arquivo ausente: " . $file); }
              $actual = hash_file("sha256", $file);
              if (!hash_equals((string) $expected, (string) $actual)) { throw new RuntimeException("Hash divergente: " . $file); }
              $bytes += (int) filesize($file);
            }
            if ($bytes !== (int) ($manifest["total_uncompressed_bytes"] ?? -1)) { throw new RuntimeException("total_uncompressed_bytes divergente"); }
          '

      - name: Static schema contract
        run: php tools/schema-check.php

      - name: Full installer with Guardian loaded
        env:
          PRONTOO_SCHEMA_DSN: mysql:host=127.0.0.1;port=3306;dbname=prontoo_schema;charset=utf8mb4
          PRONTOO_SCHEMA_USER: root
          PRONTOO_SCHEMA_PASS: root
        run: php tools/schema-check.php | tee schema-report.json

      - name: Layered architecture
        run: php tools/architecture-check.php | tee architecture-report.json

      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt HOTFIX-1.7.21.2.md app/Database/DatabaseSchema.php app/Database/operational-schema.contract.json app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php tools/schema-check.php version.json
          git commit -m "Corrige integração do instalador com o Guardião"
          git push origin HEAD:agent/hotfix-1.7.21.2-installer-integrity
