name: Delete Main Reference

on:
  pull_request:
    branches:
      - prontoo
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  delete-main:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete obsolete references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_ref() {
            ref="$1"
            status=$(curl -sS -o /tmp/delete-ref-response -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}")
            if [ "$status" != "204" ]; then
              cat /tmp/delete-ref-response
              exit 1
            fi
          }
          delete_ref main
          delete_ref "${GITHUB_HEAD_REF}"
