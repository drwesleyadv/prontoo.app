name: Reconcile PageHead Hover Contrast

on:
  push:
    branches:
      - 'agent/pagehead-hover-contrast'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/pagehead-hover-contrast
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Fix non-cyclic strong accent fallback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          css_path = Path('public/assets/design-system.css')
          css = css_path.read_text()
          old = '--md-ref-palette-primary30: var(--clinic-accent-strong,var(--brand-dark,color-mix(in srgb,var(--md-ref-palette-primary40) 78%,#000)));'
          new = '--md-ref-palette-primary30: var(--clinic-accent-strong,var(--clinic-accent-dark,color-mix(in srgb,var(--md-ref-palette-primary40) 78%,#000)));'
          if css.count(old) != 1:
              raise SystemExit('cyclic primary30 fallback not found uniquely')
          css = css.replace(old, new)
          css_path.write_text(css)

          checker_path = Path('tools/presentation-visual-contract-check')
          checker = checker_path.read_text()
          required_anchor = "    '--md-ref-palette-primary40: var(--clinic-accent,#2f6652)',\n"
          required_line = "    '--md-ref-palette-primary30: var(--clinic-accent-strong,var(--clinic-accent-dark,color-mix(in srgb,var(--md-ref-palette-primary40) 78%,#000)))',\n"
          if checker.count(required_anchor) != 1 or required_line in checker:
              raise SystemExit('checker required-token anchor invalid')
          checker = checker.replace(required_anchor, required_anchor + required_line)
          hover_anchor = "    '.pagehead-actions :where(.primary){background:var(--pt-pagehead-action-accent);color:var(--pt-pagehead-action-on-accent)',\n"
          hover_line = "    '.pagehead-actions :where(.primary):hover{background:var(--pt-pagehead-action-accent-strong);color:var(--pt-pagehead-action-on-accent)',\n"
          if checker.count(hover_anchor) != 1 or hover_line in checker:
              raise SystemExit('checker hover anchor invalid')
          checker = checker.replace(hover_anchor, hover_anchor + hover_line)
          failure_anchor = "if (($contract['version'] ?? '') !== ($version['version'] ?? '')) {\n    $failures[] = 'version';\n}\n"
          failure_block = failure_anchor + "if (str_contains($css, '--md-ref-palette-primary30: var(--clinic-accent-strong,var(--brand-dark,')) {\n    $failures[] = 'cyclic-primary30-brand-dark-fallback';\n}\n"
          if checker.count(failure_anchor) != 1 or 'cyclic-primary30-brand-dark-fallback' in checker:
              raise SystemExit('checker failure anchor invalid')
          checker = checker.replace(failure_anchor, failure_block)
          checker_path.write_text(checker)

          contract_path = Path('app/presentation.visual-contract.json')
          contract = json.loads(contract_path.read_text())
          contract['version'] = '1.8.12.2'
          colors = contract['pagehead_action']['color_contract']
          colors['clinic_accent_strong_chain'] = '--clinic-accent-strong -> --clinic-accent-dark -> direct primary mix -> --md-ref-palette-primary30 -> --pt-pagehead-action-accent-strong'
          colors['strong_fallback_may_reference_brand_dark'] = False
          invariant = 'strong_accent_fallback_is_acyclic_and_never_references_brand_dark'
          if invariant not in contract['invariants']:
              contract['invariants'].append(invariant)
          contract['css_statistics']['after']['bytes'] = len(css.encode())
          contract['css_statistics']['delta']['bytes'] = contract['css_statistics']['after']['bytes'] - contract['css_statistics']['before']['bytes']
          contract_path.write_text(json.dumps(contract, indent=4, ensure_ascii=False) + '\n')
          PY
      - name: Increment release version
        run: php tools/release-version --write --date=2026-08-12 --timestamp=2026-08-12T10:59:00-04:00 --expected-current=1.8.12.1
      - name: Describe corrective release
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          path = Path('version.json')
          data = json.loads(path.read_text())
          if data.get('version') != '1.8.12.2':
              raise SystemExit('unexpected corrective version')
          data['build'] = '1.8.12.2-pagehead-hover-contrast'
          data['package_type'] = 'incremental_refinement'
          data['logic_changes'] = True
          data['visual_changes'] = True
          data['documentation_changes'] = True
          data['database_changes'] = False
          data['schema_changes'] = False
          data['functional_equivalence_policy'] = 'pagehead_hover_contrast_correction_without_geometry_flow_runtime_or_schema_change'
          data['presentation_visual_policy'] = 'presentation-visual-contract-v1'
          data['presentation_visual_contract'] = 'app/presentation.visual-contract.json'
          data['presentation_visual_check'] = 'tools/presentation-visual-contract-check'
          data['notes'] = 'Correção de contraste no hover das ações primárias do PageHead: elimina fallback CSS cíclico entre primary30 e brand-dark e preserva fundo e texto legíveis em todos os contextos.'
          data['deployment_sync_id'] = 'github-prontoo-1.8.12.2-pagehead-hover-contrast'
          data['deployment_sync_requested_at'] = '2026-08-12T10:59:00-04:00'
          path.write_text(json.dumps(data, indent=4, ensure_ascii=False) + '\n')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/reconcile-pagehead-hover-contrast.yml
      - name: Reconcile deterministic release
        run: |
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
      - name: Validate
        run: |
          php tools/presentation-visual-contract-check
          php tools/quality-gate
          php tools/release-contract-reconcile --check
          git diff --check
      - name: Commit
        run: |
          git config user.name 'prontoo-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(presentation): preserve pagehead hover contrast'
          git push origin HEAD:agent/pagehead-hover-contrast
