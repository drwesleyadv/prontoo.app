name: Agent Release Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/cache-json-scoped-generations
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply PHP 8.4 contract fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Infrastructure/ServerJsonCache/ScopedServerJsonCacheInfrastructureOperations01.php')
          source = path.read_text()
          old = "trim((string) ($dependency['segment'] ?? ''))"
          new = "mb_trim((string) ($dependency['segment'] ?? ''))"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Esperadas 2 ocorrências trim; encontradas {count}.')
          path.write_text(source.replace(old, new))
          PY
          rm -f .github/workflows/agent-release-fix.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/php84-runtime-contract-check
          php -l app/Infrastructure/ServerJsonCache/ScopedServerJsonCacheInfrastructureOperations01.php
      - name: Commit canonical outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ajusta contrato PHP 8.4 do cache JSON"
          git push origin HEAD:agent/cache-json-scoped-generations
