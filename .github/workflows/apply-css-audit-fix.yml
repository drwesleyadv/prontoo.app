name: Apply CSS Audit Fix

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-repository-audit-2026-08-02' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove orphan CSS fragment
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('public/assets/design-system.css')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^\s*content:""!important;\n.*?(?=^body\[data-route="appointments"\] \.agenda-week-view\{)',
              re.MULTILINE | re.DOTALL,
          )
          updated, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'Fragmento CSS órfão esperado uma vez; encontrado {count}.')
          path.write_text(updated, encoding='utf-8')
          PY
          npm install --prefix "$RUNNER_TEMP/postcss" --no-save --ignore-scripts --no-package-lock postcss@8
          NODE_PATH="$RUNNER_TEMP/postcss/node_modules" node <<'NODE'
          const fs = require('fs');
          const postcss = require('postcss');
          postcss.parse(fs.readFileSync('public/assets/design-system.css', 'utf8'), {from: 'public/assets/design-system.css'});
          console.log('CSS válido após remoção do fragmento órfão.');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/design-system.css
          git commit -m "Remover fragmento CSS órfão da agenda"
          git push origin HEAD:"$HEAD_BRANCH"
