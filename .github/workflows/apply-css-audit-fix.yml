name: Apply CSS Audit Fix

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-repository-audit-2026-08-02' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair audited CSS defects
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          path = Path('public/assets/design-system.css')
          text = path.read_text(encoding='utf-8')

          marker = 'width:var(--agenda-occupancy-progress,1%)!important;'
          marker_at = text.find(marker)
          if marker_at < 0:
              raise SystemExit('Marcador exclusivo do fragmento CSS órfão não encontrado.')
          start_token = '\n  content:""!important;\n'
          start = text.rfind(start_token, 0, marker_at)
          end_token = '\nbody[data-route="appointments"] .agenda-week-view{'
          end = text.find(end_token, marker_at)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'Limites do fragmento CSS inválidos: start={start}, end={end}.')
          text = text[:start + 1] + text[end + 1:]
          if marker in text:
              raise SystemExit('O marcador órfão permaneceu após a correção.')

          mobile_start = '\n.billing-readonly-banner nav{width:100%}'
          mobile_at = text.find(mobile_start)
          if mobile_at < 0:
              raise SystemExit('Bloco responsivo de cobrança sem @media não encontrado.')
          line_end = text.find('\n', mobile_at + 1)
          if line_end < 0:
              line_end = len(text)
          mobile_line = text[mobile_at + 1:line_end]
          if not mobile_line.endswith('}}'):
              raise SystemExit('Bloco responsivo de cobrança não possui fechamento esperado.')
          text = text[:mobile_at + 1] + '@media(max-width:760px){' + text[mobile_at + 1:]

          path.write_text(text, encoding='utf-8')
          PY
          npm install --prefix "$RUNNER_TEMP/postcss" --no-save --ignore-scripts --no-package-lock postcss@8
          NODE_PATH="$RUNNER_TEMP/postcss/node_modules" node <<'NODE'
          const fs = require('fs');
          const postcss = require('postcss');
          postcss.parse(fs.readFileSync('public/assets/design-system.css', 'utf8'), {from: 'public/assets/design-system.css'});
          console.log('CSS válido após reparos auditados.');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/design-system.css
          git commit -m "Reparar blocos CSS corrompidos"
          git push origin HEAD:"$HEAD_BRANCH"
