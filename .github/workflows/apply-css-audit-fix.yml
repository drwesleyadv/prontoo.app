name: Apply CSS Audit Fix

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-repository-audit-2026-08-02' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove orphan CSS fragment
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path
          path = Path('public/assets/design-system.css')
          text = path.read_text(encoding='utf-8')
          orphan = '''  content:""!important;
          position:absolute!important;
          inset:auto auto 0 0!important;
          width:var(--agenda-occupancy-progress,1%)!important;
          height:4px!important;
          min-width:1%!important;
          max-width:100%!important;
          border-radius:0!important;
          background:var(--md-sys-color-primary)!important;
          opacity:.96!important;
          pointer-events:none!important;
          z-index:3!important;
          }
          display:none!important;
          content:none!important;
          }
          position:relative!important;
          z-index:4!important;
          }
          @media(max-width:720px){
              min-height:34px!important;
              padding:5px 6px 9px!important;
              border-radius:14px 14px 0 0!important;
            }
              height:3px!important;
            }
          }
          '''
          if text.count(orphan) != 1:
              raise SystemExit(f'Fragmento CSS órfão esperado uma vez; encontrado {text.count(orphan)}.')
          path.write_text(text.replace(orphan, '', 1), encoding='utf-8')
          PY
          npm install --prefix "$RUNNER_TEMP/postcss" --no-save --ignore-scripts --no-package-lock postcss@8
          NODE_PATH="$RUNNER_TEMP/postcss/node_modules" node <<'NODE'
          const fs = require('fs');
          const postcss = require('postcss');
          postcss.parse(fs.readFileSync('public/assets/design-system.css', 'utf8'), {from: 'public/assets/design-system.css'});
          console.log('CSS válido após remoção do fragmento órfão.');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/design-system.css
          git commit -m "Remover fragmento CSS órfão da agenda"
          git push origin HEAD:"$HEAD_BRANCH"
