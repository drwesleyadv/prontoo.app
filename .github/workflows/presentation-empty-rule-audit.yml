name: Presentation Empty Rule Audit
on:
  push:
    branches: [agent/presentation-empty-rule-reduction]
    paths:
      - tools/presentation-empty-rule-audit
      - .github/workflows/presentation-empty-rule-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-empty-rule-reduction
      - name: Audit raw-empty CSS rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tinycss2
          python3 tools/presentation-empty-rule-audit
