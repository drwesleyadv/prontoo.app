name: Agenda blocked server rendering apply

on:
  push:
    branches:
      - fix/agenda-blocked-server-rendering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agenda-blocked-server-rendering
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Apply authoritative blocked-day rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          runtime_path = Path('app/Runtime/Appointments/AppointmentsRuntimeOperations05.php')
          source = runtime_path.read_text()
          old_marker = '''        $dayBlockedWatermark = $dayBlocked
              ? '<div class="agenda-day-blocked-watermark" role="status" aria-label="Dia bloqueado">' .
                  \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon("lock") .
                  '<span>Dia bloqueado</span></div>'
              : "";
          '''
          new_marker = '''        $blockedDayMarkers = static function (int $slots, int $slotMinutes): string {
              $html = '<span class="sr-only" data-day-blocked-status="1" role="status">Dia bloqueado</span>';
              for ($index = 0; $index < $slots; $index++) {
                  if (($index * $slotMinutes) % 30 !== 0) {
                      continue;
                  }
                  $html .=
                      '<div class="agenda-day-blocked-watermark" style="--blocked-slot-index:' .
                      $index .
                      '" aria-hidden="true">' .
                      \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon("lock") .
                      '<span>Dia bloqueado</span></div>';
              }
              return $html;
          };
          $dayBlockedWatermark = $dayBlocked
              ? $blockedDayMarkers($slotCount, $slotMinutes)
              : "";
          '''
          if source.count(old_marker) != 1:
              raise SystemExit('daily blocked marker anchor not found exactly once')
          source = source.replace(old_marker, new_marker, 1)

          anchor = source.index('        $renderAgendaCanvas = function (')
          prefix = source[:anchor]
          segment = source[anchor:]

          old_use = '''            $statusMeta,
              $localTs,
              $fmtLocal,
          ): string {
          '''
          new_use = '''            $statusMeta,
              $localTs,
              $fmtLocal,
              $blockedDayMarkers,
          ): string {
          '''
          if segment.count(old_use) != 1:
              raise SystemExit('weekly closure use anchor not found exactly once')
          segment = segment.replace(old_use, new_use, 1)

          old_slots = '''            $slotCount = max(1, (int) ceil($totalMinutes / $slotMinutes));
              $slotRows = "";
              $canCreate = in_array($role, ["recepcionista", "gerente"], true);
          '''
          new_slots = '''            $slotCount = max(1, (int) ceil($totalMinutes / $slotMinutes));
              $dayBlocked = false;
              $dayBlockKey = null;
              if ($agendaDoctor > 0 && $dayRows === []) {
                  foreach ($dayBlocks as $blockKey => $dayBlock) {
                      if ((int) ($dayBlock["doctor_user_id"] ?? 0) !== $agendaDoctor) {
                          continue;
                      }
                      $dayBlockStartTs = $localTs((string) ($dayBlock["start_at"] ?? ""));
                      $dayBlockEndTs = $localTs((string) ($dayBlock["end_at"] ?? ""));
                      if ($dayBlockStartTs <= $startTs && $dayBlockEndTs >= $endTs) {
                          $dayBlocked = true;
                          $dayBlockKey = $blockKey;
                          break;
                      }
                  }
              }
              $slotRows = "";
              $canCreate = in_array($role, ["recepcionista", "gerente"], true) && !$dayBlocked;
          '''
          if segment.count(old_slots) != 1:
              raise SystemExit('weekly slot anchor not found exactly once')
          segment = segment.replace(old_slots, new_slots, 1)

          old_blocks = '''            foreach ($dayBlocks as $b) {
                  $sTs = $localTs((string) $b["start_at"]);
                  $eTs = $localTs((string) $b["end_at"]);
                  if ($eTs <= $startTs || $sTs >= $endTs) {
                      continue;
                  }
                  $top = max(0, ($sTs - $startTs) / 60 / $slotMinutes);
          '''
          new_blocks = '''            foreach ($dayBlocks as $blockKey => $b) {
                  $sTs = $localTs((string) $b["start_at"]);
                  $eTs = $localTs((string) $b["end_at"]);
                  if ($eTs <= $startTs || $sTs >= $endTs) {
                      continue;
                  }
                  if ($dayBlocked && $dayBlockKey === $blockKey) {
                      continue;
                  }
                  $top = max(0, ($sTs - $startTs) / 60 / $slotMinutes);
          '''
          if segment.count(old_blocks) != 1:
              raise SystemExit('weekly block rendering anchor not found exactly once')
          segment = segment.replace(old_blocks, new_blocks, 1)

          old_empty = '''            if ($eventHtml === "") {
                  $eventHtml =
          '''
          new_empty = '''            if ($eventHtml === "" && !$dayBlocked) {
                  $eventHtml =
          '''
          if segment.count(old_empty) < 1:
              raise SystemExit('weekly empty-state anchor not found')
          segment = segment.replace(old_empty, new_empty, 1)

          old_section = '''            return '<section class="agenda-day-shell agenda-crown-shell agenda-week-day-shell" style="--agenda-slots:' .
          '''
          new_section = '''            return '<section class="agenda-day-shell agenda-crown-shell agenda-week-day-shell' . ($dayBlocked ? ' is-day-blocked' : '') . '" style="--agenda-slots:' .
          '''
          if segment.count(old_section) != 1:
              raise SystemExit('weekly section anchor not found exactly once')
          segment = segment.replace(old_section, new_section, 1)

          old_canvas = '''                '</div><div class="agenda-day-canvas" data-agenda-canvas data-slot-minutes="' .
                  $slotMinutes .
                  '" data-day="' .
          '''
          new_canvas = '''                '</div><div class="agenda-day-canvas' . ($dayBlocked ? ' is-day-blocked' : '') . '" data-agenda-canvas data-day-blocked="' . ($dayBlocked ? '1' : '0') . '" data-slot-minutes="' .
                  $slotMinutes .
                  '" data-day="' .
          '''
          if segment.count(old_canvas) != 1:
              raise SystemExit('weekly canvas anchor not found exactly once')
          segment = segment.replace(old_canvas, new_canvas, 1)

          old_event = '''                '">' .
                  $eventHtml .
                  "</div></section>";
          '''
          new_event = '''                '">' .
                  ($dayBlocked ? $blockedDayMarkers($slotCount, $slotMinutes) : "") .
                  $eventHtml .
                  "</div></section>";
          '''
          if segment.count(old_event) < 1:
              raise SystemExit('weekly event output anchor not found')
          segment = segment.replace(old_event, new_event, 1)
          runtime_path.write_text(prefix + segment)

          test_path = Path('tools/test-fast')
          test = test_path.read_text()
          old_test = '''        str_contains($agendaRuntimeSource, 'agenda-day-blocked-watermark') &&
          '''
          new_test = '''        str_contains($agendaRuntimeSource, 'agenda-day-blocked-watermark') &&
                  str_contains($agendaRuntimeSource, '$blockedDayMarkers = static function') &&
                  str_contains($agendaRuntimeSource, 'data-day-blocked-status="1"') &&
                  str_contains($agendaRuntimeSource, '$canCreate = in_array($role, ["recepcionista", "gerente"], true) && !$dayBlocked;') &&
                  str_contains($agendaRuntimeSource, '$eventHtml === "" && !$dayBlocked') &&
                  str_contains($agendaRuntimeSource, '$dayBlocked ? $blockedDayMarkers($slotCount, $slotMinutes) : ""') &&
          '''
          if test.count(old_test) != 1:
              raise SystemExit('test-fast blocked-day anchor not found exactly once')
          test_path.write_text(test.replace(old_test, new_test, 1))

          ux_path = Path('tools/presentation-ux-contract.mjs')
          ux = ux_path.read_text()
          old_fixture = '''    <section id="blocked-weekly" class="agenda-day-shell agenda-week-day-shell" style="--agenda-slots:36" data-agenda-day="2026-09-17" data-slot-minutes="15">
                <div class="agenda-day-scale">${agendaSlots}</div>
                <div class="agenda-day-canvas" data-agenda-canvas data-slot-minutes="15">
                  <article class="agenda-day-event agenda-day-event-block" style="--event-top:0;--event-height:36"><strong>Bloqueado</strong></article>
                </div>
              </section>
          '''
          new_fixture = '''    <section id="blocked-weekly" class="agenda-day-shell agenda-week-day-shell is-day-blocked" style="--agenda-slots:36" data-agenda-day="2026-09-17" data-slot-minutes="15">
                <div class="agenda-day-scale">${agendaSlots}</div>
                <div class="agenda-day-canvas is-day-blocked" data-agenda-canvas data-day-blocked="1" data-slot-minutes="15">
                  <span class="sr-only" data-day-blocked-status="1" role="status">Dia bloqueado</span>
                  <div class="agenda-day-blocked-watermark" style="--blocked-slot-index:0" aria-hidden="true"><span>Dia bloqueado</span></div>
                </div>
              </section>
          '''
          if ux.count(old_fixture) != 1:
              raise SystemExit('presentation weekly fixture anchor not found exactly once')
          ux = ux.replace(old_fixture, new_fixture, 1)
          old_inspect = '''        fullDayCardHidden: Boolean(canvas.querySelector('.agenda-day-event-block')?.hidden)
          '''
          new_inspect = '''        fullDayCardSuppressed: !canvas.querySelector('.agenda-day-event-block') || Boolean(canvas.querySelector('.agenda-day-event-block')?.hidden)
          '''
          if ux.count(old_inspect) != 1:
              raise SystemExit('presentation inspection anchor not found exactly once')
          ux = ux.replace(old_inspect, new_inspect, 1)
          old_check = '''  if (!agendaResult.weekly.fullDayCardHidden) {
              throw new Error('weekly full-day block card remained visible instead of using blocked-day markers');
            }
          '''
          new_check = '''  if (!agendaResult.weekly.fullDayCardSuppressed) {
              throw new Error('weekly full-day block card remained visible instead of using blocked-day markers');
            }
          '''
          if ux.count(old_check) != 1:
              raise SystemExit('presentation weekly card assertion anchor not found exactly once')
          ux_path.write_text(ux.replace(old_check, new_check, 1))
          PY

          cat > /tmp/release.json <<'JSON'
          {
            "build": "1.9.16.3-agenda-blocked-server-rendering",
            "package_type": "presentation",
            "notes": "Torna o estado de dia bloqueado autoritativo no servidor também na visão semanal, elimina o cartão integral redundante e entrega os marcadores de 30 em 30 minutos já no HTML.",
            "logic_changes": true,
            "visual_changes": true,
            "documentation_changes": true,
            "deployment_sync_id": "github-prontoo-1.9.16.3-agenda-blocked-server-rendering",
            "changelog": {
              "title": "Dia bloqueado renderizado pelo servidor",
              "items": [
                "Detecta no servidor o bloqueio integral do expediente na visão semanal",
                "Renderiza no HTML os marcadores Dia bloqueado a cada 30 minutos nas visões diária e semanal",
                "Remove o cartão integral de bloqueio da coluna semanal quando o dia inteiro está bloqueado",
                "Desabilita no servidor os atalhos de criação da coluna semanal bloqueada",
                "Mantém a rotina JavaScript apenas como reforço idempotente do estado já entregue pelo servidor"
              ]
            }
          }
          JSON
          TS="$(TZ=America/Cuiaba date --iso-8601=seconds)"
          php tools/release-version --write --date=2026-09-16 --timestamp="$TS" --expected-current=1.9.16.2 --metadata-file=/tmp/release.json

          python3 <<'PY'
          from pathlib import Path
          import subprocess
          old = b'1.9.16.2'
          new = b'1.9.16.3'
          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data or old not in data:
                  continue
              path.write_bytes(data.replace(old, new))
          PY

          while IFS= read -r old_path; do
            [ -n "$old_path" ] || continue
            new_path="${old_path//1.9.16.2/1.9.16.3}"
            git mv "$old_path" "$new_path"
          done < <(git ls-files | grep '1\.9\.16\.2' || true)

          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          php tools/test-fast
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check

          rm -f .github/workflows/agenda-blocked-server-rendering-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agenda: renderiza dia bloqueado no servidor"
          git push origin HEAD:fix/agenda-blocked-server-rendering
