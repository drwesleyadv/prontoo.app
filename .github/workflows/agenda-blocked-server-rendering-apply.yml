name: Agenda blocked server rendering apply

on:
  push:
    branches:
      - fix/agenda-blocked-server-rendering

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agenda-blocked-server-rendering
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Apply authoritative blocked-day rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(label + ' anchor not found')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(label + ' anchor not found exactly once')
              return updated

          runtime_path = Path('app/Runtime/Appointments/AppointmentsRuntimeOperations05.php')
          source = runtime_path.read_text()
          new_marker = "\n".join([
              '        $blockedDayMarkers = static function (int $slots, int $slotMinutes): string {',
              '            $html = \'<span class="sr-only" data-day-blocked-status="1" role="status">Dia bloqueado</span>\';',
              '            for ($index = 0; $index < $slots; $index++) {',
              '                if (($index * $slotMinutes) % 30 !== 0) {',
              '                    continue;',
              '                }',
              '                $html .=',
              '                    \'<div class="agenda-day-blocked-watermark" style="--blocked-slot-index:\' .',
              '                    $index .',
              '                    \'" aria-hidden="true">\' .',
              '                    \\Prontoo\\Presentation\\UiComponents\\UiComponentsPresentationOperations01::icon("lock") .',
              '                    \'<span>Dia bloqueado</span></div>\';',
              '            }',
              '            return $html;',
              '        };',
              '        $dayBlockedWatermark = $dayBlocked',
              '            ? $blockedDayMarkers($slotCount, $slotMinutes)',
              '            : "";',
              ''
          ])
          source = regex_once(
              source,
              r'        \$dayBlockedWatermark = \$dayBlocked\n.*?\n            : "";\n',
              lambda _: new_marker,
              'daily blocked marker',
          )

          anchor = source.index('        $renderAgendaCanvas = function (')
          prefix = source[:anchor]
          segment = source[anchor:]
          segment = replace_once(
              segment,
              '            $fmtLocal,\n        ): string {',
              '            $fmtLocal,\n            $blockedDayMarkers,\n        ): string {',
              'weekly closure use',
          )
          slot_anchor = "\n".join([
              '            $slotCount = max(1, (int) ceil($totalMinutes / $slotMinutes));',
              '            $slotRows = "";',
              '            $canCreate = in_array($role, ["recepcionista", "gerente"], true);',
          ])
          slot_replacement = "\n".join([
              '            $slotCount = max(1, (int) ceil($totalMinutes / $slotMinutes));',
              '            $dayBlocked = false;',
              '            $dayBlockKey = null;',
              '            if ($agendaDoctor > 0 && $dayRows === []) {',
              '                foreach ($dayBlocks as $blockKey => $dayBlock) {',
              '                    if ((int) ($dayBlock["doctor_user_id"] ?? 0) !== $agendaDoctor) {',
              '                        continue;',
              '                    }',
              '                    $dayBlockStartTs = $localTs((string) ($dayBlock["start_at"] ?? ""));',
              '                    $dayBlockEndTs = $localTs((string) ($dayBlock["end_at"] ?? ""));',
              '                    if ($dayBlockStartTs <= $startTs && $dayBlockEndTs >= $endTs) {',
              '                        $dayBlocked = true;',
              '                        $dayBlockKey = $blockKey;',
              '                        break;',
              '                    }',
              '                }',
              '            }',
              '            $slotRows = "";',
              '            $canCreate = in_array($role, ["recepcionista", "gerente"], true) && !$dayBlocked;',
          ])
          segment = replace_once(segment, slot_anchor, slot_replacement, 'weekly slot state')
          segment = replace_once(
              segment,
              '            foreach ($dayBlocks as $b) {',
              '            foreach ($dayBlocks as $blockKey => $b) {',
              'weekly block loop',
          )
          block_pos = segment.index('            foreach ($dayBlocks as $blockKey => $b) {')
          before_blocks = segment[:block_pos]
          after_blocks = segment[block_pos:]
          top_anchor = '                $top = max(0, ($sTs - $startTs) / 60 / $slotMinutes);'
          top_replacement = "\n".join([
              '                if ($dayBlocked && $dayBlockKey === $blockKey) {',
              '                    continue;',
              '                }',
              top_anchor,
          ])
          after_blocks = replace_once(after_blocks, top_anchor, top_replacement, 'weekly full-day card suppression')
          after_blocks = replace_once(
              after_blocks,
              '            if ($eventHtml === "") {',
              '            if ($eventHtml === "" && !$dayBlocked) {',
              'weekly empty state',
          )
          after_blocks = replace_once(
              after_blocks,
              '            return \'<section class="agenda-day-shell agenda-crown-shell agenda-week-day-shell" style="--agenda-slots:\' .',
              '            return \'<section class="agenda-day-shell agenda-crown-shell agenda-week-day-shell\' . ($dayBlocked ? \' is-day-blocked\' : \'\') . \'" style="--agenda-slots:\' .',
              'weekly section state',
          )
          after_blocks = replace_once(
              after_blocks,
              '                \'</div><div class="agenda-day-canvas" data-agenda-canvas data-slot-minutes="\' .\n                $slotMinutes .',
              '                \'</div><div class="agenda-day-canvas\' . ($dayBlocked ? \' is-day-blocked\' : \'\') . \'" data-agenda-canvas data-day-blocked="\' . ($dayBlocked ? \'1\' : \'0\') . \'" data-slot-minutes="\' .\n                $slotMinutes .',
              'weekly canvas state',
          )
          after_blocks = replace_once(
              after_blocks,
              '                $eventHtml .\n                "</div></section>";',
              '                ($dayBlocked ? $blockedDayMarkers($slotCount, $slotMinutes) : "") .\n                $eventHtml .\n                "</div></section>";',
              'weekly markers output',
          )
          runtime_path.write_text(prefix + before_blocks + after_blocks)

          test_path = Path('tools/test-fast')
          test = test_path.read_text()
          test_anchor = "        str_contains($agendaRuntimeSource, 'agenda-day-blocked-watermark') &&\n"
          test_extra = "".join([
              test_anchor,
              "        str_contains($agendaRuntimeSource, '$blockedDayMarkers = static function') &&\n",
              "        str_contains($agendaRuntimeSource, 'data-day-blocked-status=\"1\"') &&\n",
              "        str_contains($agendaRuntimeSource, '$canCreate = in_array($role, [\"recepcionista\", \"gerente\"], true) && !$dayBlocked;') &&\n",
              "        str_contains($agendaRuntimeSource, '$eventHtml === \"\" && !$dayBlocked') &&\n",
              "        str_contains($agendaRuntimeSource, '$dayBlocked ? $blockedDayMarkers($slotCount, $slotMinutes) : \"\"') &&\n",
          ])
          test_path.write_text(replace_once(test, test_anchor, test_extra, 'test-fast blocked-day'))

          ux_path = Path('tools/presentation-ux-contract.mjs')
          ux = ux_path.read_text()
          weekly_fixture = "\n".join([
              '    <section id="blocked-weekly" class="agenda-day-shell agenda-week-day-shell is-day-blocked" style="--agenda-slots:36" data-agenda-day="2026-09-17" data-slot-minutes="15">',
              '      <div class="agenda-day-scale">${agendaSlots}</div>',
              '      <div class="agenda-day-canvas is-day-blocked" data-agenda-canvas data-day-blocked="1" data-slot-minutes="15">',
              '        <span class="sr-only" data-day-blocked-status="1" role="status">Dia bloqueado</span>',
              '        <div class="agenda-day-blocked-watermark" style="--blocked-slot-index:0" aria-hidden="true"><span>Dia bloqueado</span></div>',
              '      </div>',
              '    </section>',
              ''
          ])
          ux = regex_once(
              ux,
              r'    <section id="blocked-weekly".*?    </section>\n',
              lambda _: weekly_fixture,
              'presentation weekly fixture',
          )
          ux = replace_once(
              ux,
              "        fullDayCardHidden: Boolean(canvas.querySelector('.agenda-day-event-block')?.hidden)",
              "        fullDayCardSuppressed: !canvas.querySelector('.agenda-day-event-block') || Boolean(canvas.querySelector('.agenda-day-event-block')?.hidden)",
              'presentation inspection',
          )
          ux = replace_once(
              ux,
              '  if (!agendaResult.weekly.fullDayCardHidden) {',
              '  if (!agendaResult.weekly.fullDayCardSuppressed) {',
              'presentation weekly assertion',
          )
          ux_path.write_text(ux)
          PY

          cat > /tmp/release.json <<'JSON'
          {
            "build": "1.9.16.3-agenda-blocked-server-rendering",
            "package_type": "presentation",
            "notes": "Torna o estado de dia bloqueado autoritativo no servidor também na visão semanal, elimina o cartão integral redundante e entrega os marcadores de 30 em 30 minutos já no HTML.",
            "logic_changes": true,
            "visual_changes": true,
            "documentation_changes": true,
            "deployment_sync_id": "github-prontoo-1.9.16.3-agenda-blocked-server-rendering",
            "changelog": {
              "title": "Dia bloqueado renderizado pelo servidor",
              "items": [
                "Detecta no servidor o bloqueio integral do expediente na visão semanal",
                "Renderiza no HTML os marcadores Dia bloqueado a cada 30 minutos nas visões diária e semanal",
                "Remove o cartão integral de bloqueio da coluna semanal quando o dia inteiro está bloqueado",
                "Desabilita no servidor os atalhos de criação da coluna semanal bloqueada",
                "Mantém a rotina JavaScript apenas como reforço idempotente do estado já entregue pelo servidor"
              ]
            }
          }
          JSON
          TS="$(TZ=America/Cuiaba date --iso-8601=seconds)"
          php tools/release-version --write --date=2026-09-16 --timestamp="$TS" --expected-current=1.9.16.2 --metadata-file=/tmp/release.json

          python3 <<'PY'
          from pathlib import Path
          import subprocess
          old = b'1.9.16.2'
          new = b'1.9.16.3'
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b'\0' in data or old not in data:
                  continue
              path.write_bytes(data.replace(old, new))
          PY

          while IFS= read -r old_path; do
            [ -n "$old_path" ] || continue
            new_path="${old_path//1.9.16.2/1.9.16.3}"
            git mv "$old_path" "$new_path"
          done < <(git ls-files | grep '1\.9\.16\.2' || true)

          php tools/presentation-css-build --write
          php tools/release-contract-reconcile --write
          php -l app/Runtime/Appointments/AppointmentsRuntimeOperations05.php
          php tools/test-fast
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check

          rm -f .github/workflows/agenda-blocked-server-rendering-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agenda: renderiza dia bloqueado no servidor"
          git push origin HEAD:fix/agenda-blocked-server-rendering
