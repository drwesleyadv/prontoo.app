      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.27.6 — impedir gravações duplicadas"
          git push origin HEAD:agent/prevent-duplicate-writes-1.7.27.6
