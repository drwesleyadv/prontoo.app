name: Documentation Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  reconcile-manifest:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply temporary SOLID stage 5 migration
        if: ${{ hashFiles('.solid-stage5/payload.00') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .solid-stage5/payload.* | base64 -d > /tmp/solid-stage5.tar.gz
          mkdir -p /tmp/solid-stage5
          tar -xzf /tmp/solid-stage5.tar.gz -C /tmp/solid-stage5
          php /tmp/solid-stage5/migrate.php "$GITHUB_WORKSPACE"
          tar -xzf /tmp/solid-stage5/overrides.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f solid-migration-map.json
          rm -rf .solid-stage5
          rm -f .github/workflows/solid-stage5-apply.yml
          git show origin/prontoo:.github/workflows/documentation.yml > .github/workflows/documentation.yml
      - name: Reconcile update manifest
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q '^\.solid-stage5/'; then
            echo 'Temporary SOLID payload remained staged.' >&2
            exit 1
          fi
          git commit -m "SOLID stage 5: migrate procedural modules to native facades"
          git push origin HEAD:${GITHUB_HEAD_REF}
  validate:
    if: ${{ !(github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Validate documentation contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
