name: Documentation Contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-reconcile-helper
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile and publish final branch
        shell: bash
        run: |
          set -euo pipefail
          php tools/release-contract-reconcile --write
          git checkout origin/prontoo -- .github/workflows/documentation.yml
          php tools/release-contract-reconcile --write
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/update.manifest.json app/architecture.manifest.json CHANGELOG.md app/prontoo.php br/index.php .github/workflows/architecture.yml .github/workflows/documentation.yml
          git commit -m 'Reconciliar contrato documental final' || true
          git push origin HEAD:agent/docs-architecture-2026-08-08 --force
