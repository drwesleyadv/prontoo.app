name: Documentation Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile final state preview
        shell: bash
        run: |
          set -euo pipefail
          rm -f runtime-log-15m.php
          git checkout origin/prontoo -- .github/workflows/documentation.yml
          php tools/release-contract-reconcile --write
      - name: Validate documentation contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
      - name: Publish reconciled final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prontoo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalizar correção de prontidão e remover diagnóstico temporário"
          git push --force origin HEAD:refs/heads/agent/runtime-final-output
