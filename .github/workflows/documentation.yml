name: Documentation Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  transition:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Materialize deterministic read-only release pipeline
        shell: bash
        run: |
          set -euo pipefail
          php tools/.stage-deterministic-release.php
          test ! -e tools/.stage-deterministic-release.php
          php tools/release-contract-reconcile --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release pipeline: materialize deterministic read-only contract"
          git push origin HEAD:${GITHUB_HEAD_REF}
