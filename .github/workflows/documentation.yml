name: Documentation Contract

on:
  pull_request:
  push:
    branches:
      - main
      - agent/documentation-refactor

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  refactor:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/documentation-refactor' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply documentation refactor
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/architecture.yml /tmp/architecture-original.yml
          cat tools/documentation-refactor.php.gz.b64.part* | base64 -d | gzip -d > tools/documentation-refactor.php
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/documentation-refactor.php')
          source = path.read_text()
          old = "$source = preg_replace($regex, '$1$2' . $version . '$2$3', $source, 1, $count);"
          new = "$source = preg_replace_callback($regex, static fn(array $match): string => $match[1] . $match[2] . $version . $match[2] . $match[3], $source, 1, $count);"
          if old not in source:
              raise SystemExit('Trecho de atualização de versão não encontrado')
          path.write_text(source.replace(old, new))
          PY
          rm -f tools/documentation-refactor.php.gz.b64.part*
          php tools/documentation-refactor.php
          generated_bytes="$(stat -c%s .github/workflows/architecture.yml)"
          original_bytes="$(stat -c%s /tmp/architecture-original.yml)"
          cp /tmp/architecture-original.yml .github/workflows/architecture.yml
          GENERATED_ARCHITECTURE_BYTES="$generated_bytes" ORIGINAL_ARCHITECTURE_BYTES="$original_bytes" php -r '
          $path = "app/update.manifest.json";
          $manifest = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $workflow = ".github/workflows/architecture.yml";
          $manifest["files"][$workflow] = hash_file("sha256", $workflow);
          $manifest["total_uncompressed_bytes"] = (int) $manifest["total_uncompressed_bytes"] - (int) getenv("GENERATED_ARCHITECTURE_BYTES") + (int) getenv("ORIGINAL_ARCHITECTURE_BYTES");
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
      - name: Validate generated state
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
      - name: Commit generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Reestruturar documentação e remover comentários"
          git push origin HEAD:${GITHUB_HEAD_REF}
  validate:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'agent/documentation-refactor' && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Validate documentation contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
