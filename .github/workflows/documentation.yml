name: Documentation Contract

on:
  pull_request:
  push:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/maintenance-security-refactor-touch
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql, mbstring
      - name: Restore canonical workflows and reconcile
        shell: bash
        run: |
          set -euo pipefail
          git show 26ac640178966fc513f44d5ab2f45a75dca4e71b:.github/workflows/architecture.yml > .github/workflows/architecture.yml
          git show 26ac640178966fc513f44d5ab2f45a75dca4e71b:.github/workflows/documentation.yml > .github/workflows/documentation.yml
          rm -f tools/.release-reconcile-trigger
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/runtime-input-boundary-check
          GITHUB_BASE_REF=prontoo php tools/runtime-refactor-on-touch-check
          php tools/quality-gate --fast
          bash -n tools/login-logout-http-smoke
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              .github/workflows/*) continue ;;
            esac
            git add -A -- "$path"
          done < <(git status --porcelain | sed -E 's/^...//')
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): reconcile final 1.8.11.2 metadata'
            git push origin HEAD:agent/maintenance-security-refactor-touch
          fi
