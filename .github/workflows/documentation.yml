name: Apply Public Stats and Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: prontoo_schema
  DB_USERNAME: root
  DB_PASSWORD: root
  GITHUB_ACTIONS: 'true'
  CI: 'true'
  PRONTOO_SCHEMA_TEST_MODE: '1'
  PRONTOO_INSTALLER_CLI_MODE: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apply-public-stats:
    if: github.head_ref == 'agent/reuse-speed-chart-renderer' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql
      - name: Apply validate and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/reuse-speed-chart-renderer
          git reset --hard origin/agent/reuse-speed-chart-renderer
          git show origin/main:.github/workflows/documentation.yml > /tmp/documentation.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/public_stats_apply.py')
          text = path.read_text(encoding='utf-8')
          marker = '    "stats public route",\n)\n'
          end = text.index(marker) + len(marker)
          start = text.rfind('runner = replace_once(', 0, end)
          if start < 0:
              raise SystemExit('public runtime route block start missing')
          replacement = """public_route_old = '''        \"login\",
                  \"login_autotest\",
                  \"mfa\",'''
          public_route_new = '''        \"stats\",
                  \"login\",
                  \"login_autotest\",
                  \"mfa\",'''
          if runner.count(public_route_old) != 2:
              raise RuntimeError(
                  f\"stats public route: expected two occurrences, found {runner.count(public_route_old)}\",
              )
          public_route_head, public_route_tail = runner.rsplit(public_route_old, 1)
          runner = public_route_head + public_route_new + public_route_tail
          """
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python3 tools/public_stats_apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/architecture-check.php')
          text = path.read_text(encoding='utf-8')
          old = '''        "$stats = ['stats' => ['Domain/Maestro/Maestro.php', 'Admin/AdminPages.php']]",
                  "'stats' => $stats",'''
          new = """        '$stats = [\\'stats\\' => [\\'Domain/Maestro/Maestro.php\\', \\'Admin/AdminPages.php\\']]',
                  '\\'stats\\' => $stats',"""
          if text.count(old) != 1:
              raise SystemExit(f'generated loader token block count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cp /tmp/documentation.yml .github/workflows/documentation.yml
          rm -f .github/workflows/public-stats.yml
          rm -f tools/public_stats_apply.py
          rm -f tools/public_stats_trigger.txt
          rm -f public-stats-failure.log
          find tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
          test ! -e tools/public_stats_apply.py
          test ! -e tools/public_stats_trigger.txt
          test ! -e .github/workflows/public-stats.yml
          test ! -e public-stats-failure.log
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          cmp -s .github/workflows/documentation.yml /tmp/documentation.yml
          grep -F 'RewriteRule ^stats/?$ index.php?r=stats [QSA,L,NC]' .htaccess
          grep -F 'function page_stats(): void' app/Admin/AdminPages.php
          grep -F 'admin_performance_card_html(true)' app/Admin/AdminPages.php
          grep -F '$publicStats = $r === "stats"' app/Runtime/Runner.php
          grep -F "'stats' => \$stats" app/Support/ModuleLoader.php
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . \
            -path './.git' -prune -o \
            -path './ssd' -prune -o \
            -path './vendor' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Disponibilizar card de desempenho em stats"
          git push origin HEAD:${GITHUB_HEAD_REF}
