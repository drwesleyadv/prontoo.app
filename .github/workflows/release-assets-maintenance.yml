name: Release Assets Maintenance

on:
  push:
    branches:
      - fix/session-idle-4h

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Reconcile release assets
        shell: bash
        run: |
          set -euo pipefail
          old='1.9.15.6'
          new='1.9.15.7'

          for stem in app-icon favicon prontoo-mark; do
            for ext in png ico; do
              source="public/assets/${stem}-${old}.${ext}"
              if [[ -f "$source" ]]; then
                git mv "$source" "public/assets/${stem}-${new}.${ext}"
              fi
            done
          done
          git mv "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"

          while IFS= read -r -d '' file; do
            python3 - "$file" "$old" "$new" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          old, new = sys.argv[2], sys.argv[3]
          data = path.read_bytes()
          if b'\0' in data:
              raise SystemExit(0)
          try:
              text = data.decode('utf-8')
          except UnicodeDecodeError:
              raise SystemExit(0)
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          done < <(git grep -Ilz "$old" || true)

          python3 <<'PY'
          import json
          from pathlib import Path
          path = Path('version.json')
          data = json.loads(path.read_text())
          if data.get('version') != '1.9.15.7':
              raise SystemExit('release canônica inesperada')
          if data.get('asset_version') != '1.9.15.7':
              data['asset_version'] = '1.9.15.7'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          php tools/presentation-css-build --write
          rm .github/workflows/release-assets-maintenance.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/superseded-reference-contract-check
          php tools/version-asset-contract-check.php
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/install-security-check.php
          php tools/security-regression-check.php
          php tools/quality-gate --fast
          php tools/documentation-check.php
          git diff --check
      - name: Commit reconciled release assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reconcilia assets da release 1.9.15.7"
          git push origin HEAD:fix/session-idle-4h
