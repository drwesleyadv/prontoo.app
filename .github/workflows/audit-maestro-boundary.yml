name: Audit Maestro Boundary

on:
  push:
    branches:
      - audit/consolidation-1-9-14-1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: audit/consolidation-1-9-14-1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply typed Maestro boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new))

          service = 'app/Application/Operational/MaestroCommandService.php'
          anchor = '''    public function createClaimedAction(\n'''
          method = '''    public function recordJobRun(float $startedAt, array $result): void\n    {\n        $this->data->result(\n            'operational.maestro.05.maestro_supervised_record_job_run.01',\n            [\n                $startedAt,\n                (int) ($result['duration_ms'] ?? 0),\n                (int) ($result['rules_seen'] ?? 0),\n                (int) ($result['rules_run'] ?? 0),\n                (int) ($result['actions_created'] ?? 0),\n                (int) ($result['deferred'] ?? 0),\n                (int) ($result['errors'] ?? 0),\n                !empty($result['success']) ? 1 : 0,\n                (float) ($result['load_score'] ?? 0),\n                mb_substr((string) ($result['note'] ?? ''), 0, 255),\n            ],\n        );\n    }\n\n'''
          replace_once(service, anchor, method + anchor)

          runtime = 'app/Runtime/Maestro/MaestroRuntimeOperations05.php'
          old_runtime = '''            \\Prontoo\\Runtime\\Operational\\OperationalComposition::maestro()->result('operational.maestro.05.maestro_supervised_record_job_run.01', [\n                    $startedAt,\n                    (int) ($result["duration_ms"] ?? 0),\n                    (int) ($result["rules_seen"] ?? 0),\n                    (int) ($result["rules_run"] ?? 0),\n                    (int) ($result["actions_created"] ?? 0),\n                    (int) ($result["deferred"] ?? 0),\n                    (int) ($result["errors"] ?? 0),\n                    !empty($result["success"]) ? 1 : 0,\n                    (float) ($result["load_score"] ?? 0),\n                    mb_substr((string) ($result["note"] ?? ""), 0, 255),\n                ], []);'''
          new_runtime = '''            \\Prontoo\\Runtime\\Operational\\OperationalComposition::maestroCommands()\n                ->recordJobRun($startedAt, $result);'''
          replace_once(runtime, old_runtime, new_runtime)

          contract = 'app/application.test-contract.json'
          replace_once(
              contract,
              '"entry_points": ["grantRuntimeAccess", "updateStats", "createClaimedAction", "createSupervisedAction"],',
              '"entry_points": ["grantRuntimeAccess", "updateStats", "recordJobRun", "createClaimedAction", "createSupervisedAction"],',
          )
          replace_once(
              contract,
              '"assertions": ["application.maestro_commands.actions", "application.maestro_commands.stats_insert", "application.maestro_commands.supervised_sequence"]',
              '"assertions": ["application.maestro_commands.actions", "application.maestro_commands.stats_insert", "application.maestro_commands.job_run", "application.maestro_commands.supervised_sequence"]',
          )

          test = 'tools/test-fast'
          test_anchor = "$maestroCommands->updateStats('rule:2', 0.0, 0, 20.0, true);\n"
          test_insert = test_anchor + '''$maestroCommands->recordJobRun(123.5, [\n    'duration_ms' => 240,\n    'rules_seen' => 4,\n    'rules_run' => 3,\n    'actions_created' => 2,\n    'deferred' => 1,\n    'errors' => 0,\n    'success' => true,\n    'load_score' => 8.333,\n    'note' => 'ok',\n]);\n'''
          replace_once(test, test_anchor, test_insert)
          assertion_anchor = "$same(['claimed', 'supervised'], $maestroActions, 'application.maestro_commands.actions');\n"
          assertion_insert = assertion_anchor + '''$assert(\n    in_array(\n        'operational.maestro.05.maestro_supervised_record_job_run.01',\n        array_column($operationalWorkflowPort->calls, 0),\n        true,\n    ),\n    'application.maestro_commands.job_run',\n);\n'''
          replace_once(test, assertion_anchor, assertion_insert)
          PY

      - name: Reconcile and validate
        shell: bash
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/audit-maestro-boundary.yml
          php tools/release-contract-reconcile --write
          if grep -q 'audit-maestro-boundary.yml' app/update.manifest.json; then
            echo 'workflow temporário contaminou o manifest' >&2
            exit 1
          fi
          php tools/release-contract-reconcile --check
          php tools/runtime-symbol-contract-check
          php tools/quality-gate --fast
          php tools/application-test-contract-check
          php tools/documentation-check.php
          php tools/code-comment-check.php
          git diff --check

      - name: Commit typed boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduz dívida do hotspot Maestro por fronteira tipada"
          git push origin HEAD:audit/consolidation-1-9-14-1
