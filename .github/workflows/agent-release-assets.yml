name: Agent Release Assets

on:
  pull_request:

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/cache-json-scoped-generations
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Republish canonical release assets
        shell: bash
        run: |
          set -euo pipefail
          old='1.8.17.13'
          new='1.8.18.1'
          for stem in app-icon favicon prontoo-mark; do
            if [[ "$stem" == "favicon" ]]; then
              cp "public/assets/${stem}-${old}.png" "public/assets/${stem}-${new}.png"
              cp "public/assets/${stem}-${old}.ico" "public/assets/${stem}-${new}.ico"
            else
              cp "public/assets/${stem}-${old}.png" "public/assets/${stem}-${new}.png"
            fi
          done
          cp "public/assets/pix-${old}.svg" "public/assets/pix-${new}.svg"
          rm -f \
            "public/assets/app-icon-${old}.png" \
            "public/assets/favicon-${old}.ico" \
            "public/assets/favicon-${old}.png" \
            "public/assets/pix-${old}.svg" \
            "public/assets/prontoo-mark-${old}.png"
          python3 - <<'PY'
          from pathlib import Path
          old = '1.8.17.13'
          new = '1.8.18.1'
          excluded = {'.git', 'ssd', 'vendor', 'node_modules'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              if path == Path('.github/workflows/agent-release-assets.yml'):
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in data:
                  path.write_text(data.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/agent-release-assets.yml
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/version-asset-contract-check.php
          php tools/superseded-reference-contract-check
          php tools/php84-runtime-contract-check
          php -l app/prontoo.php
      - name: Verify assets are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git show prontoo:public/assets/app-icon-1.8.17.13.png | cmp - public/assets/app-icon-1.8.18.1.png
          git show prontoo:public/assets/favicon-1.8.17.13.ico | cmp - public/assets/favicon-1.8.18.1.ico
          git show prontoo:public/assets/favicon-1.8.17.13.png | cmp - public/assets/favicon-1.8.18.1.png
          git show prontoo:public/assets/pix-1.8.17.13.svg | cmp - public/assets/pix-1.8.18.1.svg
          git show prontoo:public/assets/prontoo-mark-1.8.17.13.png | cmp - public/assets/prontoo-mark-1.8.18.1.png
      - name: Commit canonical assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Republica assets canônicos da versão 1.8.18.1"
          git push origin HEAD:agent/cache-json-scoped-generations
