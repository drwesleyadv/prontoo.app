name: Agent CSS Architecture Audit

on:
  pull_request:
    branches:
      - prontoo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/remove-legacy-css-architecture' || github.ref_name == 'agent/remove-legacy-css-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/remove-legacy-css-architecture
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect and isolate residual runtime tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, re
          from pathlib import Path
          manifest = json.loads(Path('app/Presentation/Styles/styles.manifest.json').read_text())
          bridge = json.loads(Path('design/tokens/css-bridge.json').read_text())
          css_files = sorted(Path('app/Presentation/Styles').rglob('*.css'))
          print('LEGACY_CSS_FILES', len(css_files))
          print('LEGACY_CSS_BYTES', sum(p.stat().st_size for p in css_files))
          print('SEQUENCE_SEGMENTS', len(manifest.get('sequence', [])))
          print('MANIFEST_BYTES', Path('app/Presentation/Styles/styles.manifest.json').stat().st_size)
          print('BRIDGE_BYTES', Path('design/tokens/css-bridge.json').stat().st_size)
          print('BRIDGE_ENTRIES', len(bridge.get('entries', [])))
          source = {s['path']: Path('app/Presentation/Styles', s['path']).read_bytes() for s in manifest['sources']}
          behavior = bytearray()
          tokens = bytearray()
          for seg in manifest['sequence']:
              data = source[seg['source']]
              piece = data[int(seg['offset']):int(seg['offset'])+int(seg['bytes'])]
              (tokens if seg['source'].startswith('tokens/') else behavior).extend(piece)

          block_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          decl_re = re.compile(r'(--[A-Za-z0-9_-]+)\s*:\s*([^;]+?)(!important)?\s*;', re.S)
          def declarations(css):
              out=[]
              for selector, body in block_re.findall(css):
                  selector=' '.join(selector.split())
                  for name, value, important in decl_re.findall(body):
                      out.append((selector, name, ' '.join(value.split()), bool(important)))
              return out
          def render(items):
              order=[]; groups={}
              for selector,name,value,important in items:
                  if selector not in groups:
                      groups[selector]=[]; order.append(selector)
                  groups[selector].append((name,value,important))
              blocks=[]
              for selector in order:
                  lines='\n'.join(f'  {name}:{value}{"!important" if important else ""};' for name,value,important in groups[selector])
                  blocks.append(f'{selector}{{\n{lines}\n}}')
              return ('\n\n'.join(blocks)+'\n').encode()

          tails = bytearray()
          residual=[]
          for target in ('clinic','material','semantic'):
              token_path = Path(f'app/Presentation/Styles/tokens/{target}.css')
              data = token_path.read_bytes()
              legacy = base64.b64decode(bridge['legacy'][target]['base64'])
              if not data.startswith(legacy):
                  raise SystemExit(f'legacy prefix mismatch {target}')
              tail = data[len(legacy):]
              tails.extend(tail)
              tail_keys=set(declarations(tail.decode()))
              legacy_decls=declarations(legacy.decode())
              unique=[d for d in legacy_decls if d not in tail_keys]
              residual.extend(unique)
              print('TARGET', target, 'legacy_declarations', len(legacy_decls), 'tail_declarations', len(tail_keys), 'residual', len(unique))
          residual_unique=[]; seen=set()
          for item in residual:
              if item in seen: continue
              seen.add(item); residual_unique.append(item)
          residual_css=render(residual_unique)
          print('RESIDUAL_DECLARATIONS', len(residual_unique))
          print('RESIDUAL_CSS_BYTES', len(residual_css))
          print('ELIMINATED_LEGACY_BYTES', sum(len(base64.b64decode(v['base64'])) for v in bridge['legacy'].values()) - len(residual_css))
          Path('/tmp/token-first.css').write_bytes(bytes(tokens) + bytes(behavior))
          Path('/tmp/dtcg-only.css').write_bytes(bytes(tails) + bytes(behavior))
          Path('/tmp/deduped-runtime.css').write_bytes(residual_css + bytes(tails) + bytes(behavior))
          Path('/tmp/residual.css').write_bytes(residual_css)
          PY
      - name: Install browser contract
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Verify movable token bundle
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/token-first.css public/assets/presentation.css
          node tools/presentation-ux-contract.mjs --check
      - name: Verify deduplicated residual token bundle
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/deduped-runtime.css public/assets/presentation.css
          node tools/presentation-ux-contract.mjs --check
