name: Agent CSS Architecture Migration

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/remove-legacy-css-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/remove-legacy-css-architecture
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned design toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Materialize independent design sources
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, re
          from pathlib import Path
          manifest = json.loads(Path('app/Presentation/Styles/styles.manifest.json').read_text())
          bridge = json.loads(Path('design/tokens/css-bridge.json').read_text())
          source = {s['path']: Path('app/Presentation/Styles', s['path']).read_bytes() for s in manifest['sources']}
          behavior = bytearray()
          for seg in manifest['sequence']:
              if seg['source'].startswith('tokens/'):
                  continue
              data = source[seg['source']]
              behavior.extend(data[int(seg['offset']):int(seg['offset'])+int(seg['bytes'])])
          Path('design/styles').mkdir(parents=True, exist_ok=True)
          Path('design/styles/application.css').write_bytes(bytes(behavior))

          block_re = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          decl_re = re.compile(r'(--[A-Za-z0-9_-]+)\s*:\s*([^;]+?)(!important)?\s*;', re.S)
          def declarations(css):
              out=[]
              for selector, body in block_re.findall(css):
                  selector=' '.join(selector.split())
                  for name, value, important in decl_re.findall(body):
                      out.append((selector, name, ' '.join(value.split()), bool(important)))
              return out

          runtime = {'runtime': {'residual': {}, 'bridge': {}}}
          sequence = 0
          residual_count = 0
          for target in ('clinic','material','semantic'):
              legacy = base64.b64decode(bridge['legacy'][target]['base64']).decode()
              for selector, name, value, important in declarations(legacy):
                  sequence += 1
                  residual_count += 1
                  runtime['runtime']['residual'][f'item{sequence:04d}'] = {
                      '$type': 'string',
                      '$value': value,
                      '$extensions': {'com.prontoo': {
                          'cssName': name,
                          'cssValue': value,
                          'target': target,
                          'selector': selector,
                          'important': important,
                          'phase': 'residual',
                          'sequence': sequence,
                      }},
                  }
          for index, entry in enumerate(bridge.get('entries', []), start=1):
              value = str(entry.get('value', ''))
              runtime['runtime']['bridge'][f'item{index:04d}'] = {
                  '$type': 'string',
                  '$value': value,
                  '$extensions': {'com.prontoo': {
                      'cssName': str(entry.get('name', '')),
                      'cssValue': value,
                      'target': str(entry.get('target', '')),
                      'selector': str(entry.get('selector', 'body')),
                      'important': entry.get('important') is True,
                      'order': int(entry.get('order', 0)),
                      'phase': 'canonical',
                  }},
              }
          Path('design/tokens/runtime.tokens.json').write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + '\n')
          print('migration: behavior_bytes', len(behavior), 'residual_tokens', residual_count, 'bridge_tokens', len(bridge.get('entries', [])))
          PY
      - name: Install simplified builders and contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/design-tokens-build.mjs <<'JS'
          #!/usr/bin/env node
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import StyleDictionary from 'style-dictionary';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const mode = process.argv[2] || '--check';
          if (!['--check', '--write'].includes(mode)) {
            process.stderr.write('design-tokens-build: use --check or --write\n');
            process.exit(2);
          }
          const sourceGlob = path.join(root, 'design/tokens/**/*.tokens.json');
          const generatedPath = path.join(root, 'design/generated/tokens.css');
          const targetOrder = ['clinic', 'material', 'semantic'];
          const targetRank = new Map(targetOrder.map((target, index) => [target, index]));
          const vendorMeta = token => token?.original?.$extensions?.['com.prontoo'] ?? token?.$extensions?.['com.prontoo'] ?? {};
          const originalValue = token => token?.original?.$value ?? token?.$value ?? token?.original?.value ?? token?.value;
          const transformedValue = token => token?.value ?? token?.$value;
          const tokenPath = token => Array.isArray(token.path) ? token.path.join('.') : String(token.name || '');
          const cssName = token => {
            const value = String(vendorMeta(token).cssName || '').trim();
            if (!/^--[a-z0-9-]+$/i.test(value)) throw new Error(`invalid cssName for ${tokenPath(token)}`);
            return value;
          };
          const cssLiteral = value => {
            if (typeof value === 'string' || typeof value === 'number') return String(value);
            if (value && typeof value === 'object' && typeof value.hex === 'string') return String(value.hex);
            throw new Error(`unsupported transformed token value ${JSON.stringify(value)}`);
          };
          const render = declarations => {
            const selectorOrder = [];
            const grouped = new Map();
            for (const declaration of declarations) {
              if (!grouped.has(declaration.selector)) {
                grouped.set(declaration.selector, []);
                selectorOrder.push(declaration.selector);
              }
              grouped.get(declaration.selector).push(declaration);
            }
            return selectorOrder.map(selector => {
              const lines = grouped.get(selector).map(item => `  ${item.name}:${item.value}${item.important ? '!important' : ''};`).join('\n');
              return `${selector}{\n${lines}\n}`;
            }).join('\n\n');
          };

          StyleDictionary.registerFormat({
            name: 'prontoo/dtcg-runtime-bundle',
            format: ({ dictionary }) => {
              const all = [...dictionary.allTokens];
              const names = new Map(all.map(token => [tokenPath(token), cssName(token)]));
              const declarations = all.map(token => {
                const meta = vendorMeta(token);
                const target = String(meta.target || '');
                if (!targetRank.has(target)) throw new Error(`unknown target ${target}:${tokenPath(token)}`);
                const raw = originalValue(token);
                let value = String(meta.cssValue || '').trim();
                if (!value) {
                  if (typeof raw === 'string' && /^\{[^{}]+\}$/.test(raw.trim())) {
                    const refName = names.get(raw.trim().slice(1, -1));
                    if (!refName) throw new Error(`unknown token reference ${raw}`);
                    value = `var(${refName})`;
                  } else {
                    value = cssLiteral(transformedValue(token));
                  }
                }
                value = value.replace(/\{([^{}]+)\}/g, (_, ref) => {
                  const refName = names.get(ref);
                  if (!refName) throw new Error(`unknown embedded token reference ${ref}`);
                  return `var(${refName})`;
                });
                return {
                  selector: String(meta.selector || ':root'),
                  name: cssName(token),
                  value,
                  important: meta.important === true,
                  target,
                  phase: String(meta.phase || 'canonical'),
                  sequence: Number(meta.sequence || 0),
                  order: Number(meta.order || 0),
                };
              });
              const residual = declarations.filter(item => item.phase === 'residual').sort((a, b) => a.sequence - b.sequence || a.name.localeCompare(b.name));
              const canonical = declarations.filter(item => item.phase !== 'residual');
              const sections = [];
              if (residual.length) sections.push(render(residual));
              for (const target of targetOrder) {
                const items = canonical.filter(item => item.target === target).sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
                if (items.length) sections.push(render(items));
              }
              return sections.filter(Boolean).join('\n\n') + '\n';
            },
          });

          const tempRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'prontoo-design-tokens-'));
          try {
            const config = {
              source: [sourceGlob],
              usesDtcg: true,
              platforms: {
                css: {
                  transformGroup: 'css',
                  buildPath: `${tempRoot}/`,
                  files: [{ destination: 'tokens.css', format: 'prontoo/dtcg-runtime-bundle', options: { showFileHeader: false } }],
                },
              },
            };
            const sd = new StyleDictionary(config);
            await sd.buildAllPlatforms();
            const generated = fs.readFileSync(path.join(tempRoot, 'tokens.css'), 'utf8');
            if (mode === '--write') {
              fs.mkdirSync(path.dirname(generatedPath), { recursive: true });
              fs.writeFileSync(generatedPath, generated);
            } else {
              const current = fs.existsSync(generatedPath) ? fs.readFileSync(generatedPath, 'utf8') : '';
              if (current !== generated) {
                process.stderr.write('design-tokens-build: generated drift\n');
                process.exit(1);
              }
            }
            process.stdout.write(`design-tokens-build: ${mode === '--write' ? 'written' : 'deterministic'} dtcg=2025.10 generated=1 legacy=0\n`);
          } finally {
            fs.rmSync(tempRoot, { recursive: true, force: true });
          }
          JS
          chmod +x tools/design-tokens-build.mjs

          cat > tools/presentation-css-build <<'PHP'
          #!/usr/bin/env php
          <?php
          declare(strict_types=1);
          if (PHP_SAPI !== 'cli') {
              http_response_code(404);
              exit(1);
          }
          $root = dirname(__DIR__);
          $tokenPath = $root . '/design/generated/tokens.css';
          $applicationPath = $root . '/design/styles/application.css';
          $artifactPath = $root . '/public/assets/presentation.css';
          $visualPath = $root . '/app/presentation.visual-contract.json';
          if (is_dir($root . '/app/Presentation/Styles') || is_file($root . '/design/tokens/css-bridge.json')) {
              fwrite(STDERR, "presentation-css-build: legacy css architecture present\n");
              exit(1);
          }
          foreach ([$tokenPath, $applicationPath, $visualPath] as $required) {
              if (!is_file($required)) {
                  fwrite(STDERR, "presentation-css-build: source missing\n");
                  exit(1);
              }
          }
          $tokens = (string) file_get_contents($tokenPath);
          $application = (string) file_get_contents($applicationPath);
          if ($tokens === '' || $application === '') {
              fwrite(STDERR, "presentation-css-build: empty design source\n");
              exit(1);
          }
          if (preg_match('/--pt-(?:ref|sys|cmp)-[a-z0-9-]+\s*:/i', $application) === 1) {
              fwrite(STDERR, "presentation-css-build: canonical token authored in application css\n");
              exit(1);
          }
          if (str_contains($tokens, '@import') || str_contains($application, '@import')) {
              fwrite(STDERR, "presentation-css-build: imports are forbidden\n");
              exit(1);
          }
          $built = $tokens . $application;
          $important = substr_count($built, '!important');
          $routes = substr_count($built, 'body[data-route=');
          try {
              $visual = json_decode((string) file_get_contents($visualPath), true, 512, JSON_THROW_ON_ERROR);
          } catch (Throwable $error) {
              fwrite(STDERR, "presentation-css-build: invalid visual contract\n");
              exit(1);
          }
          $budget = is_array($visual['debt_budget'] ?? null) ? $visual['debt_budget'] : [];
          if ($important > (int) ($budget['important_count'] ?? -1) || $routes > (int) ($budget['route_scope_count'] ?? -1)) {
              fwrite(STDERR, "presentation-css-build: visual debt budget increased\n");
              exit(1);
          }
          $sha = hash('sha256', $built);
          $mode = $argv[1] ?? '--lint';
          if ($mode === '--lint') {
              echo json_encode([
                  'ok' => true,
                  'policy' => 'design-source-direct-concatenation-v1',
                  'physical_source_files' => 2,
                  'sequence_segments' => 0,
                  'bytes' => strlen($built),
                  'sha256' => $sha,
                  'important_count' => $important,
                  'route_scope_count' => $routes,
                  'legacy_source_files' => 0,
                  'manifest_bytes' => 0,
                  'deterministic_source' => true,
              ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
              exit(0);
          }
          if ($mode === '--write') {
              if (file_put_contents($artifactPath, $built) === false) {
                  fwrite(STDERR, "presentation-css-build: artifact write failed\n");
                  exit(1);
              }
              fwrite(STDOUT, "presentation-css-build: artifact written {$sha}\n");
              exit(0);
          }
          if ($mode === '--check') {
              $current = is_file($artifactPath) ? (string) file_get_contents($artifactPath) : '';
              if ($current !== $built) {
                  fwrite(STDERR, "presentation-css-build: generated artifact drift\n");
                  exit(1);
              }
              fwrite(STDOUT, "presentation-css-build: deterministic artifact {$sha}\n");
              exit(0);
          }
          fwrite(STDERR, "presentation-css-build: use --lint, --check or --write\n");
          exit(1);
          PHP
          chmod +x tools/presentation-css-build

          cat > tools/design-tokens-contract.mjs <<'JS'
          #!/usr/bin/env node
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { chromium } from 'playwright';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          execFileSync(process.execPath, [path.join(root, 'tools/design-tokens-build.mjs'), '--check'], { stdio: 'inherit' });
          const tokenSources = [
            'design/tokens/reference.tokens.json',
            'design/tokens/system.tokens.json',
            'design/tokens/component.tokens.json',
            'design/tokens/themes.tokens.json',
            'design/tokens/runtime.tokens.json',
          ];
          const generatedFile = 'design/generated/tokens.css';
          for (const file of [...tokenSources, generatedFile, 'design/styles/application.css']) {
            if (!fs.existsSync(path.join(root, file))) throw new Error(`design source missing ${file}`);
          }
          if (fs.existsSync(path.join(root, 'app/Presentation/Styles'))) throw new Error('legacy presentation styles directory still exists');
          if (fs.existsSync(path.join(root, 'design/tokens/css-bridge.json'))) throw new Error('legacy css bridge still exists');
          const expected = new Set();
          const allowedTargets = new Set(['clinic', 'material', 'semantic']);
          const collectTokens = value => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) collectTokens(item);
              return;
            }
            const meta = value.$extensions?.['com.prontoo'];
            if (Object.hasOwn(value, '$value') && meta && typeof meta.cssName === 'string') {
              if (!allowedTargets.has(String(meta.target || ''))) throw new Error(`unknown DTCG target ${meta.target}:${meta.cssName}`);
              if (!/^--[a-z0-9-]+$/i.test(meta.cssName)) throw new Error(`invalid DTCG cssName ${meta.cssName}`);
              expected.add(meta.cssName);
            }
            for (const [key, child] of Object.entries(value)) if (key !== '$extensions') collectTokens(child);
          };
          for (const file of tokenSources) collectTokens(JSON.parse(fs.readFileSync(path.join(root, file), 'utf8')));
          const generated = fs.readFileSync(path.join(root, generatedFile), 'utf8');
          for (const name of expected) if (!generated.includes(`${name}:`)) throw new Error(`generated token missing ${name}`);
          const application = fs.readFileSync(path.join(root, 'design/styles/application.css'), 'utf8');
          if (/(^|[;{]\s*)(--pt-(?:ref|sys|cmp)-[a-z0-9-]+)\s*:/im.test(application)) throw new Error('canonical token authored outside DTCG generator');

          const css = fs.readFileSync(path.join(root, 'public/assets/presentation.css'), 'utf8').replace(/^@import[^;]+;\s*/m, '');
          const themes = [
            { name: 'green', accent: '#2f6652', strong: '#1d583f', soft: '#d9f0df' },
            { name: 'blue', accent: '#2563eb', strong: '#1d4ed8', soft: '#eff6ff' },
            { name: 'wine', accent: '#8a2432', strong: '#6f1d2a', soft: '#fff0f2' },
            { name: 'violet', accent: '#6d3bc3', strong: '#53309a', soft: '#f4f1ff' },
          ];
          const markup = `<style>${css}</style><body><main><header class="pagehead has-operations"><span id="pageheadIcon" class="pagehead-icon"><span class="material-symbols-rounded">settings</span></span><nav class="pagehead-controls pagehead-controls--navigation"><a id="nav" class="pagehead-control pagehead-control--nav"><span>Outro</span></a></nav><div class="pagehead-controls--actions"><button id="primary" class="pagehead-control pagehead-control--primary">Salvar</button><button id="danger" class="pagehead-control pagehead-control--danger">Excluir</button></div></header><article id="stat" class="stat-card"><span class="material-symbols-rounded">monitoring</span><div><b>1</b><span>Indicador</span></div></article><div id="ok" class="doc-ds-chip ok">Concluído</div><input id="input" value="x"></main></body>`;
          const normalize = value => value.replace(/\s+/g, '').toLowerCase();
          const browser = await chromium.launch({ headless: true });
          let semanticBaseline = null;
          try {
            for (const theme of themes) {
              const context = await browser.newContext({ viewport: { width: 1280, height: 900 }, deviceScaleFactor: 1 });
              const page = await context.newPage();
              await page.setContent(markup, { waitUntil: 'load' });
              await page.evaluate(current => {
                const body = document.body;
                body.style.setProperty('--clinic-identity-accent', current.accent);
                body.style.setProperty('--clinic-identity-hover', current.strong);
                body.style.setProperty('--clinic-identity-pressed', current.strong);
                body.style.setProperty('--clinic-identity-on-accent', '#ffffff');
                body.style.setProperty('--clinic-accent', current.accent);
                body.style.setProperty('--clinic-accent-strong', current.strong);
                body.style.setProperty('--clinic-accent-dark', current.strong);
                body.style.setProperty('--clinic-accent-hover', current.strong);
                body.style.setProperty('--clinic-accent-pressed', current.strong);
                body.style.setProperty('--clinic-accent-soft', current.soft);
                body.style.setProperty('--clinic-accent-subtle', current.soft);
                body.style.setProperty('--clinic-on-accent', '#ffffff');
                body.style.setProperty('--md-sys-color-primary', current.accent);
                body.style.setProperty('--md-ref-palette-primary40', current.accent);
                body.style.setProperty('--md-ref-palette-primary30', current.strong);
                body.style.setProperty('--md-sys-color-on-primary', '#ffffff');
                body.style.setProperty('--md-sys-color-primary-container', current.soft);
              }, theme);
              const result = await page.evaluate(() => {
                const nav = getComputedStyle(document.getElementById('nav'));
                const pageheadIcon = getComputedStyle(document.getElementById('pageheadIcon'));
                const statIcon = getComputedStyle(document.querySelector('#stat > .material-symbols-rounded'));
                const ok = getComputedStyle(document.getElementById('ok'));
                const danger = getComputedStyle(document.getElementById('danger'));
                const body = getComputedStyle(document.body);
                return {
                  accent: body.getPropertyValue('--pt-sys-color-accent').trim(),
                  pageheadComponent: body.getPropertyValue('--pt-cmp-pagehead-accent').trim(),
                  pageheadAlias: body.getPropertyValue('--pt-pagehead-control-accent').trim(),
                  navColor: nav.color,
                  pageheadIconColor: pageheadIcon.color,
                  statIconColor: statIcon.color,
                  okBg: ok.backgroundColor,
                  okColor: ok.color,
                  dangerBg: danger.backgroundColor,
                };
              });
              const expectedColor = await page.evaluate(color => {
                const probe = document.createElement('div');
                probe.style.color = color;
                document.body.appendChild(probe);
                const value = getComputedStyle(probe).color;
                probe.remove();
                return value;
              }, theme.accent);
              for (const [key, value] of Object.entries({ accent: result.accent, pageheadComponent: result.pageheadComponent, pageheadAlias: result.pageheadAlias })) {
                if (normalize(value) !== normalize(theme.accent)) throw new Error(`${theme.name}:${key} does not follow clinic runtime accent`);
              }
              for (const [key, value] of Object.entries({ navColor: result.navColor, pageheadIconColor: result.pageheadIconColor, statIconColor: result.statIconColor })) {
                if (normalize(value) !== normalize(expectedColor)) throw new Error(`${theme.name}:${key} does not follow clinic runtime accent`);
              }
              const semantics = { okBg: normalize(result.okBg), okColor: normalize(result.okColor), dangerBg: normalize(result.dangerBg) };
              if (semanticBaseline === null) semanticBaseline = semantics;
              else for (const [key, value] of Object.entries(semantics)) if (value !== semanticBaseline[key]) throw new Error(`${theme.name}: semantic ${key} changed with clinic accent`);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          process.stdout.write(`design-tokens-contract: dtcg sources=${tokenSources.length} generated=1 mapped=${expected.size} themes=${themes.length} legacy=0 runtime=clinic-config\n`);
          JS
          chmod +x tools/design-tokens-contract.mjs
      - name: Remove legacy architecture and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/Presentation/Styles
          rm -f design/tokens/css-bridge.json
          node tools/design-tokens-build.mjs --write
          php tools/presentation-css-build --write
          python3 <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('app/presentation.visual-contract.json')
          data = json.loads(p.read_text())
          css = Path('public/assets/presentation.css').read_bytes()
          data['delivery']['current_sha256'] = hashlib.sha256(css).hexdigest()
          data['delivery']['current_bytes'] = len(css)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          node tools/design-tokens-contract.mjs
          node tools/presentation-ux-contract.mjs --check
          php tools/presentation-visual-contract-check
      - name: Publish release 1.8.18.6 and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('version.json')
          data=json.loads(p.read_text())
          now=datetime.now(ZoneInfo('America/Cuiaba'))
          stamp=now.isoformat(timespec='seconds')
          version='1.8.18.6'
          data.update({
              'version': version,
              'release': version,
              'generated_at_unix': int(now.timestamp()),
              'generated_at': stamp,
              'updated_at': stamp,
              'build': '1.8.18.6-design-source-independent',
              'asset_version': version,
              'database_changes': False,
              'schema_changes': False,
              'logic_changes': True,
              'visual_changes': False,
              'documentation_changes': True,
              'functional_equivalence_policy': 'design_sources_independent_from_legacy_css_architecture_with_observable_visual_equivalence',
              'notes': 'Design System independente da arquitetura CSS anterior: DTCG gera um bundle único de tokens, estilos comportamentais são lineares em design/styles e presentation.css é uma concatenação determinística sem bridge, slices ou manifesto legado.',
              'deployment_sync_id': 'github-prontoo-1.8.18.6-design-source-independent',
              'deployment_sync_requested_at': stamp,
              'release_date': now.date().isoformat(),
              'design_token_runtime_policy': 'generated_design_token_bundle_without_legacy_bridge',
              'design_token_artifact': 'design/generated/tokens.css',
              'design_style_source': 'design/styles/application.css',
              'presentation_build_policy': 'direct_tokens_plus_application_css_concatenation',
              'changelog': {
                  'title': 'Arquitetura de design independente do CSS legado',
                  'items': [
                      'remove integralmente app/Presentation/Styles e o manifesto de 1.074 slices da arquitetura CSS anterior',
                      'substitui o payload Base64 de compatibilidade por tokens runtime DTCG estruturados e auditáveis',
                      'consolida os tokens gerados em design/generated/tokens.css e os estilos comportamentais em design/styles/application.css',
                      'simplifica presentation.css para concatenação determinística de duas fontes sem offsets, hashes por slice ou bridge legado',
                      'mantém o contrato multitema e o baseline computado sem alteração observável de geometria, tipografia, espaçamento ou fluxos',
