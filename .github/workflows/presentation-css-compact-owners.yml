name: Presentation CSS Compact Owners
on:
  push:
    branches: [agent/presentation-css-semantic-decomposition]
    paths:
      - tools/presentation-css-compact-owners
      - tools/presentation-css-build
      - .github/workflows/presentation-css-compact-owners.yml
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/presentation-css-semantic-decomposition
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Compact owners and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/presentation-css-compact-owners
          git rm -f tools/presentation-css-compact-owners .github/workflows/presentation-css-compact-owners.yml
          php tools/presentation-css-build --lint
          php tools/presentation-css-build --check
          php tools/presentation-visual-contract-check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate --fast
          git add -A
          git diff --cached --check -- ':!app/Presentation/Styles/**/*.css'
          git commit -m "refactor(presentation): compact semantic CSS into owner files"
          git push origin HEAD:agent/presentation-css-semantic-decomposition
