name: Apply Request Fill Tone

on:
  push:
    branches:
      - agent/request-fill-exact-line-tone

concurrency:
  group: request-fill-exact-line-tone
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-request-fill-tone:
    runs-on: ubuntu-latest
    services:
      mysql80:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prontoo_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: prontoo_schema
      DB_USERNAME: root
      DB_PASSWORD: root
      GITHUB_ACTIONS: true
      CI: true
      PRONTOO_SCHEMA_TEST_MODE: 1
      PRONTOO_INSTALLER_CLI_MODE: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, json, openssl
      - name: Apply validate and publish clean tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python3 <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          version = "1.7.30.16"
          previous = "1.7.30.15"
          build = "1.7.30.16-request-fill-exact-line-tone"
          now = datetime.now(timezone.utc)
          iso = now.isoformat()

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(content, old, new, label):
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one occurrence, found {count}")
              return content.replace(old, new, 1)

          css_path = "public/assets/design-system.css"
          css = read(css_path)
          css = replace_once(
              css,
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:.3}',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:1}',
              "request fill opacity",
          )
          write(css_path, css)

          arch_check_path = "tools/architecture-check.php"
          arch_check = read(arch_check_path)
          arch_check = replace_once(
              arch_check,
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:.3}',
              '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:1}',
              "architecture request fill token",
          )
          write(arch_check_path, arch_check)

          app_path = "app/prontoo.php"
          app = read(app_path)
          app = replace_once(app, f'const PRONTOO_VERSION_FALLBACK = "{previous}";', f'const PRONTOO_VERSION_FALLBACK = "{version}";', "app fallback")
          write(app_path, app)

          br_path = "br/index.php"
          br = read(br_path)
          br = replace_once(br, f'const BR_LANDING_VERSION_FALLBACK = "{previous}";', f'const BR_LANDING_VERSION_FALLBACK = "{version}";', "landing fallback")
          write(br_path, br)

          changelog_path = "CHANGELOG.md"
          changelog = read(changelog_path)
          marker = "# Histórico de versões\n\n"
          entry = (
              f"## {version} — Tom exato da área de Requisições\n\n"
              "- mantém na área inferior de Requisições exatamente o mesmo tom visual de sua linha;\n"
              "- remove a diluição causada pela opacidade parcial apenas no preenchimento de Requisições;\n"
              "- preserva Registros, Velocidade, métricas, banco e schema.\n\n"
          )
          changelog = replace_once(changelog, marker, marker + entry, "markdown changelog")
          write(changelog_path, changelog)

          text_path = "ChangeLog.txt"
          text = read(text_path)
          entry_text = (
              f"Prontoo {version} — Tom exato da área de Requisições\n\n"
              "- A área inferior de Requisições passa a ter exatamente o mesmo tom visual da linha correspondente.\n"
              "- Registros, Velocidade, métricas, banco e schema permanecem inalterados.\n\n"
          )
          write(text_path, entry_text + text)

          version_path = "version.json"
          metadata = json.loads(read(version_path))
          metadata["version"] = version
          metadata["release"] = version
          metadata["generated_at_unix"] = int(now.timestamp())
          metadata["generated_at"] = iso
          metadata["updated_at"] = iso
          metadata["build"] = build
          metadata["previous_version"] = previous
          metadata["notes"] = "No gráfico Leitura e gravação, a área de Requisições usa o mesmo tom visual da linha correspondente, sem diluição por opacidade."
          metadata["deployment_sync_id"] = "github-request-fill-exact-line-tone-1-7-30-16"
          metadata["deployment_sync_requested_at"] = iso
          metadata["rewrite_scope"] = "developer_dashboard_request_fill_exact_line_tone"
          write(version_path, json.dumps(metadata, ensure_ascii=False, indent=4) + "\n")

          architecture_path = "app/architecture.manifest.json"
          architecture = json.loads(read(architecture_path))
          architecture["version"] = version
          architecture["release"] = version
          architecture["build"] = build
          architecture["generated_at"] = iso
          architecture["updated_at"] = iso
          architecture["developer_dashboard_observability_policy"] = "single_global_dashboard_four_kpis_two_charts_one_shared_renderer_count_averages_include_zero_days_request_fill_exactly_matches_line_tone_and_public_read_only_status_card_without_authenticated_context"
          write(architecture_path, json.dumps(architecture, ensure_ascii=False, indent=4) + "\n")

          manifest_path = "app/update.manifest.json"
          manifest = json.loads(read(manifest_path))
          manifest["version"] = version
          manifest["release"] = version
          manifest["build"] = build
          manifest["generated_at"] = iso
          manifest["updated_at"] = iso
          if "previous_version" in manifest:
              manifest["previous_version"] = previous
          if "notes" in manifest:
              manifest["notes"] = "A área de Requisições usa exatamente o tom visual de sua linha."
          write(manifest_path, json.dumps(manifest, ensure_ascii=False, indent=4) + "\n")
          PY
          rm -f .github/workflows/apply-request-fill-tone.yml
          rm -f tools/request_fill_tone_trigger.txt
          find tools -type d -name '__pycache__' -prune -exec rm -rf {} +
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
          );
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) {
                  continue;
              }
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' ||
                  str_starts_with($relative, '.git/') ||
                  str_starts_with($relative, 'ssd/') ||
                  str_starts_with($relative, 'vendor/') ||
                  str_starts_with($relative, 'node_modules/')) {
                  continue;
              }
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents(
              $manifestPath,
              json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL,
          );
          PHP
          test ! -e .github/workflows/apply-request-fill-tone.yml
          test ! -e tools/request_fill_tone_trigger.txt
          grep -F '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:1}' public/assets/design-system.css
          ! grep -F '.metric-dual-time-chart[data-metric-value-type="count"] .metric-chart-fill-load{fill:color-mix(in srgb,var(--md-sys-color-primary) 78%,#111827 22%);opacity:.3}' public/assets/design-system.css
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -path './.git' -prune -o -path './ssd' -prune -o -path './vendor' -prune -o -path './node_modules' -prune -o -name '*.php' -print0)
          php tools/documentation-check.php
          php tools/code-comment-check.php
          php tools/security-regression-check.php
          php tools/architecture-check.php
          php tools/schema-check.php
          php tools/install-security-check.php
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Igualar tom da área de Requisições à linha"
          git push origin HEAD:"${GITHUB_REF_NAME}"
