name: Telemetry Contract Fix

on:
  push:
    branches:
      - agent/telemetry-audit-live
    paths:
      - '.github/workflows/telemetry-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-audit-live
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Align contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit('missing token in '+path+': '+old[:120])
              p.write_text(s.replace(old,new,1))

          sec='tools/security-regression-check.php'
          rep(sec,
              '''$telemetryWindowUs = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations01::telemetry_comparison_microseconds();
$telemetryPreviousStartUs = $telemetryNowUs - 2 * $telemetryWindowUs;
$telemetryCurrentStartUs = $telemetryNowUs - $telemetryWindowUs;''',
              '''$telemetryTimezone = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations01::telemetry_cuiaba_tz();
$telemetryToday = (new DateTimeImmutable("@" . intdiv($telemetryNowUs, 1000000)))
    ->setTimezone($telemetryTimezone)
    ->setTime(0, 0);
$telemetryCurrentEndUs = $telemetryToday->getTimestamp() * 1000000;
$telemetryPreviousStartUs = $telemetryToday->modify("-30 days")->getTimestamp() * 1000000;
$telemetryCurrentStartUs = $telemetryToday->modify("-15 days")->getTimestamp() * 1000000;''')
          rep(sec,
              '$telemetryEvent("landing", $telemetryNowUs - 1, 300000000),',
              '$telemetryEvent("landing", $telemetryCurrentEndUs - 1, 300000000),')
          rep(sec,
              '$telemetryEvent("future_boundary", $telemetryNowUs, 400000000),',
              '$telemetryEvent("current_day_boundary", $telemetryCurrentEndUs, 400000000),')
          rep(sec,
              '    "Janelas móveis sobrepuseram ou perderam eventos de fronteira.",',
              '    "Janelas civis 15x15 sobrepuseram ou perderam eventos de fronteira.",')

          ops='app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php'
          rep(ops,
              '''        $currentTotal = array_sum(
            array_map(
                static fn(array $row): int => (int) ($row["value"] ?? 0),
                $current,
            ),
        );
        return [''',
              '''        $currentTotal = array_sum(
            array_map(
                static fn(array $row): int => (int) ($row["value"] ?? 0),
                $current,
            ),
        );
        $previousObservedDays = count(array_filter($previous, static fn(array $row): bool => !empty($row["observed"])));
        $currentObservedDays = count(array_filter($current, static fn(array $row): bool => !empty($row["observed"])));
        return [''')
          rep(ops,
              '''            "variation_pct" => \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations01::telemetry_percentage_variation(
                $currentTotal,
                $previousTotal,
            ),''',
              '''            "previous_observed_days" => $previousObservedDays,
            "current_observed_days" => $currentObservedDays,
            "variation_pct" => $previousObservedDays === 15 && $currentObservedDays === 15
                ? \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations01::telemetry_percentage_variation(
                    $currentTotal,
                    $previousTotal,
                )
                : null,''')

          admin='app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php'
          rep(admin,
              '        return \'<div class="section-head admin-performance-head"><h2>Telemetria das últimas 24 horas</h2>\' .',
              '        return \'<div class="section-head admin-performance-head"><h2>Telemetria operacional</h2>\' .')

          test='tools/database-record-telemetry-contract-check'
          rep(test,
              '''$assert((int) ($comparison["current_total"] ?? 0) === 308, "últimos 15 dias incorretos");''',
              '''$assert((int) ($comparison["current_total"] ?? 0) === 308, "últimos 15 dias incorretos");
$assert((int) ($comparison["previous_observed_days"] ?? 0) === 15 && (int) ($comparison["current_observed_days"] ?? 0) === 15, "comparação completa deve exigir 15 dias observados em cada período");
$emptyComparison = \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations03::telemetry_series_comparison_15d(
    \\Prontoo\\Infrastructure\\SupportTelemetry\\SupportTelemetryInfrastructureOperations03::telemetry_database_record_series_from_samples([], $now),
);
$assert(($emptyComparison["variation_pct"] ?? "missing") === null, "períodos sem cobertura completa não podem produzir percentual");''')
          PY
          for file in app/Infrastructure/SupportTelemetry/SupportTelemetryInfrastructureOperations03.php app/Runtime/AdminPages/AdminPagesRuntimeOperations02.php tools/security-regression-check.php; do php -l "$file" >/dev/null; done
          php tools/database-record-telemetry-contract-check
          php tools/page-load-telemetry-contract-check
          php tools/security-regression-check.php
          git diff --check
          git config user.name 'Wesley Ferreira'
          git config user.email '48494254+drwesleyadv@users.noreply.github.com'
          git add app tools
          git commit -m 'fix(telemetry): align civil-window regression contracts'
          echo READY_FOR_CLEANUP
          sleep 60
          git fetch origin +refs/heads/agent/telemetry-audit-live:refs/remotes/origin/agent/telemetry-audit-live
          git rebase origin/agent/telemetry-audit-live
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/architecture-check.php
          git diff --check
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:agent/telemetry-audit-live
