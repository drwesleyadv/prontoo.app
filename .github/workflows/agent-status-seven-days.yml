name: Apply seven-day status cards

on:
  pull_request:
    branches: [prontoo]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/status-seven-days' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Restrict seven-day timeframe to public status
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Admin/AdminPages.php')
          text = path.read_text(encoding='utf-8')
          start = text.index('function page_status(): void')
          end = text.index('function page_admin_operations(): void', start)
          before = text[:start]
          status = text[start:end]
          after = text[end:]

          status = status.replace('telemetry_route_performance_summary(24)', 'telemetry_route_performance_summary(168)')
          status = status.replace('$requests24h', '$requests7d')
          status = status.replace('$landingRequests24h', '$landingRequests7d')
          status = status.replace('Visão operacional das últimas 24 horas', 'Visão operacional dos últimos 7 dias')

          after = after.replace('telemetry_route_performance_summary(168)', 'telemetry_route_performance_summary(24)')
          after = after.replace('$requests7d', '$requests24h')
          after = after.replace('$landingRequests7d', '$landingRequests24h')

          text = before + status + after
          path.write_text(text, encoding='utf-8')

          for marker in [Path('ssd/.status-seven-days'), Path('ssd/.status-seven-days-fix'), Path('.github/workflows/agent-status-seven-days.yml')]:
              if marker.exists():
                  marker.unlink()
          PY
          php -l app/Admin/AdminPages.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $root = getcwd();
          $manifestPath = $root . '/app/update.manifest.json';
          $manifest = json_decode((string) file_get_contents($manifestPath), true, 512, JSON_THROW_ON_ERROR);
          $files = [];
          $total = 0;
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file->isFile() || $file->isLink()) continue;
              $relative = str_replace('\\', '/', substr($file->getPathname(), strlen($root) + 1));
              if ($relative === 'app/update.manifest.json' || str_starts_with($relative, '.git/') || str_starts_with($relative, 'ssd/') || str_starts_with($relative, 'vendor/') || str_starts_with($relative, 'node_modules/')) continue;
              $files[$relative] = hash_file('sha256', $file->getPathname());
              $total += $file->getSize();
          }
          ksort($files, SORT_STRING);
          $manifest['files'] = $files;
          $manifest['file_count'] = count($files);
          $manifest['total_uncompressed_bytes'] = $total;
          $manifest['updated_at'] = gmdate('c');
          file_put_contents($manifestPath, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restringir sete dias aos cards públicos do status"
          git push origin HEAD:"$HEAD_BRANCH"
