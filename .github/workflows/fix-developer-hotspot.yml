name: Fix developer control center hotspot

on:
  push:
    branches:
      - agent/developer-control-center

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-control-center
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Extract presentation composition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp-extract-developer-administration.py
          python3 tools/tmp-developer-presentation-budget.py
          python3 tools/tmp-developer-css-dedupe.py
          python3 tools/tmp-developer-css-source-sync.py
          python3 tools/tmp-developer-observability-contract.py
      - name: Remove temporary execution files
        shell: bash
        run: |
          rm -f tools/tmp-extract-developer-administration.py
          rm -f tools/tmp-developer-presentation-budget.py
          rm -f tools/tmp-developer-css-dedupe.py
          rm -f tools/tmp-developer-css-source-sync.py
          rm -f tools/tmp-developer-observability-contract.py
          rm -f .github/workflows/fix-developer-hotspot.yml
      - name: Validate and reconcile
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations06.php >/dev/null
          php -l app/Runtime/AdminPages/AdminPagesRuntimeOperations09.php >/dev/null
          php -l app/Runtime/UiComponents/UiComponentsRuntimeOperations03.php >/dev/null
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations01.php >/dev/null
          php -l app/Presentation/AdminPages/AdminPagesPresentationOperations03.php >/dev/null
          php -l tools/telemetry-json-source-contract-check >/dev/null
          php tools/presentation-css-build --write
          php tools/presentation-css-build --check
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          php tools/quality-gate
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: preserve developer presentation budgets"
          git push origin HEAD:agent/developer-control-center
