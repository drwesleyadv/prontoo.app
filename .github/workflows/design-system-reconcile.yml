name: Design System Reconcile

on:
  push:
    branches:
      - agent/design-system-2026-modernization
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/design-system-2026-modernization
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Modernize canonical design sources
        shell: bash
        run: |
          set -euo pipefail
          node tools/design-system-modernize.mjs
          npm install --save-dev axe-core@4.12.1 --ignore-scripts
          rm -f .github/workflows/design-system-reconcile.yml tools/design-system-modernize.mjs
      - name: Build deterministic design artifacts
        shell: bash
        run: |
          set -euo pipefail
          node tools/design-tokens-build.mjs --write
          php tools/presentation-css-build --write
      - name: Install browser contract
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
      - name: Establish and verify Design System contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/design-system-visual-contract.mjs --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          node tools/design-tokens-contract.mjs
          node tools/design-system-contract.mjs
          node tools/design-system-a11y-contract.mjs
          node tools/design-system-visual-contract.mjs --check
          php tools/presentation-css-build --check
          php tools/documentation-check.php
          php tools/quality-gate --fast
      - name: Commit reconciled release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/design-system-reconcile.yml \
            .github/workflows/presentation-ux.yml \
            .github/workflows/documentation.yml \
            design \
            docs \
            tests/presentation/ds-lab.html \
            tools/design-tokens-build.mjs \
            tools/design-tokens-contract.mjs \
            tools/design-system-contract.mjs \
            tools/design-system-a11y-contract.mjs \
            tools/design-system-visual-contract.mjs \
            tools/design-system-modernize.mjs \
            tools/presentation-css-build \
            package.json package-lock.json \
            version.json CHANGELOG.md \
            app/update.manifest.json \
            app/architecture.manifest.json \
            app/presentation.visual-contract.json \
            app/design-system.visual-baseline.json \
            app/prontoo.php \
            br/index.php \
            public/assets/presentation.css
          git status --short
          git diff --cached --check
          git commit -m "Moderniza o Design System e publica 1.8.21.1"
          git push origin HEAD:agent/design-system-2026-modernization
