name: Temporary Telemetry Publisher

on:
  push:
    branches:
      - agent/admin-telemetry-direct-cards

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Materialize validated tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/drwesleyadv/prontoo.app/actions/artifacts/9184418951/zip > /tmp/reconciled.zip
          mkdir -p /tmp/reconciled-artifact
          unzip -q /tmp/reconciled.zip -d /tmp/reconciled-artifact
          tar -xzf /tmp/reconciled-artifact/reconciled.tar.gz -C .
          rm .github/workflows/tmp-admin-telemetry-reconcile.yml
          php tools/release-contract-reconcile --check
          php tools/telemetry-json-source-contract-check
          php tools/presentation-visual-contract-check
          git diff --check
      - name: Publish branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898254+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(admin): flatten developer telemetry cards"
          git push origin HEAD
