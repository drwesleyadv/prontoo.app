name: Apply PR45 Manager KPI Icon Fix Target

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.number == 45 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/admin-manager-kpi-icons-20260724' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-manager-kpi-icons-20260724
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: pdo_mysql

      - name: Apply and validate correction
        shell: bash
        run: |
          set -euo pipefail
          python3 control/tools/apply-pr45-manager-kpi-fix.py work
          cd work
          php -l tools/architecture-check.php >/dev/null
          php tools/architecture-check.php >/tmp/architecture-report.json
          php -r '
            $version = json_decode((string) file_get_contents("version.json"), true, 512, JSON_THROW_ON_ERROR);
            $update = json_decode((string) file_get_contents("app/update.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            $arch = json_decode((string) file_get_contents("app/architecture.manifest.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($version["version"] ?? "") !== "1.7.24.3" || ($update["version"] ?? "") !== "1.7.24.3" || ($arch["version"] ?? "") !== "1.7.24.3") {
              throw new RuntimeException("Contrato de versão divergente");
            }
            $css = (string) file_get_contents("public/assets/design-system.css");
            if (str_contains($css, ") > :where(article,div,a,span) :where(span,small,strong){")) {
              throw new RuntimeException("Seletor residual de ícones ainda presente");
            }
            if (!str_contains($css, ":where(span:not(.material-symbols-rounded):not(.pt-icon-glyph),small,strong)")) {
              throw new RuntimeException("Exclusão tipográfica dos ícones ausente");
            }
          '

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt app/architecture.manifest.json app/prontoo.php app/update.manifest.json br/index.php public/assets/design-system.css tools/architecture-check.php version.json
          git commit -m "Prontoo 1.7.24.3 — corrige ícones dos KPIs gerenciais"
          git push origin HEAD:agent/admin-manager-kpi-icons-20260724
