name: Apply Admin Dashboard Icon Fix

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply icon cascade correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          VERSION = "1.7.24.2"
          PREVIOUS_VERSION = "1.7.24.1"
          GENERATED_AT = "2026-07-24T12:54:30Z"
          GENERATED_AT_UNIX = 1784897670
          BUILD = "1.7.24.2-admin-dashboard-icons"
          PACKAGE_TYPE = "admin_dashboard_icon_fix"
          DEPLOYMENT_ID = "hostoo-admin-dashboard-icons-20260724T125430Z"
          NOTES = (
              "Corrige a cascata tipográfica que substituía Material Symbols por Roboto nos cartões "
              "do Painel do Administrador, restaurando a renderização dos ícones sem alterar dados, "
              "regras de negócio, banco ou schema."
          )

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          css_path = "public/assets/design-system.css"
          css = read(css_path)
          unsafe_selector = ".stat-card span,.ds-kpi span,.notice-kpi span,.kpi-card span,.mini-stat span"
          safe_selector = ",".join(
              f"{selector} span:not(.material-symbols-rounded):not(.pt-icon-glyph)"
              for selector in [".stat-card", ".ds-kpi", ".notice-kpi", ".kpi-card", ".mini-stat"]
          )
          if unsafe_selector in css:
              css = css.replace(unsafe_selector, safe_selector, 1)
          elif safe_selector not in css:
              raise SystemExit("Seletor tipográfico dos KPIs não localizado")
          write(css_path, css)

          check_path = "tools/architecture-check.php"
          check = read(check_path)
          old_result = '''$architecture = ArchitectureVerifier::report($root, true);
          $selfTest = LayeredKernel::logicSelfTest($root);
          $result = [
              'ok' => !empty($architecture['ok']) && !empty($selfTest['ok']),
              'architecture' => $architecture,
              'self_test' => $selfTest,
          ];
          '''
          new_result = '''$architecture = ArchitectureVerifier::report($root, true);
          $selfTest = LayeredKernel::logicSelfTest($root);
          $dashboardIconCss = (string) file_get_contents(
              $root . '/public/assets/design-system.css',
          );
          $dashboardIconFailures = [];
          if (str_contains(
              $dashboardIconCss,
              '.stat-card span,.ds-kpi span,.notice-kpi span,.kpi-card span,.mini-stat span{',
          )) {
              $dashboardIconFailures[] = 'broad_kpi_span_selector';
          }
          foreach ([
              '.stat-card span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.ds-kpi span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.notice-kpi span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.kpi-card span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.mini-stat span:not(.material-symbols-rounded):not(.pt-icon-glyph)',
              '.manager-action > .pt-icon-glyph',
              '.material-symbols-rounded{font-family:"Material Symbols Rounded"',
          ] as $requiredIconContract) {
              if (!str_contains($dashboardIconCss, $requiredIconContract)) {
                  $dashboardIconFailures[] = $requiredIconContract;
              }
          }
          $dashboardIconCascade = [
              'ok' => $dashboardIconFailures === [],
              'failed' => $dashboardIconFailures,
          ];
          $result = [
              'ok' =>
                  !empty($architecture['ok']) &&
                  !empty($selfTest['ok']) &&
                  !empty($dashboardIconCascade['ok']),
              'architecture' => $architecture,
              'self_test' => $selfTest,
              'dashboard_icon_cascade' => $dashboardIconCascade,
          ];
          '''
          if old_result in check:
              check = check.replace(old_result, new_result, 1)
          elif new_result not in check:
              raise SystemExit("Âncora do verificador de arquitetura não localizada")
          write(check_path, check)

          version_path = Path("version.json")
          version = json.loads(version_path.read_text(encoding="utf-8"))
          version.update({
              "version": VERSION,
              "release": VERSION,
              "generated_at_unix": GENERATED_AT_UNIX,
              "generated_at": GENERATED_AT,
              "updated_at": GENERATED_AT,
              "build": BUILD,
              "package_type": PACKAGE_TYPE,
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": False,
              "visual_changes": True,
              "notes": NOTES,
              "previous_version": PREVIOUS_VERSION,
              "documentation_changes": True,
              "deployment_sync_id": DEPLOYMENT_ID,
              "deployment_sync_requested_at": GENERATED_AT,
          })
          version_path.write_text(
              json.dumps(version, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          architecture_path = Path("app/architecture.manifest.json")
          architecture = json.loads(architecture_path.read_text(encoding="utf-8"))
          architecture.update({
              "version": VERSION,
              "database_changes": False,
              "schema_changes": False,
              "visual_changes": True,
              "logic_changes": False,
          })
          architecture_path.write_text(
              json.dumps(architecture, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          runtime_path = "app/prontoo.php"
          runtime = read(runtime_path)
          runtime, fallback_count = re.subn(
              r'const PRONTOO_VERSION_FALLBACK = "[^"]+";',
              f'const PRONTOO_VERSION_FALLBACK = "{VERSION}";',
              runtime,
              count=1,
          )
          runtime, previous_count = re.subn(
              r'const PRONTOO_PREVIOUS_VERSION = "[^"]+";',
              f'const PRONTOO_PREVIOUS_VERSION = "{PREVIOUS_VERSION}";',
              runtime,
              count=1,
          )
          if fallback_count != 1 or previous_count != 1:
              raise SystemExit("Contrato de versão do runtime não localizado")
          write(runtime_path, runtime)

          landing_path = "br/index.php"
          landing = read(landing_path)
          landing, landing_count = re.subn(
              r'(BR_LANDING_VERSION_FALLBACK\s*=\s*)["\'][^"\']+["\']',
              rf'\1"{VERSION}"',
              landing,
              count=1,
          )
          if landing_count != 1:
              raise SystemExit("Fallback da landing não localizado")
          write(landing_path, landing)

          changelog_path = "ChangeLog.txt"
          changelog = read(changelog_path)
          header = f"Prontoo {VERSION} — ícones do Painel do Administrador restaurados"
          if not changelog.startswith(header):
              entry = f'''{header}

          - Corrige o seletor tipográfico genérico dos cartões KPI, que aplicava Roboto aos elementos Material Symbols e fazia os nomes dos ícones aparecerem como texto ou não renderizarem.
          - Restringe a tipografia de rótulo apenas aos spans textuais, preservando integralmente a fonte, as ligaturas e as variações dos ícones.
          - Mantém os ícones dos indicadores e das ações recomendadas aderentes ao Design System e acrescenta prova regressiva permanente no verificador de arquitetura.
          - Não altera autenticação, dados, regras de negócio, banco ou schema.

          '''
              write(changelog_path, entry + changelog)

          report_path = Path("tmp/admin-icon-audit.txt")
          if report_path.exists():
              report_path.unlink()
              try:
                  report_path.parent.rmdir()
              except OSError:
                  pass

          manifest_path = Path("app/update.manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update({
              "version": VERSION,
              "release": VERSION,
              "build": BUILD,
              "package_type": PACKAGE_TYPE,
              "generated_at": GENERATED_AT,
              "updated_at": GENERATED_AT,
              "database_changes": False,
              "schema_changes": False,
              "logic_changes": False,
              "visual_changes": True,
              "documentation_changes": True,
              "previous_version": PREVIOUS_VERSION,
              "notes": NOTES,
              "deployment_sync_id": DEPLOYMENT_ID,
              "deployment_sync_requested_at": GENERATED_AT,
          })
          files = manifest.get("files")
          if not isinstance(files, dict) or not files:
              raise SystemExit("Mapa de arquivos do manifesto ausente")
          total = 0
          for file_name in list(files):
              file_path = Path(file_name)
              if not file_path.is_file():
                  raise SystemExit(f"Arquivo do manifesto ausente: {file_name}")
              payload = file_path.read_bytes()
              files[file_name] = hashlib.sha256(payload).hexdigest()
              total += len(payload)
          manifest["file_count"] = len(files)
          manifest["total_uncompressed_bytes"] = total
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          php -l app/prontoo.php
          php -l br/index.php
          php -l tools/architecture-check.php
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) { throw new RuntimeException("JSON inválido: " . $file); }
            }
          '
          php tools/architecture-check.php
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prontoo 1.7.24.2 — corrige ícones do Painel Administrativo"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
