name: Apply Admin Dashboard Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Apply correction
        run: python3 tools/admin-dashboard-fix.py

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Pages/Dashboards.php
          php -l app/Ui/Components.php
          php -l app/prontoo.php
          php -l br/index.php
          php -r '
            foreach (["version.json", "app/update.manifest.json", "app/architecture.manifest.json"] as $file) {
              $json = json_decode((string) file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              if (!is_array($json)) { throw new RuntimeException("JSON inválido: " . $file); }
            }
          '
          php -r '
            $dashboard = (string) file_get_contents("app/Pages/Dashboards.php");
            $page = strstr($dashboard, "function page_painel(): void");
            if (!is_string($page) || strpos($page, "has_effective_role(\$c, \"gerente\")") > strpos($page, "(\$c[\"role\"] ?? \"\") === \"medico\"")) {
              throw new RuntimeException("Administrador não tem precedência no Painel");
            }
            $components = (string) file_get_contents("app/Ui/Components.php");
            foreach (["\"label\" => \"Painel\"", "\"icon\" => \"dashboard\"", "has_effective_role(\$c, \"gerente\") && can(\"painel\")"] as $required) {
              if (!str_contains($components, $required)) { throw new RuntimeException("Acesso administrativo ausente: " . $required); }
            }
          '
          php tools/architecture-check.php
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChangeLog.txt version.json app/architecture.manifest.json app/update.manifest.json app/prontoo.php br/index.php app/Pages/Dashboards.php app/Ui/Components.php
          git commit -m "Prontoo 1.7.24.1 — corrige Painel do Administrador"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
