name: Fix Runtime Boundary and Reconcile

on:
  push:
    branches:
      - agent/reconcile-security-release-1-8-14-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reduce boundary debt
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php"); s=p.read_text(); fn=s.index("    public static function secret_key(): string"); start=s.index("        if (strlen($candidate) < 32) {", fn); end=s.index("        if (strlen($candidate) < 32) {", start+1); b=chr(92); repl="        if (strlen($candidate) < 32) {\n            try {\n                $config = "+b+"Prontoo"+b+"Infrastructure"+b+"SupportFoundation"+b+"SupportFoundationInfrastructureOperations01::cfg();\n                $candidate = mb_trim((string) ($config[\"secret\"] ?? \"\"));\n            } catch (Throwable) {\n                $candidate = \"\";\n            }\n        }\n"; p.write_text(s[:start]+repl+s[end:])'
          python3 -c 'from pathlib import Path; p=Path("app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations02.php"); s=p.read_text(); start=s.index("    public static function page_login_autotest(): void"); end=s.index("    public static function person_signature_value(", start); b=chr(92); repl="    public static function page_login_autotest(): void\n    {\n        "+b+"Prontoo"+b+"Runtime"+b+"PublicWeb"+b+"PublicWebRuntimeOperations01::page_public_login_autotest();\n    }\n\n"; p.write_text(s[:start]+repl+s[end:])'
          git rm .github/workflows/fix-runtime-boundary-reconcile.yml
          php -l app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php
          php -l app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations02.php
          php tools/runtime-input-boundary-check
          php tools/version-asset-contract-check.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve runtime boundary after security hardening"
          git push origin HEAD:agent/reconcile-security-release-1-8-14-1
