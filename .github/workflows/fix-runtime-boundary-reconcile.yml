name: Fix Runtime Boundary and Reconcile

on:
  push:
    branches:
      - agent/reconcile-security-release-1-8-14-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: none
          extensions: mbstring
      - name: Reduce boundary debt, reconcile and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          security = Path('app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php')
          source = security.read_text()
          old = '''        if (strlen($candidate) < 32) {
            $config = \\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::has_cfg()
                ? \\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::cfg()
                : [];
            $candidate = mb_trim((string) ($config["secret"] ?? ""));
        }
'''
          new = '''        if (strlen($candidate) < 32) {
            try {
                $config = \\Prontoo\\Infrastructure\\SupportFoundation\\SupportFoundationInfrastructureOperations01::cfg();
                $candidate = mb_trim((string) ($config["secret"] ?? ""));
            } catch (Throwable) {
                $candidate = "";
            }
        }
'''
          if source.count(old) != 1:
              raise SystemExit('bloco de config de secret_key não é único')
          security.write_text(source.replace(old, new, 1))

          support = Path('app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations02.php')
          source = support.read_text()
          start = source.index('    public static function page_login_autotest(): void')
          end = source.index('    public static function person_signature_value(', start)
          replacement = '''    public static function page_login_autotest(): void
    {
        \\Prontoo\\Runtime\\PublicWeb\\PublicWebRuntimeOperations01::page_public_login_autotest();
    }

'''
          support.write_text(source[:start] + replacement + source[end:])
          PY
          git rm .github/workflows/fix-runtime-boundary-reconcile.yml
          php -l app/Runtime/SecurityAccess/SecurityAccessRuntimeOperations03.php
          php -l app/Runtime/SupportFoundation/SupportFoundationRuntimeOperations02.php
          php tools/runtime-input-boundary-check
          php tools/version-asset-contract-check.php
          php tools/release-contract-reconcile --write
          php tools/release-contract-reconcile --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve runtime boundary after security hardening"
          git push origin HEAD:agent/reconcile-security-release-1-8-14-1
