name: Temporary recurrence mbtrim fix

on:
  push:
    branches:
      - feature/quick-scheduling-recurrence-1-9-15-1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Apply mbtrim fix
        run: bash tools/tmp-recurrence-mbtrim-fix
