name: Agent DTCG PR Bootstrap V3

on:
  pull_request:
    branches:
      - prontoo

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/dtcg-design-tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/dtcg-design-tokens
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate DTCG source and compatibility ABI
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact style-dictionary@5.5.0
          python3 <<'PY'
          from pathlib import Path
          p = Path('tools/agent-dtcg-bootstrap-v3.mjs')
          s = p.read_text()
          old = "const dynamic = new Set([...runtime.matchAll(/--([a-z0-9-]+):/gi)].map(match => `--${match[1]}`));"
          new = "const runtimeSeeds = new Set([...runtime.matchAll(/--([a-z0-9-]+):/gi)].map(match => `--${match[1]}`));\nconst dynamic = new Set(runtimeSeeds);"
          if old not in s:
              raise SystemExit('runtime seed anchor missing')
          s = s.replace(old, new, 1)
          old_filter = '.filter(item => dynamic.has(item.name))'
          new_filter = '.filter(item => dynamic.has(item.name) && !runtimeSeeds.has(item.name))'
          if old_filter not in s:
              raise SystemExit('bridge filter anchor missing')
          s = s.replace(old_filter, new_filter, 1)
          p.write_text(s)
          PY
          node tools/agent-dtcg-bootstrap-v3.mjs
      - name: Verify unchanged computed UX
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
          cp app/presentation.ux-baseline.json /tmp/prontoo-ux-baseline.json
          node tools/presentation-ux-contract.mjs --write
          python3 <<'PY'
          import json
          old=json.load(open('/tmp/prontoo-ux-baseline.json'))
          new=json.load(open('app/presentation.ux-baseline.json'))
          a=old['scenarios']['primary-hover']['primary']
          b=new['scenarios']['primary-hover']['primary']
          for group in ('rect','style','variables'):
              for key in sorted(set(a[group])|set(b[group])):
                  if a[group].get(key)!=b[group].get(key):
                      print(f'DTCG_DRIFT {group}.{key}: {a[group].get(key)!r} -> {b[group].get(key)!r}')
          PY
          cp /tmp/prontoo-ux-baseline.json app/presentation.ux-baseline.json
          node tools/presentation-ux-contract.mjs --check
      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-dtcg-migrate.yml
          rm -f .github/workflows/agent-dtcg-pr-bootstrap.yml
          rm -f .github/workflows/agent-dtcg-pr-bootstrap-v2.yml
          rm -f .github/workflows/agent-dtcg-pr-bootstrap-v3.yml
          rm -f tools/agent-dtcg-bootstrap.mjs
          rm -f tools/agent-dtcg-bootstrap-v3.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migra Design System para tokens DTCG'
          git push origin HEAD:agent/dtcg-design-tokens
